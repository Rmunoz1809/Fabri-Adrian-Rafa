<!doctype html>
<html lang="es-PA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Holo · Cartas coleccionables en Panamá</title>
<meta name="description" content="Compra y vende cartas Pokémon, NBA y NFL en Panamá, con precio estimado y Compra Protegida.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root {
  color-scheme: dark;
  --bg: #000; --surface: #111113; --surface-2: #1c1c20; --ink: #f2f0eb; --ink-2: #a19d95; --line: #2a2a30;
  --accent: #7390ff; --accent-ink: #0b0b0d; --good: #4fd19c; --good-bg: #13291f; --warn: #f0b54a; --warn-bg: #2e2412;
  --bad: #ff8a5c; --bad-bg: #321a10;
  --holo: linear-gradient(115deg, #7cf3d5 0%, #8ab6ff 35%, #d59bff 65%, #ffc98a 100%);
  --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --sans: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
img { max-width: 100%; }
.wrap { max-width: 1152px; margin: 0 auto; padding: 0 16px; width: 100%; }
.display { font-family: var(--display); letter-spacing: -0.02em; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; } .xs { font-size: 12px; }
.holo-text { background: var(--holo); -webkit-background-clip: text; background-clip: text; color: transparent; }
.holo-border { border: 1.5px solid transparent; background: linear-gradient(var(--surface), var(--surface)) padding-box, var(--holo) border-box; }
.card-ratio { aspect-ratio: 63 / 88; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* header */
header.top { position: sticky; top: 0; z-index: 30; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(8px); }
header.top .row { display: flex; align-items: center; gap: 12px; height: 56px; }
.logo { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 700; font-size: 20px; }
.logo i { width: 20px; height: 20px; border-radius: 6px; background: var(--holo); display: inline-block; }
.top-search { flex: 1; display: none; }
.top-search input { width: 100%; max-width: 420px; }
@media (min-width: 640px) { .top-search { display: block; } }
nav.links { margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: 14px; }
nav.links a, nav.links button.link { padding: 8px 12px; border-radius: 999px; color: var(--ink-2); background: none; border: 0; cursor: pointer; }
nav.links a:hover, nav.links button.link:hover { color: var(--ink); }
nav.links .nav-me { max-width: 84px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (min-width: 640px) { nav.links .nav-me { max-width: 160px; } }
.hide-sm { display: none !important; } @media (min-width: 768px) { .hide-sm { display: inline-block !important; } }

/* controls */
.input, .select, .textarea { width: 100%; height: 44px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 0 12px; outline: none; font-size: 16px; }
.textarea { height: auto; padding: 12px; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); }
.pill-input { height: 40px; border-radius: 999px; padding: 0 16px; font-size: 14px; }
@media (min-width: 640px) { .input, .select, .textarea { font-size: 14px; } }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.dark { background: var(--ink); color: var(--bg); border-color: transparent; }
.btn.block { width: 100%; height: 48px; border-radius: 12px; }
.btn:disabled { opacity: .55; cursor: default; }
.btn.danger { color: var(--bad); }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500; }
label.f.muted-label { font-size: 12px; color: var(--ink-2); font-weight: 400; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* chips + filters */
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 4px; scrollbar-width: none; }
.chip { flex-shrink: 0; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 500; cursor: pointer; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
details.filters { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; }
details.filters summary { list-style: none; cursor: pointer; padding: 12px 16px; font-size: 14px; font-weight: 500; display: flex; justify-content: space-between; }
details.filters summary::-webkit-details-marker { display: none; }
.filters form { border-top: 1px solid var(--line); padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.filters .span2 { grid-column: span 2; }
@media (min-width: 1024px) { .filters form { grid-template-columns: repeat(6, 1fr); } .filters .span2 { grid-column: span 2; } .filters .spanall { grid-column: 1 / -1; } }
.filters .spanall { grid-column: 1 / -1; display: flex; gap: 8px; }
.badge-count { margin-left: 8px; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 1px 8px; font-size: 12px; }

/* listing grid */
.grid { list-style: none; padding: 0; margin: 16px 0 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: start; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; } }
@media (min-width: 1024px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { display: flex; flex-direction: column; border: 1px solid var(--line); background: var(--surface); border-radius: 16px; overflow: hidden; transition: transform .16s ease, box-shadow .16s ease; }
.tile:hover { transform: translateY(-2px); box-shadow: 0 10px 24px -12px rgb(0 0 0 / .25); }
.tile .art { position: relative; background: var(--surface-2); container-type: inline-size; }
.tile .art .inner { position: absolute; inset: 7%; }
.tile .body { display: flex; flex-direction: column; gap: 6px; padding: 12px; flex: 1; }
.tile .title { font-size: 14px; font-weight: 500; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin: 0; }
.tile .price { font-family: var(--display); font-weight: 700; font-size: 18px; margin: 0; }
.tile .loc { margin: 0; padding-top: 4px; font-size: 12px; color: var(--ink-2); }
.corner-l { position: absolute; left: 8px; top: 8px; display: flex; gap: 4px; }
.corner-r { position: absolute; right: 8px; top: 8px; }
.art img.card { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 6px 14px rgba(0,0,0,.25)); }
.placeholder { position: absolute; inset: 6%; border-radius: 6%; padding: 8%; color: #fff; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 8px 20px rgb(0 0 0 / .25); }
.placeholder .tag { align-self: flex-start; background: rgb(255 255 255 / .2); border-radius: 4px; padding: 2px 6px; font-size: 10px; font-weight: 700; letter-spacing: .1em; }
.placeholder .who { font-family: var(--display); font-weight: 700; font-size: clamp(13px, 9cqi, 22px); line-height: 1.1; margin: 0; }
.placeholder .meta { font-size: 11px; opacity: .8; margin: 4px 0 0; }
.placeholder .note { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; opacity: .6; margin: 8px 0 0; }

/* badges */
.b { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 8px; font-size: 12px; font-weight: 500; }
.b.good { background: var(--good-bg); color: var(--good); } .b.neutral { background: var(--surface-2); color: var(--ink-2); }
.b.warn { background: var(--warn-bg); color: var(--warn); } .row-input { display: flex; gap: 8px; } .row-input .input { flex: 1; min-width: 0; } .row-input .btn { flex-shrink: 0; }
.admin { padding-top: 24px; display: flex; flex-direction: column; gap: 16px; }
.admin-tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: none; }
.admin-tabs a { padding: 10px 14px; font-weight: 600; font-size: 14px; color: var(--ink-2); border-bottom: 2px solid transparent; white-space: nowrap; }
.admin-tabs a.on { color: var(--ink); border-bottom-color: var(--accent); }
.admin-h { font-size: 18px; margin: 16px 0 0; }
.admin-list { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 12px; }
@media (min-width: 900px) { .admin-list { grid-template-columns: 1fr 1fr; } }
.phead { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.order-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.order-actions .btn { height: 38px; border-radius: 10px; }
.order-msg:not(:empty) { margin-top: 8px; }
.admin-closed summary { cursor: pointer; font-weight: 600; margin-top: 16px; }
.toggle { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; font-weight: 500; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (min-width: 900px) { .stats { grid-template-columns: repeat(4, 1fr); } }
.goal { height: 12px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.goal div { height: 100%; background: var(--holo); border-radius: 999px; }
.nav-admin { color: var(--accent) !important; font-weight: 600; }
.b.shop { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); font-weight: 600; }
.seller-seg { display: grid; grid-template-columns: auto 1fr 1fr; gap: 4px; padding: 4px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 14px; }
.seller-seg a { display: flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 12px; border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--ink-2); text-align: center; line-height: 1.2; }
.seller-seg a.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / .12); }
.shop-note { border-color: color-mix(in srgb, var(--good) 40%, var(--line)); }
.b.prot { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
.cond { border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; font-size: 12px; font-weight: 600; color: var(--ink-2); background: var(--surface); }
.graded { background: var(--ink); color: var(--bg); border-radius: 6px; padding: 1px 6px; font-size: 12px; font-weight: 700; }
.demo { background: color-mix(in srgb, var(--surface) 90%, transparent); border-radius: 6px; padding: 2px 6px; font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); }

/* panels */
.panel { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 16px; }
.panel h2 { font-size: 14px; font-weight: 600; margin: 0; }
.notice { border-radius: 12px; padding: 12px; font-size: 14px; }
.notice.bad { background: var(--bad-bg); color: var(--bad); } .notice.good { background: var(--good-bg); color: var(--good); }
.notice.warn { background: var(--warn-bg); color: var(--warn); } .notice.soft { background: var(--surface-2); color: var(--ink-2); }
.range { position: relative; height: 8px; border-radius: 999px; background: var(--surface-2); margin: 28px 0 8px; }
.range .fill { position: absolute; height: 8px; border-radius: 999px; background: var(--holo); }
.range .mark { position: absolute; top: -4px; width: 4px; height: 16px; border-radius: 4px; background: var(--ink); transform: translateX(-50%); }
.range .lbl { position: absolute; top: -22px; transform: translateX(-50%); font-size: 10px; font-weight: 600; white-space: nowrap; }
dl.rows { margin: 12px 0 0; font-size: 14px; } dl.rows div { display: flex; justify-content: space-between; padding: 3px 0; } dl.rows dt { color: var(--ink-2); } dl.rows dd { margin: 0; }
dl.rows div.total { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 8px; font-weight: 600; } dl.rows div.total dt { color: var(--ink); }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0 0; font-size: 14px; } .facts dt { font-size: 12px; color: var(--ink-2); } .facts dd { margin: 0; }

/* detail layout */
.detail { display: grid; gap: 24px; margin-top: 16px; }
@media (min-width: 768px) { .detail { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 40px; } .detail .left { position: sticky; top: 80px; align-self: start; } }
.big-art { position: relative; border-radius: 24px; background: var(--surface-2); max-width: 384px; margin: 0 auto; container-type: inline-size; }
@media (min-width: 768px) { .big-art { max-width: none; } }
.big-art .inner { position: absolute; inset: 8%; }
.thumbs { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
.thumbs img { width: 48px; height: 64px; object-fit: cover; border-radius: 6px; border: 2px solid var(--line); cursor: pointer; }
.thumbs img.on { border-color: var(--accent); }
.col { display: flex; flex-direction: column; gap: 16px; }

/* sell */
.sell { display: grid; gap: 24px; }
@media (min-width: 1024px) { .sell { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); } .sell .left { position: sticky; top: 80px; align-self: start; } }
.drop { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; overflow: hidden; border: 2px dashed var(--line); border-radius: 24px; background: var(--surface); text-align: center; cursor: pointer; width: 100%; max-width: 260px; margin: 0 auto; }
@media (min-width: 1024px) { .drop { max-width: none; } }
.drop img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; padding: 16px; }
.results { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.results button { border: 2px solid var(--line); background: var(--surface); border-radius: 10px; padding: 4px; cursor: pointer; text-align: left; font-size: 11px; }
.results button.on { border-color: var(--accent); }
.results img { width: 100%; border-radius: 6px; display: block; }
.results.alts { grid-template-columns: repeat(6, 1fr); gap: 6px; }
.results.alts button { font-size: 10px; line-height: 1.25; }
@media (max-width: 560px) { .results.alts { grid-template-columns: repeat(4, 1fr); } }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg label { display: flex; height: 44px; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 14px; font-weight: 500; cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 4px; }
.tabs button { height: 40px; border: 0; border-radius: 8px; background: none; font-weight: 600; cursor: pointer; }
.tabs button.on { background: var(--accent); color: var(--accent-ink); }

table.fees { width: 100%; border-collapse: collapse; font-size: 14px; } table.fees th { text-align: left; font-size: 12px; font-weight: 500; color: var(--ink-2); }
table.fees th, table.fees td { padding: 12px; border-bottom: 1px solid var(--line); } table.fees tr:last-child td { border-bottom: 0; }
footer.bottom { border-top: 1px solid var(--line); margin-top: 48px; }
footer.bottom .wrap { padding-top: 32px; padding-bottom: 32px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: var(--ink-2); }
@media (min-width: 640px) { footer.bottom .wrap { flex-direction: row; justify-content: space-between; } }
h1 { margin: 0; }
.hero h1 { font-size: clamp(34px, 6vw, 48px); line-height: 1.05; max-width: 640px; }
.hero p { max-width: 560px; }
.spinner { width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; vertical-align: middle; }
/* gráfica de valor en el mercado */
.phead { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.pranges { display: flex; gap: 4px; }
.pranges button { height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: none; color: var(--ink-2); font-size: 12px; font-weight: 600; cursor: pointer; }
.pranges button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pchart { position: relative; margin-top: 12px; }
.pchart svg { display: block; width: 100%; touch-action: pan-y; }
.pchart svg:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 8px; }
.pchart .axis { fill: var(--ink-2); font-size: 11px; font-family: var(--sans); }
.ptip { position: absolute; top: 4px; pointer-events: none; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; min-width: 160px; box-shadow: 0 8px 24px rgb(0 0 0 / .5); display: none; }
.ptip .d { color: var(--ink-2); margin-bottom: 4px; }
.ptip .r { display: flex; align-items: center; gap: 6px; margin-top: 2px; color: var(--ink-2); }
.ptip .r b { color: var(--ink); font-size: 13px; }
.ptip .k, .plegend .k { width: 12px; height: 2px; border-radius: 1px; flex-shrink: 0; display: inline-block; }
.plegend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink-2); margin-top: 10px; }
.plegend span { display: inline-flex; align-items: center; gap: 6px; }
details.pdata summary { cursor: pointer; font-size: 12px; color: var(--ink-2); margin-top: 10px; }
details.pdata .tbl { max-height: 240px; overflow: auto; margin-top: 8px; }

/* vendedor en la tarjeta y en el detalle */
.tseller { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; border-top: 1px solid var(--line); margin-top: 8px; padding-top: 10px; font-size: 13px; }
.tseller .who { display: flex; align-items: center; gap: 6px; min-width: 0; flex-basis: 100%; }
.tseller .nm { font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tseller .b { font-size: 11px; padding: 2px 7px; }
.tshop { flex-basis: 100%; display: flex; flex-direction: column; gap: 6px; margin-top: 2px; }
.tshop img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; background: var(--surface-2); display: block; }
.tshop p { margin: 0; font-size: 12px; line-height: 1.35; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.seller-panel .shop-photo { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: var(--surface-2); }
/* mi cuenta */
.account { max-width: 560px; padding-top: 24px; }
.acc-avatar { display: flex; align-items: center; gap: 16px; }
.acc-pick, .acc-shop { cursor: pointer; display: block; }
.acc-pick { flex-shrink: 0; }
.acc-pick .av { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 30px; font-weight: 700; background: var(--surface-2); border: 2px solid var(--line); }
.acc-shop .shp { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 14px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; border: 2px dashed var(--line); background: var(--surface-2); color: var(--ink-2); font-size: 14px; font-weight: 500; margin-top: 6px; }
.acc-shop img.shp { padding: 0; border-style: solid; }

/* pantalla de entrada (sin sesión) */
body.gate header.top, body.gate footer.bottom { display: none; }
.gate-wrap { min-height: 100vh; display: grid; align-items: center; gap: 40px; padding: 48px 0; }
@media (min-width: 900px) { .gate-wrap { grid-template-columns: 1.1fr 1fr; gap: 64px; } }
.gate-hero .logo { font-size: 24px; margin-bottom: 28px; }
.gate-hero h1 { font-size: clamp(36px, 6vw, 56px); line-height: 1.02; }
.gate-hero p { max-width: 460px; }
.gate-form { width: 100%; max-width: 448px; }
@media (min-width: 900px) { .gate-form { justify-self: end; } }
.gate-wrap { position: relative; z-index: 1; }
.gate-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 28px; }
.gate-pills span { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; background: rgb(17 17 19 / .7); border: 1px solid rgb(255 255 255 / .12); backdrop-filter: blur(8px); }
.gate-pills i { width: 8px; height: 8px; border-radius: 50%; }
.gate-glass { margin-top: 24px; padding: 24px; border-radius: 24px; border: 1.5px solid transparent; background: linear-gradient(rgb(17 17 19 / .82), rgb(17 17 19 / .82)) padding-box, var(--holo) border-box; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 30px 80px -20px rgb(0 0 0 / .9), 0 0 60px -20px rgb(138 182 255 / .35); }
.gate-glass .input { background: rgb(0 0 0 / .45); }
.gate-hero h1, .gate-hero p { text-shadow: 0 2px 24px rgb(0 0 0 / .9); }
.gate-hero p.muted { color: #cfcbc3; }

body:not(.gate) .gate-bg { display: none; }
.gate-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; background: #000; }
.gate-bg::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 70% 60% at 50% 50%, rgb(0 0 0 / .55), rgb(0 0 0 / .88)), linear-gradient(180deg, rgb(0 0 0 / .6), transparent 25%, transparent 75%, rgb(0 0 0 / .8)); }
.gate-cols { position: absolute; left: 50%; top: 50%; width: 170vmax; height: 170vmax; display: flex; justify-content: center; gap: 18px; transform: translate(-50%, -50%) rotate(-14deg); opacity: .78; }
.gate-col { flex: 0 0 150px; display: flex; flex-direction: column; gap: 18px; animation: gate-up 70s linear infinite; }
.gate-col:nth-child(even) { animation-name: gate-down; animation-duration: 85s; }
.gate-col:nth-child(3n) { animation-duration: 60s; }
@keyframes gate-up { from { transform: translateY(0); } to { transform: translateY(-50%); } }
@keyframes gate-down { from { transform: translateY(-50%); } to { transform: translateY(0); } }
.gc { position: relative; flex-shrink: 0; width: 150px; aspect-ratio: 63 / 88; border-radius: 9px; overflow: hidden; box-shadow: 0 14px 30px rgb(0 0 0 / .7); background: var(--surface-2); }
.gc img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gc.sport { color: #fff; padding: 10px; display: flex; flex-direction: column; border: 5px solid rgb(255 255 255 / .9); }
.gc.sport::before { content: ""; position: absolute; inset: 0; background: linear-gradient(125deg, transparent 30%, rgb(255 255 255 / .28) 45%, transparent 60%), repeating-linear-gradient(90deg, rgb(255 255 255 / .05) 0 2px, transparent 2px 14px); mix-blend-mode: screen; }
.gc.sport .lg { align-self: flex-start; position: relative; background: rgb(0 0 0 / .35); border-radius: 4px; padding: 2px 6px; font-size: 9px; font-weight: 800; letter-spacing: .12em; }
.gc.sport svg { position: relative; flex: 1; width: 100%; min-height: 0; filter: drop-shadow(0 6px 8px rgb(0 0 0 / .45)); }
.gc.sport .nm { position: relative; font-family: var(--display); font-weight: 700; font-size: 14px; line-height: 1.05; text-transform: uppercase; background: rgb(0 0 0 / .4); margin: 0 -10px -10px; padding: 7px 10px; }
.gc.sport .nm small { display: block; font-family: var(--sans); font-size: 9px; font-weight: 600; letter-spacing: .08em; opacity: .75; margin-top: 2px; }
@media (max-width: 640px) { .gate-col, .gc { flex-basis: 110px; width: 110px; } .gc.sport .nm { font-size: 11px; } .gate-cols { opacity: .5; } }
.gate-form > h2, .gate-form > p { text-shadow: 0 2px 20px rgb(0 0 0 / .95); }

function estimatePrice({ reference, localComps = [], condition, grading, now = new Date() }) {

    basis.push(`${recent.length} ventas en Panamá en los últimos 6 meses`);
  }
  let ref = null;

  if (reference && refValue > 0 && !grading) {
    const factor = condition ? CONDITION_FACTOR[condition] : 1;
    const mid = refValue * factor;
    ref = { low: mid * 0.85, mid, high: mid * 1.15, stale: daysBetween(parseDate(reference.updatedAt), now) > 14 };
    basis.push(`Precio de mercado en EE.UU. (TCGplayer, ${reference.variant})`);
    if (condition && condition !== "NM") basis.push(`Ajustado por condición ${condition} (×${factor})`);
  }
  if (!local && !ref) return null;

}

async function fetchRealListings(f) {
  if (!sb) return [];
  let q = sb.from("listings").select(LISTING_COLS).eq("status", "active").limit(60);
  if (f.seller) {
    const shops = await verifiedShopIds();
    if (f.seller === "tiendas") {
      if (!shops.length) return [];
      q = q.in("seller_id", shops);
    } else if (shops.length) {
      q = q.not("seller_id", "in", `(${shops.join(",")})`);
    }
  }
  if (f.category) q = q.eq("category", f.category);
  if (f.graded === "graded") q = q.not("grading_company", "is", null);
  if (f.graded === "raw") q = q.is("grading_company", null);
  if (f.province) q = q.eq("province", f.province);
  if (f.minPrice != null) q = q.gte("price_cents", Math.round(f.minPrice * 100));
  if (f.maxPrice != null) q = q.lte("price_cents", Math.round(f.maxPrice * 100));
  for (const t of searchTokens(f.q)) q = q.or(["title", "subject", "set_name", "neighborhood", "district", "province"].map((c) => `${c}.ilike.%${t}%`).join(","));
  q = q.order("created_at", { ascending: false });
  const { data, error } = await q;
  if (error) { console.error(error); return []; }
  return withProfiles(data ?? []);
}

function matchesFilters(l, f) {
  if (f.seller === "tiendas" && !isVerifiedShop(l.seller)) return false;
  if (f.seller === "particulares" && isVerifiedShop(l.seller)) return false;
  if (f.category && l.card.category !== f.category) return false;
  if (f.graded === "graded" && !l.grading) return false;
  if (f.graded === "raw" && l.grading) return false;
  if (f.province && l.location.province !== f.province) return false;
  if (f.minPrice != null && l.priceUsd < f.minPrice) return false;
  if (f.maxPrice != null && l.priceUsd > f.maxPrice) return false;
  if (f.q) {
    const hay = normalize([l.title, l.card.subject, l.card.setName, l.card.variant, l.card.number, l.location.neighborhood, l.location.district, l.location.province].join(" "));
    if (!normalize(f.q).split(/\s+/).filter(Boolean).every((t) => hay.includes(t))) return false;
  }
  return true;
}
function sortListings(list, sort) {
  const c = [...list];
  if (sort === "precio-asc") c.sort((a, b) => a.priceUsd - b.priceUsd);
  else if (sort === "precio-desc") c.sort((a, b) => b.priceUsd - a.priceUsd);

}

    minPrice: num("min"), maxPrice: num("max"), sort: orden === "precio-asc" || orden === "precio-desc" ? orden : "recientes",

function hrefWith(f, patch) {

async function route() {
  const { path, params } = parseHash();
  window.scrollTo(0, 0);
  renderNav();
  const app = $("#app");
  const gated = !!sb && !session;
  document.body.classList.toggle("gate", gated);
  try {
    if (gated) return viewAuth(app, path === "/entrar" ? params.get("next") || "/" : location.hash.replace(/^#/, "") || "/");
    if (path === "/" || path === "") return await viewHome(app, params);
    if (path.startsWith("/carta/")) return await viewDetail(app, decodeURIComponent(path.slice(7)));
    if (path === "/protegida") return viewProtected(app);
    if (path === "/entrar") return viewAuth(app, params.get("next") || "/");
    if (path === "/vender") return viewSell(app);
    if (path === "/cuenta") return await viewAccount(app);
    if (path === "/admin") return await viewAdmin(app, params);
    app.innerHTML = `<div style="padding:64px 0;text-align:center"><p>Página no encontrada.</p><a class="btn" href="#/">Volver al inicio</a></div>`;
  } catch (e) {
    console.error(e);
    app.innerHTML = `<div class="notice bad" style="margin-top:24px">Algo salió mal. Recarga la página.</div>`;
  }
}

// ============================================================= price history
// Valor en el tiempo. La base es el historial semanal incrustado en este mismo
// archivo (<script id="precios-data">), que un GitHub Action actualiza cada lunes
// con scripts/actualizar-precios.mjs: TCGplayer vía tcgcsv.com (desde feb 2024) y
// la guía de precios oficial de Cardmarket. Encima va el precio de hoy de TCGdex
// y, si existen, las ventas registradas en Panamá. La tabla price_snapshots de
// Supabase (supabase/price_snapshots.sql) es opcional (CONFIG.PRICE_SNAPSHOTS).
const CHART_COLORS = { market: "#6d86f5", cardmarket: "#2f9e8f", sales: "#c9823d" };
const DAY_MS = 86400000;
const CHART_RANGES = [["30 días", 30], ["90 días", 90], ["1 año", 365], ["Todo", Infinity]];
const isoDay = (d) => d.toISOString().slice(0, 10);
const noonUtc = (day) => Date.parse(`${day}T12:00:00Z`);
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
const fmtDay = (t, year) => new Intl.DateTimeFormat("es-PA", year ? { day: "numeric", month: "short", year: "numeric" } : { day: "numeric", month: "short" }).format(t);
const fmtAxis = (v) => (v >= 1000 ? `$${+(v / 1000).toFixed(1)}k` : `$${+v.toFixed(v < 10 ? 2 : 0)}`);
const median = (xs) => { const a = [...xs].sort((x, y) => x - y); return a.length ? quantile(a, 0.5) : null; };

let preciosData = null;
/** Historial semanal incrustado (vacío si el bloque falta o está dañado). */
function storedPrices() {
  if (!preciosData) {
    try { preciosData = JSON.parse($("#precios-data")?.textContent || "{}"); } catch { preciosData = {}; }
    preciosData.cartas ??= {};
  }
  return preciosData;
}

const TCGDEX_API = "https://api.tcgdex.net/v2/en";
/** pokemontcg.io ids (sv3pt5-199, swsh12pt5-1) → TCGdex ids (sv03.5-199, swsh12.5-1). */
function tcgdexId(id) {
  const i = id.lastIndexOf("-"), set = id.slice(0, i), m = set.match(/^([a-z]+)(\d+)(pt5)?$/);
  return `${m ? `${m[1]}${m[1] === "sv" ? m[2].padStart(2, "0") : m[2]}${m[3] ? ".5" : ""}` : set}-${id.slice(i + 1)}`;
}
/** TCGdex ids (sv03.5-006) → pokemontcg.io ids (sv3pt5-6), the format stored in listings.catalog_id. */
function ptcgId(dexId) {
  const i = dexId.lastIndexOf("-"), set = dexId.slice(0, i), num = dexId.slice(i + 1);
  return `${set.replace(/^([a-z]+)0+(?=\d)/, "$1").replace(/\.5$/, "pt5")}-${/^\d+$/.test(num) ? String(Number(num)) : num}`;
}
const dexCache = new Map();
/** GET on the TCGdex API, cached per page load (failures are not cached). */
function dexGet(path) {
  if (!dexCache.has(path)) {
    dexCache.set(path, withTimeout(fetch(`${TCGDEX_API}${path}`), 10000).then((r) => (r.ok ? r.json() : null))
      .catch(() => { dexCache.delete(path); return null; }));
  }
  return dexCache.get(path);
}
/** TCGdex card for a listing. TCGdex pads numbers (sv03.5-006) and pokemontcg.io does not (sv3pt5-6). */
async function fetchDexCard(card) {
  const ids = [card.dexId, card.catalogId && tcgdexId(card.catalogId)].filter(Boolean);
  const m = ids.at(-1)?.match(/^(.*-)(\d{1,2})$/);
  if (m) ids.push(`${m[1]}${m[2].padStart(3, "0")}`);
  for (const id of new Set(ids)) { const d = await dexGet(`/cards/${encodeURIComponent(id)}`); if (d) return d; }
  return null;
}
let eurUsdPromise = null;
/** EUR→USD from the European Central Bank reference rate (Frankfurter). */
const eurUsd = () => (eurUsdPromise ??= withTimeout(fetch("https://api.frankfurter.dev/v1/latest?from=EUR&to=USD"), 8000)
  .then((r) => r.json()).then((j) => ({ rate: j.rates.USD, date: j.date })).catch(() => null));

// Daily copy of Cardmarket's official price guide (github.com/ZyzyThePizi/pokemon-price-data, since
// 2026-09-16). The weekly job already stores it for tracked cards; this gives the same days to cards
// that are not tracked yet (e.g. one just identified from a photo).
const CM_MIRROR = "https://raw.githubusercontent.com/ZyzyThePizi/pokemon-price-data/main";
const cmShards = new Map();
let cmFieldsPromise = null, eurUsdDaysPromise = null;
async function cardmarketMirror(idProduct) {
  cmFieldsPromise ??= withTimeout(fetch(`${CM_MIRROR}/prices/manifest.json`), 8000).then((r) => r.json()).then((j) => j.historyFields).catch(() => { cmFieldsPromise = null; return null; });
  const shard = idProduct % 1000;
  if (!cmShards.has(shard)) cmShards.set(shard, withTimeout(fetch(`${CM_MIRROR}/history/${shard}.json`), 10000).then((r) => (r.ok ? r.json() : null)).catch(() => { cmShards.delete(shard); return null; }));
  const [fields, data] = await Promise.all([cmFieldsPromise, cmShards.get(shard)]);
  if (!fields || !data) return [];
  return (data[String(idProduct)] ?? []).map((row) => Object.fromEntries(fields.map((k, i) => [k, row[i]])));
}
/** ECB EUR→USD rate per day since the mirror started, so each point uses the rate of its own date. */
async function eurUsdDays() {
  eurUsdDaysPromise ??= withTimeout(fetch("https://api.frankfurter.dev/v1/2026-09-01..?base=EUR&symbols=USD"), 8000)
    .then((r) => r.json()).then((j) => Object.entries(j.rates).map(([d, r]) => [d, r.USD]).sort()).catch(() => { eurUsdDaysPromise = null; return []; });
  return eurUsdDaysPromise;
}
const rateOn = (days, d) => { let r = null; for (const [day, v] of days) { if (day > d) break; r = v; } return r ?? days[0]?.[1] ?? null; };

/** Agrega un punto al final de la serie si es de un día posterior al último (o lo reemplaza si es el mismo día). */
function appendLatest(series, p) {
  const last = series.at(-1);
  if (!last || isoDay(new Date(p.t)) > isoDay(new Date(last.t))) series.push(p);
  else if (isoDay(new Date(p.t)) === isoDay(new Date(last.t))) series[series.length - 1] = p;
}

async function fetchPriceHistory(l) {
  const { catalogId, category } = l.card;
  const factor = l.grading ? 1 : CONDITION_FACTOR[l.condition] ?? 1;
  const store = storedPrices();
  const h = { market: [], cardmarket: [], sales: [], factor, fx: null, productId: null, cmUpdated: null, updated: store.actualizado ?? null, weekly: false, liveMarket: false, liveCm: false };
  if (catalogId && !l.grading && category === "pokemon") {
    const stored = store.cartas[catalogId];
    const [dbRows, dex, fx] = await Promise.all([
      (async () => {
        if (!sb || !CONFIG.PRICE_SNAPSHOTS) return [];
        await withTimeout(sb.rpc("snapshot_price", { p_catalog_id: catalogId }), 6000).catch(() => {});
        const { data } = await sb.from("price_snapshots").select("variant, market_cents, captured_on").eq("catalog_id", catalogId).order("captured_on").limit(1500);
        return data ?? [];
      })().catch(() => []),
      fetchDexCard(l.card),
      eurUsd(),
    ]);
    // TCGplayer (EE.UU.): un precio de mercado por semana + el de hoy.
    const tpStored = stored?.series?.tcgplayer ?? {};
    const key = pickVariantKey(Object.keys(tpStored), l.card.variant);
    h.market = (tpStored[key] ?? []).filter((p) => p.market > 0)
      .map((p) => ({ t: noonUtc(p.d), v: round2(p.market * factor), k: "precio de mercado", carried: !!p.carried, src: p.fuente }));
    h.productId = stored?.tcgplayer?.productId ?? null;
    const dbKey = dbRows.length ? pickVariantKey([...new Set(dbRows.map((r) => r.variant))], key ?? l.card.variant) : null;
    for (const r of dbRows.filter((r) => r.variant === dbKey)) appendLatest(h.market, { t: noonUtc(r.captured_on), v: round2((r.market_cents / 100) * factor), k: "precio de mercado", src: "supabase" });
    const tp = dex?.pricing?.tcgplayer;
    if (tp) {
      const tkey = pickVariantKey(Object.keys(tp).filter((k) => typeof tp[k] === "object" && tp[k]), key ?? l.card.variant);
      const v = tp[tkey]?.marketPrice ?? tp[tkey]?.midPrice;
      h.productId ??= tp[tkey]?.productId ?? null;
      if (v > 0) { appendLatest(h.market, { t: noonUtc(isoDay(new Date(tp.updated ?? Date.now()))), v: round2(v * factor), k: "precio de mercado", src: "tcgdex" }); h.liveMarket = h.market.at(-1).src === "tcgdex"; }
    }
    // Cardmarket (Europa): promedio de ventas reales de los últimos 7 días, en USD con la tasa del BCE de cada fecha.
    const cmValue = (p) => (p.avg7 > 0 ? [p.avg7, "promedio de ventas, últimos 7 días"] : p.trend > 0 ? [p.trend, "precio de tendencia"] : [null]);
    h.cardmarket = (stored?.series?.cardmarket ?? []).filter((p) => p.eurUsd && cmValue(p)[0])
      .map((p) => { const [eur, k] = cmValue(p); return { t: noonUtc(p.d), v: round2(eur * p.eurUsd * factor), k, carried: !!p.carried, src: p.fuente, rate: p.eurUsd }; });
    const cm = dex?.pricing?.cardmarket;
    if (!h.cardmarket.length && cm?.idProduct) {
      const [rows, days] = await Promise.all([cardmarketMirror(cm.idProduct).catch(() => []), eurUsdDays()]);
      for (const o of rows) {
        const [eur, k] = cmValue(o), rate = rateOn(days, o.date);
        if (eur && rate) h.cardmarket.push({ t: noonUtc(o.date), v: round2(eur * rate * factor), k, src: "cardmarket-espejo", rate });
      }
    }
    if (cm && fx && cmValue(cm)[0]) {
      const [eur, k] = cmValue(cm);
      h.fx = fx; h.cmUpdated = Date.parse(cm.updated);
      appendLatest(h.cardmarket, { t: noonUtc(isoDay(new Date(h.cmUpdated))), v: round2(eur * fx.rate * factor), k, src: "tcgdex", rate: fx.rate });
      h.liveCm = h.cardmarket.at(-1).src === "tcgdex";
    }
    h.weekly = h.market.length > 4 || h.cardmarket.length > 4;
  }
  if (sb && catalogId && !l.isDemo) {
    const gradingKey = l.grading ? `${l.grading.company}${l.grading.grade}` : "raw";
    const since = new Date(Date.now() - 366 * DAY_MS).toISOString();
    const { data } = await sb.from("sales").select("price_cents, sold_at").eq("catalog_id", catalogId).eq("grading_key", gradingKey).gte("sold_at", since).order("sold_at").limit(500);
    h.sales = (data ?? []).map((r) => ({ t: Date.parse(r.sold_at), v: r.price_cents / 100 }));
  }
  return h;
}

function niceTicks(lo, hi, n = 4) {
  if (hi - lo < 1e-6) { lo *= 0.9; hi = hi * 1.1 || 1; }
  const raw = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(raw)), e = raw / mag;
  const step = (e >= 7.5 ? 10 : e >= 3.5 ? 5 : e >= 1.5 ? 2 : 1) * mag;
  const out = [];
  for (let v = Math.max(0, Math.floor(lo / step) * step); v <= Math.ceil(hi / step) * step + step * 1e-6; v += step) out.push(round2(v));
  return out;
}

/** Links to the public sources so buyers can check the price themselves. */
function priceSources(l, h) {
  const links = [];
  if (h?.productId) links.push([`https://www.tcgplayer.com/product/${h.productId}`, "TCGplayer"]);
  if (h?.cardmarket?.length) links.push([`https://www.cardmarket.com/en/Pokemon/Products/Search?searchString=${encodeURIComponent(l.card.subject)}`, "Cardmarket"]);
  const q = [l.card.year, l.card.subject, l.card.setName, l.card.number, l.grading ? `${l.grading.company} ${l.grading.grade}` : ""].filter(Boolean).join(" ");
  links.push([`https://www.ebay.com/sch/i.html?_nkw=${encodeURIComponent(q)}&LH_Sold=1&LH_Complete=1`, "Ventas completadas en eBay"]);
  return `<p class="xs" style="margin:6px 0 0;display:flex;flex-wrap:wrap;gap:4px 14px"><span class="muted">Verifica la fuente:</span>${links.map(([u, t]) => `<a href="${esc(u)}" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:underline">${t} ↗</a>`).join("")}</p>`;
}
function renderPriceChart(box, l, h, rangeDays, setRange) {
  const price = l.priceUsd, now = Date.now();
  const header = `<div class="phead"><h2>Valor en el mercado</h2>${h.market.length + h.cardmarket.length + h.sales.length ? `<div class="pranges" role="group" aria-label="Periodo">${CHART_RANGES.map(([t, d]) => `<button type="button" data-d="${d}" class="${d === rangeDays ? "on" : ""}" aria-pressed="${d === rangeDays}">${t}</button>`).join("")}</div>` : ""}</div>`;
  if (!h.market.length && !h.cardmarket.length && !h.sales.length) {
    box.innerHTML = `${header}<p class="small muted" style="margin:6px 0 0">${l.card.category === "pokemon" && !l.grading
      ? "Todavía no tenemos historial de precios para esta carta."
      : "Todavía no hay historial para esta carta. Para cartas deportivas y graduadas lo armamos con las ventas registradas en Panamá; cuando haya ventas, aparecerán aquí."}</p>${priceSources(l, h)}`;
    return;
  }
  const from = rangeDays === Infinity ? -Infinity : now - rangeDays * DAY_MS;
  const market = h.market.filter((p) => p.t >= from), cmk = h.cardmarket.filter((p) => p.t >= from), sales = h.sales.filter((p) => p.t >= from);
  // Texto del periodo elegido: "en el último año", "desde el 8 feb 2024"…
  // Si la serie empieza bastante después del inicio del periodo, se nombra su fecha real.
  const since = (pts) => (rangeDays === Infinity || pts[0].t - from > 14 * DAY_MS ? `desde el ${fmtDay(pts[0].t, true)}` : rangeDays === 365 ? "en el último año" : `en los últimos ${rangeDays} días`);
  const move = (pts) => { const r = pts.at(-1).v / pts[0].v - 1, p = Math.round(Math.abs(r) * 100); return p < 1 ? "se mantuvo estable" : `${r > 0 ? "subió" : "bajó"} ${p}% (de ${fmtEstimate(pts[0].v)} a ${fmtEstimate(pts.at(-1).v)})`; };

  // Headline: how this listing compares with the value today, and how the value moved in the selected period.
  const current = h.market.at(-1) ?? h.cardmarket.at(-1);
  let head = "";
  if (current) {
    const d = ((price ?? current.v) - current.v) / current.v, pct = Math.round(Math.abs(d) * 100);
    const rel = pct < 3 ? "en línea con el valor de mercado" : `${pct}% ${d > 0 ? "por encima" : "por debajo"} del valor de mercado`;
    const when = isoDay(new Date(current.t)) === isoDay(new Date()) ? "hoy" : `al ${fmtDay(current.t)}`;
    head = `<p style="margin:8px 0 0"><span class="display" style="font-size:24px;font-weight:700">${fmtEstimate(current.v)}</span> <span class="small muted">valor de mercado ${when} (${h.market.length ? "TCGplayer" : "Cardmarket"})</span></p>
      <p class="small" style="margin:4px 0 0">${price != null ? `${esc(l.priceLabel ?? "Este anuncio")} (${formatUsd(toCents(price))}) está <strong>${rel}</strong>.` : ""}${market.length >= 2 ? ` En TCGplayer, ${since(market)} el valor ${move(market)}.` : ""}${cmk.length >= 2 ? ` En Europa (Cardmarket), ${since(cmk)} el promedio de ventas ${move(cmk)}.` : ""}</p>`;
  } else {
    const recent = h.sales.filter((p) => p.t >= now - 180 * DAY_MS).map((p) => p.v);
    const med = median(recent.length ? recent : h.sales.map((p) => p.v));
    const d = ((price ?? med) - med) / med, pct = Math.round(Math.abs(d) * 100);
    head = `<p style="margin:8px 0 0"><span class="display" style="font-size:24px;font-weight:700">${fmtEstimate(med)}</span> <span class="small muted">mediana de ventas en Panamá</span></p>
      ${price == null ? "" : `<p class="small" style="margin:4px 0 0">${esc(l.priceLabel ?? "Este anuncio")} (${formatUsd(toCents(price))}) está <strong>${pct < 3 ? "en línea con las ventas recientes" : `${pct}% ${d > 0 ? "por encima" : "por debajo"} de las ventas recientes`}</strong>.</p>`}`;
  }
  const notes = [];
  const weeklyTp = h.market.filter((p) => p.src !== "tcgdex" && p.src !== "supabase");
  if (weeklyTp.length) notes.push(`TCGplayer (EE.UU.): precio de mercado, un registro por semana desde el ${fmtDay(weeklyTp[0].t, true)}, de tcgcsv.com (copia pública de los precios de TCGplayer)${h.liveMarket ? "; el último punto es el precio de hoy según TCGdex" : ""}.`);
  else if (h.market.length) notes.push("TCGplayer (EE.UU.): precio de mercado de hoy según TCGdex. El historial semanal de TCGplayer se guarda automáticamente cada lunes mientras la carta tenga un anuncio activo.");
  if (h.cardmarket.length) notes.push(`Cardmarket (Europa): promedio de ventas reales de los últimos 7 días, de la guía de precios oficial de Cardmarket${h.liveCm ? " (el último punto, vía TCGdex)" : ""}, convertido de EUR a USD con la tasa del Banco Central Europeo de cada fecha${h.fx ? ` (hoy 1 € = $${h.fx.rate})` : ""}.`);
  if (h.market.some((p) => p.carried) || h.cardmarket.some((p) => p.carried)) notes.push("Las semanas sin dato nuevo repiten el último valor conocido (tramo plano).");
  if (h.factor !== 1) notes.push(`Precios ajustados a condición ${l.condition} (×${h.factor}).`);
  if (h.sales.length) notes.push("Ventas en Panamá: ventas registradas en la plataforma.");
  const updated = h.updated ? `<p class="xs muted" style="margin:4px 0 0">Actualizado automáticamente cada semana · última actualización ${fmtDay(Date.parse(h.updated), true)}</p>` : "";
  const typeLabel = (p, base) => `${base}${p.carried ? " (sin dato nuevo: se repite el anterior)" : ""}`;

  box.innerHTML = `${header}${head}
    ${market.length || cmk.length || sales.length ? `<div class="pchart"></div>` : `<p class="notice soft small" style="margin:12px 0 0">No hay datos en este periodo. Prueba con uno más largo.</p>`}
    <div class="plegend">${h.market.length ? `<span><i class="k" style="background:${CHART_COLORS.market}"></i>TCGplayer (EE.UU.)</span>` : ""}${h.cardmarket.length ? `<span><i class="k" style="background:${CHART_COLORS.cardmarket}"></i>Cardmarket (Europa)</span>` : ""}${h.sales.length ? `<span><i class="k" style="width:8px;height:8px;border-radius:50%;background:${CHART_COLORS.sales}"></i>Ventas en Panamá</span>` : ""}${price != null ? `<span><i class="k" style="height:0;border-top:2px dashed var(--ink)"></i>${esc(l.priceLabel ?? "Este anuncio")}</span>` : ""}</div>
    <p class="xs muted" style="margin:8px 0 0">${notes.map(esc).join(" ")} Es una referencia, no una garantía.</p>
    ${updated}
    ${priceSources(l, h)}
    <details class="pdata"><summary>Ver datos en tabla</summary><div class="tbl"><table class="fees"><thead><tr><th>Fecha</th><th>Tipo</th><th>Precio</th></tr></thead><tbody>${
      [...market.map((p) => ({ ...p, k: typeLabel(p, "TCGplayer · precio de mercado") })), ...cmk.map((p) => ({ ...p, k: typeLabel(p, `Cardmarket · ${p.k}`) })), ...sales.map((p) => ({ ...p, k: "Venta en Panamá" }))].sort((a, b) => b.t - a.t)
        .map((p) => `<tr><td>${fmtDay(p.t, true)}</td><td>${esc(p.k)}</td><td>${formatUsd(toCents(p.v))}</td></tr>`).join("")}</tbody></table></div></details>`;
  box.querySelectorAll(".pranges button").forEach((b) => b.addEventListener("click", () => setRange(Number(b.dataset.d))));
  const wrap = box.querySelector(".pchart");
  if (!wrap) return;

  // Geometry
  const W = Math.max(260, Math.round(wrap.clientWidth)), H = 220, m = { l: 46, r: 10, t: 14, b: 26 };
  const pts = [...market, ...cmk, ...sales];
  let xMin = Math.min(...pts.map((p) => p.t));
  if (now - xMin < 7 * DAY_MS) xMin = now - 7 * DAY_MS;
  const xMax = now;
  const vals = [...pts.map((p) => p.v), ...(price != null ? [price] : [])];
  const ticks = niceTicks(Math.min(...vals) * 0.94, Math.max(...vals) * 1.04);
  const yMin = ticks[0], yMax = ticks.at(-1);
  const X = (t) => m.l + ((t - xMin) / (xMax - xMin)) * (W - m.l - m.r);
  const Y = (v) => m.t + (1 - (v - yMin) / (yMax - yMin)) * (H - m.t - m.b);
  const xTicks = [0, 1 / 3, 2 / 3, 1].map((f) => xMin + f * (xMax - xMin));
  const spansYear = new Date(xMin).getFullYear() !== new Date(xMax).getFullYear();
  const line = market.map((p, i) => `${i ? "L" : "M"}${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join("");
  const last = market.at(-1);

  wrap.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" tabindex="0" role="img" aria-label="Gráfica del valor de mercado en TCGplayer y Cardmarket en el tiempo. Usa las flechas para recorrer los puntos.">
    ${ticks.map((v) => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text class="axis" x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end">${fmtAxis(v)}</text>`).join("")}
    ${xTicks.map((t, i) => `<text class="axis" x="${X(t)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === 3 ? "end" : "middle"}">${i === 3 ? "Hoy" : fmtDay(t, spansYear)}</text>`).join("")}
    ${price != null ? `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(price)}" y2="${Y(price)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 4" opacity=".75"/>
    <text class="axis" x="${W - m.r}" y="${Y(price) - 6}" text-anchor="end" style="fill:var(--ink)">${esc(l.priceLabel ?? "Este anuncio")} ${formatUsd(toCents(price))}</text>` : ""}
    ${market.length > 1 ? `<path d="${line}" fill="none" stroke="${CHART_COLORS.market}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : ""}
    ${last ? `<circle cx="${X(last.t)}" cy="${Y(last.v)}" r="4.5" fill="${CHART_COLORS.market}" stroke="var(--surface)" stroke-width="2"/>` : ""}
    ${cmk.length > 1 ? `<path d="${cmk.map((p, i) => `${i ? "L" : "M"}${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join("")}" fill="none" stroke="${CHART_COLORS.cardmarket}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : ""}
    ${(cmk.length > 12 ? cmk.slice(-1) : cmk).map((p) => `<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="4" fill="${CHART_COLORS.cardmarket}" stroke="var(--surface)" stroke-width="2"/>`).join("")}
    ${sales.map((p) => `<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="4.5" fill="${CHART_COLORS.sales}" stroke="var(--surface)" stroke-width="2"/>`).join("")}
    <g class="cross" style="display:none"><line y1="${m.t}" y2="${H - m.b}" stroke="var(--ink-2)" stroke-width="1"/><circle r="5.5" fill="none" stroke="var(--ink)" stroke-width="2"/></g>
  </svg><div class="ptip" role="status"></div>`;

  // Hover / keyboard layer: snap to the nearest date that has data.
  const byDay = new Map();
  for (const p of market) byDay.set(isoDay(new Date(p.t)), { t: p.t, market: p.v, marketCarried: p.carried, cm: null, sales: [] });
  for (const p of cmk) { const k = isoDay(new Date(p.t)); const s = byDay.get(k) ?? { t: p.t, market: null, cm: null, sales: [] }; s.cm = p; byDay.set(k, s); }
  for (const p of sales) { const k = isoDay(new Date(p.t)); const s = byDay.get(k) ?? { t: p.t, market: null, cm: null, sales: [] }; s.sales.push(p.v); byDay.set(k, s); }
  const stops = [...byDay.values()].sort((a, b) => a.t - b.t);
  const svg = wrap.querySelector("svg"), tip = wrap.querySelector(".ptip"), cross = svg.querySelector(".cross");
  let idx = stops.length - 1;
  const row = (color, value, label, round) => {
    const r = document.createElement("div"); r.className = "r";
    const k = document.createElement("i"); k.className = "k"; k.style.background = color; if (round) Object.assign(k.style, { width: "8px", height: "8px", borderRadius: "50%" });
    const b = document.createElement("b"); b.textContent = value;
    r.append(k, b, document.createTextNode(label)); return r;
  };
  const show = (i) => {
    idx = Math.max(0, Math.min(stops.length - 1, i));
    const s = stops[idx], x = X(s.t), y = Y(s.market ?? s.cm?.v ?? s.sales[0]);
    cross.style.display = "";
    cross.querySelector("line").setAttribute("x1", x); cross.querySelector("line").setAttribute("x2", x);
    cross.querySelector("circle").setAttribute("cx", x); cross.querySelector("circle").setAttribute("cy", y);
    const d = document.createElement("div"); d.className = "d"; d.textContent = fmtDay(s.t, true);
    tip.replaceChildren(d);
    const again = " (sin dato nuevo, se repite)";
    if (s.market != null) tip.append(row(CHART_COLORS.market, formatUsd(toCents(s.market)), `TCGplayer${s.marketCarried ? again : ""}`));
    if (s.cm) tip.append(row(CHART_COLORS.cardmarket, formatUsd(toCents(s.cm.v)), `Cardmarket · ${s.cm.k}${s.cm.carried ? again : ""}`));
    for (const v of s.sales) tip.append(row(CHART_COLORS.sales, formatUsd(toCents(v)), "venta en Panamá", true));
    const ref = s.market ?? s.cm?.v ?? s.sales[0], diff = Math.round(((price - ref) / ref) * 100);
    if (price != null) tip.append(row("var(--ink)", formatUsd(toCents(price)), `${(l.priceLabel ?? "Este anuncio").toLowerCase()} (${diff > 0 ? "+" : ""}${diff}%)`));
    tip.style.display = "block";
    const tw = tip.offsetWidth;
    tip.style.left = `${x > W / 2 ? Math.max(0, x - tw - 12) : Math.min(W - tw, x + 12)}px`;
  };
  const hide = () => { cross.style.display = "none"; tip.style.display = "none"; };
  svg.addEventListener("pointermove", (e) => {
    const r = svg.getBoundingClientRect(), px = ((e.clientX - r.left) / r.width) * W;
    let best = 0;
    stops.forEach((s, i) => { if (Math.abs(X(s.t) - px) < Math.abs(X(stops[best].t) - px)) best = i; });
    show(best);
  });
  svg.addEventListener("pointerleave", () => { if (document.activeElement !== svg) hide(); });
  svg.addEventListener("focus", () => show(idx));
  svg.addEventListener("blur", hide);
  svg.addEventListener("keydown", (e) => {
    const step = { ArrowLeft: -1, ArrowRight: 1 }[e.key];
    if (step) { e.preventDefault(); show(idx + step); }
    else if (e.key === "Home" || e.key === "End") { e.preventDefault(); show(e.key === "Home" ? 0 : stops.length - 1); }
  });
}

async function loadPriceChart(l) {
  const box = $("#priceChart");
  if (!box) return;
  const h = await fetchPriceHistory(l).catch((e) => { console.error(e); return { market: [], cardmarket: [], sales: [], factor: 1 }; });
  if (!box.isConnected) return;
  // Con historial semanal largo se abre en "1 año"; si no, en 90 días.
  let range = h.weekly ? 365 : 90, width = box.clientWidth;
  const draw = () => renderPriceChart(box, l, h, range, (r) => { range = r; draw(); });
  draw();
  const ro = new ResizeObserver(() => {
    if (!box.isConnected) return ro.disconnect();
    if (box.clientWidth !== width) { width = box.clientWidth; draw(); }
  });
  ro.observe(box);
}

async function compressImage(file) {
  if (!file.type.startsWith("image/")) return file;
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); } catch { return file; }
  const s = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height); bmp.close?.();
  const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85));
  if (!blob) return file;
  if (["image/jpeg", "image/png", "image/webp"].includes(file.type) && blob.size >= file.size) return file;
  return new File([blob], "foto.jpg", { type: "image/jpeg" });
}
async function catalogSearch(name, number) {
  const clean = (s) => s.replace(/["\\]/g, "").trim();
  const n = number?.split("/")[0].replace(/^#/, "").trim();
  const queries = n ? [`name:"${clean(name)}" number:"${clean(n)}"`, `name:"${clean(name)}"`] : [`name:"${clean(name)}"`];
  for (const q of queries) {
    for (let attempt = 0; attempt < 3; attempt++) {
      if (attempt) await new Promise((r) => setTimeout(r, 600 * 2 ** (attempt - 1)));
      try {
        const res = await fetch(`${CONFIG.CATALOG_API}/cards?q=${encodeURIComponent(q)}&pageSize=9&orderBy=-set.releaseDate&select=id,name,number,rarity,set,images,tcgplayer`);
        if (res.ok) { const d = (await res.json()).data; if (d.length) return d; break; }
        if (res.status < 500) break;
      } catch { /* network hiccup, retry */ }
    }
  }
  // pokemontcg.io fails often (and sunsets 2027-03-01): fall back to the TCGdex catalog.
  const [found, sets] = await Promise.all([dexCandidates({ name, number: number?.split("/")[0], total: number?.split("/")[1] }), dexSets()]);
  return found.slice(0, 9).map((c) => catalogFromDexBrief(c, sets.get(setOfDexId(c.id))));
}

// ============================================================= card identification
// A photo is enough: the page works out which card (and which printing) it is, fills the
// form, writes a description, and shows today's price with its history.
//   1. AI (Supabase Edge Function "identificar-carta", Claude vision). Works for Pokémon, NBA and NFL.
//   2. Fallback without any key: OCR in the browser (Tesseract.js) reads the name and the
//      collector number (199/165).
// For Pokémon both paths end in the TCGdex catalog. The candidates are ranked by number, set
// size and name, and ties are broken by comparing the photo with each catalog image.
const TESSERACT_URL = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
// TCG Pocket is a digital game: its "cards" share names and numbers with physical ones.
const isPocketSet = (setId) => /^(A\d|B\d|P-A)/.test(setId);
const setOfDexId = (id) => id.slice(0, id.lastIndexOf("-"));
const sameNumber = (a, b) => (/^\d+$/.test(a) && /^\d+$/.test(b) ? Number(a) === Number(b) : String(a).toUpperCase() === String(b).toUpperCase());
const tokens = (s) => normalize(s).replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter((w) => w.length > 1);

let dexSetsPromise = null;
const dexSets = () => (dexSetsPromise ??= dexGet("/sets").then((list) => {
  if (!list) { dexSetsPromise = null; return new Map(); }
  return new Map(list.map((s) => [s.id, s]));
}));

/** Physical cards in TCGdex that match a name and/or collector number (number/total). */
async function dexCandidates({ name, number, total }) {
  const num = number?.replace(/^#/, "").trim(), tot = total?.replace(/\D/g, "");
  const q = new URLSearchParams();
  if (num) q.set("localId", /^\d+$/.test(num) ? String(Number(num)) : num); // TCGdex matches "contains": exact check below
  if (name) q.set("name", name);
  if (![...q.keys()].length) return [];
  let list = (await dexGet(`/cards?${q}`)) ?? [];
  if (!list.length && num && name) list = (await dexGet(`/cards?localId=${encodeURIComponent(q.get("localId"))}`)) ?? [];
  list = list.filter((c) => !isPocketSet(setOfDexId(c.id)) && (!num || sameNumber(c.localId, num)));
  if (tot && list.length > 1) {
    const sets = await dexSets();
    const bySize = list.filter((c) => String(sets.get(setOfDexId(c.id))?.cardCount?.official) === String(Number(tot)));
    if (bySize.length) list = bySize;
  }
  return list;
}

/** Minimal catalog object (same shape as pokemontcg.io) from a TCGdex search row. */
function catalogFromDexBrief(c, set) {
  return { id: ptcgId(c.id), dexId: c.id, name: c.name, number: c.localId, rarity: "", set: { name: set?.name ?? setOfDexId(c.id), printedTotal: set?.cardCount?.official ?? "" }, images: { small: c.image ? `${c.image}/low.webp` : "" }, brief: true };
}

/** Full catalog object from TCGdex: set, rarity, artist, prices. Shape compatible with pokemontcg.io. */
async function catalogFromDex(dexId) {
  const d = await dexGet(`/cards/${encodeURIComponent(dexId)}`);
  if (!d) return null;
  const set = await dexGet(`/sets/${encodeURIComponent(d.set.id)}`);
  const tp = d.pricing?.tcgplayer ?? {}, prices = {};
  for (const [k, v] of Object.entries(tp)) {
    if (v && typeof v === "object") prices[k.replace(/-(\w)/g, (_, ch) => ch.toUpperCase())] = { market: v.marketPrice ?? null, mid: v.midPrice ?? null, low: v.lowPrice ?? null, productId: v.productId ?? null };
  }
  return {
    id: ptcgId(d.id), dexId: d.id, name: d.name, number: d.localId, rarity: d.rarity ?? "",
    set: { id: d.set.id, name: d.set.name, printedTotal: d.set.cardCount?.official ?? set?.cardCount?.official ?? "", releaseDate: set?.releaseDate ?? "", serie: set?.serie?.name ?? "" },
    images: { small: d.image ? `${d.image}/low.webp` : "", large: d.image ? `${d.image}/high.webp` : "" },
    tcgplayer: Object.keys(prices).length ? { prices, updatedAt: tp.updated ?? new Date().toISOString() } : null,
    cardmarket: d.pricing?.cardmarket ?? null,
    illustrator: d.illustrator ?? "", hp: d.hp ?? null, types: d.types ?? [], stage: d.stage ?? "", kind: d.category ?? "",
  };
}

const loadImage = (src, cors) => new Promise((resolve, reject) => {
  const im = new Image();
  if (cors) im.crossOrigin = "anonymous";
  im.onload = () => resolve(im); im.onerror = reject; im.src = src;
});
/** The card's area in a photo: a centered card-shaped (63×88 mm) box. Scans fill the frame. */
function cardRect(w, h, fill) {
  const ratio = 63 / 88;
  let ch = Math.min(h, w / ratio) * fill, cw = ch * ratio;
  return { x: (w - cw) / 2, y: (h - ch) / 2, w: cw, h: ch };
}
/**
 * Where the card is in a photo: the bounding box of what differs from the background
 * (the color along the photo's edges). Falls back to a centered card-shaped box.
 */
function findCard(im) {
  const W = im.naturalWidth || im.width, H = im.naturalHeight || im.height, k = 200 / Math.max(W, H);
  const w = Math.max(8, Math.round(W * k)), h = Math.max(8, Math.round(H * k));
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d", { willReadFrequently: true }); g.drawImage(im, 0, 0, w, h);
  const px = g.getImageData(0, 0, w, h).data, at = (x, y) => (y * w + x) * 4;
  const edge = [];
  for (let x = 0; x < w; x++) edge.push(at(x, 0), at(x, 1), at(x, h - 1), at(x, h - 2));
  for (let y = 0; y < h; y++) edge.push(at(0, y), at(1, y), at(w - 1, y), at(w - 2, y));
  const bg = [0, 1, 2].map((ch) => median(edge.map((i) => px[i + ch])));
  const rows = new Array(h).fill(0), cols = new Array(w).fill(0);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = at(x, y);
    if (Math.hypot(px[i] - bg[0], px[i + 1] - bg[1], px[i + 2] - bg[2]) > 48) { rows[y]++; cols[x]++; }
  }
  const span = (arr, min) => { const a = arr.findIndex((v) => v >= min), b = arr.findLastIndex((v) => v >= min); return a < 0 ? null : [a, b + 1]; };
  const ys = span(rows, w * 0.25), xs = span(cols, h * 0.25);
  if (ys && xs) {
    const bw = (xs[1] - xs[0]) / k, bh = (ys[1] - ys[0]) / k, ratio = bw / bh;
    // Accept only card-like boxes (63×88 mm ≈ 0.72, some room for tilt) that are not the whole photo.
    if (ratio > 0.55 && ratio < 0.9 && bw * bh > W * H * 0.2 && bw * bh < W * H * 0.97) return { x: xs[0] / k, y: ys[0] / k, w: bw, h: bh };
  }
  return cardRect(W, H, 0.94);
}
/** Visual fingerprint: 64-bit gradient hash (shape) + 4×4 color grid (palette). */
function signature(im, fill) {
  const r = fill ? cardRect(im.naturalWidth || im.width, im.naturalHeight || im.height, fill) : findCard(im);
  const c = document.createElement("canvas"), g = c.getContext("2d", { willReadFrequently: true });
  c.width = 9; c.height = 8; g.drawImage(im, r.x, r.y, r.w, r.h, 0, 0, 9, 8);
  const px = g.getImageData(0, 0, 9, 8).data, lum = (i) => px[i] * 0.299 + px[i + 1] * 0.587 + px[i + 2] * 0.114;
  const bits = [];
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) bits.push(lum((y * 9 + x) * 4) > lum((y * 9 + x + 1) * 4) ? 1 : 0);
  c.width = 4; c.height = 4; g.drawImage(im, r.x, r.y, r.w, r.h, 0, 0, 4, 4);
  return { bits, color: [...g.getImageData(0, 0, 4, 4).data].filter((_, i) => i % 4 !== 3) };
}
/** 0 = identical, 1 = unrelated. */
function visualDistance(a, b) {
  let ham = 0, col = 0;
  a.bits.forEach((v, i) => { if (v !== b.bits[i]) ham++; });
  for (let i = 0; i < a.color.length; i += 3) col += Math.hypot(a.color[i] - b.color[i], a.color[i + 1] - b.color[i + 1], a.color[i + 2] - b.color[i + 2]);
  return 0.5 * (ham / 64) + 0.5 * (col / (a.color.length / 3) / 441.7);
}

/** Score candidates by what was read (number, set size, name) and by how much the photo looks like each one. */
async function rankCandidates(hints, photo) {
  let list = [];
  if (hints.number) list = await dexCandidates({ name: hints.name, number: hints.number, total: hints.total });
  if (!list.length && hints.number && hints.name) list = await dexCandidates({ number: hints.number, total: hints.total });
  if (!list.length && hints.name) list = await dexCandidates({ name: hints.name });
  if (!list.length) return [];
  const sets = await dexSets();
  const read = new Set(tokens(`${hints.name ?? ""} ${hints.text ?? ""}`));
  const setWords = new Set(tokens(hints.setName ?? ""));
  const scored = list.map((c) => {
    const nameTok = tokens(c.name), set = sets.get(setOfDexId(c.id));
    let text = nameTok.length ? (2 * nameTok.filter((w) => read.has(w)).length) / nameTok.length : 0;
    if (hints.number && sameNumber(c.localId, hints.number)) text += 2;
    if (hints.total && String(set?.cardCount?.official) === String(Number(hints.total.replace(/\D/g, "")))) text += 2;
    if (setWords.size && set) { const st = tokens(set.name); text += st.length ? st.filter((w) => setWords.has(w)).length / st.length : 0; }
    return { ...c, text, setName: set?.name ?? "", dist: null };
  }).sort((a, b) => b.text - a.text).slice(0, 16);
  return visualRank(scored, photo);
}
/** Visual tie-breaker among the best text matches: compare the photo with each catalog image. */
async function visualRank(scored, photo) {
  if (photo && scored.length > 1) {
    try {
      const url = URL.createObjectURL(photo), mine = signature(await loadImage(url));
      URL.revokeObjectURL(url);
      await Promise.all(scored.filter((c) => c.image).map(async (c) => {
        try { c.dist = visualDistance(mine, signature(await withTimeout(loadImage(`${c.image}/low.webp`, true), 8000), 1)); } catch { /* image missing */ }
      }));
    } catch (e) { console.warn("visual match skipped", e); }
  }
  const score = (c) => c.text - 10 * (c.dist ?? 0.45);
  return scored.sort((a, b) => score(b) - score(a)).map((c) => ({ ...c, score: score(c) }));
}

let ocrWorker = null;
async function ocr(canvas) {
  if (!window.Tesseract) {
    await new Promise((resolve, reject) => { const s = document.createElement("script"); s.src = TESSERACT_URL; s.onload = resolve; s.onerror = reject; document.head.appendChild(s); });
  }
  ocrWorker ??= window.Tesseract.createWorker("eng").catch((e) => { ocrWorker = null; throw e; });
  const { data } = await (await ocrWorker).recognize(canvas);
  return data.text ?? "";
}
/** Draw part of the card (fractions of the card box) upscaled and in grayscale, for OCR. */
function cropForOcr(im, [fx, fy, fw, fh], width, r = findCard(im)) {
  const sx = r.x + r.w * fx, sy = r.y + r.h * fy, sw = r.w * fw, sh = r.h * fh;
  const c = document.createElement("canvas"); c.width = width; c.height = Math.round((width * sh) / sw);
  const g = c.getContext("2d"); g.filter = "grayscale(1) contrast(1.4)"; g.drawImage(im, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}
// OCR mixes up I/l/1 and O/0: compare names in a folded alphabet.
const fold = (s) => normalize(s).replace(/[^a-z0-9]/g, "").replace(/[l1|]/g, "i").replace(/0/g, "o").replace(/5/g, "s");
const trigrams = (s) => { const out = new Set(); for (let i = 0; i + 3 <= s.length; i++) out.add(s.slice(i, i + 3)); return out; };
let allCardsPromise = null;
/** Every physical card in TCGdex (~2.4 MB, loaded once and only for the OCR fallback). */
const allDexCards = () => (allCardsPromise ??= dexGet("/cards").then((list) => {
  if (!list) { allCardsPromise = null; return []; }
  return list.filter((c) => !isPocketSet(setOfDexId(c.id)));
}));

/** Collector numbers read from the text: "199/165", and repairs like "21157203" → 215/203. */
function numberCandidates(text, sets) {
  const totals = new Set([...sets.values()].map((s) => s.cardCount?.official).filter((n) => n > 0));
  const pairs = new Map(), singles = new Set();
  const add = (a, b, weight) => {
    const na = Number(a), nb = Number(b);
    if (!(na >= 1 && totals.has(nb) && na <= nb * 1.6 + 30)) return;
    const k = `${na}/${nb}`; pairs.set(k, Math.max(pairs.get(k) ?? 0, weight));
  };
  // The rarity symbol after the number is often read as one more digit ("238/1918"): try both lengths.
  for (const m of text.matchAll(/(\d{1,3})\s?[/|\\]\s?(\d{2,4})/g)) { add(m[1], m[2].slice(0, 3), 3); add(m[1], m[2].slice(0, 2), 2.5); }
  for (const [run] of text.matchAll(/\d{4,9}/g)) {
    for (let i = 1; i <= 3; i++) {
      const a = run.slice(0, i);
      for (const skip of run[i] === "1" || run[i] === "7" ? [1, 0] : [0]) { // "/" read as 1 or 7, or dropped
        const rest = run.slice(i + skip);
        for (const n of [3, 2]) if (rest.length >= n) add(a, rest.slice(0, n), (skip ? 2 : 1.5) - (rest.length > n ? 0.5 : 0));
      }
    }
  }
  for (const [n] of text.matchAll(/(?<![\d©])\d{1,3}(?!\d)/g)) singles.add(String(Number(n)));
  return { pairs: [...pairs].map(([k, w]) => { const [num, total] = k.split("/"); return { num, total, w }; }), singles };
}

/** Candidates for an OCR reading: names that appear in the top text × numbers from the bottom. */
async function ocrCandidates(o) {
  const [cards, sets] = await Promise.all([allDexCards(), dexSets()]);
  if (!cards.length) return [];
  // Card-frame words ("Trainer", "Supporter"…) would match names like "Gym Trainer" on every card.
  const topText = o.top.replace(/\bev[oe]l[vy]es from\s+\S+/gi, " ") // the previous stage's name, not this card's
    .replace(/\b(trainer|supporter|item|stadium|pok[eé]mon|tool|basic|stage ?\d?|energy|ability|tera)\b/gi, " ");
  const topGrams = new Set(topText.split("\n").flatMap((line) => line.split(/\s{2,}|[^\p{L}\s'’.-]+/u).flatMap((part) => [...trigrams(fold(part))])));
  const nameScore = new Map();
  for (const name of new Set(cards.map((c) => c.name))) {
    const g = trigrams(fold(name));
    if (!g.size) continue;
    let hit = 0; for (const t of g) if (topGrams.has(t)) hit++;
    const cover = hit / g.size;
    // Partial reads ("UmbreonViay" for "Umbreon VMAX") still count almost fully: the picture breaks ties.
    if (cover >= 0.6) nameScore.set(name, (0.5 + 0.5 * cover) * Math.min(1, (g.size + 2) / 6)); // short names count less
  }
  const { pairs, singles } = numberCandidates(`${o.bottom}\n${o.top}`, sets);
  const scored = [];
  for (const c of cards) {
    const nm = nameScore.get(c.name) ?? 0, total = sets.get(setOfDexId(c.id))?.cardCount?.official;
    const pair = pairs.find((p) => sameNumber(c.localId, p.num) && Number(p.total) === total);
    const single = /^\d+$/.test(c.localId) && singles.has(String(Number(c.localId)));
    if (!nm && !pair) continue;
    const text = 3 * nm + (pair ? 2 + pair.w : single ? 0.5 : 0); // lone numbers are weak: HP, damage, prizes…
    scored.push({ ...c, text, setName: sets.get(setOfDexId(c.id))?.name ?? "", dist: null });
  }
  // Keep every close text match (e.g. all 36 printings of "Charizard"): the picture decides between them.
  scored.sort((a, b) => b.text - a.text);
  return scored.filter((c) => c.text >= scored[0].text - 2).slice(0, 150);
}

/** Read the card's name (top) and collector number (bottom) from the photo. */
async function ocrRead(photo, status) {
  const url = URL.createObjectURL(photo);
  allDexCards(); // start the catalog download while OCR runs
  try {
    const im = await loadImage(url);
    status("Leyendo el nombre de la carta…");
    const top = await ocr(cropForOcr(im, [0, 0, 1, 0.3], 1400));
    status("Leyendo el número de la carta…");
    const bottom = `${await ocr(cropForOcr(im, [0, 0.8, 1, 0.2], 1800))}\n${await ocr(cropForOcr(im, [0, 0.84, 0.5, 0.16], 1600))}`;
    return { top, bottom };
  } finally { URL.revokeObjectURL(url); }
}

const toBase64 = (file) => new Promise((resolve, reject) => {
  const fr = new FileReader(); fr.onload = () => resolve(String(fr.result).split(",")[1]); fr.onerror = reject; fr.readAsDataURL(file);
});
/** Claude vision via the Edge Function. Returns null when the function is not available. */
async function identifyWithAI(files) {
  if (!CONFIG.IDENTIFY_FUNCTION || !sb) return null;
  const s = (await sb.auth.getSession()).data.session;
  if (!s) return null;
  const images = await Promise.all(files.slice(0, 2).map(async (f) => ({ data: await toBase64(f), media_type: f.type || "image/jpeg" })));
  const res = await withTimeout(fetch(`${CONFIG.SUPABASE_URL}/functions/v1/${CONFIG.IDENTIFY_FUNCTION}`, {
    method: "POST", headers: { "Content-Type": "application/json", apikey: CONFIG.SUPABASE_KEY, Authorization: `Bearer ${s.access_token}` },
    body: JSON.stringify({ images }),
  }), 60000);
  if (!res.ok) { console.warn("identificar-carta", res.status, await res.text().catch(() => "")); return null; }
  return (await res.json()).card ?? null;
}

/** Photo(s) → { kind, card?, alternatives, ai?, source, confidence } or null. */
async function identifyCard(files, status) {
  status("Analizando la foto…");
  const ai = await identifyWithAI(files).catch((e) => { console.warn("AI identification unavailable", e); return null; });
  if (ai && !ai.is_trading_card) return { kind: "not-card", ai };
  if (ai && ai.category !== "pokemon") return { kind: "other", ai, source: "ia", confidence: ai.confidence };
  let hints = null, ranked;
  if (ai) {
    const [number, total] = (ai.card_number ?? "").replace(/^#/, "").split("/");
    hints = { name: ai.subject, number: number?.trim() || null, total: total?.trim() || null, setName: ai.set_name, text: `${ai.subject} ${ai.variant ?? ""}` };
    status("Buscando tu carta en el catálogo…");
    ranked = await rankCandidates(hints, files[0]);
  } else {
    const read = await ocrRead(files[0], status);
    status("Buscando tu carta en el catálogo…");
    ranked = await visualRank(await ocrCandidates(read), files[0]);
  }
  if (!ranked.length) return ai ? { kind: "other", ai, source: "ia", confidence: "baja" } : null;
  const card = await catalogFromDex(ranked[0].id);
  if (!card) return null;
  const [best, next] = ranked;
  const exact = hints ? hints.number && sameNumber(best.localId, hints.number) && best.text >= 4 : best.text >= 6;
  const clear = !next || best.score - next.score > 0.6;
  const confidence = ai ? (ai.confidence === "alta" && exact ? "alta" : "media") : exact && clear ? "alta" : exact || clear ? "media" : "baja";
  return { kind: "pokemon", card, alternatives: ranked.slice(1, 7), ai, source: ai ? "ia" : "ocr", confidence };
}

/** Short listing description written from the identified card (never invents condition). */
function describeCard(c, ai) {
  const parts = [];
  if (c) {
    const year = c.set.releaseDate?.slice(0, 4);
    parts.push(`${c.name} · ${c.number}${c.set.printedTotal ? `/${c.set.printedTotal}` : ""} del set ${c.set.name}${c.set.serie ? ` (${c.set.serie}${year ? `, ${year}` : ""})` : year ? ` (${year})` : ""}.`);
    const facts = [c.rarity && `Rareza: ${c.rarity}`, c.types?.length && `Tipo: ${c.types.join("/")}`, c.hp && `${c.hp} HP`, c.illustrator && `Ilustración de ${c.illustrator}`].filter(Boolean);
    if (facts.length) parts.push(`${facts.join(" · ")}.`);
  } else if (ai) {
    parts.push(`${ai.subject} · ${[ai.set_name, ai.year, ai.card_number, ai.variant].filter(Boolean).join(" · ")}.`);
  }
  if (ai?.is_graded && ai.grading_company && ai.grade) parts.push(`Graduada ${ai.grading_company} ${ai.grade}${ai.cert_number ? `, certificado ${ai.cert_number}` : ""}.`);
  if (ai?.condition_notes?.length) parts.push(`Revisión visual preliminar: ${ai.condition_notes.join("; ")}.`);
  return parts.join("\n");
}
