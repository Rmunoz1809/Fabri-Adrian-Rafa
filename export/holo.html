// ------------------------------------------------------------- authenticity checks
async function adminChecks(body) {
  const { data: rows, error } = await sb.from("authenticity_checks").select("id, listing_id, requester_id, listing_title, contact, shop_id, status, notes, created_at, updated_at, checked_at").order("created_at", { ascending: false }).limit(100);
  if (error) {
    body.innerHTML = `<p class="notice bad">${["42P01", "PGRST205"].includes(error.code) ? "Falta aplicar la migración 0011 en Supabase." : "No pudimos cargar las revisiones. Recarga la página."}</p>`;
    return;
  }
  const { data: shops } = await sb.from("public_profiles").select("id, display_name").eq("is_shop", true).eq("verified", true).order("display_name");
  const people = await profilesById([...rows.map((r) => r.requester_id), ...rows.map((r) => r.shop_id)]);
  const open = rows.filter((r) => ["requested", "paid"].includes(r.status)), closed = rows.filter((r) => !open.includes(r));
  const price = formatUsd(toCents(CONFIG.AUTH_CHECK_USD));
  const card = (r) => `<li class="panel order" data-id="${r.id}" data-listing="${r.listing_id ?? ""}">
      <div class="phead">${r.listing_id ? `<a href="#/carta/${encodeURIComponent(r.listing_id)}" style="font-weight:600">${esc(r.listing_title)}</a>` : `<span style="font-weight:600">${esc(r.listing_title)} (anuncio eliminado)</span>`}<span class="b ${r.status === "authentic" ? "good" : open.includes(r) ? "prot" : "warn"}">${CHECK_STATUS[r.status] ?? esc(r.status)}</span></div>
      <dl class="rows"><div><dt>Vendedor</dt><dd>${esc(people.get(r.requester_id)?.display_name ?? "—")}</dd></div>
        <div><dt>WhatsApp</dt><dd>${esc(r.contact)}</dd></div><div><dt>Cobrar</dt><dd>${price}</dd></div>
        ${r.shop_id ? `<div><dt>Tienda</dt><dd>${esc(people.get(r.shop_id)?.display_name ?? "—")}</dd></div>` : ""}
        <div><dt>Pedida / actualizada</dt><dd>${fmtDate(r.created_at)} · ${fmtDate(r.updated_at)}</dd></div></dl>
      <label class="f muted-label" style="margin-top:8px">Notas (ref. de pago, cita…)<textarea class="textarea order-notes" rows="2" maxlength="500">${esc(r.notes ?? "")}</textarea></label>
      ${r.status === "paid" ? `<label class="f muted-label" style="margin-top:8px">Tienda que la revisó<select class="select chk-shop"><option value="">Elige la tienda…</option>${(shops ?? []).map((s) => `<option value="${s.id}">${esc(s.display_name)}</option>`).join("")}</select></label>` : ""}
      <div class="order-actions">
        ${r.status === "requested" ? `<button class="btn primary" data-act="paid">Marcar pagada</button>` : ""}
        ${r.status === "paid" ? `<button class="btn primary" data-act="authentic">Auténtica</button><button class="btn danger" data-act="not_authentic">No auténtica</button><button class="btn" data-act="inconclusive">Sin resultado claro</button>` : ""}
        ${open.includes(r) ? `<button class="btn danger" data-act="cancelled">${r.status === "paid" ? "Cancelar y reembolsar" : "Cancelar"}</button>` : ""}
        <button class="btn" data-act="notes">Guardar notas</button>
      </div><div class="order-msg"></div></li>`;
  body.innerHTML = `<p class="small muted" style="margin:0">El vendedor paga ${price} por Yappy y lleva la carta a la tienda. Holo nunca recibe la carta. “Auténtica” muestra “Revisada por &lt;tienda&gt;” en el anuncio. ${shops?.length ? "" : "<b>Todavía no hay tiendas verificadas</b>: verifica una en la pestaña Tiendas."}</p>
    <h2 class="h2" style="margin-top:20px">Pendientes (${open.length})</h2>
    ${open.length ? `<ul class="admin-list">${open.map(card).join("")}</ul>` : `<p class="muted small">No hay revisiones pendientes.</p>`}
    ${closed.length ? `<details style="margin-top:20px"><summary class="small">Cerradas (${closed.length})</summary><ul class="admin-list">${closed.map(card).join("")}</ul></details>` : ""}`;
  body.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", async () => {
    const li = b.closest("li"), msg = li.querySelector(".order-msg"), act = b.dataset.act;
    const patch = { notes: li.querySelector(".order-notes").value.trim() || null };
    if (act !== "notes") patch.status = act;
    if (["authentic", "not_authentic", "inconclusive"].includes(act)) {
      patch.shop_id = li.querySelector(".chk-shop")?.value || null;
      if (!patch.shop_id) { msg.innerHTML = `<p class="notice bad" style="margin:0">Elige la tienda que la revisó.</p>`; return; }
      patch.checked_at = new Date().toISOString();
    }
    if (act === "cancelled" && !confirm("¿Cancelar esta revisión? Si ya pagó, devuélvele el dinero por Yappy.")) return;
    const removeListing = act === "not_authentic" && li.dataset.listing && confirm("¿Quitar también el anuncio de la página? (Recomendado si la carta es réplica.)");
    li.querySelectorAll("button").forEach((x) => (x.disabled = true));
    const { error } = await sb.from("authenticity_checks").update(patch).eq("id", li.dataset.id);
    if (!error && removeListing) {
      const { error: e2 } = await sb.from("listings").update({ status: "removed" }).eq("id", li.dataset.listing);
      if (e2) { li.querySelectorAll("button").forEach((x) => (x.disabled = false)); return adminFail(e2, msg, "La revisión quedó guardada, pero no se pudo quitar el anuncio. Hazlo en Anuncios."); }
      listingCache.delete(li.dataset.listing);
    }
    if (error) { li.querySelectorAll("button").forEach((x) => (x.disabled = false)); return adminFail(error, msg); }
    if (act === "notes") { li.querySelectorAll("button").forEach((x) => (x.disabled = false)); msg.innerHTML = `<p class="notice good" style="margin:0">Notas guardadas.</p>`; return; }
    if (li.dataset.listing) listingCache.delete(li.dataset.listing);
    route();
  }));
}

// Manual activation until the Yappy payment button is connected: the user pays, staff adds 30 days.
async function adminPlans(body, q) {
  const { data: subs, error } = await sb.from("subscriptions").select("user_id, active_until, source, payment_ref, updated_at").order("active_until", { ascending: false }).limit(200);
  if (error) {
    body.innerHTML = `<p class="notice bad">${["42P01", "PGRST205"].includes(error.code) ? "Falta aplicar la migración 0012 en Supabase." : "No pudimos cargar los planes. Recarga la página."}</p>`;
    return;
  }
  const bySub = new Map(subs.map((s) => [s.user_id, s]));
  const words = searchTokens(q);
  let found = [];
  if (words.length) {
    let pq = sb.from("public_profiles").select("id, display_name").limit(20);
    for (const t of words) pq = pq.or(searchFilter(t, ["display_name"]));
    found = (await pq).data ?? [];
  }
  const people = await profilesById([...subs.map((s) => s.user_id), ...found.map((p) => p.id)]);
  const now = Date.now(), active = subs.filter((s) => Date.parse(s.active_until) > now);
  const row = (id) => {
    const s = bySub.get(id), on = s && Date.parse(s.active_until) > now;
    return `<li class="panel" data-id="${id}"><div class="phead"><a href="#/vendedor/${encodeURIComponent(id)}" style="font-weight:600">${esc(people.get(id)?.display_name ?? "—")}</a>
      <span class="b ${on ? "good" : "neutral"}">${on ? `Activo hasta ${fmtDate(s.active_until)}` : s ? `Venció ${fmtDate(s.active_until)}` : "Sin plan"}</span></div>
      ${s?.payment_ref ? `<p class="xs muted" style="margin:6px 0 0">Último pago: ${esc(s.payment_ref)}</p>` : ""}
      <div class="order-actions"><input class="input pl-ref" maxlength="120" placeholder="Ref. de pago Yappy" style="max-width:220px">
        <button class="btn primary" data-act="add">${on ? "Sumar 30 días" : "Activar 30 días"}</button>${on ? `<button class="btn danger" data-act="stop">Quitar plan</button>` : ""}</div>
      <div class="order-msg"></div></li>`;
  };
  body.innerHTML = `<p class="small muted" style="margin:0">Plan Coleccionista: ${formatUsd(toCents(CONFIG.PLAN_USD))} al mes, escaneos sin límite. Cuando la persona pague por Yappy, búscala por su nombre y activa 30 días.</p>
    <form class="row-input" id="plSearch" style="margin-top:16px;max-width:460px"><input class="input" name="q" value="${esc(q)}" placeholder="Nombre del usuario"><button class="btn">Buscar</button></form>
    ${words.length ? `<h2 class="h2" style="margin-top:20px">Resultados</h2>${found.length ? `<ul class="admin-list">${found.map((p) => row(p.id)).join("")}</ul>` : `<p class="muted small">Nadie con ese nombre.</p>`}` : ""}
    <h2 class="h2" style="margin-top:20px">Planes activos (${active.length})</h2>
    ${active.length ? `<ul class="admin-list">${active.map((s) => row(s.user_id)).join("")}</ul>` : `<p class="muted small">Todavía no hay planes activos.</p>`}`;
  $("#plSearch").addEventListener("submit", (e) => { e.preventDefault(); go(`/admin?tab=planes&q=${encodeURIComponent(new FormData(e.target).get("q").trim())}`); });
  body.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", async () => {
    const li = b.closest("li"), msg = li.querySelector(".order-msg"), id = li.dataset.id, s = bySub.get(id);
    const ref = li.querySelector(".pl-ref").value.trim() || null;
    if (b.dataset.act === "stop" && !confirm("¿Quitar el plan ahora? Vuelve a 3 escaneos al día.")) return;
    const base = Math.max(Date.now(), s ? Date.parse(s.active_until) : 0);
    const patch = b.dataset.act === "stop"
      ? { user_id: id, active_until: new Date().toISOString(), source: "manual", payment_ref: s?.payment_ref ?? null }
      : { user_id: id, active_until: new Date(base + 30 * DAY_MS).toISOString(), source: "manual", payment_ref: ref ?? s?.payment_ref ?? null };
    li.querySelectorAll("button").forEach((x) => (x.disabled = true));
    const { error: e2 } = await sb.from("subscriptions").upsert(patch);
    if (e2) { li.querySelectorAll("button").forEach((x) => (x.disabled = false)); return adminFail(e2, msg); }
    route();
  }));
}

// ------------------------------------------------------------- summary
async function adminSummary(body) {
  const [{ data: orders, error }, { count: activeCount }, { count: shopCount }, { count: pendingShops }, { count: openReports }] = await Promise.all([
    sb.from("protected_orders").select("status, price_cents, fee_cents, created_at"),
    sb.from("listings").select("id", { count: "exact", head: true }).eq("status", "active"),
    sb.from("public_profiles").select("id", { count: "exact", head: true }).eq("is_shop", true).eq("verified", true),
    sb.from("shop_requests").select("id", { count: "exact", head: true }).eq("status", "pending"),
    sb.from("reports").select("id", { count: "exact", head: true }).eq("resolved", false),
  ]);
  if (error) throw error;
  const paid = orders.filter((o) => PAID_STATES.includes(o.status));
  const released = orders.filter((o) => o.status === "released");
  const sum = (arr, k) => arr.reduce((a, o) => a + o[k], 0);
  const pct = Math.min(100, Math.round((paid.length / GOAL_ORDERS) * 100));
  const first = orders.length ? orders.map((o) => o.created_at).sort()[0] : null;
  const days = first ? Math.max(1, Math.ceil((Date.now() - new Date(first)) / 86400000)) : 0;
  const stat = (n, t) => `<div class="panel stat"><p class="display" style="font-size:28px;font-weight:700;margin:0">${n}</p><p class="xs muted" style="margin:2px 0 0">${t}</p></div>`;
  body.innerHTML = `
    <section class="panel col"><h2>Meta: ${GOAL_ORDERS} Compras Protegidas pagadas en 4 semanas</h2>
      <div class="goal" role="progressbar" aria-valuemin="0" aria-valuemax="${GOAL_ORDERS}" aria-valuenow="${paid.length}"><div style="width:${pct}%"></div></div>
      <p class="small" style="margin:0"><b>${paid.length} de ${GOAL_ORDERS}</b>${first ? ` · día ${days} desde la primera orden${days > 28 ? " (ya pasaron las 4 semanas)" : ""}` : " · aún no hay órdenes"}</p></section>
    <div class="stats">
      ${stat(paid.length, "órdenes pagadas")}
      ${stat(formatUsd(sum(released, "fee_cents")), "comisiones cobradas (liberadas)")}
      ${stat(formatUsd(sum(paid, "price_cents")), "valor de cartas protegidas (GMV)")}
      ${stat(orders.filter((o) => o.status === "awaiting_payment").length, "esperando pago")}
      ${stat(activeCount ?? 0, "anuncios activos")}
      ${stat(shopCount ?? 0, "tiendas verificadas")}
      ${stat(pendingShops ?? 0, "solicitudes de tienda")}
      ${stat(orders.filter((o) => ["refunded", "cancelled"].includes(o.status)).length, "reembolsadas o canceladas")}
      ${stat(openReports ?? 0, "reportes por revisar")}
    </div>`;
}

    ["Revisión en tienda", `<p>Es un servicio opcional para vendedores. El vendedor paga ${formatUsd(toCents(CONFIG.AUTH_CHECK_USD))} a ${esc(CONFIG.APP_NAME)} y lleva la carta a una tienda aliada, que la revisa en persona. Si la tienda no encuentra señales de réplica, el anuncio muestra “Revisada por” con el nombre de la tienda. ${esc(CONFIG.APP_NAME)} nunca recibe la carta.</p><ul><li>El resultado es <b>la opinión de la tienda</b> con lo que puede ver en persona. No es una garantía de autenticidad ni una graduación oficial.</li><li>Ni ${esc(CONFIG.APP_NAME)} ni la tienda responden si una carta revisada resulta falsa, salvo el reembolso de Compra Protegida (sección 6).</li><li>El pago no se devuelve según el resultado. Sí lo devolvemos si la revisión no se puede hacer por causa nuestra o de la tienda.</li><li>Si la carta no pasa la revisión, podemos retirar el anuncio.</li><li>La insignia deja de verse cuando el anuncio se vende o se retira.</li></ul>`],
    ["Plan Coleccionista", `<p>Es una suscripción opcional de ${formatUsd(toCents(CONFIG.PLAN_USD))} al mes. Sin el plan, cada cuenta puede escanear 3 cartas al día en “¿Cuánto vale tu carta?”; con el plan, sin límite para uso personal (ponemos un tope diario alto para evitar abusos).</p><ul><li>Cada pago activa el plan por 30 días. No se renueva solo: si no vuelves a pagar, tu cuenta regresa al plan gratis.</li><li>Los valores que muestra el escáner son referencias de mercado, no tasaciones (sección 5).</li><li>Podemos cambiar el precio o lo que incluye el plan; los cambios aplican desde tu siguiente pago.</li></ul>`],
    ["Reembolsos", `<ul><li><b>Compra Protegida:</b> devolvemos todo lo pagado si la carta no llega, no es original o no coincide con el anuncio y el comprador reclama dentro de los 3 días de recibirla (sección 6). El reembolso se hace por el mismo medio de pago, en un máximo de 5 días hábiles desde que lo aprobamos.</li><li><b>Revisión en tienda:</b> se devuelve si la revisión no se puede hacer por causa nuestra o de la tienda, no según el resultado (sección 9).</li><li><b>Plan Coleccionista:</b> no se reembolsa una vez activado, salvo que el servicio no funcione por causa nuestra (sección 10).</li><li><b>Pagos hechos por fuera de ${esc(CONFIG.APP_NAME)}:</b> no los podemos reembolsar (sección 7).</li><li>Para pedir un reembolso escríbenos a ${legalVal("EMAIL")} o por WhatsApp con la referencia de tu compra.</li></ul>`],
    ["Conducta prohibida", `<ul><li>Estafas o suplantación de identidad.</li><li>Pedir o hacer pagos por fuera de Compra Protegida.</li><li>Acosar, amenazar o insultar a otras personas.</li><li>Usar la plataforma para actividades ilegales o para extraer datos de forma automatizada.</li><li>Intentar vulnerar la seguridad de la plataforma.</li><li>Hacer ofertas sin intención de comprar, o publicar reseñas falsas u ofensivas (o pedir u ofrecer algo a cambio de una reseña).</li></ul>`],
    ["Reportes", `<p>Cualquier usuario puede reportar un anuncio. Revisamos los reportes y podemos retirar anuncios, ocultar reseñas que incumplan estas reglas o suspender cuentas. Las reseñas solo las puede dejar quien compró con Compra Protegida. Si crees que retiramos algo por error, escríbenos a ${legalVal("EMAIL")}.</p>`],
    ["Marcas", `<p>Pokémon, NBA, NFL y los nombres de jugadores, equipos y fabricantes (Panini, Topps y otros) son marcas de sus dueños. ${esc(CONFIG.APP_NAME)} no está afiliado ni patrocinado por ellos. Las imágenes de catálogo se usan solo para identificar las cartas. Si tienes derechos sobre una imagen y quieres que la retiremos, escríbenos a ${legalVal("EMAIL")}.</p>`],

    ["Para qué los usamos", `<ul><li>Operar tu cuenta y publicar tus anuncios.</li><li>Identificar cartas a partir de tus fotos y estimar su precio.</li><li>Coordinar las Compras Protegidas y atender reclamos.</li><li>Prevenir fraudes y atender reportes.</li><li>Entender cómo se usa la plataforma para mejorarla (con datos anónimos).</li></ul><p>No vendemos tus datos ni los usamos para publicidad de terceros.</p>`],
    ["Base legal", `<p>Tratamos tus datos con tu <b>consentimiento</b>, que das al crear tu cuenta, y porque son necesarios para <b>prestarte el servicio</b> que pides. Puedes retirar tu consentimiento cuando quieras (sección 8), aunque sin algunos datos no podremos darte el servicio.</p>`],
    ["Qué es público", `<p>En tus anuncios se muestran tu nombre para mostrar, tu foto de perfil, el barrio y distrito de la carta, y si eres tienda, su descripción y foto. <b>Tu correo y tu teléfono nunca se muestran.</b></p>`],
    ["Con quién los compartimos", `<p>Usamos proveedores que procesan datos por nosotros, con medidas de seguridad:</p><ul><li><b>Supabase</b>: base de datos, cuentas y almacenamiento de fotos.</li><li><b>Anthropic</b>: análisis de las fotos para identificar la carta y búsqueda de precios. No usa tus fotos para entrenar sus modelos.</li><li><b>GitHub</b>: aloja la página.</li><li><b>Tiendas aliadas</b>: si pides una Revisión en tienda, le damos a la tienda tu nombre para mostrar y los datos de la carta para coordinar la cita.</li><li><b>Yappy (Banco General)</b>: procesa los pagos en línea. Recibe el monto y la referencia de tu compra; tus datos de pago los das directamente en la app de Yappy y nunca pasan por ${esc(CONFIG.APP_NAME)}. También usamos Yappy para pagarles a los vendedores.</li><li><b>WhatsApp (Meta)</b>: solo si decides contactarnos por ahí.</li><li><b>Cloudflare Turnstile</b>: el captcha de entrar y crear cuenta. Revisa datos técnicos de tu navegador para distinguir personas de robots.</li><li><b>Google Fonts y jsDelivr</b>: sirven la letra y el código de la página; reciben tu IP al descargarlos, como cualquier sitio web.</li><li><b>Catálogos y guías de precios</b> (TCGdex, Pokémon TCG API, PriceCharting, Cardmarket y otros): les pedimos datos de la carta, nunca datos tuyos.</li></ul><p>Algunos de estos proveedores guardan datos fuera de Panamá (por ejemplo, en Estados Unidos). Al aceptar esta política autorizas esa transferencia, que hacemos con proveedores que ofrecen un nivel de protección adecuado. Compartiremos datos con autoridades solo cuando la ley lo exija.</p>`],
    ["Cuánto tiempo los guardamos", `<p>Mientras tengas tu cuenta. Si la cierras, borramos tus datos en un plazo razonable, salvo lo que debamos conservar por obligaciones legales o contables (por ejemplo, registros de Compras Protegidas) o para resolver disputas.</p>`],
    ["Tus derechos", `<p>Tienes derecho a <b>acceder</b> a tus datos, <b>rectificarlos</b>, <b>cancelarlos</b> (borrarlos), <b>oponerte</b> a su uso y pedir su <b>portabilidad</b>. Puedes cambiar tu nombre y fotos desde <a href="#/cuenta">Mi cuenta</a>; para lo demás escribe a ${legalVal("EMAIL")} y te respondemos en los plazos de la ley. Si no quedas conforme, puedes acudir a la Autoridad Nacional de Transparencia y Acceso a la Información (ANTAI).</p>`],
    ["Cookies y almacenamiento en tu navegador", `<p>No usamos cookies de publicidad ni rastreadores de terceros (como Google Analytics o el píxel de Meta). Guardamos en el almacenamiento local de tu navegador solo esto:</p><ul><li><b>Tu sesión</b>, para que no tengas que entrar cada vez.</li><li><b>Un identificador anónimo de uso</b>, para contar visitas sin saber quién eres.</li><li><b>Una copia temporal de precios</b>, para que la página cargue más rápido.</li></ul><p>Puedes borrarlo cuando quieras desde la configuración de tu navegador; si lo haces, se cierra tu sesión.</p>`],
    ["Seguridad", `<p>Los datos viajan cifrados, el acceso está restringido por reglas de seguridad en la base de datos y solo el equipo autorizado puede ver la información de Compras Protegidas y reportes. Ningún sistema es 100% seguro; si ocurre un incidente que afecte tus datos, te avisaremos como indica la ley.</p>`],
    ["Menores de edad", `<p>Si tienes menos de 18 años, usa ${esc(CONFIG.APP_NAME)} con permiso y supervisión de tu madre, padre o tutor.</p>`],

// ------------------------------------------------------------- captcha (Cloudflare Turnstile)
// Off until CONFIG.TURNSTILE_SITE_KEY is set. Supabase Auth verifies the token server-side once
// "Captcha protection" is enabled in the dashboard with the matching secret key.
let turnstileLoad = null;
function loadTurnstile() {
  turnstileLoad ??= new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
    s.async = true; s.onload = () => resolve(window.turnstile); s.onerror = () => { turnstileLoad = null; reject(new Error("turnstile load failed")); };
    document.head.appendChild(s);
  });
  return turnstileLoad;
}
async function mountCaptcha(box) {
  if (!CONFIG.TURNSTILE_SITE_KEY || !box) return null;
  try {
    const ts = await loadTurnstile();
    if (!box.isConnected) return null;
    // The normal widget is at least 300 px wide; on narrow phones use the compact one so the form doesn't overflow.
    const size = box.clientWidth < 300 ? "compact" : "flexible";
    const id = ts.render(box, { sitekey: CONFIG.TURNSTILE_SITE_KEY, language: "es", theme: "auto", appearance: "interaction-only", size });
    // The widget solves itself in the background; a fast submit (or a password manager) can beat it,
    // so wait a few seconds for the token instead of failing right away.
    const token = async (ms = 8000) => {
      for (const until = Date.now() + ms; ; await new Promise((r) => setTimeout(r, 150))) {
        const t = ts.getResponse(id);
        if (t || Date.now() > until || !box.isConnected) return t || "";
      }
    };
    const remove = () => { clearInterval(watch); try { ts.remove(id); } catch { /* already gone */ } };
    // Leaving the sign-in page drops the form without telling us: clean up the widget so it stops running.
    const watch = setInterval(() => { if (!box.isConnected) remove(); }, 1000);
    return { token, reset: () => ts.reset(id), remove };
  } catch (e) {
    console.error(e);
    box.innerHTML = `<p class="notice bad">No se pudo cargar la verificación. Recarga la página.</p>`;
    return null;
  }
}

// ============================================================= boot
document.querySelectorAll(".brand-name, #brand").forEach((n) => (n.textContent = CONFIG.APP_NAME));
if (!/Mac|iPhone|iPad/i.test(navigator.userAgentData?.platform ?? navigator.platform ?? "")) $("#searchKbd").textContent = "Ctrl K";
$("#searchBtn").addEventListener("click", openSearch);
$("#menuBtn").addEventListener("click", () => toggleSideNav());
$("#sideClose").addEventListener("click", () => toggleSideNav(false));
$("#sideNav").addEventListener("click", (e) => { if (e.target.closest("a")) toggleSideNav(false); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && layers.length) { e.preventDefault(); layers.at(-1).close(); return; }
  const palette = ((e.metaKey || e.ctrlKey) && !e.altKey && e.key.toLowerCase() === "k") || (e.key === "/" && !e.metaKey && !e.ctrlKey && !e.altKey && !isTyping(e.target));
  if (palette && !document.body.classList.contains("gate")) { e.preventDefault(); openSearch(); }
});
// Leaving the mobile layout closes the filters drawer (on large screens it is a sidebar).
matchMedia("(min-width: 1024px)").addEventListener("change", () => $("#fpanel")?._close?.(true));
// Card images fade in once loaded; broken ones leave a neutral box instead of a broken-image icon.
document.addEventListener("load", (e) => { if (e.target instanceof HTMLImageElement) e.target.classList.remove("loading-img"); }, true);
document.addEventListener("error", (e) => { if (e.target instanceof HTMLImageElement && e.target.classList.contains("card")) e.target.classList.replace("loading-img", "broken") || e.target.classList.add("broken"); }, true);
window.addEventListener("hashchange", route);
// The seller row sits inside the card's link: clicking it opens the seller page instead of the card.
document.addEventListener("click", (e) => {
  const row = e.target.closest?.(".tseller[data-seller]");
  if (!row?.dataset.seller || !row.closest("a")) return;
  e.preventDefault();
  go(`/vendedor/${encodeURIComponent(row.dataset.seller)}`);
});
async function loadProfileName() {
  profileName = null; isStaff = false;
  if (!session) return;
  const { data } = await sb.from("profiles").select("display_name, is_staff").eq("id", session.user.id).maybeSingle();
  profileName = data?.display_name ?? null;
  isStaff = Boolean(data?.is_staff);
  renderNav();
  refreshOfferBadge();
  if (isStaff && parseHash().path === "/admin") route(); // staff flag arrived after the first render
}
(async () => {
  if (sb) {
    session = (await sb.auth.getSession()).data.session;
    sb.auth.onAuthStateChange((_evt, s) => {
      const changed = (s?.user.id ?? null) !== (session?.user.id ?? null);
      session = s;
      // supabase-js runs this callback while holding its auth lock: calling it again from inside
      // can deadlock, so the follow-up queries run on the next tick.
      if (changed) setTimeout(() => { loadProfileName(); route(); }, 0);
    });
    loadProfileName();
  }
  trackVisitOncePerSession();
  route();
})();
</script>
