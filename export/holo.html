  function renderIdent() {
    const res = st.ident, box = $("#idBox");
    if (!res || res.kind === "not-card") return;
    const ai = res.ai, c = res.kind === "pokemon" ? st.picked : null;
    const how = res.source === "ia" ? "Reconocida con IA" : "Reconocida leyendo el texto de la foto";
    const title = c ? `${c.name} · ${c.number}${c.set.printedTotal ? `/${c.set.printedTotal}` : ""}` : `${ai.subject}${ai.card_number ? ` · ${ai.card_number}` : ""}`;
    const sub = c ? [c.set.name, c.set.releaseDate?.slice(0, 4), c.rarity].filter(Boolean).join(" · ") : [ai.set_name, ai.year, ai.variant].filter(Boolean).join(" · ");
    const flags = ai?.authenticity_flags?.length ? `<p class="notice warn xs" style="margin:10px 0 0">Revisa: ${esc(ai.authenticity_flags.join("; "))}</p>` : "";
    const alts = res.kind === "pokemon" && res.alternatives.length
      ? `<p class="xs muted" style="margin:12px 0 0">¿No es esta versión? Toca la tuya:</p><div class="results alts">${res.alternatives.map((a, i) => `<button type="button" data-alt="${i}">${a.image ? `<img src="${esc(a.image)}/low.webp" alt="${esc(a.name)}" loading="lazy">` : ""}<span>${esc(a.name)} · ${esc(a.setName || setOfDexId(a.id))} · ${esc(a.localId)}</span></button>`).join("")}</div>`
      : "";
    box.innerHTML = `<div class="panel holo-border">
      <div style="display:flex;gap:14px;align-items:flex-start">
        ${c?.images.small ? `<img src="${esc(c.images.small)}" alt="${esc(c.name)}" style="width:92px;border-radius:8px;flex-shrink:0">` : ""}
        <div style="min-width:0">
          <p class="xs" style="margin:0;color:var(--good);font-weight:600">✓ ${how} · ${esc(confidenceText[res.confidence] ?? "")}</p>
          <p style="margin:4px 0 0;font-weight:700;font-size:17px">${esc(title)}</p>
          <p class="small muted" style="margin:2px 0 0">${esc(sub)}</p>
          ${c?.illustrator ? `<p class="xs muted" style="margin:2px 0 0">Ilustración: ${esc(c.illustrator)}</p>` : ""}
          <div id="idPrice"></div>
        </div>
      </div>
      <p class="small" style="margin:12px 0 0;white-space:pre-line">${esc(describeCard(c, ai))}</p>
      ${flags}${alts}
      <p class="xs muted" style="margin:10px 0 0">Llenamos el formulario por ti: revisa los datos antes de publicar.</p></div>`;
    box.querySelectorAll("[data-alt]").forEach((b) => b.addEventListener("click", async () => {
      const a = res.alternatives[Number(b.dataset.alt)];
      b.disabled = true;
      const full = await catalogFromDex(a.id);
      if (!full) { b.disabled = false; return; }
      res.alternatives[Number(b.dataset.alt)] = { id: res.card.dexId, localId: res.card.number, name: res.card.name, image: res.card.images.small.replace(/\/low\.webp$/, ""), setName: res.card.set.name };
      res.card = full; res.confidence = "alta";
      await pickCard(full, { fromIdent: true, replace: true });
      renderIdent();
    }));
    renderIdPrice();
  }
  /** Today's price, in one line, under the identified card. */
  async function renderIdPrice() {
    const el = $("#idPrice"), c = st.picked;
    if (!el || !c || val("category") !== "pokemon") return;
    const ref = pickReferencePrice(c, val("variant"));
    const tpv = ref ? ref.market ?? ref.mid : null;
    const cm = c.cardmarket, eur = cm ? (cm.avg7 > 0 ? cm.avg7 : cm.trend > 0 ? cm.trend : null) : null;
    const fx = eur ? await eurUsd() : null;
    if (!el.isConnected || st.picked !== c) return;
    const parts = [tpv > 0 && `<strong>${fmtEstimate(tpv)}</strong> <span class="muted">TCGplayer (EE.UU.)</span>`, eur && fx && `<strong>${fmtEstimate(eur * fx.rate)}</strong> <span class="muted">Cardmarket (Europa, ${eur === cm.avg7 ? "promedio 7 días" : "tendencia"})</span>`].filter(Boolean);
    el.innerHTML = parts.length
      ? `<p class="small" style="margin:8px 0 0">Precio actual (Near Mint): ${parts.join(" · ")}</p>`
      : `<p class="xs muted" style="margin:8px 0 0">Todavía no hay precio de mercado para esta carta.</p>`;
  }

  /** Select a catalog card: fill the form, the estimate and the price chart. */
  async function pickCard(c, { fromIdent = false, replace = false } = {}) {
    const run = ++st.pickRun;
    if (c.brief || (!c.set?.releaseDate && c.dexId)) c = (await catalogFromDex(c.dexId)) ?? c;
    if (run !== st.pickRun) return;
    st.picked = c;
    set("subject", c.name); set("setName", c.set.name); set("year", c.set.releaseDate?.slice(0, 4)); set("number", c.set.printedTotal ? `${c.number}/${c.set.printedTotal}` : c.number); set("variant", c.rarity ?? "");
    const autoTitle = `${c.name} ${c.number}${c.set.printedTotal ? `/${c.set.printedTotal}` : ""} · ${c.set.name}`.slice(0, 80);
    if (!val("title") || (replace && val("title") === st.autoTitle)) { set("title", autoTitle); st.autoTitle = autoTitle; }
    fillDescription(describeCard(c, fromIdent ? st.ident?.ai : null));
    renderEstimate();
    loadSellChart();
  }

  // ----- market value chart for the selected card
  const sellListing = () => {
    const c = st.picked, price = Number(val("price"));
    return {
      card: { category: "pokemon", subject: c.name, setName: c.set.name, year: c.set.releaseDate?.slice(0, 4), number: val("number"), variant: val("variant"), catalogId: c.id, dexId: c.dexId },
      condition: st.graded ? null : val("condition") || "NM",
      grading: st.graded && val("company") && Number(val("grade")) ? { company: val("company"), grade: Number(val("grade")) } : null,
      priceUsd: price > 0 ? price : null, priceLabel: "Tu precio", isDemo: false,
    };
  };
  let chartRo = null;
  async function loadSellChart() {
    const box = $("#sellChart");
    if (!st.picked || val("category") !== "pokemon") { box.hidden = true; st.hist = null; return; }
    const run = ++st.chartRun, c = st.picked;
    box.hidden = false;
    box.innerHTML = `<h2>Valor en el mercado</h2><p class="muted small" style="margin:8px 0 0"><span class="spinner"></span> Buscando el precio de hoy y su historial…</p>`;
    const h = await fetchPriceHistory(sellListing()).catch((e) => { console.error(e); return { market: [], cardmarket: [], sales: [], factor: 1 }; });
    if (run !== st.chartRun || st.picked !== c || !box.isConnected) return;
    st.hist = h; st.range = h.weekly ? 365 : 90;
    drawSellChart();
    renderIdPrice();
    if (!chartRo) {
      let width = box.clientWidth;
      chartRo = new ResizeObserver(() => { if (!box.isConnected) return chartRo.disconnect(); if (box.clientWidth !== width) { width = box.clientWidth; drawSellChart(); } });
      chartRo.observe(box);
    }
  }
  function drawSellChart() {
    const box = $("#sellChart");
    if (!st.hist || !st.picked || box.hidden) return;
    renderPriceChart(box, sellListing(), st.hist, st.range, (r) => { st.range = r; drawSellChart(); });
  }

  async function doCatalogSearch() {
    const name = $("#catName").value.trim();
    if (name.length < 2) { $("#catResults").innerHTML = `<p class="xs muted">Escribe el nombre de la carta.</p>`; return; }
    $("#catResults").innerHTML = `<p class="xs muted"><span class="spinner"></span> Buscando…</p>`;
    st.catalog = await catalogSearch(name, $("#catNum").value);
    $("#catResults").innerHTML = st.catalog.length
      ? `<p class="xs muted" style="margin:10px 0 0">Toca tu carta:</p><div class="results">${st.catalog.map((c, i) => `<button type="button" data-i="${i}"><img src="${esc(c.images.small)}" alt="${esc(c.name)}" loading="lazy"><span>${esc(c.set.name)} · ${esc(c.number)}</span></button>`).join("")}</div>`
      : `<p class="xs muted">No la encontramos (el catálogo a veces falla; intenta de nuevo) o llena los datos a mano.</p>`;
    $("#catResults").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
      $("#catResults").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
      pickCard(st.catalog[Number(b.dataset.i)], { replace: true });
    }));
  }
  $("#catBtn").addEventListener("click", doCatalogSearch);
  [$("#catName"), $("#catNum")].forEach((i) => i.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); doCatalogSearch(); } }));
  renderGrade();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("#sellMsg"), btn = $("#publishBtn");
    const fail = (t) => { msg.innerHTML = `<p class="notice bad" style="margin:0">${esc(t)}</p>`; btn.disabled = false; btn.textContent = "Publicar gratis"; };
    const price = Number(val("price")), year = val("year") ? Number(val("year")) : null, grade = st.graded ? Number(val("grade")) : null;
    if (!st.files.length) return fail("Agrega al menos una foto real de la carta.");
    if (val("subject").length < 2) return fail("Falta el nombre del Pokémon o jugador.");
    if (!val("setName")) return fail("Falta el set o producto.");
    if (year != null && !(Number.isInteger(year) && year >= 1990 && year <= 2030)) return fail("Año no válido.");
    if (st.graded && !(grade >= 1 && grade <= 10)) return fail("La nota de graduación debe estar entre 1 y 10.");
    if (!(price >= 1 && price <= 100000)) return fail("Escribe un precio entre $1 y $100,000.");
    if (val("title").length < 5) return fail("El título es muy corto.");
    for (const f of st.files) if (f.size > 3 * 1024 * 1024) return fail("Una de las fotos es muy pesada (máx. 3 MB).");
    const loc = FLAT_LOCATIONS[Number(val("location"))];
    if (!loc) return fail("Elige tu barrio o zona.");

    btn.disabled = true; btn.textContent = "Publicando…"; msg.innerHTML = "";
    // Sesión fresca: getSession renueva el token si expiró mientras llenaban el formulario.
    const fresh = (await sb.auth.getSession()).data.session;
    if (!fresh) return fail("Tu sesión expiró. Vuelve a entrar para publicar.");
    const uid = fresh.user.id, id = crypto.randomUUID();
    const catalogId = val("category") === "pokemon" && st.picked ? st.picked.id : null;
    const gradingKey = st.graded ? `${val("company")}${grade}` : "raw";
    let comps = [];
    if (catalogId) {
      const { data } = await sb.from("sales").select("price_cents, sold_at").eq("catalog_id", catalogId).eq("grading_key", gradingKey).order("sold_at", { ascending: false }).limit(50);
      comps = (data ?? []).map((s) => ({ priceUsd: s.price_cents / 100, soldAt: s.sold_at }));
    }
    const estimate = catalogId ? estimatePrice({ reference: st.graded ? null : pickReferencePrice(st.picked, val("variant")), localComps: comps, condition: st.graded ? null : val("condition"), grading: st.graded ? { company: val("company"), grade } : null }) : null;

    // El anuncio nace como borrador (invisible al público) y sólo pasa a "active" cuando
    // las fotos ya están en Storage y registradas. Así nunca se publica un anuncio a medias.
    const paths = [];
    const step = (t) => { btn.textContent = t; };
    const abort = async (err, t) => {
      console.error(err);
      if (paths.length) { const rm = await sb.storage.from("listing-photos").remove(paths); if (rm.error) console.error(rm.error); }
      await sb.from("listings").delete().eq("id", id); // borra en cascada listing_photos
      return fail(t);
    };
    const dbMessage = (err, t) =>
      err?.code === "42501" ? "Tu sesión no tiene permiso para publicar. Sal y vuelve a entrar." :
      err?.code === "23503" ? "Tu cuenta no tiene perfil de vendedor. Sal y vuelve a entrar, o escríbenos." :
      err?.code === "23514" ? "Algún dato no es válido (revisa precio, título, nota o condición)." : t;
    const dup = (e) => /exists|duplicate/i.test(e?.message ?? "");

    step("Guardando datos…");
    const ins = await sb.from("listings").insert({
      id, seller_id: uid, status: "draft", category: val("category"), title: val("title"), description: val("description") || null,
      subject: val("subject"), set_name: val("setName"), year, number: val("number") || null, variant: val("variant") || null,
      condition: st.graded ? null : val("condition"), grading_company: st.graded ? val("company") : null, grade,
      cert_number: st.graded ? val("cert") || null : null,
      price_cents: Math.round(price * 100), province: loc.province, district: loc.district, neighborhood: loc.neighborhood,
      catalog_id: catalogId, estimate,
    });
    if (ins.error) { console.error(ins.error); return fail(dbMessage(ins.error, "No pudimos guardar el anuncio. Intenta de nuevo.")); }

    for (const [i, f] of st.files.entries()) {
      step(`Subiendo foto ${i + 1} de ${st.files.length}…`);
      const ext = { "image/png": "png", "image/webp": "webp" }[f.type] ?? "jpg";
      const path = `${uid}/${id}/${i}.${ext}`;
      let up;
      for (let attempt = 0; attempt < 3; attempt++) { // la red del teléfono a veces corta; reintenta
        if (attempt) await new Promise((r) => setTimeout(r, 800 * attempt));
        up = await sb.storage.from("listing-photos").upload(path, f, { contentType: f.type || "image/jpeg", cacheControl: "31536000", upsert: false });
        if (!up.error || dup(up.error)) break; // "ya existe" = el intento anterior sí llegó
      }
      if (up.error && !dup(up.error)) return abort(up.error, "No pudimos subir las fotos. Revisa tu conexión e intenta de nuevo.");
      paths.push(path);
    }

    step("Publicando…");
    const pr = await sb.from("listing_photos").insert(paths.map((storage_path, position) => ({ listing_id: id, storage_path, position })));
    if (pr.error) return abort(pr.error, dbMessage(pr.error, "No pudimos guardar las fotos del anuncio. Intenta de nuevo."));
    const act = await sb.from("listings").update({ status: "active" }).eq("id", id).select("id");
    if (act.error || !act.data?.length) return abort(act.error ?? "activate: 0 rows", dbMessage(act.error, "No pudimos publicar el anuncio. Intenta de nuevo."));
    go(`/carta/${id}`);
  });
}

// Shop verification request (reviewed by staff in #/admin?tab=tiendas).
async function renderShopRequest(uid) {
  const box = $("#shopReqBody");
  if (!box) return;
  const { data: reqs, error } = await sb.from("shop_requests").select("status, shop_name, created_at").eq("user_id", uid).order("created_at", { ascending: false }).limit(1);
  if (error) { box.innerHTML = `<p class="xs muted">Muy pronto podrás pedir la verificación desde aquí.</p>`; return; }
  const last = reqs?.[0];
  if (last?.status === "pending") {
    box.innerHTML = `<p class="notice soft" style="margin:0">Recibimos tu solicitud para <b style="color:var(--ink)">${esc(last.shop_name)}</b>. La revisamos en 1 a 2 días y te avisamos.</p>`;
    return;
  }
  box.innerHTML = `${last?.status === "rejected" ? `<p class="notice warn" style="margin:0 0 12px">No pudimos verificar tu solicitud anterior. Revisa los datos y vuelve a enviarla.</p>` : ""}
    <div class="col" style="gap:10px">
      <label class="f">Nombre de la tienda<input class="input" id="srName" maxlength="80" required></label>
      <label class="f">Instagram o WhatsApp de la tienda<input class="input" id="srContact" maxlength="120" placeholder="@mitienda o 6XXX-XXXX"></label>
      <label class="f">¿Dónde queda?<input class="input" id="srLoc" maxlength="120" placeholder="Centro comercial, local, ciudad"></label>
      <div id="srMsg"></div>
      <button type="button" class="btn block" id="srSend">Pedir verificación de tienda</button></div>`;
  $("#srSend").addEventListener("click", async (e) => {
    const name = $("#srName").value.trim(), msg = $("#srMsg");
    if (name.length < 2) { msg.innerHTML = `<p class="notice bad" style="margin:0">Escribe el nombre de la tienda.</p>`; return; }
    e.target.disabled = true;
    const { error } = await sb.from("shop_requests").insert({ user_id: uid, shop_name: name, contact: $("#srContact").value.trim() || null, location: $("#srLoc").value.trim() || null });
    if (error) { e.target.disabled = false; console.error(error); msg.innerHTML = `<p class="notice bad" style="margin:0">No pudimos enviar la solicitud. Intenta de nuevo.</p>`; return; }
    renderShopRequest(uid);
  });
}
const PROFILE_COLS = "display_name, is_shop, verified, avatar_path, shop_description, shop_photo_path";
async function viewAccount(app) {
  setTitle("Mi cuenta");
  if (!sb || !session) return go("/entrar?next=/cuenta");
  app.innerHTML = `<p class="muted small" style="margin-top:24px"><span class="spinner"></span> Cargando…</p>`;
  const uid = session.user.id;
  const { data: prof, error } = await sb.from("profiles").select(PROFILE_COLS).eq("id", uid).maybeSingle();
  if (error || !prof) {
    console.error(error);
    app.innerHTML = `<p class="notice bad" style="margin-top:24px">No pudimos cargar tu perfil. ${error?.code === "42703" ? "Falta aplicar la migración 0003 en Supabase." : "Recarga la página."}</p>`;
    return;
  }
  const st = { avatar: null, shopPhoto: null };
  const pic = (url, cls, empty) => url ? `<img src="${esc(url)}" alt="" class="${cls}">` : `<span class="${cls} empty">${empty}</span>`;
  app.innerHTML = `<div class="account"><h1 class="display" style="font-size:30px">Mi cuenta</h1>
    <p class="muted" style="margin:4px 0 0">Así te ven los compradores en tus anuncios.</p>
    <form id="accForm" class="col" style="margin-top:24px" novalidate>
      <section class="panel col">
        <h2>Perfil</h2>
        <div class="acc-avatar"><label class="acc-pick" title="Cambiar foto de perfil">${pic(profilePhotoUrl(prof.avatar_path), "av", esc(prof.display_name.slice(0, 1).toUpperCase()))}
          <input type="file" id="avatarIn" accept="image/jpeg,image/png,image/webp" class="sr-only"></label>
          <div><p style="margin:0;font-weight:600">Foto de perfil</p><p class="xs muted" style="margin:2px 0 0">Tu cara o el logo de tu tienda. Toca la foto para cambiarla.</p></div></div>
        <label class="f">Nombre para mostrar<input class="input" name="displayName" required minlength="2" maxlength="40" value="${esc(prof.display_name)}"></label>
      </section>
      ${prof.is_shop ? "" : `<section class="panel col" id="shopReq"><h2>¿Tienes una tienda?</h2><p class="small muted" style="margin:0">Las tiendas verificadas llevan el sello “🏪 Tienda verificada” y muestran la foto del local en cada anuncio.</p><div id="shopReqBody"><p class="xs muted"><span class="spinner"></span></p></div></section>`}
      ${prof.is_shop ? `<section class="panel col">
        <div class="phead"><h2>Tu tienda</h2>${sellerBadge({ isShop: true, verified: prof.verified })}</div>
        <label class="f">Describe tu tienda<textarea class="textarea" name="shopDescription" rows="4" maxlength="280" placeholder="Qué vendes, dónde queda el local, horario…">${esc(prof.shop_description ?? "")}</textarea><span class="xs muted" id="descCount"></span></label>
        <div class="f" style="font-size:14px;font-weight:500">Foto del local
          <label class="acc-shop" title="Cambiar foto del local">${pic(profilePhotoUrl(prof.shop_photo_path), "shp", "📷 Sube una foto de la fachada o del mostrador")}
            <input type="file" id="shopIn" accept="image/jpeg,image/png,image/webp" class="sr-only"></label>
          <span class="xs muted" style="font-weight:400">Una foto real del local da confianza: la gente ve que existes.</span></div>
        ${prof.verified ? `<p class="notice good" style="margin:0">✓ Tu tienda está verificada.</p>`
          : `<p class="notice soft" style="margin:0"><b style="color:var(--ink)">Tu tienda está en revisión.</b> Sube la foto del local: nos ayuda a verificar que existe. Te avisamos cuando tengas el sello.</p>`}
      </section>` : ""}
      <div id="accMsg"></div>
      <button class="btn primary block" id="accBtn">Guardar cambios</button>
    </form></div>`;

  const form = $("#accForm"), desc = form.shopDescription;
  const count = () => ($("#descCount").textContent = `${desc.value.length}/280`);
  if (desc) { desc.addEventListener("input", count); count(); }
  const preview = (input, key, cls) => input.addEventListener("change", () => {
    const f = input.files[0]; if (!f) return;
    st[key] = f;
    const holder = input.parentElement.querySelector(`.${cls}`);
    const img = document.createElement("img"); img.className = cls; img.alt = ""; img.src = URL.createObjectURL(f);
    holder.replaceWith(img);
  });
  if (!prof.is_shop) renderShopRequest(uid);
  preview($("#avatarIn"), "avatar", "av");
  if (prof.is_shop) preview($("#shopIn"), "shopPhoto", "shp");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("#accBtn"), msg = $("#accMsg");
    const say = (cls, t) => (msg.innerHTML = `<p class="notice ${cls}" style="margin:0">${esc(t)}</p>`);
    const displayName = form.displayName.value.trim();
    if (displayName.length < 2) return say("bad", "El nombre debe tener al menos 2 caracteres.");
    btn.disabled = true; btn.textContent = "Guardando…"; msg.innerHTML = "";
    const uploaded = [];
    const upload = async (file, kind) => {
      const f = await compressImage(file);
      const ext = { "image/png": "png", "image/webp": "webp" }[f.type] ?? "jpg";
      const path = `${uid}/${kind}-${Date.now()}.${ext}`;
      const up = await sb.storage.from("profile-photos").upload(path, f, { contentType: f.type || "image/jpeg", cacheControl: "31536000", upsert: false });
      if (up.error) throw up.error;
      uploaded.push(path);
      return path;
    };
    try {
      const patch = { display_name: displayName };
      if (prof.is_shop) patch.shop_description = desc.value.trim() || null;
      if (st.avatar) patch.avatar_path = await upload(st.avatar, "avatar");
      if (st.shopPhoto) patch.shop_photo_path = await upload(st.shopPhoto, "local");
      const res = await sb.from("profiles").update(patch).eq("id", uid).select(PROFILE_COLS).single();
      if (res.error) throw res.error;
      // Replaced photos are no longer referenced anywhere: remove them.
      const old = [st.avatar && prof.avatar_path, st.shopPhoto && prof.shop_photo_path].filter(Boolean);
      if (old.length) sb.storage.from("profile-photos").remove(old);
      Object.assign(prof, res.data); st.avatar = st.shopPhoto = null;
      profileName = prof.display_name; renderNav();
      say("good", "Listo, tu perfil quedó guardado.");
    } catch (err) {
      console.error(err);
      if (uploaded.length) sb.storage.from("profile-photos").remove(uploaded);
      say("bad", err?.statusCode === "413" || /size/i.test(err?.message ?? "") ? "La foto es muy pesada (máximo 5 MB)." : "No pudimos guardar los cambios. Revisa tu conexión e intenta de nuevo.");
    } finally { btn.disabled = false; btn.textContent = "Guardar cambios"; }
  });
}

  cancelled: { label: "Cancelada", next: null },
};
const PAID_STATES = ["paid", "verifying", "delivered", "released"];
const LISTING_STATUS = { draft: "Borrador", active: "Activo", reserved: "Reservado", sold: "Vendido", removed: "Quitado" };
const GOAL_ORDERS = 20;

async function viewAdmin(app, params) {
  setTitle("Panel de staff");
  if (!isStaff) {
    app.innerHTML = `<div style="padding:64px 0;text-align:center"><p>Esta sección es solo para el equipo de ${esc(CONFIG.APP_NAME)}.</p><a class="btn" href="#/">Volver al inicio</a></div>`;
    return;
  }
  const tab = ["ordenes", "anuncios", "tiendas", "resumen"].includes(params.get("tab")) ? params.get("tab") : "ordenes";
  const tabs = [["ordenes", "Órdenes"], ["anuncios", "Anuncios"], ["tiendas", "Tiendas"], ["resumen", "Resumen"]];
  app.innerHTML = `<div class="admin"><h1 class="display" style="font-size:30px">Panel de staff</h1>
    <nav class="admin-tabs" aria-label="Secciones">${tabs.map(([k, t]) => `<a href="#/admin?tab=${k}" class="${k === tab ? "on" : ""}">${t}</a>`).join("")}</nav>
    <div id="adminBody"><p class="muted small"><span class="spinner"></span> Cargando…</p></div></div>`;
  const body = $("#adminBody");
  try {
    if (tab === "ordenes") await adminOrders(body);
    else if (tab === "anuncios") await adminListings(body, params.get("q") ?? "");
    else if (tab === "tiendas") await adminShops(body);
    else await adminSummary(body);
  } catch (e) {
    console.error(e);
    body.innerHTML = `<p class="notice bad">${e?.code === "42P01" || e?.code === "42703" ? "Falta aplicar la migración 0005 en Supabase." : "No pudimos cargar esta sección. Recarga la página."}</p>`;
  }
}
function adminFail(err, el, fallback = "No se pudo guardar. Intenta de nuevo.") {
  console.error(err);
  el.innerHTML = `<p class="notice bad" style="margin:0">${esc(fallback)}</p>`;
}
async function profilesById(ids) {
  const uniq = [...new Set(ids.filter(Boolean))];
  if (!uniq.length) return new Map();
  const { data } = await sb.from("public_profiles").select("id, display_name, is_shop, verified").in("id", uniq);
  return new Map((data ?? []).map((p) => [p.id, p]));
}
const fmtDate = (s) => s ? new Date(s).toLocaleDateString("es-PA", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";

// ------------------------------------------------------------- orders
async function adminOrders(body) {
  const { data: orders, error } = await sb.from("protected_orders")
    .select("id, listing_id, seller_id, buyer_contact, price_cents, fee_cents, itbms_cents, status, payment_ref, notes, created_at, updated_at")
    .order("created_at", { ascending: false }).limit(200);
  if (error) throw error;
  const listingIds = [...new Set(orders.map((o) => o.listing_id))];
  const { data: listings } = listingIds.length
    ? await sb.from("listings").select("id, title, status, catalog_id, grading_company, grade, condition").in("id", listingIds)
    : { data: [] };
  const byListing = new Map((listings ?? []).map((l) => [l.id, l]));
  const sellers = await profilesById(orders.map((o) => o.seller_id));
  const open = orders.filter((o) => ORDER_FLOW[o.status]?.next);
  const closed = orders.filter((o) => !ORDER_FLOW[o.status]?.next);

  const card = (o) => {
    const l = byListing.get(o.listing_id), f = ORDER_FLOW[o.status];
    const total = o.price_cents + o.fee_cents + o.itbms_cents;
    const canCancel = !["released", "refunded", "cancelled"].includes(o.status);
    return `<li class="panel order" data-id="${o.id}">
      <div class="phead"><a href="#/carta/${encodeURIComponent(o.listing_id)}" style="font-weight:600">${esc(l?.title ?? "Anuncio")}</a><span class="b ${o.status === "released" ? "good" : ["refunded", "cancelled"].includes(o.status) ? "warn" : "prot"}">${f?.label ?? o.status}</span></div>
      <dl class="rows">
        <div><dt>Vendedor</dt><dd>${esc(sellers.get(o.seller_id)?.display_name ?? "—")}</dd></div>
        <div><dt>Comprador</dt><dd>${esc(o.buyer_contact || "—")}</dd></div>
        <div><dt>El comprador paga</dt><dd>${formatUsd(total)}</dd></div>
        <div><dt>Pagar al vendedor</dt><dd>${formatUsd(o.price_cents)}</dd></div>
        <div><dt>Comisión (+ ITBMS ${formatUsd(o.itbms_cents)})</dt><dd>${formatUsd(o.fee_cents)}</dd></div>
        ${o.payment_ref ? `<div><dt>Ref. de pago</dt><dd>${esc(o.payment_ref)}</dd></div>` : ""}
        <div><dt>Creada / actualizada</dt><dd>${fmtDate(o.created_at)} · ${fmtDate(o.updated_at)}</dd></div>
      </dl>
      <label class="f muted-label" style="margin-top:8px">Notas<textarea class="textarea order-notes" rows="2" maxlength="500">${esc(o.notes ?? "")}</textarea></label>
      <div class="order-actions">
        ${f?.next ? `<button class="btn primary" data-act="next">${f.action}</button>` : ""}
        ${canCancel ? `<button class="btn danger" data-act="cancel">${PAID_STATES.includes(o.status) ? "Reembolsar" : "Cancelar"}</button>` : ""}
        <button class="btn" data-act="notes">Guardar notas</button>
      </div><div class="order-msg"></div></li>`;
  };

  body.innerHTML = `
    <section class="panel col"><h2>Nueva orden protegida</h2>
      <p class="small muted" style="margin:0">Cuando un comprador te escribe para comprar protegido, búscale el anuncio y crea la orden. El monto se calcula solo (4%, mín. $1, máx. $40 + ITBMS).</p>
      <div class="row-input"><input class="input" id="noSearch" placeholder="Busca el anuncio (título, jugador, set…)"><button class="btn" id="noFind" style="border-radius:12px">Buscar</button></div>
      <div id="noResults"></div>
    </section>
    <h2 class="display admin-h">Abiertas (${open.length})</h2>
    ${open.length ? `<ul class="admin-list">${open.map(card).join("")}</ul>` : `<p class="muted small">No hay órdenes abiertas.</p>`}
    <details class="admin-closed"><summary>Cerradas (${closed.length})</summary>${closed.length ? `<ul class="admin-list">${closed.map(card).join("")}</ul>` : `<p class="muted small">Ninguna todavía.</p>`}</details>`;

  // new order
  const find = async () => {
    const q = $("#noSearch").value.trim(), out = $("#noResults");
    if (q.length < 2) { out.innerHTML = `<p class="xs muted">Escribe al menos 2 letras.</p>`; return; }
    out.innerHTML = `<p class="xs muted"><span class="spinner"></span> Buscando…</p>`;
    let query = sb.from("listings").select("id, title, price_cents, seller_id, status").eq("status", "active").limit(8);
    for (const t of searchTokens(q)) query = query.or(["title", "subject", "set_name"].map((c) => `${c}.ilike.%${t}%`).join(","));
    const { data, error } = await query;
    if (error) return adminFail(error, out, "No se pudo buscar.");
    if (!data.length) { out.innerHTML = `<p class="xs muted">No hay anuncios activos con ese texto.</p>`; return; }
    const sellersFound = await profilesById(data.map((l) => l.seller_id));
    out.innerHTML = `<ul class="admin-list">${data.map((l) => {
      const q2 = quoteProtected(l.price_cents);
      return `<li class="panel" data-lid="${l.id}"><div class="phead"><span style="font-weight:600">${esc(l.title)}</span><span class="small muted">${esc(sellersFound.get(l.seller_id)?.display_name ?? "")}</span></div>
        <p class="small" style="margin:6px 0">Carta ${formatUsd(q2.priceCents)} + comisión ${formatUsd(q2.feeCents)} + ITBMS ${formatUsd(q2.itbmsCents)} = <b>${formatUsd(q2.buyerTotalCents)}</b></p>
        <div class="row-input"><input class="input no-buyer" maxlength="120" placeholder="Comprador: nombre y WhatsApp"><button class="btn primary no-create" style="border-radius:12px">Crear orden</button></div><div class="no-msg"></div></li>`;
    }).join("")}</ul>`;
    out.querySelectorAll("[data-lid]").forEach((li) => li.querySelector(".no-create").addEventListener("click", async (e) => {
      const l = data.find((x) => x.id === li.dataset.lid), q2 = quoteProtected(l.price_cents), msg = li.querySelector(".no-msg");
      e.target.disabled = true;
      const { error } = await sb.from("protected_orders").insert({
        listing_id: l.id, seller_id: l.seller_id, buyer_contact: li.querySelector(".no-buyer").value.trim() || null,
        price_cents: q2.priceCents, fee_cents: q2.feeCents, itbms_cents: q2.itbmsCents, status: "awaiting_payment",
      });
      if (error) { e.target.disabled = false; return adminFail(error, msg, "No se pudo crear la orden."); }
      await sb.from("listings").update({ protected_eligible: true }).eq("id", l.id);
      route();
    }));
  };
  $("#noFind").addEventListener("click", find);
  $("#noSearch").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); find(); } });

  // order actions
  body.querySelectorAll("li.order").forEach((li) => {
    const o = orders.find((x) => x.id === li.dataset.id), msg = li.querySelector(".order-msg");
    li.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", async () => {
      const act = b.dataset.act;
      if (act === "notes") {
        const { error } = await sb.from("protected_orders").update({ notes: li.querySelector(".order-notes").value.trim() || null }).eq("id", o.id);
        return error ? adminFail(error, msg) : (msg.innerHTML = `<p class="notice good" style="margin:0">Notas guardadas.</p>`);
      }
      const patch = {};
      let listingStatus = null;
      if (act === "cancel") {
        const refund = PAID_STATES.includes(o.status);
        if (!confirm(refund ? "¿Marcar como reembolsada? Confirma que ya le devolviste el dinero al comprador." : "¿Cancelar esta orden?")) return;
        patch.status = refund ? "refunded" : "cancelled";
        listingStatus = "active";
      } else {
        patch.status = ORDER_FLOW[o.status].next;
        if (patch.status === "paid") {
          const ref = prompt("Referencia del pago (Yappy o transferencia):", o.payment_ref ?? "");
          if (ref === null) return;
          patch.payment_ref = ref.trim() || null;
          listingStatus = "reserved";
        }
        if (patch.status === "released" && !confirm(`¿Ya le pagaste ${formatUsd(o.price_cents)} al vendedor? Esto cierra la orden y marca la carta como vendida.`)) return;
        if (patch.status === "released") listingStatus = "sold";
      }
      li.querySelectorAll("button").forEach((x) => (x.disabled = true));
      const { error } = await sb.from("protected_orders").update(patch).eq("id", o.id);
      if (error) { li.querySelectorAll("button").forEach((x) => (x.disabled = false)); return adminFail(error, msg); }
      if (listingStatus) await sb.from("listings").update({ status: listingStatus }).eq("id", o.listing_id);
      if (patch.status === "released") {
        // Record the sale: this is the local Panama price data behind the estimates.
        const l = byListing.get(o.listing_id);
        const { error: saleErr } = await sb.from("sales").insert({
          listing_id: o.listing_id, catalog_id: l?.catalog_id ?? null,
          grading_key: l?.grading_company ? `${l.grading_company}${Number(l.grade)}` : "raw",
          condition: l?.condition ?? null, price_cents: o.price_cents, via_protected: true,
        });
        if (saleErr && saleErr.code !== "23505") console.error(saleErr); // 23505 = already recorded
      }
      route();
    }));
  });
}

// ------------------------------------------------------------- listings
async function adminListings(body, q) {
  let query = sb.from("listings").select("id, title, price_cents, status, protected_eligible, seller_id, created_at").order("created_at", { ascending: false }).limit(50);
  for (const t of searchTokens(q)) query = query.or(["title", "subject", "set_name"].map((c) => `${c}.ilike.%${t}%`).join(","));
  const { data, error } = await query;
  if (error) throw error;
  const sellers = await profilesById(data.map((l) => l.seller_id));
  body.innerHTML = `
    <form id="alSearch" class="row-input" style="margin-bottom:12px"><input class="input" name="q" value="${esc(q)}" placeholder="Buscar anuncio"><button class="btn" style="border-radius:12px">Buscar</button></form>
    ${data.length ? `<ul class="admin-list">${data.map((l) => `<li class="panel" data-id="${l.id}">
      <div class="phead"><a href="#/carta/${encodeURIComponent(l.id)}" style="font-weight:600">${esc(l.title)}</a><span class="small">${formatUsd(l.price_cents)}</span></div>
      <p class="xs muted" style="margin:4px 0 8px">${esc(sellers.get(l.seller_id)?.display_name ?? "—")} · ${LISTING_STATUS[l.status] ?? l.status} · ${fmtDate(l.created_at)}</p>
      <div class="order-actions">
        <label class="toggle"><input type="checkbox" class="al-prot" ${l.protected_eligible ? "checked" : ""}> Compra Protegida</label>
        ${l.status === "removed" ? `<button class="btn" data-status="active">Reactivar</button>` : `<button class="btn danger" data-status="removed">Quitar anuncio</button>`}
      </div><div class="order-msg"></div></li>`).join("")}</ul>` : `<p class="muted small">No hay anuncios${q ? " con ese texto" : ""}.</p>`}`;
  $("#alSearch").addEventListener("submit", (e) => { e.preventDefault(); go(`/admin?tab=anuncios&q=${encodeURIComponent(e.target.q.value.trim())}`); });
  body.querySelectorAll("li[data-id]").forEach((li) => {
    const msg = li.querySelector(".order-msg");
    li.querySelector(".al-prot").addEventListener("change", async (e) => {
      const { error } = await sb.from("listings").update({ protected_eligible: e.target.checked }).eq("id", li.dataset.id);
      if (error) { e.target.checked = !e.target.checked; adminFail(error, msg); }
    });
    li.querySelector("[data-status]").addEventListener("click", async (e) => {
      const status = e.target.dataset.status;
      if (status === "removed" && !confirm("¿Quitar este anuncio? Deja de verse en la página (se puede reactivar).")) return;
      const { error } = await sb.from("listings").update({ status }).eq("id", li.dataset.id);
      if (error) return adminFail(error, msg);
      route();
    });
  });
}

// ------------------------------------------------------------- shops
async function adminShops(body) {
  const [{ data: reqs, error }, { data: shops }] = await Promise.all([
    sb.from("shop_requests").select("id, user_id, shop_name, contact, location, status, created_at").eq("status", "pending").order("created_at"),
    sb.from("public_profiles").select("id, display_name, verified").eq("is_shop", true).order("display_name"),
  ]);
  if (error) throw error;
  const names = await profilesById(reqs.map((r) => r.user_id));
  body.innerHTML = `
    <h2 class="display admin-h" style="margin-top:0">Solicitudes pendientes (${reqs.length})</h2>
    ${reqs.length ? `<ul class="admin-list">${reqs.map((r) => `<li class="panel" data-id="${r.id}" data-user="${r.user_id}">
      <div class="phead"><span style="font-weight:600">${esc(r.shop_name)}</span><span class="xs muted">${fmtDate(r.created_at)}</span></div>
      <dl class="rows"><div><dt>Cuenta</dt><dd>${esc(names.get(r.user_id)?.display_name ?? "—")}</dd></div>
        <div><dt>Contacto</dt><dd>${esc(r.contact || "—")}</dd></div><div><dt>Ubicación</dt><dd>${esc(r.location || "—")}</dd></div></dl>
      <p class="xs muted" style="margin:8px 0">Antes de aprobar: revisa su Instagram, que el local exista y que venda cartas originales.</p>
      <div class="order-actions"><button class="btn primary" data-act="approve">Aprobar y verificar</button><button class="btn danger" data-act="reject">Rechazar</button></div>
      <div class="order-msg"></div></li>`).join("")}</ul>` : `<p class="muted small">No hay solicitudes pendientes.</p>`}
    <h2 class="display admin-h">Tiendas (${shops?.length ?? 0})</h2>
    ${shops?.length ? `<ul class="admin-list">${shops.map((s) => `<li class="panel" data-user="${s.id}"><div class="phead"><span style="font-weight:600">${esc(s.display_name)}</span>${s.verified ? shopBadge() : `<span class="b neutral">Sin verificar</span>`}</div>
      <div class="order-actions" style="margin-top:8px">${s.verified ? `<button class="btn danger" data-act="unverify">Quitar verificación</button>` : `<button class="btn primary" data-act="verify">Verificar</button>`}</div><div class="order-msg"></div></li>`).join("")}</ul>` : `<p class="muted small">Todavía no hay tiendas.</p>`}`;

  body.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", async () => {
    const li = b.closest("li"), msg = li.querySelector(".order-msg"), act = b.dataset.act, user = li.dataset.user;
    li.querySelectorAll("button").forEach((x) => (x.disabled = true));
    const fail = (e) => { li.querySelectorAll("button").forEach((x) => (x.disabled = false)); adminFail(e, msg); };
    if (act === "approve" || act === "verify" || act === "unverify") {
      const { error } = await sb.from("profiles").update(act === "unverify" ? { verified: false } : { is_shop: true, verified: true }).eq("id", user);
      if (error) return fail(error);
    }
    if (act === "approve" || act === "reject") {
      const { error } = await sb.from("shop_requests").update({ status: act === "approve" ? "approved" : "rejected", reviewed_at: new Date().toISOString() }).eq("id", li.dataset.id);
      if (error) return fail(error);
    }
    route();
  }));
}

// ------------------------------------------------------------- summary
async function adminSummary(body) {
  const [{ data: orders, error }, { count: activeCount }, { count: shopCount }, { count: pendingShops }] = await Promise.all([
    sb.from("protected_orders").select("status, price_cents, fee_cents, created_at"),
    sb.from("listings").select("id", { count: "exact", head: true }).eq("status", "active"),
    sb.from("public_profiles").select("id", { count: "exact", head: true }).eq("is_shop", true).eq("verified", true),
    sb.from("shop_requests").select("id", { count: "exact", head: true }).eq("status", "pending"),
  ]);
  if (error) throw error;
  const paid = orders.filter((o) => PAID_STATES.includes(o.status));
  const released = orders.filter((o) => o.status === "released");
  const sum = (arr, k) => arr.reduce((a, o) => a + o[k], 0);
  const pct = Math.min(100, Math.round((paid.length / GOAL_ORDERS) * 100));
  const first = orders.length ? orders.map((o) => o.created_at).sort()[0] : null;
  const days = first ? Math.max(1, Math.ceil((Date.now() - new Date(first)) / 86400000)) : 0;
  const stat = (n, t) => `<div class="panel stat"><p class="display" style="font-size:28px;font-weight:700;margin:0">${n}</p><p class="xs muted" style="margin:2px 0 0">${t}</p></div>`;
  body.innerHTML = `
    <section class="panel col"><h2>Meta: ${GOAL_ORDERS} Compras Protegidas pagadas en 4 semanas</h2>
      <div class="goal" role="progressbar" aria-valuemin="0" aria-valuemax="${GOAL_ORDERS}" aria-valuenow="${paid.length}"><div style="width:${pct}%"></div></div>
      <p class="small" style="margin:0"><b>${paid.length} de ${GOAL_ORDERS}</b>${first ? ` · día ${days} desde la primera orden${days > 28 ? " (ya pasaron las 4 semanas)" : ""}` : " · aún no hay órdenes"}</p></section>
    <div class="stats">
      ${stat(paid.length, "órdenes pagadas")}
      ${stat(formatUsd(sum(released, "fee_cents")), "comisiones cobradas (liberadas)")}
      ${stat(formatUsd(sum(paid, "price_cents")), "valor de cartas protegidas (GMV)")}
      ${stat(orders.filter((o) => o.status === "awaiting_payment").length, "esperando pago")}
      ${stat(activeCount ?? 0, "anuncios activos")}
      ${stat(shopCount ?? 0, "tiendas verificadas")}
      ${stat(pendingShops ?? 0, "solicitudes de tienda")}
      ${stat(orders.filter((o) => ["refunded", "cancelled"].includes(o.status)).length, "reembolsadas o canceladas")}
    </div>`;
}

// ============================================================= boot
document.querySelectorAll(".brand-name, #brand").forEach((n) => (n.textContent = CONFIG.APP_NAME));
$("#topSearch").addEventListener("submit", (e) => { e.preventDefault(); const q = $("#qTop").value.trim(); go(q ? `/?q=${encodeURIComponent(q)}` : "/"); });
window.addEventListener("hashchange", route);
async function loadProfileName() {
  profileName = null; isStaff = false;
  if (!session) return;
  const { data } = await sb.from("profiles").select("display_name, is_staff").eq("id", session.user.id).maybeSingle();
  profileName = data?.display_name ?? null;
  isStaff = Boolean(data?.is_staff);
  renderNav();
  if (isStaff && parseHash().path === "/admin") route(); // staff flag arrived after the first render
}
(async () => {
  if (sb) {
    session = (await sb.auth.getSession()).data.session;
    sb.auth.onAuthStateChange((_evt, s) => {
      const changed = (s?.user.id ?? null) !== (session?.user.id ?? null);
      session = s;
      if (changed) { loadProfileName(); route(); }
    });
    loadProfileName();
  }
  route();
})();
</script>
