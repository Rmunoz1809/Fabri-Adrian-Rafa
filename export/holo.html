function rowToListing(r, prof) {

async function withProfiles(rows) {
  if (!rows.length) return [];
  const ids = [...new Set(rows.map((r) => r.seller_id))];
  const { data } = await sb.from("public_profiles").select("id, display_name, is_shop, verified").in("id", ids);
  const byId = new Map((data ?? []).map((p) => [p.id, p]));
  return rows.map((r) => rowToListing(r, byId.get(r.seller_id)));
}
const searchTokens = (q) => String(q ?? "").replace(/[,()%*\\"'.:]/g, " ").split(/\s+/).filter((t) => t.length >= 2).slice(0, 5);

async function fetchRealListings(f) {
  if (!sb) return [];
  let q = sb.from("listings").select(LISTING_COLS).eq("status", "active").limit(60);
  if (f.category) q = q.eq("category", f.category);
  if (f.graded === "graded") q = q.not("grading_company", "is", null);
  if (f.graded === "raw") q = q.is("grading_company", null);
  if (f.province) q = q.eq("province", f.province);
  if (f.minPrice != null) q = q.gte("price_cents", Math.round(f.minPrice * 100));
  if (f.maxPrice != null) q = q.lte("price_cents", Math.round(f.maxPrice * 100));
  for (const t of searchTokens(f.q)) q = q.or(["title", "subject", "set_name", "neighborhood", "district", "province"].map((c) => `${c}.ilike.%${t}%`).join(","));
  q = q.order("created_at", { ascending: false });
  const { data, error } = await q;
  if (error) { console.error(error); return []; }
  return withProfiles(data ?? []);
}
async function fetchRealListing(id) {
  if (!sb) return null;
  const { data, error } = await sb.from("listings").select(LISTING_COLS).eq("id", id).maybeSingle();
  if (error || !data) return null;
  return (await withProfiles([data]))[0];
}

function matchesFilters(l, f) {
  if (f.category && l.card.category !== f.category) return false;
  if (f.graded === "graded" && !l.grading) return false;
  if (f.graded === "raw" && l.grading) return false;
  if (f.province && l.location.province !== f.province) return false;
  if (f.minPrice != null && l.priceUsd < f.minPrice) return false;
  if (f.maxPrice != null && l.priceUsd > f.maxPrice) return false;
  if (f.q) {
    const hay = normalize([l.title, l.card.subject, l.card.setName, l.card.variant, l.card.number, l.location.neighborhood, l.location.district, l.location.province].join(" "));
    if (!normalize(f.q).split(/\s+/).filter(Boolean).every((t) => hay.includes(t))) return false;
  }
  return true;
}
function sortListings(list, sort) {
  const c = [...list];
  if (sort === "precio-asc") c.sort((a, b) => a.priceUsd - b.priceUsd);
  else if (sort === "precio-desc") c.sort((a, b) => b.priceUsd - a.priceUsd);
  else c.sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  return c;
}

// ============================================================= router
function parseHash() {
  const raw = location.hash.replace(/^#/, "") || "/";
  const [path, qs] = raw.split("?");
  return { path, params: new URLSearchParams(qs ?? "") };
}
function go(path) { location.hash = path; }
function filtersFrom(params) {
  const num = (k) => { const v = params.get(k); const n = v ? Number(v) : NaN; return Number.isFinite(n) && n >= 0 ? n : undefined; };
  const tipo = params.get("tipo"), orden = params.get("orden");
  return {
    q: params.get("q")?.trim() || undefined, category: params.get("cat") || undefined,
    graded: tipo === "raw" || tipo === "graded" ? tipo : undefined, province: params.get("provincia") || undefined,
    minPrice: num("min"), maxPrice: num("max"), sort: orden === "precio-asc" || orden === "precio-desc" ? orden : "recientes",
  };
}
function hrefWith(f, patch) {
  const base = { q: f.q, cat: f.category, tipo: f.graded, provincia: f.province, min: f.minPrice, max: f.maxPrice, orden: f.sort === "recientes" ? undefined : f.sort };
  const p = new URLSearchParams();
  for (const [k, v] of Object.entries({ ...base, ...patch })) if (v != null && v !== "") p.set(k, v);
  const s = p.toString();
  return s ? `#/?${s}` : "#/";
}

async function route() {
  const { path, params } = parseHash();
  window.scrollTo(0, 0);
  renderNav();
  const app = $("#app");
  const gated = !!sb && !session;
  document.body.classList.toggle("gate", gated);
  try {
    if (gated) return viewAuth(app, path === "/entrar" ? params.get("next") || "/" : location.hash.replace(/^#/, "") || "/");
    if (path === "/" || path === "") return await viewHome(app, params);
    if (path.startsWith("/carta/")) return await viewDetail(app, decodeURIComponent(path.slice(7)));
    if (path === "/protegida") return viewProtected(app);
    if (path === "/entrar") return viewAuth(app, params.get("next") || "/");
    if (path === "/vender") return viewSell(app);
    app.innerHTML = `<div style="padding:64px 0;text-align:center"><p>Página no encontrada.</p><a class="btn" href="#/">Volver al inicio</a></div>`;
  } catch (e) {
    console.error(e);
    app.innerHTML = `<div class="notice bad" style="margin-top:24px">Algo salió mal. Recarga la página.</div>`;
  }
}

function renderNav() {
  const name = session ? esc(profileName ?? session.user.email?.split("@")[0] ?? "Tu cuenta") : null;

// ============================================================= price history
// Valor en el tiempo. La base es el historial semanal incrustado en este mismo
// archivo (<script id="precios-data">), que un GitHub Action actualiza cada lunes
// con scripts/actualizar-precios.mjs: TCGplayer vía tcgcsv.com (desde feb 2024) y
// la guía de precios oficial de Cardmarket. Encima va el precio de hoy de TCGdex
// y, si existen, las ventas registradas en Panamá. La tabla price_snapshots de
// Supabase (supabase/price_snapshots.sql) es opcional (CONFIG.PRICE_SNAPSHOTS).
const CHART_COLORS = { market: "#6d86f5", cardmarket: "#2f9e8f", sales: "#c9823d" };
const DAY_MS = 86400000;
const CHART_RANGES = [["30 días", 30], ["90 días", 90], ["1 año", 365], ["Todo", Infinity]];
const isoDay = (d) => d.toISOString().slice(0, 10);
const noonUtc = (day) => Date.parse(`${day}T12:00:00Z`);
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
const fmtDay = (t, year) => new Intl.DateTimeFormat("es-PA", year ? { day: "numeric", month: "short", year: "numeric" } : { day: "numeric", month: "short" }).format(t);
const fmtAxis = (v) => (v >= 1000 ? `$${+(v / 1000).toFixed(1)}k` : `$${+v.toFixed(v < 10 ? 2 : 0)}`);
const median = (xs) => { const a = [...xs].sort((x, y) => x - y); return a.length ? quantile(a, 0.5) : null; };

let preciosData = null;
/** Historial semanal incrustado (vacío si el bloque falta o está dañado). */
function storedPrices() {
  if (!preciosData) {
    try { preciosData = JSON.parse($("#precios-data")?.textContent || "{}"); } catch { preciosData = {}; }
    preciosData.cartas ??= {};
  }
  return preciosData;
}

const TCGDEX_API = "https://api.tcgdex.net/v2/en";
/** pokemontcg.io ids (sv3pt5-199) → TCGdex ids (sv03.5-199). */
function tcgdexId(id) {
  const i = id.lastIndexOf("-"), set = id.slice(0, i), m = set.match(/^sv(\d+)(pt5)?$/);
  return `${m ? `sv${m[1].padStart(2, "0")}${m[2] ? ".5" : ""}` : set}-${id.slice(i + 1)}`;
}
let eurUsdPromise = null;
/** EUR→USD from the European Central Bank reference rate (Frankfurter). */
const eurUsd = () => (eurUsdPromise ??= withTimeout(fetch("https://api.frankfurter.dev/v1/latest?from=EUR&to=USD"), 8000)
  .then((r) => r.json()).then((j) => ({ rate: j.rates.USD, date: j.date })).catch(() => null));

/** Agrega un punto al final de la serie si es de un día posterior al último (o lo reemplaza si es el mismo día). */
function appendLatest(series, p) {
  const last = series.at(-1);
  if (!last || isoDay(new Date(p.t)) > isoDay(new Date(last.t))) series.push(p);
  else if (isoDay(new Date(p.t)) === isoDay(new Date(last.t))) series[series.length - 1] = p;
}

async function fetchPriceHistory(l) {
  const { catalogId, category } = l.card;
  const factor = l.grading ? 1 : CONDITION_FACTOR[l.condition] ?? 1;
  const store = storedPrices();
  const h = { market: [], cardmarket: [], sales: [], factor, fx: null, productId: null, cmUpdated: null, updated: store.actualizado ?? null, weekly: false, liveMarket: false, liveCm: false };
  if (catalogId && !l.grading && category === "pokemon") {
    const stored = store.cartas[catalogId];
    const [dbRows, dex, fx] = await Promise.all([
      (async () => {
        if (!sb || !CONFIG.PRICE_SNAPSHOTS) return [];
        await withTimeout(sb.rpc("snapshot_price", { p_catalog_id: catalogId }), 6000).catch(() => {});
        const { data } = await sb.from("price_snapshots").select("variant, market_cents, captured_on").eq("catalog_id", catalogId).order("captured_on").limit(1500);
        return data ?? [];
      })().catch(() => []),
      withTimeout(fetch(`${TCGDEX_API}/cards/${encodeURIComponent(tcgdexId(catalogId))}`), 8000).then((r) => (r.ok ? r.json() : null)).catch(() => null),
      eurUsd(),
    ]);
    // TCGplayer (EE.UU.): un precio de mercado por semana + el de hoy.
    const tpStored = stored?.series?.tcgplayer ?? {};
    const key = pickVariantKey(Object.keys(tpStored), l.card.variant);
    h.market = (tpStored[key] ?? []).filter((p) => p.market > 0)
      .map((p) => ({ t: noonUtc(p.d), v: round2(p.market * factor), k: "precio de mercado", carried: !!p.carried, src: p.fuente }));
    h.productId = stored?.tcgplayer?.productId ?? null;
    const dbKey = dbRows.length ? pickVariantKey([...new Set(dbRows.map((r) => r.variant))], key ?? l.card.variant) : null;
    for (const r of dbRows.filter((r) => r.variant === dbKey)) appendLatest(h.market, { t: noonUtc(r.captured_on), v: round2((r.market_cents / 100) * factor), k: "precio de mercado", src: "supabase" });
    const tp = dex?.pricing?.tcgplayer;
    if (tp) {
      const tkey = pickVariantKey(Object.keys(tp).filter((k) => typeof tp[k] === "object" && tp[k]), key ?? l.card.variant);
      const v = tp[tkey]?.marketPrice ?? tp[tkey]?.midPrice;
      h.productId ??= tp[tkey]?.productId ?? null;
      if (v > 0) { appendLatest(h.market, { t: noonUtc(isoDay(new Date(tp.updated ?? Date.now()))), v: round2(v * factor), k: "precio de mercado", src: "tcgdex" }); h.liveMarket = h.market.at(-1).src === "tcgdex"; }
    }
    // Cardmarket (Europa): promedio de ventas reales de los últimos 7 días, en USD con la tasa del BCE de cada fecha.
    const cmValue = (p) => (p.avg7 > 0 ? [p.avg7, "promedio de ventas, últimos 7 días"] : p.trend > 0 ? [p.trend, "precio de tendencia"] : [null]);
    h.cardmarket = (stored?.series?.cardmarket ?? []).filter((p) => p.eurUsd && cmValue(p)[0])
      .map((p) => { const [eur, k] = cmValue(p); return { t: noonUtc(p.d), v: round2(eur * p.eurUsd * factor), k, carried: !!p.carried, src: p.fuente, rate: p.eurUsd }; });
    const cm = dex?.pricing?.cardmarket;
    if (cm && fx && cmValue(cm)[0]) {
      const [eur, k] = cmValue(cm);
      h.fx = fx; h.cmUpdated = Date.parse(cm.updated);
      appendLatest(h.cardmarket, { t: noonUtc(isoDay(new Date(h.cmUpdated))), v: round2(eur * fx.rate * factor), k, src: "tcgdex", rate: fx.rate });
      h.liveCm = h.cardmarket.at(-1).src === "tcgdex";
    }
    h.weekly = h.market.length > 4 || h.cardmarket.length > 4;
  }
  if (sb && catalogId && !l.isDemo) {
    const gradingKey = l.grading ? `${l.grading.company}${l.grading.grade}` : "raw";
    const since = new Date(Date.now() - 366 * DAY_MS).toISOString();
    const { data } = await sb.from("sales").select("price_cents, sold_at").eq("catalog_id", catalogId).eq("grading_key", gradingKey).gte("sold_at", since).order("sold_at").limit(500);
    h.sales = (data ?? []).map((r) => ({ t: Date.parse(r.sold_at), v: r.price_cents / 100 }));
  }
  return h;
}

function niceTicks(lo, hi, n = 4) {
  if (hi - lo < 1e-6) { lo *= 0.9; hi = hi * 1.1 || 1; }
  const raw = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(raw)), e = raw / mag;
  const step = (e >= 7.5 ? 10 : e >= 3.5 ? 5 : e >= 1.5 ? 2 : 1) * mag;
  const out = [];
  for (let v = Math.max(0, Math.floor(lo / step) * step); v <= Math.ceil(hi / step) * step + step * 1e-6; v += step) out.push(round2(v));
  return out;
}

/** Links to the public sources so buyers can check the price themselves. */
function priceSources(l, h) {
  const links = [];
  if (h?.productId) links.push([`https://www.tcgplayer.com/product/${h.productId}`, "TCGplayer"]);

function renderPriceChart(box, l, h, rangeDays, setRange) {
  const price = l.priceUsd, now = Date.now();

    box.innerHTML = `${header}<p class="small muted" style="margin:6px 0 0">${l.card.category === "pokemon" && !l.grading
      ? "Todavía no tenemos historial de precios para esta carta."
      : "Todavía no hay historial para esta carta. Para cartas deportivas y graduadas lo armamos con las ventas registradas en Panamá; cuando haya ventas, aparecerán aquí."}</p>${priceSources(l, h)}`;
    return;
  }
  const from = rangeDays === Infinity ? -Infinity : now - rangeDays * DAY_MS;
  const market = h.market.filter((p) => p.t >= from), cmk = h.cardmarket.filter((p) => p.t >= from), sales = h.sales.filter((p) => p.t >= from);
  // Texto del periodo elegido: "en el último año", "desde el 8 feb 2024"…
  // Si la serie empieza bastante después del inicio del periodo, se nombra su fecha real.
  const since = (pts) => (rangeDays === Infinity || pts[0].t - from > 14 * DAY_MS ? `desde el ${fmtDay(pts[0].t, true)}` : rangeDays === 365 ? "en el último año" : `en los últimos ${rangeDays} días`);
  const move = (pts) => { const r = pts.at(-1).v / pts[0].v - 1, p = Math.round(Math.abs(r) * 100); return p < 1 ? "se mantuvo estable" : `${r > 0 ? "subió" : "bajó"} ${p}% (de ${fmtEstimate(pts[0].v)} a ${fmtEstimate(pts.at(-1).v)})`; };

  // Headline: how this listing compares with the value today, and how the value moved in the selected period.
  const current = h.market.at(-1) ?? h.cardmarket.at(-1);
  let head = "";
  if (current) {
    const d = (price - current.v) / current.v, pct = Math.round(Math.abs(d) * 100);
    const rel = pct < 3 ? "en línea con el valor de mercado" : `${pct}% ${d > 0 ? "por encima" : "por debajo"} del valor de mercado`;
    const when = isoDay(new Date(current.t)) === isoDay(new Date()) ? "hoy" : `al ${fmtDay(current.t)}`;
    head = `<p style="margin:8px 0 0"><span class="display" style="font-size:24px;font-weight:700">${fmtEstimate(current.v)}</span> <span class="small muted">valor de mercado ${when} (${h.market.length ? "TCGplayer" : "Cardmarket"})</span></p>
      <p class="small" style="margin:4px 0 0">Este anuncio (${formatUsd(toCents(price))}) está <strong>${rel}</strong>.${market.length >= 2 ? ` En TCGplayer, ${since(market)} el valor ${move(market)}.` : ""}${cmk.length >= 2 ? ` En Europa (Cardmarket), ${since(cmk)} el promedio de ventas ${move(cmk)}.` : ""}</p>`;
  } else {
    const recent = h.sales.filter((p) => p.t >= now - 180 * DAY_MS).map((p) => p.v);
    const med = median(recent.length ? recent : h.sales.map((p) => p.v));
    const d = (price - med) / med, pct = Math.round(Math.abs(d) * 100);
    head = `<p style="margin:8px 0 0"><span class="display" style="font-size:24px;font-weight:700">${fmtEstimate(med)}</span> <span class="small muted">mediana de ventas en Panamá</span></p>
      <p class="small" style="margin:4px 0 0">Este anuncio (${formatUsd(toCents(price))}) está <strong>${pct < 3 ? "en línea con las ventas recientes" : `${pct}% ${d > 0 ? "por encima" : "por debajo"} de las ventas recientes`}</strong>.</p>`;
  }
  const notes = [];
  const weeklyTp = h.market.filter((p) => p.src !== "tcgdex" && p.src !== "supabase");
  if (weeklyTp.length) notes.push(`TCGplayer (EE.UU.): precio de mercado, un registro por semana desde el ${fmtDay(weeklyTp[0].t, true)}, de tcgcsv.com (copia pública de los precios de TCGplayer)${h.liveMarket ? "; el último punto es el precio de hoy según TCGdex" : ""}.`);
  else if (h.market.length) notes.push("TCGplayer (EE.UU.): precio de mercado de hoy según TCGdex. El historial semanal de esta carta empieza con la próxima actualización automática.");

  if (h.market.some((p) => p.carried) || h.cardmarket.some((p) => p.carried)) notes.push("Las semanas sin dato nuevo repiten el último valor conocido (tramo plano).");
  if (h.factor !== 1) notes.push(`Precios ajustados a condición ${l.condition} (×${h.factor}).`);
  if (h.sales.length) notes.push("Ventas en Panamá: ventas registradas en la plataforma.");
  const updated = h.updated ? `<p class="xs muted" style="margin:4px 0 0">Actualizado automáticamente cada semana · última actualización ${fmtDay(Date.parse(h.updated), true)}</p>` : "";
  const typeLabel = (p, base) => `${base}${p.carried ? " (sin dato nuevo: se repite el anterior)" : ""}`;

  box.innerHTML = `${header}${head}
    ${market.length || cmk.length || sales.length ? `<div class="pchart"></div>` : `<p class="notice soft small" style="margin:12px 0 0">No hay datos en este periodo. Prueba con uno más largo.</p>`}
    <div class="plegend">${h.market.length ? `<span><i class="k" style="background:${CHART_COLORS.market}"></i>TCGplayer (EE.UU.)</span>` : ""}${h.cardmarket.length ? `<span><i class="k" style="background:${CHART_COLORS.cardmarket}"></i>Cardmarket (Europa)</span>` : ""}${h.sales.length ? `<span><i class="k" style="width:8px;height:8px;border-radius:50%;background:${CHART_COLORS.sales}"></i>Ventas en Panamá</span>` : ""}<span><i class="k" style="height:0;border-top:2px dashed var(--ink)"></i>Este anuncio</span></div>
    <p class="xs muted" style="margin:8px 0 0">${notes.map(esc).join(" ")} Es una referencia, no una garantía.</p>
    ${updated}
    ${priceSources(l, h)}
    <details class="pdata"><summary>Ver datos en tabla</summary><div class="tbl"><table class="fees"><thead><tr><th>Fecha</th><th>Tipo</th><th>Precio</th></tr></thead><tbody>${
      [...market.map((p) => ({ ...p, k: typeLabel(p, "TCGplayer · precio de mercado") })), ...cmk.map((p) => ({ ...p, k: typeLabel(p, `Cardmarket · ${p.k}`) })), ...sales.map((p) => ({ ...p, k: "Venta en Panamá" }))].sort((a, b) => b.t - a.t)
        .map((p) => `<tr><td>${fmtDay(p.t, true)}</td><td>${esc(p.k)}</td><td>${formatUsd(toCents(p.v))}</td></tr>`).join("")}</tbody></table></div></details>`;
  box.querySelectorAll(".pranges button").forEach((b) => b.addEventListener("click", () => setRange(Number(b.dataset.d))));
  const wrap = box.querySelector(".pchart");
  if (!wrap) return;

  // Geometry
  const W = Math.max(260, Math.round(wrap.clientWidth)), H = 220, m = { l: 46, r: 10, t: 14, b: 26 };
  const pts = [...market, ...cmk, ...sales];
  let xMin = Math.min(...pts.map((p) => p.t));
  if (now - xMin < 7 * DAY_MS) xMin = now - 7 * DAY_MS;
  const xMax = now;
  const vals = [...pts.map((p) => p.v), price];
  const ticks = niceTicks(Math.min(...vals) * 0.94, Math.max(...vals) * 1.04);
  const yMin = ticks[0], yMax = ticks.at(-1);
  const X = (t) => m.l + ((t - xMin) / (xMax - xMin)) * (W - m.l - m.r);
  const Y = (v) => m.t + (1 - (v - yMin) / (yMax - yMin)) * (H - m.t - m.b);
  const xTicks = [0, 1 / 3, 2 / 3, 1].map((f) => xMin + f * (xMax - xMin));
  const spansYear = new Date(xMin).getFullYear() !== new Date(xMax).getFullYear();
  const line = market.map((p, i) => `${i ? "L" : "M"}${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join("");
  const last = market.at(-1);

  wrap.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" tabindex="0" role="img" aria-label="Gráfica del valor de mercado en TCGplayer y Cardmarket en el tiempo. Usa las flechas para recorrer los puntos.">
    ${ticks.map((v) => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text class="axis" x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end">${fmtAxis(v)}</text>`).join("")}
    ${xTicks.map((t, i) => `<text class="axis" x="${X(t)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === 3 ? "end" : "middle"}">${i === 3 ? "Hoy" : fmtDay(t, spansYear)}</text>`).join("")}
    <line x1="${m.l}" x2="${W - m.r}" y1="${Y(price)}" y2="${Y(price)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 4" opacity=".75"/>
    <text class="axis" x="${W - m.r}" y="${Y(price) - 6}" text-anchor="end" style="fill:var(--ink)">Este anuncio ${formatUsd(toCents(price))}</text>
    ${market.length > 1 ? `<path d="${line}" fill="none" stroke="${CHART_COLORS.market}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : ""}
    ${last ? `<circle cx="${X(last.t)}" cy="${Y(last.v)}" r="4.5" fill="${CHART_COLORS.market}" stroke="var(--surface)" stroke-width="2"/>` : ""}
    ${cmk.length > 1 ? `<path d="${cmk.map((p, i) => `${i ? "L" : "M"}${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join("")}" fill="none" stroke="${CHART_COLORS.cardmarket}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : ""}
    ${(cmk.length > 12 ? cmk.slice(-1) : cmk).map((p) => `<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="4" fill="${CHART_COLORS.cardmarket}" stroke="var(--surface)" stroke-width="2"/>`).join("")}
    ${sales.map((p) => `<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="4.5" fill="${CHART_COLORS.sales}" stroke="var(--surface)" stroke-width="2"/>`).join("")}
    <g class="cross" style="display:none"><line y1="${m.t}" y2="${H - m.b}" stroke="var(--ink-2)" stroke-width="1"/><circle r="5.5" fill="none" stroke="var(--ink)" stroke-width="2"/></g>
  </svg><div class="ptip" role="status"></div>`;

  // Hover / keyboard layer: snap to the nearest date that has data.
  const byDay = new Map();
  for (const p of market) byDay.set(isoDay(new Date(p.t)), { t: p.t, market: p.v, marketCarried: p.carried, cm: null, sales: [] });
  for (const p of cmk) { const k = isoDay(new Date(p.t)); const s = byDay.get(k) ?? { t: p.t, market: null, cm: null, sales: [] }; s.cm = p; byDay.set(k, s); }
  for (const p of sales) { const k = isoDay(new Date(p.t)); const s = byDay.get(k) ?? { t: p.t, market: null, cm: null, sales: [] }; s.sales.push(p.v); byDay.set(k, s); }
  const stops = [...byDay.values()].sort((a, b) => a.t - b.t);
  const svg = wrap.querySelector("svg"), tip = wrap.querySelector(".ptip"), cross = svg.querySelector(".cross");
  let idx = stops.length - 1;
  const row = (color, value, label, round) => {
    const r = document.createElement("div"); r.className = "r";
    const k = document.createElement("i"); k.className = "k"; k.style.background = color; if (round) Object.assign(k.style, { width: "8px", height: "8px", borderRadius: "50%" });
    const b = document.createElement("b"); b.textContent = value;
    r.append(k, b, document.createTextNode(label)); return r;
  };
  const show = (i) => {
    idx = Math.max(0, Math.min(stops.length - 1, i));
    const s = stops[idx], x = X(s.t), y = Y(s.market ?? s.cm?.v ?? s.sales[0]);
    cross.style.display = "";
    cross.querySelector("line").setAttribute("x1", x); cross.querySelector("line").setAttribute("x2", x);
    cross.querySelector("circle").setAttribute("cx", x); cross.querySelector("circle").setAttribute("cy", y);
    const d = document.createElement("div"); d.className = "d"; d.textContent = fmtDay(s.t, true);
    tip.replaceChildren(d);
    const again = " (sin dato nuevo, se repite)";
    if (s.market != null) tip.append(row(CHART_COLORS.market, formatUsd(toCents(s.market)), `TCGplayer${s.marketCarried ? again : ""}`));
    if (s.cm) tip.append(row(CHART_COLORS.cardmarket, formatUsd(toCents(s.cm.v)), `Cardmarket · ${s.cm.k}${s.cm.carried ? again : ""}`));
    for (const v of s.sales) tip.append(row(CHART_COLORS.sales, formatUsd(toCents(v)), "venta en Panamá", true));
    const ref = s.market ?? s.cm?.v ?? s.sales[0], diff = Math.round(((price - ref) / ref) * 100);
    tip.append(row("var(--ink)", formatUsd(toCents(price)), `este anuncio (${diff > 0 ? "+" : ""}${diff}%)`));
    tip.style.display = "block";
    const tw = tip.offsetWidth;
    tip.style.left = `${x > W / 2 ? Math.max(0, x - tw - 12) : Math.min(W - tw, x + 12)}px`;
  };
  const hide = () => { cross.style.display = "none"; tip.style.display = "none"; };
  svg.addEventListener("pointermove", (e) => {
    const r = svg.getBoundingClientRect(), px = ((e.clientX - r.left) / r.width) * W;
    let best = 0;
    stops.forEach((s, i) => { if (Math.abs(X(s.t) - px) < Math.abs(X(stops[best].t) - px)) best = i; });
    show(best);
  });
  svg.addEventListener("pointerleave", () => { if (document.activeElement !== svg) hide(); });
  svg.addEventListener("focus", () => show(idx));
  svg.addEventListener("blur", hide);
  svg.addEventListener("keydown", (e) => {
    const step = { ArrowLeft: -1, ArrowRight: 1 }[e.key];
    if (step) { e.preventDefault(); show(idx + step); }
    else if (e.key === "Home" || e.key === "End") { e.preventDefault(); show(e.key === "Home" ? 0 : stops.length - 1); }
  });
}

async function loadPriceChart(l) {
  const box = $("#priceChart");
  if (!box) return;
  const h = await fetchPriceHistory(l).catch((e) => { console.error(e); return { market: [], cardmarket: [], sales: [], factor: 1 }; });
  if (!box.isConnected) return;
  // Con historial semanal largo se abre en "1 año"; si no, en 90 días.
  let range = h.weekly ? 365 : 90, width = box.clientWidth;
  const draw = () => renderPriceChart(box, l, h, range, (r) => { range = r; draw(); });
  draw();
  const ro = new ResizeObserver(() => {
    if (!box.isConnected) return ro.disconnect();
    if (box.clientWidth !== width) { width = box.clientWidth; draw(); }
  });
  ro.observe(box);
}

async function compressImage(file) {
  if (!file.type.startsWith("image/")) return file;
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); } catch { return file; }
  const s = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height); bmp.close?.();
  const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85));
  if (!blob) return file;
  if (["image/jpeg", "image/png", "image/webp"].includes(file.type) && blob.size >= file.size) return file;
  return new File([blob], "foto.jpg", { type: "image/jpeg" });
}
async function catalogSearch(name, number) {
  const clean = (s) => s.replace(/["\\]/g, "").trim();
  const n = number?.split("/")[0].replace(/^#/, "").trim();
  const queries = n ? [`name:"${clean(name)}" number:"${clean(n)}"`, `name:"${clean(name)}"`] : [`name:"${clean(name)}"`];
  for (const q of queries) {
    for (let attempt = 0; attempt < 3; attempt++) {
      if (attempt) await new Promise((r) => setTimeout(r, 600 * 2 ** (attempt - 1)));
      try {
        const res = await fetch(`${CONFIG.CATALOG_API}/cards?q=${encodeURIComponent(q)}&pageSize=9&orderBy=-set.releaseDate&select=id,name,number,rarity,set,images,tcgplayer`);
        if (res.ok) { const d = (await res.json()).data; if (d.length) return d; break; }
        if (res.status < 500) break;
      } catch { /* network hiccup, retry */ }
    }
  }
  return [];
}

  renderGrade();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("#sellMsg"), btn = $("#publishBtn");
    const fail = (t) => { msg.innerHTML = `<p class="notice bad" style="margin:0">${esc(t)}</p>`; btn.disabled = false; btn.textContent = "Publicar gratis"; };
    const price = Number(val("price")), year = val("year") ? Number(val("year")) : null, grade = st.graded ? Number(val("grade")) : null;
    if (!st.files.length) return fail("Agrega al menos una foto real de la carta.");
    if (val("subject").length < 2) return fail("Falta el nombre del Pokémon o jugador.");
    if (!val("setName")) return fail("Falta el set o producto.");
    if (year != null && !(Number.isInteger(year) && year >= 1990 && year <= 2030)) return fail("Año no válido.");
    if (st.graded && !(grade >= 1 && grade <= 10)) return fail("La nota de graduación debe estar entre 1 y 10.");
    if (!(price > 0 && price <= 100000)) return fail("Escribe un precio válido.");
    if (val("title").length < 5) return fail("El título es muy corto.");
    for (const f of st.files) if (f.size > 3 * 1024 * 1024) return fail("Una de las fotos es muy pesada (máx. 3 MB).");

    btn.disabled = true; btn.textContent = "Publicando…"; msg.innerHTML = "";
    const uid = session.user.id, id = crypto.randomUUID(), loc = FLAT_LOCATIONS[Number(val("location"))];
    const catalogId = val("category") === "pokemon" && st.picked ? st.picked.id : null;
    const gradingKey = st.graded ? `${val("company")}${grade}` : "raw";
    let comps = [];
    if (catalogId) {
      const { data } = await sb.from("sales").select("price_cents, sold_at").eq("catalog_id", catalogId).eq("grading_key", gradingKey).order("sold_at", { ascending: false }).limit(50);
      comps = (data ?? []).map((s) => ({ priceUsd: s.price_cents / 100, soldAt: s.sold_at }));
    }
    const estimate = catalogId ? estimatePrice({ reference: st.graded ? null : pickReferencePrice(st.picked, val("variant")), localComps: comps, condition: st.graded ? null : val("condition"), grading: st.graded ? { company: val("company"), grade } : null }) : null;

    const { error } = await sb.from("listings").insert({
      id, seller_id: uid, category: val("category"), title: val("title"), description: val("description") || null,
      subject: val("subject"), set_name: val("setName"), year, number: val("number") || null, variant: val("variant") || null,
      condition: st.graded ? null : val("condition"), grading_company: st.graded ? val("company") : null, grade,
      price_cents: Math.round(price * 100), province: loc.province, district: loc.district, neighborhood: loc.neighborhood,
      catalog_id: catalogId, estimate,
    });
    if (error) { console.error(error); return fail("No pudimos guardar el anuncio. Intenta de nuevo."); }
    const paths = [];
    for (const [i, f] of st.files.entries()) {
      const ext = { "image/png": "png", "image/webp": "webp" }[f.type] ?? "jpg";
      const path = `${uid}/${id}/${i}.${ext}`;
      const up = await sb.storage.from("listing-photos").upload(path, f, { contentType: f.type || "image/jpeg" });
      if (up.error) {
        console.error(up.error);
        if (paths.length) await sb.storage.from("listing-photos").remove(paths);
        await sb.from("listings").delete().eq("id", id);
        return fail("No pudimos subir las fotos. Intenta de nuevo.");
      }
      paths.push(path);
    }
    const pr = await sb.from("listing_photos").insert(paths.map((storage_path, position) => ({ listing_id: id, storage_path, position })));
    if (pr.error) console.error(pr.error);
    go(`/carta/${id}`);
  });
}

// ============================================================= boot
document.querySelectorAll(".brand-name, #brand").forEach((n) => (n.textContent = CONFIG.APP_NAME));
$("#topSearch").addEventListener("submit", (e) => { e.preventDefault(); const q = $("#qTop").value.trim(); go(q ? `/?q=${encodeURIComponent(q)}` : "/"); });
window.addEventListener("hashchange", route);
async function loadProfileName() {
  profileName = null;
  if (!session) return;
  const { data } = await sb.from("profiles").select("display_name").eq("id", session.user.id).maybeSingle();
  profileName = data?.display_name ?? null;
  renderNav();
}
(async () => {
  if (sb) {
    session = (await sb.auth.getSession()).data.session;
    sb.auth.onAuthStateChange((_evt, s) => {
      const changed = (s?.user.id ?? null) !== (session?.user.id ?? null);
      session = s;
      if (changed) { loadProfileName(); route(); }
    });
    loadProfileName();
  }
  route();
})();
</script>
