/* ==========================================================================

:root {

}

  let ref = null;

  if (reference && refValue > 0 && !grading) {

/** Plays the element's closing animation (data-state="closed"), then runs done once. */
function animateOut(el, done) {
  el.dataset.state = "closed";
  let finished = false;
  const end = () => {
    if (finished) return;
    finished = true;
    el.removeEventListener("animationend", onEnd);
    done?.();
  };
  const onEnd = (e) => { if (e.target === el) end(); };
  el.addEventListener("animationend", onEnd);
  setTimeout(end, 700); // safety net if the animation never runs
}

// Open overlays, topmost last. Escape closes the top one; navigation closes all.
const layers = [];
function pushLayer(close) {
  const layer = { close };
  layers.push(layer);
  return () => { const i = layers.indexOf(layer); if (i >= 0) layers.splice(i, 1); };
}
function closeLayers() { for (const l of [...layers].reverse()) l.close(true); }
let scrollLocks = 0;
function lockScroll(on) {
  scrollLocks = Math.max(0, scrollLocks + (on ? 1 : -1));

}
/** Keeps Tab focus inside a modal element. */
function trapFocus(root, e) {
  if (e.key !== "Tab") return;
  const f = [...root.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), select, textarea, [tabindex]:not([tabindex="-1"])')].filter((n) => n.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f.at(-1);
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

function toast(message, { type = "success", description = "", duration = 4000 } = {}) {

  el.innerHTML = `${ic({ success: "checkCircle", error: "alert", info: "info" }[type] ?? "info")}<div><p class="t"></p>${description ? '<p class="d"></p>' : ""}</div>`;
  el.querySelector(".t").textContent = message;
  if (description) el.querySelector(".d").textContent = description;
  box.append(el);
  while (box.children.length > 3) box.firstElementChild.remove();
  void el.offsetHeight;
  el.dataset.mounted = "true";
  let timer = 0, left = duration, since = Date.now();
  const remove = () => { el.dataset.removed = "true"; setTimeout(() => el.remove(), 400); };
  const arm = () => { since = Date.now(); timer = setTimeout(remove, Math.max(0, left)); };
  el.addEventListener("pointerenter", () => { clearTimeout(timer); left -= Date.now() - since; });
  el.addEventListener("pointerleave", arm);
  arm();
}

// ------------------------------------------------------------- top progress bar (BProgress)
const progress = (() => {
  let n = null, trickle = 0, delay = 0, token = 0;
  const root = () => $("#bprogress");
  const set = (v) => { n = Math.min(Math.max(v, 0.08), 1); root().querySelector(".bar").style.transform = `translate3d(${(n - 1) * 100}%,0,0)`; };
  const step = () => { if (n != null && n < 1) set(n + (n < 0.2 ? 0.1 : n < 0.5 ? 0.04 : n < 0.8 ? 0.02 : n < 0.99 ? 0.005 : 0)); };
  return {
    start() {
      const t = ++token;
      clearTimeout(delay);
      delay = setTimeout(() => {
        if (t !== token) return;
        const r = root();
        if (n == null || n >= 1) { r.querySelector(".bar").style.transition = "none"; set(0); void r.offsetWidth; r.querySelector(".bar").style.transition = ""; }
        r.style.opacity = "1"; r.classList.add("on");
        clearInterval(trickle); trickle = setInterval(step, 200);
      }, 100);
      return t;
    },
    done(t) {
      if (t !== token) return;
      clearTimeout(delay); clearInterval(trickle);
      if (n == null) return; // finished before the bar was shown
      set(1);
      setTimeout(() => {
        if (t !== token) return;
        root().style.opacity = "0";
        setTimeout(() => { if (t === token) { root().classList.remove("on"); n = null; } }, 200);
      }, 200);
    },
  };
})();

// ------------------------------------------------------------- dropdown menu (Radix popover motion)
/** items: [{ label, icon, href | onSelect, checked }] | "sep" | { heading } */
function openMenu(trigger, items, { align = "end" } = {}) {
  if (trigger._closeMenu) return trigger._closeMenu();
  const pop = document.createElement("div");
  pop.className = "pop";
  pop.setAttribute("role", "menu");
  pop.innerHTML = items.map((it) => {
    if (it === "sep") return '<div class="sep" role="separator"></div>';
    if (it.heading) return `<div class="label">${esc(it.heading)}</div>`;
    const attrs = `class="item" role="${it.checked == null ? "menuitem" : "menuitemradio"}"${it.checked == null ? "" : ` aria-checked="${it.checked}"`}`;
    const inner = `${it.icon ? ic(it.icon) : ""}<span>${esc(it.label)}</span>${it.checked == null ? "" : ic("check", "ck")}`;
    return it.href ? `<a ${attrs} href="${esc(it.href)}">${inner}</a>` : `<button type="button" ${attrs}>${inner}</button>`;
  }).join("");
  pop.dataset.state = "open";
  document.body.append(pop);
  const place = () => {
    const r = trigger.getBoundingClientRect(), w = pop.offsetWidth;
    pop.style.top = `${Math.round(r.bottom + 6)}px`;
    pop.style.left = `${Math.round(Math.max(8, Math.min(align === "end" ? r.right - w : r.left, innerWidth - w - 8)))}px`;
    pop.style.transformOrigin = `${align === "end" ? "right" : "left"} top`;
  };
  place();
  const entries = () => [...pop.querySelectorAll(".item")];
  const clickable = items.filter((it) => it !== "sep" && !it.heading);
  let removeLayer = () => {};
  const close = (instant) => {
    if (!trigger._closeMenu) return;
    trigger._closeMenu = null;
    removeLayer();
    document.removeEventListener("pointerdown", outside, true);
    removeEventListener("resize", onResize);
    removeEventListener("scroll", place, true);
    trigger.setAttribute("aria-expanded", "false");
    const hadFocus = pop.contains(document.activeElement);
    if (instant === true) pop.remove(); else animateOut(pop, () => pop.remove());
    if (hadFocus && instant !== true) trigger.focus();
  };
  const outside = (e) => { if (!pop.contains(e.target) && !trigger.contains(e.target)) close(); };
  const onResize = () => close(true);
  trigger._closeMenu = close;
  trigger.setAttribute("aria-expanded", "true");
  removeLayer = pushLayer(close);
  document.addEventListener("pointerdown", outside, true);
  addEventListener("resize", onResize);
  addEventListener("scroll", place, true);
  entries().forEach((node, i) => node.addEventListener("click", () => { const it = clickable[i]; close(); it.onSelect?.(); }));
  pop.addEventListener("keydown", (e) => {
    const list = entries(), at = list.indexOf(document.activeElement);
    const move = { ArrowDown: at + 1, ArrowUp: at - 1, Home: 0, End: list.length - 1 }[e.key];
    if (move != null) { e.preventDefault(); list[(move + list.length) % list.length]?.focus(); }
    else if (e.key === "Tab") close(true);
  });
  (entries().find((n) => n.getAttribute("aria-checked") === "true") ?? entries()[0])?.focus({ preventScroll: true });
}

function openFilters() {
  const panel = $("#fpanel");
  if (!panel || panel.dataset.state === "open" || matchMedia("(min-width: 1024px)").matches) return;
  const trigger = $("#filtersBtn");

    if (instant === true) { ov.remove(); panel.dataset.state = "closed"; reset(); return; }
    animateOut(ov, () => ov.remove());

  };

/** Vaul-style drag on the drawer handle: follow the finger, then close or snap back. */
function enableDrawerDrag(panel) {
  const head = panel.querySelector(".drawer-head");
  if (!head) return;
  let y0 = 0, t0 = 0, dy = 0, dragging = false;
  head.addEventListener("pointerdown", (e) => {
    if (panel.dataset.state !== "open" || e.target.closest("button")) return;
    dragging = true; y0 = e.clientY; t0 = performance.now(); dy = 0;
    try { head.setPointerCapture(e.pointerId); } catch { /* synthetic pointer */ }
    panel.style.animation = "none";
    panel.style.transition = "none";
  });
  head.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    dy = Math.max(0, e.clientY - y0);
    panel.style.transform = `translate3d(0, ${dy}px, 0)`;
  });
  const release = () => {
    if (!dragging) return;
    dragging = false;
    const velocity = dy / Math.max(1, performance.now() - t0);
    if (dy > panel.offsetHeight * 0.25 || velocity > 0.4) { panel._close?.(); return; }
    // Snap back. The inline "animation: none" stays so the open animation doesn't replay.
    panel.style.transition = "transform .5s cubic-bezier(.32,.72,0,1)";
    panel.style.transform = "translate3d(0,0,0)";
  };
  head.addEventListener("pointerup", release);
  head.addEventListener("pointercancel", release);
}

function modal(className, html, { label, onClose } = {}) {

    if (closed) return;

function openSearch() {

  const { el, close } = modal("cmd", `<form class="cmd-in" role="search">${ic("search")}<input id="cmdQ" type="search" placeholder="Busca Charizard, Wembanyama, Prizm…" autocomplete="off" spellcheck="false" aria-label="Buscar cartas" aria-controls="cmdList" aria-autocomplete="list" role="combobox" aria-expanded="true"><kbd>Esc</kbd></form>

  const render = (q, found) => paint(found.length

    : `<p class="cmd-empty">No encontramos cartas para “${esc(q)}”.</p>${all(q)}`);
  const search = () => {
    const q = input.value.trim(), mine = ++seq;
    if (!q) return quick();

    const local = [...(CONFIG.SHOW_DEMO_LISTINGS ? DEMO : []), ...listingCache.values()].filter((l) => matchesFilters(l, f));
    render(q, local);
    if (!sb || !session) return;

      const real = await fetchRealListings(f).catch(() => []);
      if (mine !== seq || !el.isConnected) return;
      rememberListings(real);
      const seen = new Set(local.map((l) => l.id));

  input.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); setActive(active + (e.key === "ArrowDown" ? 1 : -1)); }

    e.preventDefault();
    const q = input.value.trim(), target = options[active]?.getAttribute("href") ?? (q ? `#/?q=${encodeURIComponent(q)}` : "#/");

  });
  list.addEventListener("click", (e) => { const a = e.target.closest("a.cmd-item"); if (a && a.getAttribute("href") === location.hash) { e.preventDefault(); close(); } });
  quick();
  input.focus();
}

// Migration 0006 adds listing_photos.kind ("card" | "verification"). Until it is applied the

const missingKind = (e) => photoKinds && e?.code === "42703" && /kind/.test(e?.message ?? "");
const photoUrl = (path) => `${CONFIG.SUPABASE_URL}/storage/v1/object/public/listing-photos/${path.split("/").map(encodeURIComponent).join("/")}`;

async function withProfiles(rows) {
  if (!rows.length) return [];
  const ids = [...new Set(rows.map((r) => r.seller_id))];
  let { data, error } = await sb.from("public_profiles").select("id, display_name, is_shop, verified, avatar_path, shop_description, shop_photo_path").in("id", ids);

const searchTokens = (q) => String(q ?? "").replace(/[,()%*\\"'.:]/g, " ").split(/\s+/).filter((t) => t.length >= 2).slice(0, 5);

// "Tienda verificada" = shop flag + verified by Holo staff. Everyone else is a "particular".
const isVerifiedShop = (seller) => Boolean(seller?.isShop && seller?.verified);
async function verifiedShopIds() {
  const { data, error } = await sb.from("public_profiles").select("id").eq("is_shop", true).eq("verified", true);
  if (error) { console.error(error); return []; }
  return (data ?? []).map((p) => p.id);

async function fetchRealListings(f) {
  if (!sb) return [];
  let q = sb.from("listings").select(listingCols()).eq("status", "active").limit(60);
  if (f.seller) {
    const shops = await verifiedShopIds();
    if (f.seller === "tiendas") {
      if (!shops.length) return [];
      q = q.in("seller_id", shops);
    } else if (shops.length) {
      q = q.not("seller_id", "in", `(${shops.join(",")})`);
    }
  }
  if (f.category) q = q.eq("category", f.category);
  if (f.graded === "graded") q = q.not("grading_company", "is", null);
  if (f.graded === "raw") q = q.is("grading_company", null);
  if (f.province) q = q.eq("province", f.province);
  if (f.minPrice != null) q = q.gte("price_cents", Math.round(f.minPrice * 100));
  if (f.maxPrice != null) q = q.lte("price_cents", Math.round(f.maxPrice * 100));
  for (const t of searchTokens(f.q)) q = q.or(["title", "subject", "set_name", "neighborhood", "district", "province"].map((c) => `${c}.ilike.%${t}%`).join(","));
  q = q.order("created_at", { ascending: false });
  const { data, error } = await q;
  if (missingKind(error)) { photoKinds = false; return fetchRealListings(f); }
  if (error) { console.error(error); return []; }
  return withProfiles(data ?? []);
}
async function fetchSellerProfile(id) {
  let { data, error } = await sb.from("public_profiles").select("id, display_name, is_shop, verified, avatar_path, shop_description, shop_photo_path, created_at").eq("id", id).maybeSingle();
  if (error) ({ data } = await sb.from("public_profiles").select("id, display_name, is_shop, verified, created_at").eq("id", id).maybeSingle());
  return data ?? null;
}
async function fetchSellerListings(id, prof) {
  const { data, error } = await sb.from("listings").select(listingCols()).eq("seller_id", id).eq("status", "active").order("created_at", { ascending: false }).limit(100);
  if (missingKind(error)) { photoKinds = false; return fetchSellerListings(id, prof); }
  if (error) { console.error(error); return []; }
  return (data ?? []).map((r) => rowToListing(r, prof));
}
async function fetchRealListing(id) {
  if (!sb) return null;
  const { data, error } = await sb.from("listings").select(listingCols()).eq("id", id).maybeSingle();
  if (missingKind(error)) { photoKinds = false; return fetchRealListing(id); }
  if (error || !data) return null;
  return (await withProfiles([data]))[0];
}

function matchesFilters(l, f) {
  if (f.seller === "tiendas" && !isVerifiedShop(l.seller)) return false;
  if (f.seller === "particulares" && isVerifiedShop(l.seller)) return false;
  if (f.category && l.card.category !== f.category) return false;
  if (f.graded === "graded" && !l.grading) return false;
  if (f.graded === "raw" && l.grading) return false;
  if (f.province && l.location.province !== f.province) return false;
  if (f.minPrice != null && l.priceUsd < f.minPrice) return false;
  if (f.maxPrice != null && l.priceUsd > f.maxPrice) return false;
  if (f.q) {
    const hay = normalize([l.title, l.card.subject, l.card.setName, l.card.variant, l.card.number, l.location.neighborhood, l.location.district, l.location.province].join(" "));
    if (!normalize(f.q).split(/\s+/).filter(Boolean).every((t) => hay.includes(t))) return false;
  }
  return true;
}
function sortListings(list, sort) {
  const c = [...list];
  if (sort === "precio-asc") c.sort((a, b) => a.priceUsd - b.priceUsd);
  else if (sort === "precio-desc") c.sort((a, b) => b.priceUsd - a.priceUsd);
  else c.sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  return c;
}

function parseHash() {
  const raw = location.hash.replace(/^#/, "") || "/";
  const [path, qs] = raw.split("?");
  return { path, params: new URLSearchParams(qs ?? "") };
}
function go(path) { location.hash = path; }
function filtersFrom(params) {
  const num = (k) => { const v = params.get(k); const n = v ? Number(v) : NaN; return Number.isFinite(n) && n >= 0 ? n : undefined; };
  const tipo = params.get("tipo"), orden = params.get("orden"), vendedor = params.get("vendedor");
  return {
    seller: vendedor === "tiendas" || vendedor === "particulares" ? vendedor : undefined,
    q: params.get("q")?.trim() || undefined, category: params.get("cat") || undefined,
    graded: tipo === "raw" || tipo === "graded" ? tipo : undefined, province: params.get("provincia") || undefined,
    minPrice: num("min"), maxPrice: num("max"), sort: orden === "precio-asc" || orden === "precio-desc" ? orden : "recientes",
  };
}
function hrefWith(f, patch) {
  const base = { vendedor: f.seller, q: f.q, cat: f.category, tipo: f.graded, provincia: f.province, min: f.minPrice, max: f.maxPrice, orden: f.sort === "recientes" ? undefined : f.sort };
  const p = new URLSearchParams();
  for (const [k, v] of Object.entries({ ...base, ...patch })) if (v != null && v !== "") p.set(k, v);
  const s = p.toString();
  return s ? `#/?${s}` : "#/";
}

const safeDecode = (s) => { try { return decodeURIComponent(s); } catch { return s; } };
async function route() {
  const { path, params } = parseHash();
  closeLayers();
  window.scrollTo(0, 0);
  renderNav();
  const app = $("#app");
  const gated = !!sb && !session;
  document.body.classList.toggle("gate", gated);
  app.classList.remove("view-in");
  void app.offsetWidth;
  app.classList.add("view-in");
  const busy = progress.start();
  try {
    if (gated) return viewAuth(app, path === "/entrar" ? params.get("next") || "/" : location.hash.replace(/^#/, "") || "/");
    if (path === "/" || path === "") return await viewHome(app, params);
    if (path.startsWith("/carta/")) return await viewDetail(app, safeDecode(path.slice(7)));
    if (path.startsWith("/vendedor/")) return await viewSeller(app, safeDecode(path.slice(10)));
    if (path === "/protegida") return viewProtected(app);
    if (path === "/entrar") return viewAuth(app, params.get("next") || "/");
    if (path === "/vender") return viewSell(app);
    // Account and staff pages render into a padded column.
    if (path === "/cuenta" || path === "/admin") {
      app.innerHTML = `<div class="wrap"></div>`;
      return path === "/cuenta" ? await viewAccount(app.firstElementChild) : await viewAdmin(app.firstElementChild, params);
    }
    setTitle("Página no encontrada");
    app.innerHTML = `<div class="wrap"><div class="empty-state" style="margin-top:48px"><span class="ico">${ic("search")}</span><p style="font-weight:600">Página no encontrada.</p><p class="small muted" style="margin:4px 0 16px">El enlace puede estar roto o la página ya no existe.</p><a class="btn primary" href="#/">Volver al inicio</a></div></div>`;
  } catch (e) {
    console.error(e);
    app.innerHTML = `<div class="wrap"><p class="notice bad" style="margin-top:24px">Algo salió mal. Recarga la página.</p></div>`;
  } finally {
    progress.done(busy);
  }
}

/** Price vs. the estimate's middle value, Collectr-style: arrow + amount + percent. */
function marketDelta(l) {
  const est = l.estimate;
  if (!(est?.mid > 0)) return "";
  const diff = l.priceUsd - est.mid, pct = Math.abs(diff / est.mid) * 100;
  const tone = { "buen-precio": "good", "en-rango": "neutral", alto: "warn" }[priceVerdict(l.priceUsd, est)] ?? "neutral";
  if (pct < 0.5) return `<p class="delta ${tone}"><span>En el valor estimado</span></p>`;
  return `<p class="delta ${tone}" title="Comparado con el valor estimado de ${esc(fmtEstimate(est.mid))}">${diff < 0 ? TRI.down : TRI.up}<span>${diff < 0 ? "−" : "+"}${fmtEstimate(Math.abs(diff))} (${fmtPct(pct)}%)</span><span class="vs">vs. estimado</span></p>`;
}
function tile(l, i = 0) {

const skeletonGrid = (n) => `<ul class="grid" aria-hidden="true">${Array.from({ length: n }, () => `<li><div class="pcard sk-card"><div class="sk card-ratio"></div><div class="sk" style="height:16px;width:85%;margin-top:12px"></div><div class="sk" style="height:12px;width:55%;margin-top:8px"></div><div class="sk" style="height:20px;width:40%;margin-top:18px"></div></div></li>`).join("")}</ul><p class="sr-only" role="status">Cargando cartas…</p>`;
function estimatePanel(est, price) {
  if (!est) return ""; // the market value panel researches the price for these cards
  const span = est.high - est.low, pad = span * 0.35 || est.mid * 0.2, min = Math.max(0, est.low - pad), max = est.high + pad;
  const at = (v) => Math.min(100, Math.max(0, ((v - min) / (max - min)) * 100));
  const pct = (v) => `${at(v)}%`;
  const conf = { alta: "Confianza alta", media: "Confianza media", baja: "Confianza baja" }[est.confidence];
  // Keep the "Este anuncio" label inside the panel when the price sits near either end.
  const lblShift = at(price) < 14 ? "translateX(-4px)" : at(price) > 86 ? "translateX(calc(-100% + 4px))" : "translateX(-50%)";
  return `<section class="panel">
    <div class="phead"><h2 class="ptitle">${ic("tag")}Precio estimado</h2><span class="conf conf-${esc(est.confidence)}">${conf}</span></div>
    <p class="est-range">${fmtEstimate(est.low)} – ${fmtEstimate(est.high)}</p>
    <p class="sub">Valor medio ${fmtEstimate(est.mid)}</p>
    ${price != null ? `<div class="range" aria-hidden="true"><div class="fill" style="left:${pct(est.low)};right:calc(100% - ${pct(est.high)})"></div><div class="lbl" style="left:${pct(price)};transform:${lblShift}">Este anuncio</div><div class="mark" style="left:${pct(price)}"></div></div>` : ""}
    <ul class="basis">${est.basis.map((b) => `<li>${ic("check")}<span>${esc(b)}</span></li>`).join("")}</ul>
    <p class="xs muted" style="margin-top:12px">Es una referencia, no una garantía ni una tasación.</p></section>`;
}

// ============================================================= price history
// Valor en el tiempo. La base es el historial semanal incrustado en este mismo
// archivo (<script id="precios-data">), que un GitHub Action actualiza cada lunes
// con scripts/actualizar-precios.mjs: TCGplayer vía tcgcsv.com (desde feb 2024) y
// la guía de precios oficial de Cardmarket. Encima va el precio de hoy de TCGdex
// y, si existen, las ventas registradas en Panamá. La tabla price_snapshots de
// Supabase (supabase/price_snapshots.sql) es opcional (CONFIG.PRICE_SNAPSHOTS).
const CHART_COLORS = { market: "#ffffff", cardmarket: "#60a5fa", sales: "#f5a524", web: "#94a3b8" };
const DAY_MS = 86400000;
const CHART_RANGES = [["1M", 30, "30 días"], ["3M", 90, "90 días"], ["1A", 365, "1 año"], ["Todo", Infinity, "Todo el historial"]];
const isoDay = (d) => d.toISOString().slice(0, 10);
const noonUtc = (day) => Date.parse(`${day}T12:00:00Z`);
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
const fmtDay = (t, year) => new Intl.DateTimeFormat("es-PA", year ? { day: "numeric", month: "short", year: "numeric" } : { day: "numeric", month: "short" }).format(t);
const fmtAxis = (v) => (v >= 1000 ? `$${+(v / 1000).toFixed(1)}k` : `$${+v.toFixed(v < 10 ? 2 : 0)}`);
const median = (xs) => { const a = [...xs].sort((x, y) => x - y); return a.length ? quantile(a, 0.5) : null; };

let preciosData = null;
/** Historial semanal incrustado (vacío si el bloque falta o está dañado). */
function storedPrices() {
  if (!preciosData) {
    try { preciosData = JSON.parse($("#precios-data")?.textContent || "{}"); } catch { preciosData = {}; }
    preciosData.cartas ??= {};
  }
  return preciosData;
}

const TCGDEX_API = "https://api.tcgdex.net/v2/en";
/** pokemontcg.io ids (sv3pt5-199, swsh12pt5-1) → TCGdex ids (sv03.5-199, swsh12.5-1). */
function tcgdexId(id) {
  const i = id.lastIndexOf("-"), set = id.slice(0, i), m = set.match(/^([a-z]+)(\d+)(pt5)?$/);
  return `${m ? `${m[1]}${m[1] === "sv" ? m[2].padStart(2, "0") : m[2]}${m[3] ? ".5" : ""}` : set}-${id.slice(i + 1)}`;
}
/** TCGdex ids (sv03.5-006) → pokemontcg.io ids (sv3pt5-6), the format stored in listings.catalog_id. */
function ptcgId(dexId) {
  const i = dexId.lastIndexOf("-"), set = dexId.slice(0, i), num = dexId.slice(i + 1);
  return `${set.replace(/^([a-z]+)0+(?=\d)/, "$1").replace(/\.5$/, "pt5")}-${/^\d+$/.test(num) ? String(Number(num)) : num}`;
}
const dexCache = new Map();
/** GET on the TCGdex API, cached per page load (failures are not cached). */
function dexGet(path) {
  if (!dexCache.has(path)) {
    dexCache.set(path, withTimeout(fetch(`${TCGDEX_API}${path}`), 10000).then((r) => (r.ok ? r.json() : null))
      .catch(() => { dexCache.delete(path); return null; }));
  }
  return dexCache.get(path);
}
/** TCGdex card for a listing. TCGdex pads numbers (sv03.5-006) and pokemontcg.io does not (sv3pt5-6). */
async function fetchDexCard(card) {
  const ids = [card.dexId, card.catalogId && tcgdexId(card.catalogId)].filter(Boolean);
  const m = ids.at(-1)?.match(/^(.*-)(\d{1,2})$/);
  if (m) ids.push(`${m[1]}${m[2].padStart(3, "0")}`);
  for (const id of new Set(ids)) { const d = await dexGet(`/cards/${encodeURIComponent(id)}`); if (d) return d; }
  return null;
}
let eurUsdPromise = null;
/** EUR→USD from the European Central Bank reference rate (Frankfurter). */
const eurUsd = () => (eurUsdPromise ??= withTimeout(fetch("https://api.frankfurter.dev/v1/latest?from=EUR&to=USD"), 8000)
  .then((r) => r.json()).then((j) => ({ rate: j.rates.USD, date: j.date })).catch(() => null));

// Daily copy of Cardmarket's official price guide (github.com/ZyzyThePizi/pokemon-price-data, since
// 2026-09-16). The weekly job already stores it for tracked cards; this gives the same days to cards
// that are not tracked yet (e.g. one just identified from a photo).
const CM_MIRROR = "https://raw.githubusercontent.com/ZyzyThePizi/pokemon-price-data/main";
const cmShards = new Map();
let cmFieldsPromise = null, eurUsdDaysPromise = null;
async function cardmarketMirror(idProduct) {
  cmFieldsPromise ??= withTimeout(fetch(`${CM_MIRROR}/prices/manifest.json`), 8000).then((r) => r.json()).then((j) => j.historyFields).catch(() => { cmFieldsPromise = null; return null; });
  const shard = idProduct % 1000;
  if (!cmShards.has(shard)) cmShards.set(shard, withTimeout(fetch(`${CM_MIRROR}/history/${shard}.json`), 10000).then((r) => (r.ok ? r.json() : null)).catch(() => { cmShards.delete(shard); return null; }));
  const [fields, data] = await Promise.all([cmFieldsPromise, cmShards.get(shard)]);
  if (!fields || !data) return [];
  return (data[String(idProduct)] ?? []).map((row) => Object.fromEntries(fields.map((k, i) => [k, row[i]])));
}
/** ECB EUR→USD rate per day since the mirror started, so each point uses the rate of its own date. */
async function eurUsdDays() {
  eurUsdDaysPromise ??= withTimeout(fetch("https://api.frankfurter.dev/v1/2026-09-01..?base=EUR&symbols=USD"), 8000)
    .then((r) => r.json()).then((j) => Object.entries(j.rates).map(([d, r]) => [d, r.USD]).sort()).catch(() => { eurUsdDaysPromise = null; return []; });
  return eurUsdDaysPromise;
}
const rateOn = (days, d) => { let r = null; for (const [day, v] of days) { if (day > d) break; r = v; } return r ?? days[0]?.[1] ?? null; };

/** Agrega un punto al final de la serie si es de un día posterior al último (o lo reemplaza si es el mismo día). */
function appendLatest(series, p) {
  const last = series.at(-1);
  if (!last || isoDay(new Date(p.t)) > isoDay(new Date(last.t))) series.push(p);
  else if (isoDay(new Date(p.t)) === isoDay(new Date(last.t))) series[series.length - 1] = p;
}

async function fetchPriceHistory(l) {
  const { catalogId, category } = l.card;
  const factor = l.grading ? 1 : CONDITION_FACTOR[l.condition] ?? 1;
  const store = storedPrices();
  const h = { market: [], cardmarket: [], sales: [], web: [], quote: null, quoteTried: false, factor, fx: null, productId: null, cmUpdated: null, updated: store.actualizado ?? null, weekly: false, liveMarket: false, liveCm: false };
  if (catalogId && !l.grading && category === "pokemon") {
    const stored = store.cartas[catalogId];
    const [dbRows, dex, fx] = await Promise.all([
      (async () => {
        if (!sb || !CONFIG.PRICE_SNAPSHOTS) return [];
        await withTimeout(sb.rpc("snapshot_price", { p_catalog_id: catalogId }), 6000).catch(() => {});
        const { data } = await sb.from("price_snapshots").select("variant, market_cents, captured_on").eq("catalog_id", catalogId).order("captured_on").limit(1500);
        return data ?? [];
      })().catch(() => []),
      fetchDexCard(l.card),
      eurUsd(),
    ]);
    // TCGplayer (EE.UU.): un precio de mercado por semana + el de hoy.
    const tpStored = stored?.series?.tcgplayer ?? {};
    const key = pickVariantKey(Object.keys(tpStored), l.card.variant);
    h.market = (tpStored[key] ?? []).filter((p) => p.market > 0)
      .map((p) => ({ t: noonUtc(p.d), v: round2(p.market * factor), k: "precio de mercado", carried: !!p.carried, src: p.fuente }));
    h.productId = stored?.tcgplayer?.productId ?? null;
    const dbKey = dbRows.length ? pickVariantKey([...new Set(dbRows.map((r) => r.variant))], key ?? l.card.variant) : null;
    for (const r of dbRows.filter((r) => r.variant === dbKey)) appendLatest(h.market, { t: noonUtc(r.captured_on), v: round2((r.market_cents / 100) * factor), k: "precio de mercado", src: "supabase" });
    const tp = dex?.pricing?.tcgplayer;
    if (tp) {
      const tkey = pickVariantKey(Object.keys(tp).filter((k) => typeof tp[k] === "object" && tp[k]), key ?? l.card.variant);
      const v = tp[tkey]?.marketPrice ?? tp[tkey]?.midPrice;
      h.productId ??= tp[tkey]?.productId ?? null;
      if (v > 0) { appendLatest(h.market, { t: noonUtc(isoDay(new Date(tp.updated ?? Date.now()))), v: round2(v * factor), k: "precio de mercado", src: "tcgdex" }); h.liveMarket = h.market.at(-1).src === "tcgdex"; }
    }
    // Cardmarket (Europa): promedio de ventas reales de los últimos 7 días, en USD con la tasa del BCE de cada fecha.
    const cmValue = (p) => (p.avg7 > 0 ? [p.avg7, "promedio de ventas, últimos 7 días"] : p.trend > 0 ? [p.trend, "precio de tendencia"] : [null]);
    h.cardmarket = (stored?.series?.cardmarket ?? []).filter((p) => p.eurUsd && cmValue(p)[0])
      .map((p) => { const [eur, k] = cmValue(p); return { t: noonUtc(p.d), v: round2(eur * p.eurUsd * factor), k, carried: !!p.carried, src: p.fuente, rate: p.eurUsd }; });
    const cm = dex?.pricing?.cardmarket;
    if (!h.cardmarket.length && cm?.idProduct) {
      const [rows, days] = await Promise.all([cardmarketMirror(cm.idProduct).catch(() => []), eurUsdDays()]);
      for (const o of rows) {
        const [eur, k] = cmValue(o), rate = rateOn(days, o.date);
        if (eur && rate) h.cardmarket.push({ t: noonUtc(o.date), v: round2(eur * rate * factor), k, src: "cardmarket-espejo", rate });
      }
    }
    if (cm && fx && cmValue(cm)[0]) {
      const [eur, k] = cmValue(cm);
      h.fx = fx; h.cmUpdated = Date.parse(cm.updated);
      appendLatest(h.cardmarket, { t: noonUtc(isoDay(new Date(h.cmUpdated))), v: round2(eur * fx.rate * factor), k, src: "tcgdex", rate: fx.rate });
      h.liveCm = h.cardmarket.at(-1).src === "tcgdex";
    }
    h.weekly = h.market.length > 4 || h.cardmarket.length > 4;
  }
  if (sb && catalogId && !l.isDemo) {
    const gradingKey = l.grading ? `${l.grading.company}${l.grading.grade}` : "raw";
    const since = new Date(Date.now() - 366 * DAY_MS).toISOString();
    const { data } = await sb.from("sales").select("price_cents, sold_at").eq("catalog_id", catalogId).eq("grading_key", gradingKey).gte("sold_at", since).order("sold_at").limit(500);
    h.sales = (data ?? []).map((r) => ({ t: Date.parse(r.sold_at), v: r.price_cents / 100 }));
  }
  // The free catalogs have no price (graded cards, NBA/NFL, catalog down): PriceCharting/SportsCardsPro
  // (real sold listings per grade), and if that fails, research it on the web with the Edge Function.
  if (!h.market.length && !h.cardmarket.length && l.card.subject) {
    h.quoteTried = true;
    h.quote = await fetchPriceCharting(l, factor).catch((e) => { console.warn("pricecharting", e); return null; })
      ?? await fetchMarketQuote(l).catch((e) => { console.warn("market quote", e); return null; });
    if (h.quote) {
      const src = h.quote.sources[0];
      h.web = h.quote.history?.length
        ? h.quote.history.map((p) => ({ t: p.t, v: p.v, src: src.name, url: src.url, k: `${src.name} · valor del mes` }))
        : h.quote.sales.map((s) => ({ t: noonUtc(s.date), v: s.price, src: s.source, url: s.url })).sort((a, b) => a.t - b.t);
      const today = noonUtc(isoDay(new Date()));
      if (!h.web.length || h.web.at(-1).t < today) h.web.push({ t: today, v: h.quote.market_price, src: "valor aproximado", today: true });
    }
  }
  return h;
}

// Market price researched on the web by the Edge Function (action "price": Claude + web search over
// eBay sold listings, PriceCharting, 130point, PSA…). Cached 24 h in Supabase and 12 h in this browser.
const quotePromises = new Map();
function quoteCard(l) {
  const c = l.card;
  return {
    category: c.category, subject: c.subject ?? "", set_name: c.setName ?? "", year: c.year ?? "", number: c.number ?? "", variant: c.variant ?? "",
    grading_company: l.grading?.company ?? "", grade: l.grading?.grade ?? "", condition: l.grading ? "" : l.condition ?? "NM",
  };
}
function fetchMarketQuote(l) {
  if (!CONFIG.IDENTIFY_FUNCTION) return Promise.resolve(null);
  const card = quoteCard(l), key = `holo-quote:${JSON.stringify(card).toLowerCase()}`;
  try {
    const kept = JSON.parse(localStorage.getItem(key) ?? "null");
    if (kept?.market_price > 0 && Date.now() - Date.parse(kept.fetched_at) < 12 * 3600000) return Promise.resolve(kept);
  } catch { /* storage unavailable */ }
  if (!quotePromises.has(key)) {
    const p = (async () => {
      const s = sb ? (await sb.auth.getSession()).data.session : null;
      const res = await withTimeout(fetch(`${CONFIG.SUPABASE_URL}/functions/v1/${CONFIG.IDENTIFY_FUNCTION}`, {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: CONFIG.SUPABASE_KEY, Authorization: `Bearer ${s?.access_token ?? CONFIG.SUPABASE_KEY}` },
        body: JSON.stringify({ action: "price", card }),
      }), 120000);
      if (!res.ok) throw new Error(`price ${res.status} ${await res.text().catch(() => "")}`);
      const q = (await res.json()).quote;
      if (!(q?.market_price > 0)) throw new Error("price: empty quote");
      try { localStorage.setItem(key, JSON.stringify(q)); } catch { /* storage unavailable */ }
      return q;
    })();
    quotePromises.set(key, p);
    p.catch(() => quotePromises.delete(key));
  }
  return quotePromises.get(key);
}
/** A listing estimate (same shape as estimatePrice) from a web quote. */
function estimateFromQuote(q) {
  if (!(q?.market_price > 0)) return null;
  return { low: round2(q.low), mid: round2(q.market_price), high: round2(q.high), currency: "USD", confidence: q.sales.length >= 5 ? "media" : "baja", basis: [q.basis || "Ventas recientes encontradas en internet"], source: "web", updatedAt: q.fetched_at };
}

// PriceCharting (Pokémon) / SportsCardsPro (NBA, NFL): value per grade (Ungraded, PSA 10, CGC 10, 9.5…)
// from real eBay/TCGplayer sold listings, a monthly history since release, and the listings themselves
// with links. Neither site sends CORS headers, so pages are read through the r.jina.ai reader
// (keyless, CORS-enabled, ~20 requests/min per visitor). Works without the Edge Function; 12 h cache here.
const PC_READER = "https://r.jina.ai/";
const pcPromises = new Map();
const pcNorm = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/&amp;/g, "&").replace(/[^a-z0-9]+/g, " ").trim();
const pcTokens = (s) => pcNorm(s).split(" ").filter(Boolean);
const pcMoney = (s) => { const n = Number(String(s ?? "").replace(/[^0-9.]/g, "")); return n > 0 ? n : null; };
const pcNum = (s) => (String(s ?? "").split("/")[0].match(/[a-z]*\d+[a-z]*/i)?.[0] ?? "").toLowerCase().replace(/^([a-z]*)0+(?=\d)/, "$1");
async function pcPage(url) {
  const res = await withTimeout(fetch(PC_READER + url, { headers: { "X-Return-Format": "html" } }), 45000);
  if (!res.ok) throw new Error(`pricecharting ${res.status}`);
  const html = await res.text();
  return { doc: new DOMParser().parseFromString(html, "text/html"), chart: html.match(/chart_data\s*=\s*(\{.*?\});/s)?.[1] ?? null };
}
/** Which PriceCharting column holds this grade: chart series, sold-listings block and price-guide label. */
function pcGrade(l) {
  const g = l.grading;
  if (!g) return { chart: "used", sales: "used", label: "Ungraded", name: "sin graduar" };
  const n = Number(g.grade), c = String(g.company ?? "").toUpperCase();
  if (n >= 10) {
    if (c === "PSA") return { chart: "manualonly", sales: "manual-only", label: "PSA 10", name: "PSA 10" };
    const block = { CGC: "grade-seventeen", SGC: "grade-eighteen", BGS: "loose-and-box", BECKETT: "loose-and-box", TAG: "grade-twenty-one", ACE: "grade-twenty-two" }[c];
    return { chart: null, sales: block ?? null, label: `${c === "BECKETT" ? "BGS" : c} 10`, name: `${c} 10`, fallback: "PSA 10" };
  }
  if (n >= 9.5) return { chart: "boxonly", sales: "box-only", label: "Grade 9.5", name: `${c} ${n}` };
  if (n >= 9) return { chart: "graded", sales: "graded", label: "Grade 9", name: `${c} ${n}` };
  if (n >= 8) return { chart: "new", sales: "new", label: "Grade 8", name: `${c} ${n}` };
  if (n >= 7) return { chart: "cib", sales: "cib", label: "Grade 7", name: `${c} ${n}` };
  const w = ["one", "two", "three", "four", "five", "six"][Math.max(1, Math.floor(n)) - 1];
  return { chart: null, sales: `grade-${w}`, label: `Grade ${Math.max(1, Math.floor(n))}`, name: `${c} ${n}`, fallback: "Grade 7" };
}
/** Best search row for this card: same number, the player/Pokémon name, the set, and the base print unless the variant says otherwise. */
function pcPick(doc, l, site) {
  const c = l.card, num = pcNum(c.number), subj = pcTokens(c.subject), set = pcTokens(`${c.setName ?? ""} ${c.year ?? ""}`), variant = pcTokens(c.variant);
  let best = null;
  for (const tr of doc.querySelectorAll("tr[id^=product-]")) {
    const a = tr.querySelector("td.title a"), con = tr.querySelector(".console-in-title a, td.console a");
    if (!a) continue;
    const title = a.textContent.trim(), conName = con?.textContent.trim() ?? "", t = pcTokens(title), ct = pcTokens(conName);
    const rowNum = pcNum(title.match(/#\s*([a-z0-9-]+)/i)?.[1] ?? "");
    const bracket = pcTokens(title.match(/\[([^\]]+)\]/)?.[1] ?? "");
    let s = subj.filter((w) => t.includes(w)).length / Math.max(1, subj.length) * 4;
    if (s < 2) continue;
    if (num) { if (rowNum !== num) continue; s += 3; }
    s += set.filter((w) => ct.includes(w)).length / Math.max(1, set.length) * 3;
    if (bracket.length) s += variant.some((w) => bracket.includes(w)) ? 1.5 : -2.5;
    if (c.category === "pokemon" && !ct.includes("pokemon")) s -= 3;
    if ({ nba: "basketball", nfl: "football" }[c.category] && !ct.includes({ nba: "basketball", nfl: "football" }[c.category])) s -= 3;
    if (ct.some((w) => ["japanese", "chinese", "korean"].includes(w)) && !set.some((w) => ["japanese", "chinese", "korean"].includes(w))) s -= 2;

function fetchPriceCharting(l, factor = 1) {

      const chart = page.chart ? JSON.parse(page.chart) : {};
      const history = (chart[g.chart] ?? []).filter(([, cents]) => cents > 0).map(([t, cents]) => ({ t, v: round2((cents / 100) * factor) }));
      const cut = Date.now() - 400 * DAY_MS;

        const a = tr.querySelector("td.title a"), date = tr.querySelector("td.date")?.textContent.trim();

function niceTicks(lo, hi, n = 4) {
  if (hi - lo < 1e-6) { lo *= 0.9; hi = hi * 1.1 || 1; }
  const raw = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(raw)), e = raw / mag;

  for (let v = Math.max(0, Math.floor(lo / step) * step); v <= Math.ceil(hi / step) * step + step * 1e-6; v += step) out.push(round2(v));
  return out;
}

/** Monotone cubic path through points sorted by x (d3.curveMonotoneX), as Recharts draws "monotone". */
function monotonePath(P) {
  if (!P.length) return "";
  const f = (v) => v.toFixed(1);
  if (P.length === 1) return `M${f(P[0][0])},${f(P[0][1])}`;
  if (P.length === 2) return `M${f(P[0][0])},${f(P[0][1])}L${f(P[1][0])},${f(P[1][1])}`;
  const n = P.length, h = [], s = [], t = new Array(n);
  for (let i = 0; i < n - 1; i++) { h[i] = P[i + 1][0] - P[i][0]; s[i] = h[i] ? (P[i + 1][1] - P[i][1]) / h[i] : 0; }
  for (let i = 1; i < n - 1; i++) {
    const p = (s[i - 1] * h[i] + s[i] * h[i - 1]) / (h[i - 1] + h[i]);
    t[i] = (Math.sign(s[i - 1]) + Math.sign(s[i])) * Math.min(Math.abs(s[i - 1]), Math.abs(s[i]), 0.5 * Math.abs(p)) || 0;
  }
  t[0] = h[0] ? (3 * s[0] - t[1]) / 2 : t[1];
  t[n - 1] = h[n - 2] ? (3 * s[n - 2] - t[n - 2]) / 2 : t[n - 2];
  let d = `M${f(P[0][0])},${f(P[0][1])}`;
  for (let i = 0; i < n - 1; i++) {
    const dx = h[i] / 3;
    d += `C${f(P[i][0] + dx)},${f(P[i][1] + dx * t[i])} ${f(P[i + 1][0] - dx)},${f(P[i + 1][1] - dx * t[i + 1])} ${f(P[i + 1][0])},${f(P[i + 1][1])}`;
  }
  return d;
}

      ${area ? `<path d="${area}" fill="url(#pcDots)" mask="url(#pcMask)"/>` : ""}
      ${market.length > 1 ? `<path d="${line}" fill="none" stroke="${CHART_COLORS.market}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>` : ""}
      ${cmk.length > 1 ? `<path d="${cmLine}" fill="none" stroke="${CHART_COLORS.cardmarket}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : ""}
      ${(cmk.length > 12 ? cmk.slice(-1) : cmk).map((p) => dot(p, CHART_COLORS.cardmarket)).join("")}
      ${sales.map((p) => dot(p, CHART_COLORS.sales, 4.5)).join("")}
      ${web.length > 1 ? `<path d="${webLine}" fill="none" stroke="${CHART_COLORS.web}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>` : ""}
      ${web.map((p) => (p.today ? `<circle class="ping" cx="${X(p.t)}" cy="${Y(p.v)}" r="4.5" fill="${CHART_COLORS.web}" opacity=".75"/>${dot(p, CHART_COLORS.web, 4.5)}` : dot(p, CHART_COLORS.web, 3))).join("")}
      ${last ? `<circle class="ping" cx="${X(last.t)}" cy="${Y(last.v)}" r="4.5" fill="${CHART_COLORS.market}" opacity=".75"/>${dot(last, CHART_COLORS.market, 4.5)}` : ""}
    </g>
    <g class="cross" style="display:none"><line y1="${m.t}" y2="${base}" stroke="var(--fg-3)" stroke-width="1"/><circle r="5.5" fill="var(--card)" stroke="var(--fg)" stroke-width="2"/></g>
  </svg><div class="ptip" role="status"></div>`;
  if (animate) revealChart(wrap.querySelector("#pcClip rect"), W);

  // Hover / keyboard layer: snap to the nearest date that has data.
  const byDay = new Map();
  const blank = (t) => ({ t, market: null, cm: null, sales: [], web: [] });
  for (const p of market) byDay.set(isoDay(new Date(p.t)), { ...blank(p.t), market: p.v, marketCarried: p.carried });
  for (const p of cmk) { const k = isoDay(new Date(p.t)); const s = byDay.get(k) ?? blank(p.t); s.cm = p; byDay.set(k, s); }
  for (const p of sales) { const k = isoDay(new Date(p.t)); const s = byDay.get(k) ?? blank(p.t); s.sales.push(p.v); byDay.set(k, s); }
  for (const p of web) { const k = isoDay(new Date(p.t)); const s = byDay.get(k) ?? blank(p.t); s.web.push(p); byDay.set(k, s); }
  const stops = [...byDay.values()].sort((a, b) => a.t - b.t);
  const svg = wrap.querySelector("svg"), tip = wrap.querySelector(".ptip"), cross = svg.querySelector(".cross");
  let idx = stops.length - 1;
  const row = (color, value, label, round) => {
    const r = document.createElement("div"); r.className = "r";
    const k = document.createElement("i"); k.className = "k"; k.style.background = color; if (round) Object.assign(k.style, { width: "8px", height: "8px", borderRadius: "50%" });
    const b = document.createElement("b"); b.textContent = value;
    r.append(k, b, document.createTextNode(label)); return r;
  };
  const show = (i) => {
    idx = Math.max(0, Math.min(stops.length - 1, i));
    const s = stops[idx], x = X(s.t), y = Y(s.market ?? s.cm?.v ?? s.sales[0] ?? s.web[0].v);
    cross.style.display = "";
    cross.querySelector("line").setAttribute("x1", x); cross.querySelector("line").setAttribute("x2", x);
    cross.querySelector("circle").setAttribute("cx", x); cross.querySelector("circle").setAttribute("cy", y);
    const d = document.createElement("div"); d.className = "d"; d.textContent = fmtDay(s.t, true);
    tip.replaceChildren(d);
    const again = " (sin dato nuevo, se repite)";
    if (s.market != null) tip.append(row(CHART_COLORS.market, formatUsd(toCents(s.market)), `TCGplayer${s.marketCarried ? again : ""}`));
    if (s.cm) tip.append(row(CHART_COLORS.cardmarket, formatUsd(toCents(s.cm.v)), `Cardmarket · ${s.cm.k}${s.cm.carried ? again : ""}`));
    for (const v of s.sales) tip.append(row(CHART_COLORS.sales, formatUsd(toCents(v)), "venta en Panamá", true));
    for (const p of s.web) tip.append(row(CHART_COLORS.web, formatUsd(toCents(p.v)), p.today ? "valor aproximado hoy" : p.k ?? `venta · ${p.src}`, true));
    const ref = s.market ?? s.cm?.v ?? s.sales[0] ?? s.web[0]?.v, diff = Math.round(((price - ref) / ref) * 100);
    if (price != null) tip.append(row("var(--fg)", formatUsd(toCents(price)), `${(l.priceLabel ?? "Este anuncio").toLowerCase()} (${diff > 0 ? "+" : ""}${diff}%)`));
    const first = tip.style.display !== "block";
    tip.style.display = "block";
    const tw = tip.offsetWidth, left = x > W / 2 ? Math.max(0, x - tw - 12) : Math.min(W - tw, x + 12);
    tip.classList.toggle("moving", !first); // Recharts slides the tooltip (400 ms ease) once it is visible
    tip.style.transform = `translate(${Math.round(left)}px, 0)`;
  };
  const hide = () => { cross.style.display = "none"; tip.style.display = "none"; tip.classList.remove("moving"); };
  svg.addEventListener("pointermove", (e) => {
    const r = svg.getBoundingClientRect(), px = ((e.clientX - r.left) / r.width) * W;
    let best = 0;
    stops.forEach((s, i) => { if (Math.abs(X(s.t) - px) < Math.abs(X(stops[best].t) - px)) best = i; });
    if (best !== idx || tip.style.display !== "block") show(best);
  });
  svg.addEventListener("pointerleave", () => { if (document.activeElement !== svg) hide(); });
  svg.addEventListener("focus", () => show(idx));
  svg.addEventListener("blur", hide);
  svg.addEventListener("keydown", (e) => {
    const step = { ArrowLeft: -1, ArrowRight: 1 }[e.key];
    if (step) { e.preventDefault(); show(idx + step); }
    else if (e.key === "Home" || e.key === "End") { e.preventDefault(); show(e.key === "Home" ? 0 : stops.length - 1); }
  });
}

async function loadPriceChart(l) {
  const box = $("#priceChart");
  if (!box) return;
  const h = await fetchPriceHistory(l).catch((e) => { console.error(e); return { market: [], cardmarket: [], sales: [], web: [], factor: 1 }; });
  if (!box.isConnected) return;
  h.retry = () => { box.innerHTML = `<h2 class="ptitle">${ic("trend")}Valor en el mercado</h2><p class="loading" style="padding:20px 0"><span class="spinner"></span>Buscando el precio en ventas recientes…</p>`; loadPriceChart(l); };
  // Con historial semanal largo se abre en "1 año"; si no, en 90 días (o todo, si son ventas encontradas en internet).
  let range = h.weekly ? 365 : h.web?.length ? Infinity : 90, width = box.clientWidth;
  const draw = (animate) => renderPriceChart(box, l, h, range, (r) => { range = r; draw(true); }, animate);
  draw(true);
  const ro = new ResizeObserver(() => {
    if (!box.isConnected) return ro.disconnect();
    if (box.clientWidth !== width) { width = box.clientWidth; draw(false); }
  });
  ro.observe(box);
}

// ------------------------------------------------------------- share
// Sellers spread listings in WhatsApp/Facebook/Instagram groups. Hash links get no
// preview there, so "Compartir" builds a 1080×1350 image (the Instagram portrait size).
const listingUrl = (l) => `${location.origin}${location.pathname}#/carta/${encodeURIComponent(l.id)}`;
function loadImg(src) {
  return new Promise((res) => {
    if (!src) return res(null);
    const im = new Image(); im.crossOrigin = "anonymous";
    im.onload = () => res(im); im.onerror = () => res(null);
    // The page already loaded this image without CORS; a distinct URL avoids reusing
    // that cached copy, which would taint the canvas.
    im.src = src + (src.includes("?") ? "&" : "?") + "canvas=1";
  });
}
async function shareImage(l) {
  const W = 1080, H = 1350, c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  await document.fonts?.ready;
  const g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, "#15151a"); g.addColorStop(1, "#0b0b0d");
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  const holo = x.createLinearGradient(0, 0, W, 0);
  [["#7cf3d5", 0], ["#8ab6ff", .35], ["#d59bff", .65], ["#ffc98a", 1]].forEach(([col, at]) => holo.addColorStop(at, col));
  x.fillStyle = holo; x.fillRect(0, 0, W, 10);
  // card
  const img = await loadImg(l.photos[0]);
  const boxW = 560, boxH = 782, bx = (W - boxW) / 2, by = 70;
  if (img) {
    const r = Math.min(boxW / img.width, boxH / img.height), w = img.width * r, h = img.height * r;
    x.save(); x.shadowColor = "rgba(0,0,0,.6)"; x.shadowBlur = 50; x.shadowOffsetY = 20;
    x.drawImage(img, (W - w) / 2, by + (boxH - h) / 2, w, h); x.restore();
  } else {
    x.fillStyle = "#26262d"; x.beginPath(); x.roundRect(bx, by, boxW, boxH, 36); x.fill();
    x.fillStyle = "#f2f0eb"; x.font = "700 56px 'Bricolage Grotesque', sans-serif"; x.textAlign = "center";
    x.fillText(l.card.subject.slice(0, 18), W / 2, by + boxH / 2);
  }
  // text
  x.textAlign = "left"; x.fillStyle = "#f2f0eb";
  const pad = 80; let y = 930;
  x.font = "600 44px Inter, sans-serif";
  let title = l.title; while (x.measureText(title).width > W - pad * 2 && title.length > 4) title = title.slice(0, -2);
  if (title !== l.title) title = title.trimEnd() + "…";
  x.fillText(title, pad, y); y += 110;
  x.font = "700 104px 'Bricolage Grotesque', sans-serif"; x.fillText(formatUsd(toCents(l.priceUsd)), pad, y);
  y += 64; x.font = "500 36px Inter, sans-serif"; x.fillStyle = "#a19d95";
  const bits = [];
  if (l.estimate) bits.push(`Precio estimado ${fmtEstimate(l.estimate.low)} – ${fmtEstimate(l.estimate.high)}`);
  bits.push(`${l.location.neighborhood}, ${l.location.district}`);
  x.fillText(bits.join("  ·  "), pad, y);
  // pills
  const pills = [];
  if (isVerifiedShop(l.seller)) pills.push(["🏪 Tienda verificada", "#4fd19c"]);
  if (l.protectedEligible) pills.push(["🛡 Compra Protegida", "#7390ff"]);
  if (l.verificationPhoto) pills.push(["📸 Foto de verificación", "#4fd19c"]);
  let px = pad; y += 70; x.font = "600 30px Inter, sans-serif";
  for (const [t, col] of pills) {
    const w = x.measureText(t).width + 44;
    if (px + w > W - pad) break;
    x.fillStyle = col + "26"; x.beginPath(); x.roundRect(px, y - 38, w, 56, 28); x.fill();
    x.fillStyle = col; x.fillText(t, px + 22, y); px += w + 14;
  }
  // footer
  x.fillStyle = holo; x.beginPath(); x.roundRect(pad, H - 110, 44, 44, 12); x.fill();
  x.fillStyle = "#f2f0eb"; x.font = "700 40px 'Bricolage Grotesque', sans-serif"; x.fillText(CONFIG.APP_NAME, pad + 60, H - 74);
  x.fillStyle = "#a19d95"; x.font = "500 30px Inter, sans-serif"; x.textAlign = "right";
  x.fillText("Cartas coleccionables en Panamá", W - pad, H - 76);
  return new Promise((res) => c.toBlob(res, "image/jpeg", 0.9));
}
function setupShare(l) {
  const url = listingUrl(l), text = `${l.title} · ${formatUsd(toCents(l.priceUsd))} en ${CONFIG.APP_NAME}`;
  const wa = $("#shareWa"); if (wa) wa.href = `https://wa.me/?text=${encodeURIComponent(`${text}\n${url}`)}`;
  $("#shareBtn")?.addEventListener("click", async (e) => {
    const btn = e.currentTarget, label = btn.innerHTML;
    track("compartir", l.id);
    btn.disabled = true; btn.textContent = "Preparando imagen…";
    try {
      let blob = null;
      try { blob = await shareImage(l); } catch (err) { console.error("share image failed", err); }
      const file = blob && new File([blob], `holo-${l.id.slice(0, 8)}.jpg`, { type: "image/jpeg" });
      if (file && navigator.canShare?.({ files: [file] })) {
        await navigator.share({ files: [file], title: l.title, text: `${text}\n${url}` });
      } else if (navigator.share && !file) {
        await navigator.share({ title: l.title, text, url });
      } else {
        if (file) { const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = file.name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }
        try { await navigator.clipboard.writeText(`${text}\n${url}`); } catch { /* clipboard blocked */ }
        toast(file ? "Descargamos la imagen y copiamos el link: pégalo junto a la imagen en tu grupo." : "Copiamos el link del anuncio.");
      }
    } catch (err) {
      if (err?.name !== "AbortError") { console.error(err); toast("No pudimos compartir. Copia el link desde la barra del navegador.", { type: "error" }); }
    } finally { btn.disabled = false; btn.innerHTML = label; }
  });
}

function gateBackground() {

            <label class="f">Correo<input class="input" name="email" type="email" required autocomplete="email" inputmode="email"></label>
            <label class="f">Contraseña<input class="input" name="password" type="password" required minlength="8" autocomplete="${up ? "new-password" : "current-password"}"></label>
            <div id="authMsg" aria-live="polite"></div>
            <button class="btn primary block" id="authBtn">${up ? "Crear cuenta" : "Entrar"}</button>
            ${up ? `<p class="legal">Al crear tu cuenta aceptas que tratemos tus datos para operar el marketplace (Ley 81 de 2019). Nunca mostramos tu correo ni tu dirección.</p>` : ""}
          </form></div></div></div></div>`;
    app.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => { if (b.dataset.m !== mode) { mode = b.dataset.m; render(); app.querySelector(`.tabs [data-m="${mode}"]`)?.focus(); } }));
    $("#authForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target), btn = $("#authBtn"), msg = $("#authMsg");
      const email = String(fd.get("email")).trim().toLowerCase(), password = String(fd.get("password"));
      btn.disabled = true; btn.innerHTML = `<span class="spinner" style="border-color:currentColor"></span>Un momento…`; msg.innerHTML = "";
      const res = await (mode === "registro"
        ? sb.auth.signUp({ email, password, options: { data: { display_name: String(fd.get("displayName")).trim() } } })
        : sb.auth.signInWithPassword({ email, password })).catch(() => ({ error: { code: "network" } }));
      if (!btn.isConnected) return;
      btn.disabled = false; btn.textContent = mode === "registro" ? "Crear cuenta" : "Entrar";
      if (res.error) {
        const c = res.error.code;
        const text = c === "user_already_exists" ? "Ya existe una cuenta con ese correo. Usa “Entrar”." : c === "invalid_credentials" ? "Correo o contraseña incorrectos." : c === "weak_password" ? "La contraseña es muy débil. Usa al menos 8 caracteres." : c === "over_email_send_rate_limit" || c === "over_request_rate_limit" ? "Demasiados intentos. Prueba en unos minutos." : c === "network" ? "No hay conexión con el servidor. Revisa tu internet." : "No pudimos completar la operación. Intenta de nuevo.";
        msg.innerHTML = `<p class="notice bad">${esc(text)}</p>`; return;
      }
      if (mode === "registro") track("registro");
      if (mode === "registro" && !res.data.session) { msg.innerHTML = `<p class="notice good">Te enviamos un correo para confirmar tu cuenta.</p>`; return; }
      toast(mode === "registro" ? "Cuenta creada" : "Sesión iniciada");
      go(next);
    });
  };
  render();
}

async function compressImage(file) {
  if (!file.type.startsWith("image/")) return file;
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); } catch { return file; }
  const s = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height); bmp.close?.();
  const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85));
  if (!blob) return file;
  if (["image/jpeg", "image/png", "image/webp"].includes(file.type) && blob.size >= file.size) return file;
  return new File([blob], "foto.jpg", { type: "image/jpeg" });
}
async function catalogSearch(name, number) {
  const clean = (s) => s.replace(/["\\]/g, "").trim();
  const n = number?.split("/")[0].replace(/^#/, "").trim();
  const queries = n ? [`name:"${clean(name)}" number:"${clean(n)}"`, `name:"${clean(name)}"`] : [`name:"${clean(name)}"`];
  for (const q of queries) {
    for (let attempt = 0; attempt < 3; attempt++) {
      if (attempt) await new Promise((r) => setTimeout(r, 600 * 2 ** (attempt - 1)));
      try {
        const res = await fetch(`${CONFIG.CATALOG_API}/cards?q=${encodeURIComponent(q)}&pageSize=9&orderBy=-set.releaseDate&select=id,name,number,rarity,set,images,tcgplayer`);
        if (res.ok) { const d = (await res.json()).data; if (d.length) return d; break; }
        if (res.status < 500) break;
      } catch { /* network hiccup, retry */ }
    }
  }
  // pokemontcg.io fails often (and sunsets 2027-03-01): fall back to the TCGdex catalog.
  const [found, sets] = await Promise.all([dexCandidates({ name, number: number?.split("/")[0], total: number?.split("/")[1] }), dexSets()]);
  return found.slice(0, 9).map((c) => catalogFromDexBrief(c, sets.get(setOfDexId(c.id))));
}

// ============================================================= card identification
// A photo is enough: the page works out which card (and which printing) it is, fills the
// form, writes a description, and shows today's price with its history.
//   1. AI (Supabase Edge Function "identificar-carta", Claude vision). Works for Pokémon, NBA and NFL.
//   2. Fallback without any key: OCR in the browser (Tesseract.js) reads the name and the
//      collector number (199/165).
// For Pokémon both paths end in the TCGdex catalog. The candidates are ranked by number, set
// size and name, and ties are broken by comparing the photo with each catalog image.
const TESSERACT_URL = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
// TCG Pocket is a digital game: its "cards" share names and numbers with physical ones.
const isPocketSet = (setId) => /^(A\d|B\d|P-A)/.test(setId);
const setOfDexId = (id) => id.slice(0, id.lastIndexOf("-"));
const sameNumber = (a, b) => (/^\d+$/.test(a) && /^\d+$/.test(b) ? Number(a) === Number(b) : String(a).toUpperCase() === String(b).toUpperCase());
const tokens = (s) => normalize(s).replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter((w) => w.length > 1);

let dexSetsPromise = null;
const dexSets = () => (dexSetsPromise ??= dexGet("/sets").then((list) => {
  if (!list) { dexSetsPromise = null; return new Map(); }
  return new Map(list.map((s) => [s.id, s]));
}));

/** Physical cards in TCGdex that match a name and/or collector number (number/total). */
async function dexCandidates({ name, number, total }) {
  const num = number?.replace(/^#/, "").trim(), tot = total?.replace(/\D/g, "");
  const q = new URLSearchParams();
  if (num) q.set("localId", /^\d+$/.test(num) ? String(Number(num)) : num); // TCGdex matches "contains": exact check below
  if (name) q.set("name", name);
  if (![...q.keys()].length) return [];
  let list = (await dexGet(`/cards?${q}`)) ?? [];
  if (!list.length && num && name) list = (await dexGet(`/cards?localId=${encodeURIComponent(q.get("localId"))}`)) ?? [];
  list = list.filter((c) => !isPocketSet(setOfDexId(c.id)) && (!num || sameNumber(c.localId, num)));
  if (tot && list.length > 1) {
    const sets = await dexSets();
    const bySize = list.filter((c) => String(sets.get(setOfDexId(c.id))?.cardCount?.official) === String(Number(tot)));
    if (bySize.length) list = bySize;
  }
  return list;
}

/** Minimal catalog object (same shape as pokemontcg.io) from a TCGdex search row. */
function catalogFromDexBrief(c, set) {
  return { id: ptcgId(c.id), dexId: c.id, name: c.name, number: c.localId, rarity: "", set: { name: set?.name ?? setOfDexId(c.id), printedTotal: set?.cardCount?.official ?? "" }, images: { small: c.image ? `${c.image}/low.webp` : "" }, brief: true };
}

/** Full catalog object from TCGdex: set, rarity, artist, prices. Shape compatible with pokemontcg.io. */
async function catalogFromDex(dexId) {
  const d = await dexGet(`/cards/${encodeURIComponent(dexId)}`);
  if (!d) return null;
  const set = await dexGet(`/sets/${encodeURIComponent(d.set.id)}`);
  const tp = d.pricing?.tcgplayer ?? {}, prices = {};
  for (const [k, v] of Object.entries(tp)) {
    if (v && typeof v === "object") prices[k.replace(/-(\w)/g, (_, ch) => ch.toUpperCase())] = { market: v.marketPrice ?? null, mid: v.midPrice ?? null, low: v.lowPrice ?? null, productId: v.productId ?? null };
  }
  return {
    id: ptcgId(d.id), dexId: d.id, name: d.name, number: d.localId, rarity: d.rarity ?? "",
    set: { id: d.set.id, name: d.set.name, printedTotal: d.set.cardCount?.official ?? set?.cardCount?.official ?? "", releaseDate: set?.releaseDate ?? "", serie: set?.serie?.name ?? "" },
    images: { small: d.image ? `${d.image}/low.webp` : "", large: d.image ? `${d.image}/high.webp` : "" },
    tcgplayer: Object.keys(prices).length ? { prices, updatedAt: tp.updated ?? new Date().toISOString() } : null,
    cardmarket: d.pricing?.cardmarket ?? null,
    illustrator: d.illustrator ?? "", hp: d.hp ?? null, types: d.types ?? [], stage: d.stage ?? "", kind: d.category ?? "",
  };
}

const loadImage = (src, cors) => new Promise((resolve, reject) => {
  const im = new Image();
  if (cors) im.crossOrigin = "anonymous";
  im.onload = () => resolve(im); im.onerror = reject; im.src = src;
});
/** The card's area in a photo: a centered card-shaped (63×88 mm) box. Scans fill the frame. */
function cardRect(w, h, fill) {
  const ratio = 63 / 88;
  let ch = Math.min(h, w / ratio) * fill, cw = ch * ratio;
  return { x: (w - cw) / 2, y: (h - ch) / 2, w: cw, h: ch };
}
/**
 * Where the card is in a photo: the bounding box of what differs from the background
 * (the color along the photo's edges). Falls back to a centered card-shaped box.
 */
function findCard(im) {
  const W = im.naturalWidth || im.width, H = im.naturalHeight || im.height, k = 200 / Math.max(W, H);
  const w = Math.max(8, Math.round(W * k)), h = Math.max(8, Math.round(H * k));
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d", { willReadFrequently: true }); g.drawImage(im, 0, 0, w, h);
  const px = g.getImageData(0, 0, w, h).data, at = (x, y) => (y * w + x) * 4;
  const edge = [];
  for (let x = 0; x < w; x++) edge.push(at(x, 0), at(x, 1), at(x, h - 1), at(x, h - 2));
  for (let y = 0; y < h; y++) edge.push(at(0, y), at(1, y), at(w - 1, y), at(w - 2, y));
  const bg = [0, 1, 2].map((ch) => median(edge.map((i) => px[i + ch])));
  const rows = new Array(h).fill(0), cols = new Array(w).fill(0);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = at(x, y);
    if (Math.hypot(px[i] - bg[0], px[i + 1] - bg[1], px[i + 2] - bg[2]) > 48) { rows[y]++; cols[x]++; }
  }
  const span = (arr, min) => { const a = arr.findIndex((v) => v >= min), b = arr.findLastIndex((v) => v >= min); return a < 0 ? null : [a, b + 1]; };
  const ys = span(rows, w * 0.25), xs = span(cols, h * 0.25);
  if (ys && xs) {
    const bw = (xs[1] - xs[0]) / k, bh = (ys[1] - ys[0]) / k, ratio = bw / bh;
    // Accept only card-like boxes (63×88 mm ≈ 0.72, some room for tilt) that are not the whole photo.
    if (ratio > 0.55 && ratio < 0.9 && bw * bh > W * H * 0.2 && bw * bh < W * H * 0.97) return { x: xs[0] / k, y: ys[0] / k, w: bw, h: bh };
  }
  return cardRect(W, H, 0.94);
}
/** Visual fingerprint: 64-bit gradient hash (shape) + 4×4 color grid (palette). */
function signature(im, fill) {
  const r = fill ? cardRect(im.naturalWidth || im.width, im.naturalHeight || im.height, fill) : findCard(im);
  const c = document.createElement("canvas"), g = c.getContext("2d", { willReadFrequently: true });
  c.width = 9; c.height = 8; g.drawImage(im, r.x, r.y, r.w, r.h, 0, 0, 9, 8);
  const px = g.getImageData(0, 0, 9, 8).data, lum = (i) => px[i] * 0.299 + px[i + 1] * 0.587 + px[i + 2] * 0.114;
  const bits = [];
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) bits.push(lum((y * 9 + x) * 4) > lum((y * 9 + x + 1) * 4) ? 1 : 0);
  c.width = 4; c.height = 4; g.drawImage(im, r.x, r.y, r.w, r.h, 0, 0, 4, 4);
  return { bits, color: [...g.getImageData(0, 0, 4, 4).data].filter((_, i) => i % 4 !== 3) };
}
/** 0 = identical, 1 = unrelated. */
function visualDistance(a, b) {
  let ham = 0, col = 0;
  a.bits.forEach((v, i) => { if (v !== b.bits[i]) ham++; });
  for (let i = 0; i < a.color.length; i += 3) col += Math.hypot(a.color[i] - b.color[i], a.color[i + 1] - b.color[i + 1], a.color[i + 2] - b.color[i + 2]);
  return 0.5 * (ham / 64) + 0.5 * (col / (a.color.length / 3) / 441.7);
}

/** Score candidates by what was read (number, set size, name) and by how much the photo looks like each one. */
async function rankCandidates(hints, photo) {
  let list = [];
  if (hints.number) list = await dexCandidates({ name: hints.name, number: hints.number, total: hints.total });
  if (!list.length && hints.number && hints.name) list = await dexCandidates({ number: hints.number, total: hints.total });
  if (!list.length && hints.name) list = await dexCandidates({ name: hints.name });
  if (!list.length) return [];
  const sets = await dexSets();
  const read = new Set(tokens(`${hints.name ?? ""} ${hints.text ?? ""}`));
  const setWords = new Set(tokens(hints.setName ?? ""));
  const scored = list.map((c) => {
    const nameTok = tokens(c.name), set = sets.get(setOfDexId(c.id));
    let text = nameTok.length ? (2 * nameTok.filter((w) => read.has(w)).length) / nameTok.length : 0;
    if (hints.number && sameNumber(c.localId, hints.number)) text += 2;
    if (hints.total && String(set?.cardCount?.official) === String(Number(hints.total.replace(/\D/g, "")))) text += 2;
    if (setWords.size && set) { const st = tokens(set.name); text += st.length ? st.filter((w) => setWords.has(w)).length / st.length : 0; }
    return { ...c, text, setName: set?.name ?? "", dist: null };
  }).sort((a, b) => b.text - a.text).slice(0, 16);
  return visualRank(scored, photo);
}
/** Visual tie-breaker among the best text matches: compare the photo with each catalog image. */
async function visualRank(scored, photo) {
  if (photo && scored.length > 1) {
    try {
      const url = URL.createObjectURL(photo), mine = signature(await loadImage(url));
      URL.revokeObjectURL(url);
      await Promise.all(scored.filter((c) => c.image).map(async (c) => {
        try { c.dist = visualDistance(mine, signature(await withTimeout(loadImage(`${c.image}/low.webp`, true), 8000), 1)); } catch { /* image missing */ }
      }));
    } catch (e) { console.warn("visual match skipped", e); }
  }
  const score = (c) => c.text - 10 * (c.dist ?? 0.45);
  return scored.sort((a, b) => score(b) - score(a)).map((c) => ({ ...c, score: score(c) }));
}

let ocrWorker = null;
async function ocr(canvas) {
  if (!window.Tesseract) {
    await new Promise((resolve, reject) => { const s = document.createElement("script"); s.src = TESSERACT_URL; s.onload = resolve; s.onerror = reject; document.head.appendChild(s); });
  }
  ocrWorker ??= window.Tesseract.createWorker("eng").catch((e) => { ocrWorker = null; throw e; });
  const { data } = await (await ocrWorker).recognize(canvas);
  return data.text ?? "";
}
/** Draw part of the card (fractions of the card box) upscaled and in grayscale, for OCR. */
function cropForOcr(im, [fx, fy, fw, fh], width, r = findCard(im)) {
  const sx = r.x + r.w * fx, sy = r.y + r.h * fy, sw = r.w * fw, sh = r.h * fh;
  const c = document.createElement("canvas"); c.width = width; c.height = Math.round((width * sh) / sw);
  const g = c.getContext("2d"); g.filter = "grayscale(1) contrast(1.4)"; g.drawImage(im, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}
// OCR mixes up I/l/1 and O/0: compare names in a folded alphabet.
const fold = (s) => normalize(s).replace(/[^a-z0-9]/g, "").replace(/[l1|]/g, "i").replace(/0/g, "o").replace(/5/g, "s");
const trigrams = (s) => { const out = new Set(); for (let i = 0; i + 3 <= s.length; i++) out.add(s.slice(i, i + 3)); return out; };
let allCardsPromise = null;
/** Every physical card in TCGdex (~2.4 MB, loaded once and only for the OCR fallback). */
const allDexCards = () => (allCardsPromise ??= dexGet("/cards").then((list) => {
  if (!list) { allCardsPromise = null; return []; }
  return list.filter((c) => !isPocketSet(setOfDexId(c.id)));
}));

/** Collector numbers read from the text: "199/165", and repairs like "21157203" → 215/203. */
function numberCandidates(text, sets) {
  const totals = new Set([...sets.values()].map((s) => s.cardCount?.official).filter((n) => n > 0));
  const pairs = new Map(), singles = new Set();
  const add = (a, b, weight) => {
    const na = Number(a), nb = Number(b);
    if (!(na >= 1 && totals.has(nb) && na <= nb * 1.6 + 30)) return;
    const k = `${na}/${nb}`; pairs.set(k, Math.max(pairs.get(k) ?? 0, weight));
  };
  // The rarity symbol after the number is often read as one more digit ("238/1918"): try both lengths.
  for (const m of text.matchAll(/(\d{1,3})\s?[/|\\]\s?(\d{2,4})/g)) { add(m[1], m[2].slice(0, 3), 3); add(m[1], m[2].slice(0, 2), 2.5); }
  for (const [run] of text.matchAll(/\d{4,9}/g)) {
    for (let i = 1; i <= 3; i++) {
      const a = run.slice(0, i);
      for (const skip of run[i] === "1" || run[i] === "7" ? [1, 0] : [0]) { // "/" read as 1 or 7, or dropped
        const rest = run.slice(i + skip);
        for (const n of [3, 2]) if (rest.length >= n) add(a, rest.slice(0, n), (skip ? 2 : 1.5) - (rest.length > n ? 0.5 : 0));
      }
    }
  }
  for (const [n] of text.matchAll(/(?<![\d©])\d{1,3}(?!\d)/g)) singles.add(String(Number(n)));
  return { pairs: [...pairs].map(([k, w]) => { const [num, total] = k.split("/"); return { num, total, w }; }), singles };
}

/** Candidates for an OCR reading: names that appear in the top text × numbers from the bottom. */
async function ocrCandidates(o) {
  const [cards, sets] = await Promise.all([allDexCards(), dexSets()]);
  if (!cards.length) return [];
  // Card-frame words ("Trainer", "Supporter"…) would match names like "Gym Trainer" on every card.
  const topText = o.top.replace(/\bev[oe]l[vy]es from\s+\S+/gi, " ") // the previous stage's name, not this card's
    .replace(/\b(trainer|supporter|item|stadium|pok[eé]mon|tool|basic|stage ?\d?|energy|ability|tera)\b/gi, " ");
  const topGrams = new Set(topText.split("\n").flatMap((line) => line.split(/\s{2,}|[^\p{L}\s'’.-]+/u).flatMap((part) => [...trigrams(fold(part))])));
  const nameScore = new Map();
  for (const name of new Set(cards.map((c) => c.name))) {
    const g = trigrams(fold(name));
    if (!g.size) continue;
    let hit = 0; for (const t of g) if (topGrams.has(t)) hit++;
    const cover = hit / g.size;
    // Partial reads ("UmbreonViay" for "Umbreon VMAX") still count almost fully: the picture breaks ties.
    if (cover >= 0.6) nameScore.set(name, (0.5 + 0.5 * cover) * Math.min(1, (g.size + 2) / 6)); // short names count less
  }
  const { pairs, singles } = numberCandidates(`${o.bottom}\n${o.top}`, sets);
  const scored = [];
  for (const c of cards) {
    const nm = nameScore.get(c.name) ?? 0, total = sets.get(setOfDexId(c.id))?.cardCount?.official;
    const pair = pairs.find((p) => sameNumber(c.localId, p.num) && Number(p.total) === total);
    const single = /^\d+$/.test(c.localId) && singles.has(String(Number(c.localId)));
    if (!nm && !pair) continue;
    const text = 3 * nm + (pair ? 2 + pair.w : single ? 0.5 : 0); // lone numbers are weak: HP, damage, prizes…
    scored.push({ ...c, text, setName: sets.get(setOfDexId(c.id))?.name ?? "", dist: null });
  }
  // Keep every close text match (e.g. all 36 printings of "Charizard"): the picture decides between them.
  scored.sort((a, b) => b.text - a.text);
  return scored.filter((c) => c.text >= scored[0].text - 2).slice(0, 150);
}

/** Read the card's name (top) and collector number (bottom) from the photo. */
async function ocrRead(photo, status) {
  const url = URL.createObjectURL(photo);
  allDexCards(); // start the catalog download while OCR runs
  try {
    const im = await loadImage(url);
    status("Leyendo el nombre de la carta…");
    const top = await ocr(cropForOcr(im, [0, 0, 1, 0.3], 1400));
    status("Leyendo el número de la carta…");
    const bottom = `${await ocr(cropForOcr(im, [0, 0.8, 1, 0.2], 1800))}\n${await ocr(cropForOcr(im, [0, 0.84, 0.5, 0.16], 1600))}`;
    return { top, bottom };
  } finally { URL.revokeObjectURL(url); }
}

const toBase64 = (file) => new Promise((resolve, reject) => {
  const fr = new FileReader(); fr.onload = () => resolve(String(fr.result).split(",")[1]); fr.onerror = reject; fr.readAsDataURL(file);
});
/** Claude vision via the Edge Function. Returns null when the function is not available. */
async function identifyWithAI(files) {
  if (!CONFIG.IDENTIFY_FUNCTION || !sb) return null;
  const s = (await sb.auth.getSession()).data.session;
  if (!s) return null;
  const images = await Promise.all(files.slice(0, 2).map(async (f) => ({ data: await toBase64(f), media_type: f.type || "image/jpeg" })));
  const res = await withTimeout(fetch(`${CONFIG.SUPABASE_URL}/functions/v1/${CONFIG.IDENTIFY_FUNCTION}`, {
    method: "POST", headers: { "Content-Type": "application/json", apikey: CONFIG.SUPABASE_KEY, Authorization: `Bearer ${s.access_token}` },
    body: JSON.stringify({ images }),
  }), 60000);
  if (!res.ok) { console.warn("identificar-carta", res.status, await res.text().catch(() => "")); return null; }
  return (await res.json()).card ?? null;
}

/** Photo(s) → { kind, card?, alternatives, ai?, source, confidence } or null. */
async function identifyCard(files, status) {
  status("Analizando la foto…");
  const ai = await identifyWithAI(files).catch((e) => { console.warn("AI identification unavailable", e); return null; });
  if (ai && !ai.is_trading_card) return { kind: "not-card", ai };
  if (ai && ai.category !== "pokemon") return { kind: "other", ai, source: "ia", confidence: ai.confidence };
  let hints = null, ranked;
  if (ai) {
    const [number, total] = (ai.card_number ?? "").replace(/^#/, "").split("/");
    hints = { name: ai.subject, number: number?.trim() || null, total: total?.trim() || null, setName: ai.set_name, text: `${ai.subject} ${ai.variant ?? ""}` };
    status("Buscando tu carta en el catálogo…");
    ranked = await rankCandidates(hints, files[0]);
  } else {
    const read = await ocrRead(files[0], status);
    status("Buscando tu carta en el catálogo…");
    ranked = await visualRank(await ocrCandidates(read), files[0]);
  }
  if (!ranked.length) return ai ? { kind: "other", ai, source: "ia", confidence: "baja" } : null;
  const card = await catalogFromDex(ranked[0].id);
  if (!card) return null;
  const [best, next] = ranked;
  const exact = hints ? hints.number && sameNumber(best.localId, hints.number) && best.text >= 4 : best.text >= 6;
  const clear = !next || best.score - next.score > 0.6;
  const confidence = ai ? (ai.confidence === "alta" && exact ? "alta" : "media") : exact && clear ? "alta" : exact || clear ? "media" : "baja";
  return { kind: "pokemon", card, alternatives: ranked.slice(1, 7), ai, source: ai ? "ia" : "ocr", confidence };
}

/** Short listing description written from the identified card (never invents condition). */
function describeCard(c, ai) {
  const parts = [];
  if (c) {
    const year = c.set.releaseDate?.slice(0, 4);
    parts.push(`${c.name} · ${c.number}${c.set.printedTotal ? `/${c.set.printedTotal}` : ""} del set ${c.set.name}${c.set.serie ? ` (${c.set.serie}${year ? `, ${year}` : ""})` : year ? ` (${year})` : ""}.`);
    const facts = [c.rarity && `Rareza: ${c.rarity}`, c.types?.length && `Tipo: ${c.types.join("/")}`, c.hp && `${c.hp} HP`, c.illustrator && `Ilustración de ${c.illustrator}`].filter(Boolean);
    if (facts.length) parts.push(`${facts.join(" · ")}.`);
  } else if (ai) {
    parts.push(`${ai.subject} · ${[ai.set_name, ai.year, ai.card_number, ai.variant].filter(Boolean).join(" · ")}.`);
  }
  if (ai?.is_graded && ai.grading_company && ai.grade) parts.push(`Graduada ${ai.grading_company} ${ai.grade}${ai.cert_number ? `, certificado ${ai.cert_number}` : ""}.`);
  if (ai?.condition_notes?.length) parts.push(`Revisión visual preliminar: ${ai.condition_notes.join("; ")}.`);
  return parts.join("\n");
}

  async function doCatalogSearch() {

    const gradingKey = st.graded ? `${val("company")}${grade}` : "raw";

      comps = (data ?? []).map((s) => ({ priceUsd: s.price_cents / 100, soldAt: s.sold_at }));

      ?? estimateFromQuote(st.hist?.quote); // graded, NBA/NFL: the price researched on the web

    // El anuncio nace como borrador (invisible al público) y sólo pasa a "active" cuando

    const paths = [];
