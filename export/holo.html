.pcard { position: relative; display: flex; flex-direction: column; padding: 12px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); container-type: inline-size; transition: border-color .15s var(--ease), background-color .15s var(--ease), transform .15s var(--ease); }

.media { position: relative; border-radius: 8px; container-type: inline-size; }

.media:has(img.card.loading-img), .media:has(img.card.broken), .big-art .inner:has(img.card.broken) { background: var(--muted); border-radius: 8px; }
.corner-l { position: absolute; left: 6px; top: 6px; display: flex; gap: 4px; z-index: 1; }
.corner-r { position: absolute; right: 6px; bottom: 6px; z-index: 1; }
.pcard .title { margin-top: 12px; font-size: 15px; font-weight: 700; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pcard .set { margin-top: 3px; font-size: 12px; color: var(--fg-2); text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--deco); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.pcard .foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 12px; }

label.accept { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }

.row-input { display: flex; gap: 8px; }

/* my account */

/* my account: the seller's dashboard (numbers only) */
.account.dash { max-width: none; }
.account.dash .acc-form { max-width: 640px; }
.dash-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }

@media (min-width: 1200px) { .dash-tiles { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.dtile { min-width: 0; padding: 16px; border: 1px solid var(--border); border-radius: var(--radius-xl); background: var(--card); }
.dtile .k { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--fg-2); }
.dtile .k .i { width: 15px; height: 15px; color: var(--fg-3); }
.dtile .v { margin-top: 6px; font-size: 28px; font-weight: 800; line-height: 1.1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.dtile .s { margin-top: 4px; font-size: 12px; line-height: 1.35; color: var(--fg-3); }
.dash-seg { display: inline-flex; gap: 4px; padding: 4px; border-radius: var(--radius-lg); background: var(--muted); }

.dr-card { display: flex; align-items: center; gap: 12px; min-width: 0; }

@media (min-width: 900px) {
  .dash-row { grid-template-columns: minmax(0, 1fr) 540px; align-items: center; }

  .dash-hrow { display: grid; padding: 0 0 10px; font-size: 12px; font-weight: 600; color: var(--fg-3); }

}
.of-head { display: flex; align-items: center; gap: 10px; min-width: 0; }

/* staff panel */
.admin { padding-top: 32px; display: flex; flex-direction: column; gap: 16px; }

.admin-h { margin: 16px 0 0; font-size: 18px; }
.admin-list { display: grid; gap: 12px; margin: 12px 0 0; padding: 0; list-style: none; }
.checkout { max-width: 560px; margin: 24px auto 48px; }
.admin-list > li { min-width: 0; } /* long content (e.g. the claim form) must not widen the card */
.claim-box input[type=file] { max-width: 100%; }
.claim-photos { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

@media (min-width: 900px) { .admin-list { grid-template-columns: 1fr 1fr; } }
.order-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }

/* ---------------------------------------------------------------- pages */
.page { padding-top: 40px; }
.page h1 { font-size: clamp(30px, 4.4vw, 44px); line-height: 1.05; letter-spacing: -.035em; font-weight: 800; margin-top: 12px; }

.sell .left, .sell .right { display: flex; flex-direction: column; gap: 14px; }

.step { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; }
.drop { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; width: 100%; max-width: 280px; margin: 0 auto; overflow: hidden; border: 1.5px dashed var(--input); border-radius: var(--radius-xl); background: var(--card); text-align: center; cursor: pointer; transition: border-color .15s var(--ease), background-color .15s var(--ease), box-shadow .15s var(--ease); }

.results { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }

.results img { display: block; width: 100%; aspect-ratio: 63 / 88; object-fit: contain; margin-bottom: 4px; border-radius: 5px; }
.seg, .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: var(--radius-lg); background: var(--muted); }
.seg label, .tabs button { position: relative; display: flex; align-items: center; justify-content: center; height: 36px; border: 0; border-radius: 8px; background: transparent; color: var(--fg-2); font-size: 14px; font-weight: 600; cursor: pointer; transition: color .15s var(--ease), background-color .15s var(--ease), box-shadow .15s var(--ease); }

/* ---------------------------------------------------------------- overlays */
.pop { position: fixed; z-index: 50; min-width: 220px; padding: 4px; background: var(--popover); border: 1px solid var(--input); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); }

.pop .item { display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 10px; border: 0; border-radius: var(--radius-sm); background: none; font-size: 14px; text-align: left; cursor: pointer; outline: none; transition: background-color .15s var(--ease); }
.pop .item:hover, .pop .item:focus-visible { background: var(--muted); }
.pop .item .i { color: var(--fg-2); }
.pop .item .ck { margin-left: auto; color: var(--brand); visibility: hidden; }
.pop .item[aria-checked="true"] .ck { visibility: visible; }
.pop .sep { height: 1px; margin: 4px -4px; background: var(--border); }
.pop .label { padding: 8px 10px 6px; font-size: 12px; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }
.dlg-ov { position: fixed; inset: 0; z-index: 70; background: rgb(3 7 18 / .6); }
.dlg-ov[data-state="open"] { animation: enter .2s ease; --tw-enter-opacity: 0; }
.dlg-ov[data-state="closed"] { animation: exit .2s ease forwards; --tw-exit-opacity: 0; }
.dlg, .cmd { position: fixed; z-index: 71; left: 50%; width: calc(100% - 32px); background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); }
.dlg { top: 50%; translate: -50% -50%; max-width: 440px; padding: 24px; }
.dlg h2 { font-size: 18px; font-weight: 700; }
.dlg p { margin-top: 8px; font-size: 14px; color: var(--fg-2); }
.dlg-actions { display: flex; flex-direction: column-reverse; gap: 8px; margin-top: 24px; }
@media (min-width: 640px) { .dlg-actions { flex-direction: row; justify-content: flex-end; } }
.dlg[data-state="open"], .cmd[data-state="open"] { animation: enter .2s ease; --tw-enter-opacity: 0; --tw-enter-scale: .95; }
.dlg[data-state="closed"], .cmd[data-state="closed"] { animation: exit .2s ease forwards; --tw-exit-opacity: 0; --tw-exit-scale: .95; }
.cmd { top: 12vh; translate: -50% 0; max-width: 580px; overflow: hidden; background: var(--popover); border-color: var(--input); }
@media (max-width: 640px) { .cmd { top: 12px; } }
.cmd-in { display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 14px; border-bottom: 1px solid var(--border); }
.cmd-in .i { width: 18px; height: 18px; color: var(--fg-2); }

.cmd-list { max-height: min(420px, 60vh); overflow: auto; padding: 6px; overscroll-behavior: contain; }
.cmd-group { padding: 8px 8px 4px; font-size: 12px; font-weight: 500; color: var(--fg-2); }
.cmd-item { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 8px; cursor: pointer; }
.cmd-item[aria-selected="true"] { background: var(--muted); }
.cmd-item .th { position: relative; flex-shrink: 0; width: 32px; height: 44px; overflow: hidden; border-radius: 4px; background: var(--muted); }
.cmd-item .th img { width: 100%; height: 100%; object-fit: contain; }
.cmd-item .th.ic { display: grid; place-items: center; width: 32px; height: 32px; color: var(--fg-2); }
.cmd-item .tx { flex: 1; min-width: 0; }
.cmd-item .t1, .cmd-item .t2 { display: block; }
.cmd-item .t1 { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmd-item .t2 { font-size: 12px; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmd-item .pr { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.cmd-empty { padding: 28px 16px; text-align: center; font-size: 14px; color: var(--fg-2); }

/* toasts (Sonner) */
.toaster { position: fixed; z-index: 100; right: 24px; bottom: 24px; width: 356px; display: flex; flex-direction: column; gap: 14px; margin: 0; padding: 0; list-style: none; pointer-events: none; }
@media (max-width: 600px) { .toaster { left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); width: auto; } }
.toast { display: flex; align-items: center; gap: 6px; padding: 16px; background: #fff; border: 1px solid hsl(0 0% 93%); border-radius: 8px; box-shadow: 0 4px 12px rgb(0 0 0 / .1); color: hsl(0 0% 9%); font-size: 13px; pointer-events: auto; opacity: 0; transform: translateY(100%); transition: transform .4s, opacity .4s, box-shadow .2s; }
.toast[data-mounted="true"] { opacity: 1; transform: translateY(0); }

.toast > .i { margin: 0 4px 0 -3px; }

.toast.error > .i { color: hsl(358 100% 81%); }

.toast .t { font-weight: 500; line-height: 1.5; }

/* top progress bar (BProgress) */
.bprogress { position: fixed; z-index: 1031; top: 0; left: 0; width: 100%; height: 3px; pointer-events: none; display: none; transition: opacity .2s linear; }
.bprogress.on { display: block; }
.bprogress .bar { position: absolute; inset: 0; background: var(--brand); transform: translate3d(-100%, 0, 0); transition: transform .2s ease; }
.bprogress .peg { position: absolute; right: 0; width: 100px; height: 100%; box-shadow: 0 0 10px var(--brand), 0 0 5px var(--brand); opacity: 1; transform: rotate(3deg) translate(0, -4px); }

/* footer */

/* ---------------------------------------------------------------- sign-in gate */
body.gate header.top, body.gate footer.bottom { display: none; }
.gate-wrap { position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh; display: grid; align-items: center; gap: 40px; padding: 48px 0; }
@media (min-width: 900px) { .gate-wrap { grid-template-columns: 1.1fr 1fr; gap: 64px; } }
.gate-hero .logo { font-size: 22px; margin-bottom: 28px; }
.gate-hero h1 { font-size: clamp(36px, 6vw, 58px); line-height: 1.02; letter-spacing: -.035em; font-weight: 800; }
.gate-hero p { max-width: 460px; }
.gate-hero h1, .gate-hero p { text-shadow: 0 2px 24px rgb(0 0 0 / .9); }
.gate-hero p.muted { color: #d4d4d4; }
.gate-form { width: 100%; max-width: 440px; }

/** Plays the element's closing animation (data-state="closed"), then runs done once. */
function animateOut(el, done) {
  el.dataset.state = "closed";
  let finished = false;
  const end = () => {
    if (finished) return;
    finished = true;
    el.removeEventListener("animationend", onEnd);
    done?.();
  };
  const onEnd = (e) => { if (e.target === el) end(); };
  el.addEventListener("animationend", onEnd);
  setTimeout(end, 700); // safety net if the animation never runs
}

// Open overlays, topmost last. Escape closes the top one; navigation closes all.
const layers = [];
function pushLayer(close) {
  const layer = { close };
  layers.push(layer);
  return () => { const i = layers.indexOf(layer); if (i >= 0) layers.splice(i, 1); };
}
function closeLayers() { for (const l of [...layers].reverse()) l.close(true); }
let scrollLocks = 0;
function lockScroll(on) {
  scrollLocks = Math.max(0, scrollLocks + (on ? 1 : -1));
  document.documentElement.classList.toggle("lock", scrollLocks > 0);
}
/** Keeps Tab focus inside a modal element. */
function trapFocus(root, e) {
  if (e.key !== "Tab") return;
  const f = [...root.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), select, textarea, [tabindex]:not([tabindex="-1"])')].filter((n) => n.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f.at(-1);
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

// ------------------------------------------------------------- toasts (Sonner)
function toast(message, { type = "success", description = "", duration = 4000 } = {}) {
  const box = $("#toaster");
  const el = document.createElement("li");
  el.className = `toast ${type}`;
  el.setAttribute("role", type === "error" ? "alert" : "status");
  el.innerHTML = `${ic({ success: "checkCircle", error: "alert", info: "info" }[type] ?? "info")}<div><p class="t"></p>${description ? '<p class="d"></p>' : ""}</div>`;
  el.querySelector(".t").textContent = message;
  if (description) el.querySelector(".d").textContent = description;
  box.append(el);
  while (box.children.length > 3) box.firstElementChild.remove();
  void el.offsetHeight;
  el.dataset.mounted = "true";
  let timer = 0, left = duration, since = Date.now();
  const remove = () => { el.dataset.removed = "true"; setTimeout(() => el.remove(), 400); };
  const arm = () => { since = Date.now(); timer = setTimeout(remove, Math.max(0, left)); };
  el.addEventListener("pointerenter", () => { clearTimeout(timer); left -= Date.now() - since; });
  el.addEventListener("pointerleave", arm);
  arm();
}

// ------------------------------------------------------------- top progress bar (BProgress)
const progress = (() => {
  let n = null, trickle = 0, delay = 0, token = 0;
  const root = () => $("#bprogress");
  const set = (v) => { n = Math.min(Math.max(v, 0.08), 1); root().querySelector(".bar").style.transform = `translate3d(${(n - 1) * 100}%,0,0)`; };
  const step = () => { if (n != null && n < 1) set(n + (n < 0.2 ? 0.1 : n < 0.5 ? 0.04 : n < 0.8 ? 0.02 : n < 0.99 ? 0.005 : 0)); };
  return {
    start() {
      const t = ++token;
      clearTimeout(delay);
      delay = setTimeout(() => {
        if (t !== token) return;
        const r = root();
        if (n == null || n >= 1) { r.querySelector(".bar").style.transition = "none"; set(0); void r.offsetWidth; r.querySelector(".bar").style.transition = ""; }
        r.style.opacity = "1"; r.classList.add("on");
        clearInterval(trickle); trickle = setInterval(step, 200);
      }, 100);
      return t;
    },
    done(t) {
      if (t !== token) return;
      clearTimeout(delay); clearInterval(trickle);
      if (n == null) return; // finished before the bar was shown
      set(1);
      setTimeout(() => {
        if (t !== token) return;
        root().style.opacity = "0";
        setTimeout(() => { if (t === token) { root().classList.remove("on"); n = null; } }, 200);
      }, 200);
    },
  };
})();

// ------------------------------------------------------------- dropdown menu (Radix popover motion)
/** items: [{ label, icon, href | onSelect, checked }] | "sep" | { heading } */
function openMenu(trigger, items, { align = "end" } = {}) {
  if (trigger._closeMenu) return trigger._closeMenu();
  const pop = document.createElement("div");
  pop.className = "pop";
  pop.setAttribute("role", "menu");
  pop.innerHTML = items.map((it) => {
    if (it === "sep") return '<div class="sep" role="separator"></div>';
    if (it.heading) return `<div class="label">${esc(it.heading)}</div>`;
    const attrs = `class="item" role="${it.checked == null ? "menuitem" : "menuitemradio"}"${it.checked == null ? "" : ` aria-checked="${it.checked}"`}`;
    const inner = `${it.icon ? ic(it.icon) : ""}<span>${esc(it.label)}</span>${it.checked == null ? "" : ic("check", "ck")}`;
    return it.href ? `<a ${attrs} href="${esc(it.href)}">${inner}</a>` : `<button type="button" ${attrs}>${inner}</button>`;
  }).join("");
  pop.dataset.state = "open";
  document.body.append(pop);
  const place = () => {
    const r = trigger.getBoundingClientRect(), w = pop.offsetWidth;
    pop.style.top = `${Math.round(r.bottom + 6)}px`;
    pop.style.left = `${Math.round(Math.max(8, Math.min(align === "end" ? r.right - w : r.left, innerWidth - w - 8)))}px`;
    pop.style.transformOrigin = `${align === "end" ? "right" : "left"} top`;
  };
  place();
  const entries = () => [...pop.querySelectorAll(".item")];
  const clickable = items.filter((it) => it !== "sep" && !it.heading);
  let removeLayer = () => {};
  const close = (instant) => {
    if (!trigger._closeMenu) return;
    trigger._closeMenu = null;
    removeLayer();
    document.removeEventListener("pointerdown", outside, true);
    removeEventListener("resize", onResize);
    removeEventListener("scroll", place, true);
    trigger.setAttribute("aria-expanded", "false");
    const hadFocus = pop.contains(document.activeElement);
    if (instant === true) pop.remove(); else animateOut(pop, () => pop.remove());
    if (hadFocus && instant !== true) trigger.focus();
  };
  const outside = (e) => { if (!pop.contains(e.target) && !trigger.contains(e.target)) close(); };
  const onResize = () => close(true);
  trigger._closeMenu = close;
  trigger.setAttribute("aria-expanded", "true");
  removeLayer = pushLayer(close);
  document.addEventListener("pointerdown", outside, true);
  addEventListener("resize", onResize);
  addEventListener("scroll", place, true);
  entries().forEach((node, i) => node.addEventListener("click", () => { const it = clickable[i]; close(); it.onSelect?.(); }));
  pop.addEventListener("keydown", (e) => {
    const list = entries(), at = list.indexOf(document.activeElement);
    const move = { ArrowDown: at + 1, ArrowUp: at - 1, Home: 0, End: list.length - 1 }[e.key];
    if (move != null) { e.preventDefault(); list[(move + list.length) % list.length]?.focus(); }
    else if (e.key === "Tab") close(true);
  });
  (entries().find((n) => n.getAttribute("aria-checked") === "true") ?? entries()[0])?.focus({ preventScroll: true });
}

// Every section lives in a drawer from the left, on phones, tablets and computers alike.
function toggleSideNav(force) {
  const nav = $("#sideNav"), btn = $("#menuBtn");
  const open = force ?? nav.hidden;
  if (!open) return nav._close?.();
  if (!nav.hidden) return;
  const ov = document.createElement("div");
  ov.className = "overlay";

  let removeLayer = () => {};

    if (!nav._close) return;

    nav.removeEventListener("keydown", onKey);
    nav.removeAttribute("role");
    nav.removeAttribute("aria-modal");

    animateOut(nav, hide);

// ------------------------------------------------------------- filters drawer (Vaul motion + drag to dismiss)
function openFilters() {
  const panel = $("#fpanel");
  if (!panel || panel.dataset.state === "open" || matchMedia("(min-width: 1024px)").matches) return;
  const trigger = $("#filtersBtn");
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.dataset.state = "open";
  document.body.append(ov);
  panel.style.animation = panel.style.transition = panel.style.transform = "";
  panel.dataset.state = "open";
  panel.setAttribute("role", "dialog");
  panel.setAttribute("aria-modal", "true");
  trigger?.setAttribute("aria-expanded", "true");
  lockScroll(true);
  let removeLayer = () => {}, closed = false;
  const close = (instant) => {
    if (closed) return;
    closed = true;
    removeLayer();
    lockScroll(false);
    trigger?.setAttribute("aria-expanded", "false");
    panel.removeAttribute("role");
    panel.removeAttribute("aria-modal");
    panel.removeEventListener("keydown", onKey);
    // A drag leaves inline animation/transition behind; clear them so the close animation runs
    // from wherever the finger left the drawer.
    panel.style.animation = panel.style.transition = "";
    const reset = () => { if (panel.dataset.state === "closed") { delete panel.dataset.state; panel.style.transform = ""; } };
    if (instant === true) { ov.remove(); panel.dataset.state = "closed"; reset(); return; }
    animateOut(ov, () => ov.remove());
    animateOut(panel, reset);
    trigger?.focus({ preventScroll: true });
  };
  const onKey = (e) => trapFocus(panel, e);
  panel.addEventListener("keydown", onKey);
  panel._close = close;
  ov.addEventListener("click", () => close());
  removeLayer = pushLayer(close);
  panel.focus({ preventScroll: true });
}
/** Vaul-style drag on the drawer handle: follow the finger, then close or snap back. */
function enableDrawerDrag(panel) {
  const head = panel.querySelector(".drawer-head");
  if (!head) return;
  let y0 = 0, t0 = 0, dy = 0, dragging = false;
  head.addEventListener("pointerdown", (e) => {
    if (panel.dataset.state !== "open" || e.target.closest("button")) return;
    dragging = true; y0 = e.clientY; t0 = performance.now(); dy = 0;
    try { head.setPointerCapture(e.pointerId); } catch { /* synthetic pointer */ }
    panel.style.animation = "none";
    panel.style.transition = "none";
  });
  head.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    dy = Math.max(0, e.clientY - y0);
    panel.style.transform = `translate3d(0, ${dy}px, 0)`;
  });
  const release = () => {
    if (!dragging) return;
    dragging = false;
    const velocity = dy / Math.max(1, performance.now() - t0);
    if (dy > panel.offsetHeight * 0.25 || velocity > 0.4) { panel._close?.(); return; }
    // Snap back. The inline "animation: none" stays so the open animation doesn't replay.
    panel.style.transition = "transform .5s cubic-bezier(.32,.72,0,1)";
    panel.style.transform = "translate3d(0,0,0)";
  };
  head.addEventListener("pointerup", release);
  head.addEventListener("pointercancel", release);
}

// ------------------------------------------------------------- dialogs (shadcn motion)
function modal(className, html, { label, onClose } = {}) {
  const prev = document.activeElement;
  const ov = document.createElement("div");
  ov.className = "dlg-ov";
  const d = document.createElement("div");
  d.className = className;
  d.setAttribute("role", "dialog");
  d.setAttribute("aria-modal", "true");
  if (label) d.setAttribute("aria-label", label);
  d.innerHTML = html;
  ov.dataset.state = d.dataset.state = "open";
  document.body.append(ov, d);
  lockScroll(true);
  let removeLayer = () => {}, closed = false;
  const close = (instant) => {
    if (closed) return;
    closed = true;
    removeLayer();
    lockScroll(false);
    onClose?.();
    if (instant === true) { ov.remove(); d.remove(); return; }
    animateOut(ov, () => ov.remove());
    animateOut(d, () => d.remove());
    if (prev instanceof HTMLElement && prev.isConnected) prev.focus({ preventScroll: true });
  };
  ov.addEventListener("click", () => close());
  d.addEventListener("keydown", (e) => trapFocus(d, e));
  removeLayer = pushLayer(close);
  return { el: d, close };
}
/** Promise<boolean>: an accessible replacement for window.confirm. */
function confirmDialog({ title, body, confirm = "Confirmar", cancel = "Cancelar", danger = false }) {
  return new Promise((resolve) => {
    let answer = false;
    const { el, close } = modal("dlg", `<h2 id="dlgT"></h2><p id="dlgB"></p><div class="dlg-actions"><button type="button" class="btn outline" data-v="0">${esc(cancel)}</button><button type="button" class="btn ${danger ? "destructive" : "primary"}" data-v="1">${esc(confirm)}</button></div>`, { onClose: () => resolve(answer) });
    el.setAttribute("role", "alertdialog");
    el.setAttribute("aria-labelledby", "dlgT");
    el.setAttribute("aria-describedby", "dlgB");
    el.querySelector("#dlgT").textContent = title;
    el.querySelector("#dlgB").textContent = body;
    el.addEventListener("click", (e) => { const b = e.target.closest("[data-v]"); if (b) { answer = b.dataset.v === "1"; close(); } });
    el.querySelector('[data-v="0"]').focus();
  });
}

  const s = { nba: ["#1d428a", "#c8102e"], nfl: ["#013369", "#2f6f3e"] }[l.card.category] ?? ["#444", "#888"];

function openSearch() {
  if ($(".cmd") || document.body.classList.contains("gate")) return;
  toggleSideNav(false);
  const { el, close } = modal("cmd", `<form class="cmd-in" role="search">${ic("search")}<input id="cmdQ" type="search" placeholder="Busca Charizard, Wembanyama, Prizm…" autocomplete="off" spellcheck="false" aria-label="Buscar cartas" aria-controls="cmdList" aria-autocomplete="list" role="combobox" aria-expanded="true"><kbd>Esc</kbd></form>

    <div class="cmd-foot"><span><kbd>↵</kbd> abrir</span><span><kbd>↑</kbd><kbd>↓</kbd> moverse</span><span><kbd>Esc</kbd> cerrar</span></div>`, { label: "Buscar cartas" });
  const input = el.querySelector("#cmdQ"), list = el.querySelector("#cmdList");
  let options = [], active = -1, seq = 0, timer = 0;
  const setActive = (i) => {
    active = options.length ? (i + options.length) % options.length : -1;
    options.forEach((o, j) => o.setAttribute("aria-selected", String(j === active)));
    if (active >= 0) { options[active].scrollIntoView({ block: "nearest" }); input.setAttribute("aria-activedescendant", options[active].id); }
    else input.removeAttribute("aria-activedescendant");
  };
  const paint = (html) => {
    list.innerHTML = html;
    options = [...list.querySelectorAll(".cmd-item")];
    options.forEach((o, i) => { o.id = `cmdo${i}`; o.addEventListener("pointermove", () => { if (active !== i) setActive(i); }); });
    setActive(0);
  };
  const quick = () => paint(`<p class="cmd-group">Explorar</p>${[...CATEGORIES.map((c) => [c.name, `#/?cat=${c.slug}`]), ["Cartas graduadas", "#/?tipo=graded"], ["Compra Protegida", "#/protegida"]]
    .map(([t, h]) => `<a class="cmd-item" role="option" href="${h}"><span class="th ic">${ic(h === "#/protegida" ? "shield" : "arrowRight")}</span><span class="tx"><span class="t1">${esc(t)}</span></span></a>`).join("")}`);
  const row = (l) => `<a class="cmd-item" role="option" href="#/carta/${encodeURIComponent(l.id)}">${thumbArt(l)}<span class="tx"><span class="t1">${esc(l.title)}</span><span class="t2">${esc([categoryName(l.card.category), l.card.setName, l.location.neighborhood].filter(Boolean).join(" · "))}</span></span><span class="pr">${formatUsd(toCents(l.priceUsd))}</span></a>`;
  const all = (q) => `<a class="cmd-item" role="option" href="#/?q=${encodeURIComponent(q)}"><span class="th ic">${ic("search")}</span><span class="tx"><span class="t1">Ver todos los resultados para “${esc(q)}”</span></span></a>`;
  const render = (q, found) => paint(found.length
    ? `<p class="cmd-group">Cartas</p>${found.slice(0, 6).map(row).join("")}${all(q)}`
    : `<p class="cmd-empty">No encontramos cartas para “${esc(q)}”.</p>${all(q)}`);
  const search = () => {
    const q = input.value.trim(), mine = ++seq;
    if (!q) return quick();
    const f = { q };
    const local = [...(CONFIG.SHOW_DEMO_LISTINGS ? DEMO : []), ...listingCache.values()].filter((l) => matchesFilters(l, f));
    render(q, local);
    if (!sb) return; // visitors without an account can search real listings too
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const real = await fetchRealListings(f).catch(() => []);
      if (mine !== seq || !el.isConnected) return;
      rememberListings(real);
      const seen = new Set(local.map((l) => l.id));
      render(q, [...local, ...real.filter((l) => !seen.has(l.id))]);
    }, 220);
  };
  input.addEventListener("input", search);
  input.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); setActive(active + (e.key === "ArrowDown" ? 1 : -1)); }
  });
  el.querySelector("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const q = input.value.trim(), target = options[active]?.getAttribute("href") ?? (q ? `#/?q=${encodeURIComponent(q)}` : "#/");
    close();
    if (location.hash === target) route(); else location.hash = target;
  });
  list.addEventListener("click", (e) => { const a = e.target.closest("a.cmd-item"); if (a && a.getAttribute("href") === location.hash) { e.preventDefault(); close(); } });
  quick();
  input.focus();
}

// First-party funnel events. Visitors get a random id kept in their browser; no IP,

let trackOff = false;
function visitorId() {

const missingKind = (e) => photoKinds && e?.code === "42703" && /kind/.test(e?.message ?? "");
const photoUrl = (path) => `${CONFIG.SUPABASE_URL}/storage/v1/object/public/listing-photos/${path.split("/").map(encodeURIComponent).join("/")}`;

const profilePhotoUrl = (path) => path ? `${CONFIG.SUPABASE_URL}/storage/v1/object/public/profile-photos/${path.split("/").map(encodeURIComponent).join("/")}` : null;
function profileToSeller(id, prof) {

async function withProfiles(rows) {

// "Revisada por <tienda>" (migration 0011). Until it runs there are simply no badges.
let authChecksOn = true;
async function withAuthChecks(listings) {
  if (!authChecksOn || !listings.length) return listings;
  const { data, error } = await sb.from("listing_authenticity").select("listing_id, shop_name, checked_at").in("listing_id", listings.map((l) => l.id));
  if (error) {

    return listings;
  }
  const byId = new Map((data ?? []).map((c) => [c.listing_id, c]));
  for (const l of listings) {

}
// Accent-insensitive search in the database: "pacifica" finds "Pacífica" and "pokemon" finds "Pokémon".
// Each word becomes a case-insensitive regex (PostgREST imatch) in which vowels, n and c also match
// their accented forms. Only letters, digits and # / & - survive, so nothing can break the filter syntax.
const ACCENTS = { a: "aáàâäã", e: "eéèêë", i: "iíìîï", o: "oóòôöõ", u: "uúùûü", n: "nñ", c: "cç" };
const searchTokens = (q) => normalize(q).replace(/[^\p{L}\p{N}#/&-]+/gu, " ").split(/\s+/).filter((t) => t.length >= 2).slice(0, 5);
const searchFilter = (t, cols) => {
  const re = [...t].map((ch) => (ACCENTS[ch] ? `[${ACCENTS[ch]}]` : ch)).join("");
  return cols.map((c) => `${c}.imatch.${re}`).join(",");
};

// "Tienda verificada" = shop flag + verified by Holo staff. Everyone else is a "particular".
const isVerifiedShop = (seller) => Boolean(seller?.isShop && seller?.verified);
async function verifiedShopIds() {
  const { data, error } = await sb.from("public_profiles").select("id").eq("is_shop", true).eq("verified", true);
  if (error) { console.error(error); return []; }
  return (data ?? []).map((p) => p.id);
}

async function fetchRealListings(f) {
  if (!sb) return [];
  let q = sb.from("listings").select(listingCols()).eq("status", "active").limit(60);
  if (f.seller) {
    const shops = await verifiedShopIds();
    if (f.seller === "tiendas") {
      if (!shops.length) return [];
      q = q.in("seller_id", shops);
    } else if (shops.length) {
      q = q.not("seller_id", "in", `(${shops.join(",")})`);
    }
  }
  if (f.category) q = q.eq("category", f.category);
  if (f.graded === "graded") q = q.not("grading_company", "is", null);
  if (f.graded === "raw") q = q.is("grading_company", null);
  if (f.province) q = q.eq("province", f.province);
  if (f.minPrice != null) q = q.gte("price_cents", Math.round(f.minPrice * 100));
  if (f.maxPrice != null) q = q.lte("price_cents", Math.round(f.maxPrice * 100));
  for (const t of searchTokens(f.q)) q = q.or(searchFilter(t, ["title", "subject", "set_name", "variant", "number", "neighborhood", "district", "province"]));
  // Sort in the database too, so a price sort brings the cheapest (or priciest) of all listings, not of the newest 60.
  q = f.sort === "precio-asc" || f.sort === "precio-desc" ? q.order("price_cents", { ascending: f.sort === "precio-asc" }) : q.order("created_at", { ascending: false });
  const { data, error } = await q;
  if (missingKind(error)) { photoKinds = false; return fetchRealListings(f); }
  if (error) { console.error(error); return []; }
  return withProfiles(data ?? []);
}
async function fetchSellerProfile(id) {
  let { data, error } = await sb.from("public_profiles").select("id, display_name, is_shop, verified, avatar_path, shop_description, shop_photo_path, created_at").eq("id", id).maybeSingle();
  if (error) ({ data } = await sb.from("public_profiles").select("id, display_name, is_shop, verified, created_at").eq("id", id).maybeSingle());
  return data ?? null;
}
async function fetchSellerListings(id, prof) {
  const { data, error } = await sb.from("listings").select(listingCols()).eq("seller_id", id).eq("status", "active").order("created_at", { ascending: false }).limit(100);
  if (missingKind(error)) { photoKinds = false; return fetchSellerListings(id, prof); }
  if (error) { console.error(error); return []; }
  const listings = (data ?? []).map((r) => rowToListing(r, prof));
  await Promise.all([applySellerStats(listings.map((l) => l.seller)), withAuthChecks(listings)]);
  return listings;
}
async function fetchRealListing(id) {
  if (!sb) return null;
  const { data, error } = await sb.from("listings").select(listingCols()).eq("id", id).maybeSingle();
  if (missingKind(error)) { photoKinds = false; return fetchRealListing(id); }
  if (error || !data) return null;
  return (await withProfiles([data]))[0];
}

function matchesFilters(l, f) {
  if (f.seller === "tiendas" && !isVerifiedShop(l.seller)) return false;
  if (f.seller === "particulares" && isVerifiedShop(l.seller)) return false;
  if (f.category && l.card.category !== f.category) return false;
  if (f.graded === "graded" && !l.grading) return false;
  if (f.graded === "raw" && l.grading) return false;
  if (f.province && l.location.province !== f.province) return false;
  if (f.minPrice != null && l.priceUsd < f.minPrice) return false;
  if (f.maxPrice != null && l.priceUsd > f.maxPrice) return false;
  if (f.q) {
    // Same words as the database search (searchTokens), so demo and real listings match alike.
    const hay = normalize([l.title, l.card.subject, l.card.setName, l.card.variant, l.card.number, l.location.neighborhood, l.location.district, l.location.province].join(" "));
    if (!searchTokens(f.q).every((t) => hay.includes(t))) return false;
  }
  return true;
}
function sortListings(list, sort) {
  const c = [...list];
  if (sort === "precio-asc") c.sort((a, b) => a.priceUsd - b.priceUsd);
  else if (sort === "precio-desc") c.sort((a, b) => b.priceUsd - a.priceUsd);
  else c.sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  return c;
}

// ============================================================= router
function parseHash() {
  const raw = location.hash.replace(/^#/, "") || "/";
  const [path, qs] = raw.split("?");
  return { path, params: new URLSearchParams(qs ?? "") };
}
function go(path) { location.hash = path; }
function filtersFrom(params) {
  const num = (k) => { const v = params.get(k); const n = v ? Number(v) : NaN; return Number.isFinite(n) && n >= 0 ? n : undefined; };
  const tipo = params.get("tipo"), orden = params.get("orden"), vendedor = params.get("vendedor");
  return {
    seller: vendedor === "tiendas" || vendedor === "particulares" ? vendedor : undefined,
    q: params.get("q")?.trim() || undefined, category: params.get("cat") || undefined,
    graded: tipo === "raw" || tipo === "graded" ? tipo : undefined, province: params.get("provincia") || undefined,
    minPrice: num("min"), maxPrice: num("max"), sort: orden === "precio-asc" || orden === "precio-desc" ? orden : "recientes",
  };
}
function hrefWith(f, patch) {
  const base = { vendedor: f.seller, q: f.q, cat: f.category, tipo: f.graded, provincia: f.province, min: f.minPrice, max: f.maxPrice, orden: f.sort === "recientes" ? undefined : f.sort };
  const p = new URLSearchParams();
  for (const [k, v] of Object.entries({ ...base, ...patch })) if (v != null && v !== "") p.set(k, v);
  const s = p.toString();
  return s ? `#/?${s}` : "#/";
}

const safeDecode = (s) => { try { return decodeURIComponent(s); } catch { return s; } };
async function route() {
  const { path, params } = parseHash();
  closeLayers();
  if (keepScrollOnce) keepScrollOnce = false; // filter changes keep the user where they are
  else window.scrollTo(0, 0);
  renderNav();
  const app = $("#app");
  // Anyone can browse (so shared links open the card). Only the account and staff pages
  // need a session; /vender and the contact buttons ask for it themselves.
  const needsLogin = !!sb && !session && (path === "/cuenta" || path === "/admin" || path.startsWith("/pagar/"));
  const gated = needsLogin || (!!sb && !session && path === "/entrar");
  document.body.classList.toggle("gate", gated);
  app.classList.remove("view-in");
  void app.offsetWidth;
  app.classList.add("view-in");
  const busy = progress.start();
  try {
    if (needsLogin) return viewAuth(app, location.hash.replace(/^#/, "") || "/");
    if (path === "/" || path === "") return await viewHome(app, params);
    if (path.startsWith("/carta/")) return await viewDetail(app, safeDecode(path.slice(7)));
    if (path.startsWith("/vendedor/")) return await viewSeller(app, safeDecode(path.slice(10)), params);
    if (path === "/protegida") return viewProtected(app);
    if (path === "/escanear") return viewScan(app);
    if (path === "/terminos") return viewTerms(app);
    if (path === "/privacidad") return viewPrivacy(app);
    if (path === "/entrar") return viewAuth(app, params.get("next") || "/");
    if (path === "/vender") return viewSell(app);
    if (path.startsWith("/pagar/")) { app.innerHTML = `<div class="wrap"></div>`; return await viewCheckout(app.firstElementChild, safeDecode(path.slice(7))); }
    // Account and staff pages render into a padded column.
    if (path === "/cuenta" || path === "/admin") {
      app.innerHTML = `<div class="wrap"></div>`;
      return path === "/cuenta" ? await viewAccount(app.firstElementChild) : await viewAdmin(app.firstElementChild, params);
    }
    setTitle("Página no encontrada");
    app.innerHTML = `<div class="wrap"><div class="empty-state" style="margin-top:48px"><span class="ico">${ic("search")}</span><p style="font-weight:600">Página no encontrada.</p><p class="small muted" style="margin:4px 0 16px">El enlace puede estar roto o la página ya no existe.</p><a class="btn primary" href="#/">Volver al inicio</a></div></div>`;
  } catch (e) {
    console.error(e);
    app.innerHTML = `<div class="wrap"><p class="notice bad" style="margin-top:24px">Algo salió mal. Recarga la página.</p></div>`;
  } finally {
    progress.done(busy);
  }
}

    : sb ? `<a class="acct" href="#/entrar" aria-label="Iniciar sesión"><span class="avatar">${ic("user")}</span><span class="nm">Iniciar sesión</span></a>${sell}` : sell;

function cardArt(l) {
  if (l.photos[0]) return `<img class="card loading-img" src="${esc(l.photos[0])}" alt="${esc(l.title)}" loading="lazy" decoding="async">`;

  const pct = (v) => `${at(v)}%`;

    <ul class="basis">${est.basis.map((b) => `<li>${ic("check")}<span>${esc(b)}</span></li>`).join("")}</ul>

// ============================================================= price history
// Valor en el tiempo. La base es el historial semanal incrustado en este mismo
// archivo (<script id="precios-data">), que un GitHub Action actualiza cada lunes
// con scripts/actualizar-precios.mjs: TCGplayer vía tcgcsv.com (desde feb 2024) y
// la guía de precios oficial de Cardmarket. Encima va el precio de hoy de TCGdex
// y, si existen, las ventas registradas en Panamá. La tabla price_snapshots de
// Supabase (supabase/price_snapshots.sql) es opcional (CONFIG.PRICE_SNAPSHOTS).
const CHART_COLORS = { market: "#ffffff", cardmarket: "#60a5fa", sales: "#f5a524", web: "#94a3b8" };
const DAY_MS = 86400000;
const CHART_RANGES = [["1M", 30, "30 días"], ["3M", 90, "90 días"], ["1A", 365, "1 año"], ["Todo", Infinity, "Todo el historial"]];
const isoDay = (d) => d.toISOString().slice(0, 10);
const noonUtc = (day) => Date.parse(`${day}T12:00:00Z`);
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
const fmtDay = (t, year) => new Intl.DateTimeFormat("es-PA", year ? { day: "numeric", month: "short", year: "numeric" } : { day: "numeric", month: "short" }).format(t);
const fmtAxis = (v) => (v >= 1000 ? `$${+(v / 1000).toFixed(1)}k` : `$${+v.toFixed(v < 10 ? 2 : 0)}`);
const median = (xs) => { const a = [...xs].sort((x, y) => x - y); return a.length ? quantile(a, 0.5) : null; };

let preciosData = null;
/** Historial semanal incrustado (vacío si el bloque falta o está dañado). */
function storedPrices() {
  if (!preciosData) {
    try { preciosData = JSON.parse($("#precios-data")?.textContent || "{}"); } catch { preciosData = {}; }
    preciosData.cartas ??= {};
  }
  return preciosData;
}

const TCGDEX_API = "https://api.tcgdex.net/v2/en";
/** pokemontcg.io ids (sv3pt5-199, swsh12pt5-1) → TCGdex ids (sv03.5-199, swsh12.5-1). */
function tcgdexId(id) {
  const i = id.lastIndexOf("-"), set = id.slice(0, i), m = set.match(/^([a-z]+)(\d+)(pt5)?$/);
  return `${m ? `${m[1]}${m[1] === "sv" ? m[2].padStart(2, "0") : m[2]}${m[3] ? ".5" : ""}` : set}-${id.slice(i + 1)}`;
}
/** TCGdex ids (sv03.5-006) → pokemontcg.io ids (sv3pt5-6), the format stored in listings.catalog_id. */
function ptcgId(dexId) {
  const i = dexId.lastIndexOf("-"), set = dexId.slice(0, i), num = dexId.slice(i + 1);
  return `${set.replace(/^([a-z]+)0+(?=\d)/, "$1").replace(/\.5$/, "pt5")}-${/^\d+$/.test(num) ? String(Number(num)) : num}`;
}
const dexCache = new Map();
/** GET on the TCGdex API, cached per page load (failures are not cached). */
function dexGet(path) {
  if (!dexCache.has(path)) {
    dexCache.set(path, withTimeout(fetch(`${TCGDEX_API}${path}`), 10000).then((r) => (r.ok ? r.json() : null))
      .catch(() => { dexCache.delete(path); return null; }));
  }
  return dexCache.get(path);
}
/** TCGdex card for a listing. TCGdex pads numbers (sv03.5-006) and pokemontcg.io does not (sv3pt5-6). */
async function fetchDexCard(card) {
  const ids = [card.dexId, card.catalogId && tcgdexId(card.catalogId)].filter(Boolean);
  const m = ids.at(-1)?.match(/^(.*-)(\d{1,2})$/);
  if (m) ids.push(`${m[1]}${m[2].padStart(3, "0")}`);
  for (const id of new Set(ids)) { const d = await dexGet(`/cards/${encodeURIComponent(id)}`); if (d) return d; }
  return null;
}
let eurUsdPromise = null;
/** EUR→USD from the European Central Bank reference rate (Frankfurter). */
const eurUsd = () => (eurUsdPromise ??= withTimeout(fetch("https://api.frankfurter.dev/v1/latest?from=EUR&to=USD"), 8000)
  .then((r) => r.json()).then((j) => ({ rate: j.rates.USD, date: j.date })).catch(() => null));

// Daily copy of Cardmarket's official price guide (github.com/ZyzyThePizi/pokemon-price-data, since
// 2026-09-16). The weekly job already stores it for tracked cards; this gives the same days to cards
// that are not tracked yet (e.g. one just identified from a photo).
const CM_MIRROR = "https://raw.githubusercontent.com/ZyzyThePizi/pokemon-price-data/main";
const cmShards = new Map();
let cmFieldsPromise = null, eurUsdDaysPromise = null;
async function cardmarketMirror(idProduct) {
  cmFieldsPromise ??= withTimeout(fetch(`${CM_MIRROR}/prices/manifest.json`), 8000).then((r) => r.json()).then((j) => j.historyFields).catch(() => { cmFieldsPromise = null; return null; });
  const shard = idProduct % 1000;
  if (!cmShards.has(shard)) cmShards.set(shard, withTimeout(fetch(`${CM_MIRROR}/history/${shard}.json`), 10000).then((r) => (r.ok ? r.json() : null)).catch(() => { cmShards.delete(shard); return null; }));
  const [fields, data] = await Promise.all([cmFieldsPromise, cmShards.get(shard)]);
  if (!fields || !data) return [];
  return (data[String(idProduct)] ?? []).map((row) => Object.fromEntries(fields.map((k, i) => [k, row[i]])));
}
/** ECB EUR→USD rate per day since the mirror started, so each point uses the rate of its own date. */
async function eurUsdDays() {
  eurUsdDaysPromise ??= withTimeout(fetch("https://api.frankfurter.dev/v1/2026-09-01..?base=EUR&symbols=USD"), 8000)
    .then((r) => r.json()).then((j) => Object.entries(j.rates).map(([d, r]) => [d, r.USD]).sort()).catch(() => { eurUsdDaysPromise = null; return []; });
  return eurUsdDaysPromise;
}
const rateOn = (days, d) => { let r = null; for (const [day, v] of days) { if (day > d) break; r = v; } return r ?? days[0]?.[1] ?? null; };

/** Agrega un punto al final de la serie si es de un día posterior al último (o lo reemplaza si es el mismo día). */
function appendLatest(series, p) {
  const last = series.at(-1);
  if (!last || isoDay(new Date(p.t)) > isoDay(new Date(last.t))) series.push(p);
  else if (isoDay(new Date(p.t)) === isoDay(new Date(last.t))) series[series.length - 1] = p;
}

async function fetchPriceHistory(l) {
  const { catalogId, category } = l.card;
  const factor = l.grading ? 1 : CONDITION_FACTOR[l.condition] ?? 1;
  const store = storedPrices();
  const h = { market: [], cardmarket: [], sales: [], web: [], quote: null, quoteTried: false, factor, fx: null, productId: null, cmUpdated: null, updated: store.actualizado ?? null, weekly: false, liveMarket: false, liveCm: false };
  if (catalogId && !l.grading && category === "pokemon") {
    const stored = store.cartas[catalogId];
    const [dbRows, dex, fx] = await Promise.all([
      (async () => {
        if (!sb || !CONFIG.PRICE_SNAPSHOTS) return [];
        await withTimeout(sb.rpc("snapshot_price", { p_catalog_id: catalogId }), 6000).catch(() => {});
        const { data } = await sb.from("price_snapshots").select("variant, market_cents, captured_on").eq("catalog_id", catalogId).order("captured_on").limit(1500);
        return data ?? [];
      })().catch(() => []),
      fetchDexCard(l.card),
      eurUsd(),
    ]);
    // TCGplayer (EE.UU.): un precio de mercado por semana + el de hoy.
    const tpStored = stored?.series?.tcgplayer ?? {};
    const key = pickVariantKey(Object.keys(tpStored), l.card.variant);
    h.market = (tpStored[key] ?? []).filter((p) => p.market > 0)
      .map((p) => ({ t: noonUtc(p.d), v: round2(p.market * factor), k: "precio de mercado", carried: !!p.carried, src: p.fuente }));
    h.productId = stored?.tcgplayer?.productId ?? null;
    const dbKey = dbRows.length ? pickVariantKey([...new Set(dbRows.map((r) => r.variant))], key ?? l.card.variant) : null;
    for (const r of dbRows.filter((r) => r.variant === dbKey)) appendLatest(h.market, { t: noonUtc(r.captured_on), v: round2((r.market_cents / 100) * factor), k: "precio de mercado", src: "supabase" });
    const tp = dex?.pricing?.tcgplayer;
    if (tp) {
      const tkey = pickVariantKey(Object.keys(tp).filter((k) => typeof tp[k] === "object" && tp[k]), key ?? l.card.variant);
      const v = tp[tkey]?.marketPrice ?? tp[tkey]?.midPrice;
      h.productId ??= tp[tkey]?.productId ?? null;
      if (v > 0) { appendLatest(h.market, { t: noonUtc(isoDay(new Date(tp.updated ?? Date.now()))), v: round2(v * factor), k: "precio de mercado", src: "tcgdex" }); h.liveMarket = h.market.at(-1).src === "tcgdex"; }
    }
    // Cardmarket (Europa): promedio de ventas reales de los últimos 7 días, en USD con la tasa del BCE de cada fecha.
    const cmValue = (p) => (p.avg7 > 0 ? [p.avg7, "promedio de ventas, últimos 7 días"] : p.trend > 0 ? [p.trend, "precio de tendencia"] : [null]);
    h.cardmarket = (stored?.series?.cardmarket ?? []).filter((p) => p.eurUsd && cmValue(p)[0])
      .map((p) => { const [eur, k] = cmValue(p); return { t: noonUtc(p.d), v: round2(eur * p.eurUsd * factor), k, carried: !!p.carried, src: p.fuente, rate: p.eurUsd }; });
    const cm = dex?.pricing?.cardmarket;
    if (!h.cardmarket.length && cm?.idProduct) {
      const [rows, days] = await Promise.all([cardmarketMirror(cm.idProduct).catch(() => []), eurUsdDays()]);
      for (const o of rows) {
        const [eur, k] = cmValue(o), rate = rateOn(days, o.date);
        if (eur && rate) h.cardmarket.push({ t: noonUtc(o.date), v: round2(eur * rate * factor), k, src: "cardmarket-espejo", rate });
      }
    }
    if (cm && fx && cmValue(cm)[0]) {
      const [eur, k] = cmValue(cm);
      h.fx = fx; h.cmUpdated = Date.parse(cm.updated);
      appendLatest(h.cardmarket, { t: noonUtc(isoDay(new Date(h.cmUpdated))), v: round2(eur * fx.rate * factor), k, src: "tcgdex", rate: fx.rate });
      h.liveCm = h.cardmarket.at(-1).src === "tcgdex";
    }
    h.weekly = h.market.length > 4 || h.cardmarket.length > 4;
  }
  if (sb && catalogId && !l.isDemo) {
    const gradingKey = l.grading ? `${l.grading.company}${l.grading.grade}` : "raw";
    const since = new Date(Date.now() - 366 * DAY_MS).toISOString();
    const { data } = await sb.from("sales").select("price_cents, sold_at").eq("catalog_id", catalogId).eq("grading_key", gradingKey).gte("sold_at", since).order("sold_at").limit(500);
    h.sales = (data ?? []).map((r) => ({ t: Date.parse(r.sold_at), v: r.price_cents / 100 }));
  }
  // The free catalogs have no price (graded cards, NBA/NFL, catalog down): PriceCharting/SportsCardsPro
  // (real sold listings per grade), and if that fails, research it on the web with the Edge Function.
  if (!h.market.length && !h.cardmarket.length && l.card.subject) {
    h.quoteTried = true;
    h.quote = await fetchPriceCharting(l, factor).catch((e) => { console.warn("pricecharting", e); return null; })
      ?? await fetchMarketQuote(l).catch((e) => { console.warn("market quote", e); return null; });
    if (h.quote) {
      const src = h.quote.sources[0];
      h.web = h.quote.history?.length
        ? h.quote.history.map((p) => ({ t: p.t, v: p.v, src: src.name, url: src.url, k: `${src.name} · valor del mes` }))
        : h.quote.sales.map((s) => ({ t: noonUtc(s.date), v: s.price, src: s.source, url: s.url })).sort((a, b) => a.t - b.t);
      const today = noonUtc(isoDay(new Date()));
      if (!h.web.length || h.web.at(-1).t < today) h.web.push({ t: today, v: h.quote.market_price, src: "valor aproximado", today: true });
    }
  }
  return h;
}

// Market price researched on the web by the Edge Function (action "price": Claude + web search over
// eBay sold listings, PriceCharting, 130point, PSA…). Cached 24 h in Supabase and 12 h in this browser.
const quotePromises = new Map();
function quoteCard(l) {
  const c = l.card;
  return {
    category: c.category, subject: c.subject ?? "", set_name: c.setName ?? "", year: c.year ?? "", number: c.number ?? "", variant: c.variant ?? "",
    grading_company: l.grading?.company ?? "", grade: l.grading?.grade ?? "", condition: l.grading ? "" : l.condition ?? "NM",
  };
}
function fetchMarketQuote(l) {
  if (!CONFIG.IDENTIFY_FUNCTION) return Promise.resolve(null);
  const card = quoteCard(l), key = `holo-quote:${JSON.stringify(card).toLowerCase()}`;
  try {
    const kept = JSON.parse(localStorage.getItem(key) ?? "null");
    if (kept?.market_price > 0 && Date.now() - Date.parse(kept.fetched_at) < 12 * 3600000) return Promise.resolve(kept);
  } catch { /* storage unavailable */ }
  if (!quotePromises.has(key)) {
    const p = (async () => {
      const s = sb ? (await sb.auth.getSession()).data.session : null;
      const res = await withTimeout(fetch(`${CONFIG.SUPABASE_URL}/functions/v1/${CONFIG.IDENTIFY_FUNCTION}`, {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: CONFIG.SUPABASE_KEY, Authorization: `Bearer ${s?.access_token ?? CONFIG.SUPABASE_KEY}` },
        body: JSON.stringify({ action: "price", card }),
      }), 120000);
      if (!res.ok) throw new Error(`price ${res.status} ${await res.text().catch(() => "")}`);
      const q = (await res.json()).quote;
      if (!(q?.market_price > 0)) throw new Error("price: empty quote");
      try { localStorage.setItem(key, JSON.stringify(q)); } catch { /* storage unavailable */ }
      return q;
    })();
    quotePromises.set(key, p);
    p.catch(() => quotePromises.delete(key));
  }
  return quotePromises.get(key);
}
/** A listing estimate (same shape as estimatePrice) from a web quote. */
function estimateFromQuote(q) {
  if (!(q?.market_price > 0)) return null;
  return { low: round2(q.low), mid: round2(q.market_price), high: round2(q.high), currency: "USD", confidence: q.sales.length >= 5 ? "media" : "baja", basis: [q.basis || "Ventas recientes encontradas en internet"], source: "web", updatedAt: q.fetched_at };
}

// PriceCharting (Pokémon) / SportsCardsPro (NBA, NFL): value per grade (Ungraded, PSA 10, CGC 10, 9.5…)
// from real eBay/TCGplayer sold listings, a monthly history since release, and the listings themselves
// with links. Neither site sends CORS headers, so pages are read through the r.jina.ai reader
// (keyless, CORS-enabled, ~20 requests/min per visitor). Works without the Edge Function; 12 h cache here.
const PC_READER = "https://r.jina.ai/";
const pcPromises = new Map();
const pcNorm = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/&amp;/g, "&").replace(/[^a-z0-9]+/g, " ").trim();
const pcTokens = (s) => pcNorm(s).split(" ").filter(Boolean);
const pcMoney = (s) => { const n = Number(String(s ?? "").replace(/[^0-9.]/g, "")); return n > 0 ? n : null; };
const pcNum = (s) => (String(s ?? "").split("/")[0].match(/[a-z]*\d+[a-z]*/i)?.[0] ?? "").toLowerCase().replace(/^([a-z]*)0+(?=\d)/, "$1");
async function pcPage(url) {
  const res = await withTimeout(fetch(PC_READER + url, { headers: { "X-Return-Format": "html" } }), 45000);
  if (!res.ok) throw new Error(`pricecharting ${res.status}`);
  const html = await res.text();
  return { doc: new DOMParser().parseFromString(html, "text/html"), chart: html.match(/chart_data\s*=\s*(\{.*?\});/s)?.[1] ?? null };
}
/** Which PriceCharting column holds this grade: chart series, sold-listings block and price-guide label. */
function pcGrade(l) {
  const g = l.grading;
  if (!g) return { chart: "used", sales: "used", label: "Ungraded", name: "sin graduar" };

    const p = (s[i - 1] * h[i] + s[i] * h[i - 1]) / (h[i - 1] + h[i]);

}

  const X = (t) => m.l + ((t - xMin) / (xMax - xMin)) * (W - m.l - m.r);
  const Y = (v) => m.t + (1 - (v - yMin) / (yMax - yMin)) * (H - m.t - m.b);
  const xTicks = [0, 1 / 3, 2 / 3, 1].map((f) => xMin + f * (xMax - xMin));
  const spansYear = new Date(xMin).getFullYear() !== new Date(xMax).getFullYear();
  const line = monotonePath(market.map((p) => [X(p.t), Y(p.v)]));
  const cmLine = monotonePath(cmk.map((p) => [X(p.t), Y(p.v)]));
  const webLine = monotonePath(web.map((p) => [X(p.t), Y(p.v)]));
  const last = market.at(-1), base = H - m.b;
  const area = market.length > 1 ? `${line}L${X(last.t).toFixed(1)},${base}L${X(market[0].t).toFixed(1)},${base}Z` : "";
  const dot = (p, color, r = 4) => `<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="${r}" fill="${color}" stroke="var(--card)" stroke-width="2"/>`;

  wrap.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" tabindex="0" role="img" aria-label="Gráfica del valor de mercado en TCGplayer y Cardmarket en el tiempo. Usa las flechas para recorrer los puntos.">
    <defs>
      <pattern id="pcDots" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="${CHART_COLORS.market}" fill-opacity=".6"/></pattern>
      <linearGradient id="pcFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <mask id="pcMask" maskUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${H}"><rect x="0" y="${m.t}" width="${W}" height="${base - m.t}" fill="url(#pcFade)"/></mask>
      <clipPath id="pcClip"><rect x="0" y="0" width="${animate ? 0 : W}" height="${H}"/></clipPath>
    </defs>
    ${ticks.map((v) => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 3"/><text class="axis" x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end">${fmtAxis(v)}</text>`).join("")}
    ${xTicks.map((t, i) => `<text class="axis" x="${X(t)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === 3 ? "end" : "middle"}">${i === 3 ? "Hoy" : fmtDay(t, spansYear)}</text>`).join("")}
    ${price != null ? `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(price)}" y2="${Y(price)}" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="4 4" opacity=".6"/>
    <text class="axis" x="${W - m.r}" y="${Y(price) - 7}" text-anchor="end" style="fill:var(--fg);font-weight:600">${esc(l.priceLabel ?? "Este anuncio")} ${formatUsd(toCents(price))}</text>` : ""}
    <g clip-path="url(#pcClip)">
      ${area ? `<path d="${area}" fill="url(#pcDots)" mask="url(#pcMask)"/>` : ""}
      ${market.length > 1 ? `<path d="${line}" fill="none" stroke="${CHART_COLORS.market}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>` : ""}
      ${cmk.length > 1 ? `<path d="${cmLine}" fill="none" stroke="${CHART_COLORS.cardmarket}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : ""}
      ${(cmk.length > 12 ? cmk.slice(-1) : cmk).map((p) => dot(p, CHART_COLORS.cardmarket)).join("")}
      ${sales.map((p) => dot(p, CHART_COLORS.sales, 4.5)).join("")}
      ${web.length > 1 ? `<path d="${webLine}" fill="none" stroke="${CHART_COLORS.web}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>` : ""}
      ${web.map((p) => (p.today ? `<circle class="ping" cx="${X(p.t)}" cy="${Y(p.v)}" r="4.5" fill="${CHART_COLORS.web}" opacity=".75"/>${dot(p, CHART_COLORS.web, 4.5)}` : dot(p, CHART_COLORS.web, 3))).join("")}
      ${last ? `<circle class="ping" cx="${X(last.t)}" cy="${Y(last.v)}" r="4.5" fill="${CHART_COLORS.market}" opacity=".75"/>${dot(last, CHART_COLORS.market, 4.5)}` : ""}
    </g>
    <g class="cross" style="display:none"><line y1="${m.t}" y2="${base}" stroke="var(--fg-3)" stroke-width="1"/><circle r="5.5" fill="var(--card)" stroke="var(--fg)" stroke-width="2"/></g>
  </svg><div class="ptip" role="status"></div>`;
  if (animate) revealChart(wrap.querySelector("#pcClip rect"), W);

  // Hover / keyboard layer: snap to the nearest date that has data.
  const byDay = new Map();
  const blank = (t) => ({ t, market: null, cm: null, sales: [], web: [] });
  for (const p of market) byDay.set(isoDay(new Date(p.t)), { ...blank(p.t), market: p.v, marketCarried: p.carried });
  for (const p of cmk) { const k = isoDay(new Date(p.t)); const s = byDay.get(k) ?? blank(p.t); s.cm = p; byDay.set(k, s); }
  for (const p of sales) { const k = isoDay(new Date(p.t)); const s = byDay.get(k) ?? blank(p.t); s.sales.push(p.v); byDay.set(k, s); }
  for (const p of web) { const k = isoDay(new Date(p.t)); const s = byDay.get(k) ?? blank(p.t); s.web.push(p); byDay.set(k, s); }
  const stops = [...byDay.values()].sort((a, b) => a.t - b.t);
  const svg = wrap.querySelector("svg"), tip = wrap.querySelector(".ptip"), cross = svg.querySelector(".cross");
  let idx = stops.length - 1;
  const row = (color, value, label, round) => {
    const r = document.createElement("div"); r.className = "r";
    const k = document.createElement("i"); k.className = "k"; k.style.background = color; if (round) Object.assign(k.style, { width: "8px", height: "8px", borderRadius: "50%" });
    const b = document.createElement("b"); b.textContent = value;
    r.append(k, b, document.createTextNode(label)); return r;
  };
  const show = (i) => {
    idx = Math.max(0, Math.min(stops.length - 1, i));
    const s = stops[idx], x = X(s.t), y = Y(s.market ?? s.cm?.v ?? s.sales[0] ?? s.web[0].v);
    cross.style.display = "";
    cross.querySelector("line").setAttribute("x1", x); cross.querySelector("line").setAttribute("x2", x);
    cross.querySelector("circle").setAttribute("cx", x); cross.querySelector("circle").setAttribute("cy", y);
    const d = document.createElement("div"); d.className = "d"; d.textContent = fmtDay(s.t, true);
    tip.replaceChildren(d);
    const again = " (sin dato nuevo, se repite)";
    if (s.market != null) tip.append(row(CHART_COLORS.market, formatUsd(toCents(s.market)), `TCGplayer${s.marketCarried ? again : ""}`));
    if (s.cm) tip.append(row(CHART_COLORS.cardmarket, formatUsd(toCents(s.cm.v)), `Cardmarket · ${s.cm.k}${s.cm.carried ? again : ""}`));
    for (const v of s.sales) tip.append(row(CHART_COLORS.sales, formatUsd(toCents(v)), "venta en Panamá", true));
    for (const p of s.web) tip.append(row(CHART_COLORS.web, formatUsd(toCents(p.v)), p.today ? "valor aproximado hoy" : p.k ?? `venta · ${p.src}`, true));
    const ref = s.market ?? s.cm?.v ?? s.sales[0] ?? s.web[0]?.v, diff = Math.round(((price - ref) / ref) * 100);
    if (price != null) tip.append(row("var(--fg)", formatUsd(toCents(price)), `${(l.priceLabel ?? "Este anuncio").toLowerCase()} (${diff > 0 ? "+" : ""}${diff}%)`));
    const first = tip.style.display !== "block";
    tip.style.display = "block";
    const tw = tip.offsetWidth, left = x > W / 2 ? Math.max(0, x - tw - 12) : Math.min(W - tw, x + 12);
    tip.classList.toggle("moving", !first); // Recharts slides the tooltip (400 ms ease) once it is visible
    tip.style.transform = `translate(${Math.round(left)}px, 0)`;
  };
  const hide = () => { cross.style.display = "none"; tip.style.display = "none"; tip.classList.remove("moving"); };
  svg.addEventListener("pointermove", (e) => {
    const r = svg.getBoundingClientRect(), px = ((e.clientX - r.left) / r.width) * W;
    let best = 0;
    stops.forEach((s, i) => { if (Math.abs(X(s.t) - px) < Math.abs(X(stops[best].t) - px)) best = i; });
    if (best !== idx || tip.style.display !== "block") show(best);
  });
  svg.addEventListener("pointerleave", () => { if (document.activeElement !== svg) hide(); });
  svg.addEventListener("focus", () => show(idx));
  svg.addEventListener("blur", hide);
  svg.addEventListener("keydown", (e) => {
    const step = { ArrowLeft: -1, ArrowRight: 1 }[e.key];
    if (step) { e.preventDefault(); show(idx + step); }
    else if (e.key === "Home" || e.key === "End") { e.preventDefault(); show(e.key === "Home" ? 0 : stops.length - 1); }
  });
}

async function loadPriceChart(l) {
  const box = $("#priceChart");
  if (!box) return;
  const h = await fetchPriceHistory(l).catch((e) => { console.error(e); return { market: [], cardmarket: [], sales: [], web: [], factor: 1 }; });
  if (!box.isConnected) return;
  h.retry = () => { box.innerHTML = `<h2 class="ptitle">${ic("trend")}Valor en el mercado</h2><p class="loading" style="padding:20px 0"><span class="spinner"></span>Buscando el precio en ventas recientes…</p>`; loadPriceChart(l); };
  // Con historial semanal largo se abre en "1 año"; si no, en 90 días (o todo, si son ventas encontradas en internet).
  let range = h.weekly ? 365 : h.web?.length ? Infinity : 90, width = box.clientWidth;
  const draw = (animate) => renderPriceChart(box, l, h, range, (r) => { range = r; draw(true); }, animate);
  draw(true);
  const ro = new ResizeObserver(() => {
    if (!box.isConnected) return ro.disconnect();
    if (box.clientWidth !== width) { width = box.clientWidth; draw(false); }
  });
  ro.observe(box);
}

// Offers go from 60% of the price to just under it; every change runs through make_offer/respond_offer
// in the database. Reviews come only from released Compras Protegidas, shown from the first one.
const OFFER_MIN = 0.6;
const minOfferCents = (priceCents) => Math.ceil(priceCents * OFFER_MIN);
const buyerCode = () => (session ? session.user.id.slice(0, 8).toUpperCase() : "");
const stars = (n) => "★".repeat(Math.round(n)) + "☆".repeat(5 - Math.round(n));
const sellerScore = (s) => [s.rating ? `★ ${s.rating.toFixed(1)} (${s.reviewCount ?? 0} ${s.reviewCount === 1 ? "reseña" : "reseñas"})` : "",
  `${s.salesCount} ${s.salesCount === 1 ? "venta completada" : "ventas completadas"}`].filter(Boolean).join(" · ");
let statsOn = true;
async function applySellerStats(sellers) {
  const ids = [...new Set(sellers.map((s) => s?.id).filter((id) => id && isUuid(id)))];
  if (!statsOn || !sb || !ids.length) return;
  const { data, error } = await sb.from("seller_stats").select("seller_id, completed_sales, review_count, avg_rating").in("seller_id", ids);
  if (error) { if (["42P01", "PGRST205"].includes(error.code)) statsOn = false; else console.error(error); return; }
  const byId = new Map((data ?? []).map((x) => [x.seller_id, x]));
  for (const s of sellers) {
    const x = s && byId.get(s.id);
    if (x) { s.salesCount = x.completed_sales; s.reviewCount = x.review_count; s.rating = x.avg_rating != null ? Number(x.avg_rating) : null; }
  }
}

    box.querySelectorAll("button").forEach((b) => (b.disabled = true));

    if (e) { box.querySelectorAll("button").forEach((b) => (b.disabled = false)); console.error(e); return toast(offerError(e, min, price - 1), { type: "error" }); }

  $("#offerDecline")?.addEventListener("click", () => act("respond_offer", { p_offer: o.id, p_action: "decline_counter" }, "Contraoferta rechazada."));
  $("#offerBuy")?.addEventListener("click", () => track("click_protegida", l.id));
}

    toast("¡Gracias por tu reseña!");

// Seller's answer to a received offer: accept, reject or counter. respond_offer() checks every rule again.
function bindOfferActions(box, done) {
  box.querySelectorAll("[data-of]").forEach((b) => b.addEventListener("click", async () => {
    const li = b.closest("li"), action = b.dataset.of, args = { p_offer: li.dataset.offer, p_action: action };
    const price = Number(li.dataset.price), amount = Number(li.dataset.amount);
    if (action === "counter") {
      args.p_amount = Math.round(Number(li.querySelector(".of-amt").value) * 100);
      if (!(args.p_amount > amount && args.p_amount < price)) return toast(`La contraoferta tiene que estar entre ${formatUsd(amount + 1)} y ${formatUsd(price - 1)}.`, { type: "error" });
    }
    if (action === "accept" && !(await confirmDialog({ title: `¿Aceptar ${formatUsd(amount)}?`, body: "El comprador podrá comprar con Compra Protegida a ese precio.", confirm: "Aceptar oferta" }))) return;
    li.querySelectorAll("button").forEach((x) => (x.disabled = true));
    const { error } = await sb.rpc("respond_offer", args);
    if (error) { li.querySelectorAll("button").forEach((x) => (x.disabled = false)); console.error(error); return toast(offerError(error, amount + 1, price - 1), { type: "error" }); }
    toast({ accept: "Oferta aceptada", reject: "Oferta rechazada", counter: "Contraoferta enviada" }[action]);
    refreshOfferBadge();
    done();
  }));
}

// Mi cuenta: the seller's dashboard. Their cards, the offers they received and, per card and in total,
// how many people saw them. Only counts from our own events (migrations 0007 and 0017): no AI, and no
// visitor ids leave the database. The seller's own visits and the staff's are not counted.
let listingStatsOn = true;
async function loadListingStats(uid, ids) {
  if (!ids.length) return { totals: {}, byId: new Map() };
  if (listingStatsOn) {
    const { data, error } = await sb.rpc("my_listing_stats");
    if (!error && data) return { totals: data.totals ?? {}, byId: new Map((data.listings ?? []).map((r) => [r.id, r])) };
    if (!["PGRST202", "42883"].includes(error?.code)) { console.error(error); return null; }
    listingStatsOn = false; // migration 0017 not applied yet
  }
  // Until 0017 runs, staff can read the raw events (0007 policy) and count them the same way here.
  if (!isStaff) return null;
  const [ev, own, team] = await Promise.all([
    sb.from("events").select("name, visitor_id, user_id, listing_ref, created_at").in("listing_ref", ids)
      .in("name", ["ver_carta", "click_whatsapp", "click_protegida", "compartir"]).limit(20000),
    sb.from("events").select("visitor_id").eq("user_id", uid).limit(5000),
    sb.from("profiles").select("id").eq("is_staff", true),
  ]);
  if (ev.error) { console.error(ev.error); return null; }
  const ownBrowsers = new Set((own.data ?? []).map((r) => r.visitor_id));
  const skipUsers = new Set([uid, ...(team.data ?? []).map((r) => r.id)]);
  const rows = ev.data.filter((e) => !ownBrowsers.has(e.visitor_id) && !skipUsers.has(e.user_id));
  const week = Date.now() - 7 * 864e5;
  const people = (list) => new Set(list.map((e) => e.visitor_id)).size;
  const count = (list) => {
    const views = list.filter((e) => e.name === "ver_carta"), recent = views.filter((e) => Date.parse(e.created_at) >= week);
    return {
      views: views.length, visitors: people(views), views_7d: recent.length, visitors_7d: people(recent),
      interested: people(list.filter((e) => e.name === "click_whatsapp" || e.name === "click_protegida")),
      shares: list.filter((e) => e.name === "compartir").length,
      last_view: views.reduce((m, e) => (!m || e.created_at > m ? e.created_at : m), null),
    };
  };
  const by = new Map();
  for (const e of rows) { if (!by.has(e.listing_ref)) by.set(e.listing_ref, []); by.get(e.listing_ref).push(e); }
  return { totals: count(rows), byId: new Map([...by].map(([id, list]) => [id, count(list)])) };
}
const fmtN = (n) => new Intl.NumberFormat("es-PA").format(n ?? 0);
function daysAgo(ts) {
  const d = Math.floor((Date.now() - Date.parse(ts)) / 864e5);
  return d <= 0 ? "hoy" : d === 1 ? "ayer" : `hace ${fmtN(d)} días`;
}

      ${past.length ? `<details class="admin-closed"><summary>Anteriores (${fmtN(past.length)})</summary><ul class="admin-list">${past.map(offerItem).join("")}</ul></details>` : ""}

  box.innerHTML = `<section class="dash-tiles" aria-label="Resumen de tus cartas">${tiles.join("")}</section>

    refunded: "La compra se reembolsó al comprador.",
    cancelled: "La compra se canceló.",
  }[o.stage] ?? "");
  const card = (o) => {
    const [label, cls] = (o.role === "buyer" ? BUYER_STAGE : SELLER_STAGE)[o.stage] ?? [o.stage, "neutral"];
    const buyerCan = o.role === "buyer" && ["paid", "delivered"].includes(o.stage);
    return `<li class="panel" data-order="${o.id}"><div class="phead">${link(o)}<span class="b ${cls}">${label}</span></div>
      <p class="small" style="margin:6px 0 0">${o.role === "buyer" ? buyerText(o) : sellerText(o)}</p>
      ${buyerCan ? `<div class="order-actions"><button class="btn primary sm" data-ord="confirm">Ya recibí mi carta</button><button class="btn outline sm" data-ord="claim">Tengo un problema</button></div>` : ""}
      ${o.role === "seller" && o.stage === "paid" ? `<div class="order-actions"><button class="btn primary sm" data-ord="delivered">Ya la entregué</button></div>` : ""}

    ${pay.error ? "" : `<section class="panel col"><h2>Dónde te pagamos tus ventas</h2>

    refreshOfferBadge();

  };
  box.querySelectorAll("[data-ord]").forEach((b) => b.addEventListener("click", async () => {
    const li = b.closest("li"), what = b.dataset.ord;

// "Tengo un problema": reason plus up to 4 photos in the private claim-photos bucket.
function openClaim(uid, li, done) {
  const box = li.querySelector(".claim-box");
  if (box.innerHTML) { box.innerHTML = ""; return; }
  box.innerHTML = `<div class="col" style="gap:8px;margin-top:12px">
    <label class="f">¿Qué pasó?<textarea class="textarea cl-reason" rows="3" maxlength="1000" placeholder="Ej.: no me llegó, no es la carta de las fotos, llegó doblada…"></textarea></label>
    <label class="f">Fotos de la carta como la recibiste (hasta 4)<input type="file" class="cl-photos" accept="image/jpeg,image/png,image/webp" multiple></label>
    <p class="xs muted" style="margin:0">Solo las ve el equipo de ${esc(CONFIG.APP_NAME)}. Guarda la carta como llegó mientras revisamos.</p>
    <button type="button" class="btn danger sm cl-send">Enviar reclamo</button></div>`;
  box.querySelector(".cl-reason").focus();
  box.querySelector(".cl-send").addEventListener("click", async (e) => {
    const btn = e.currentTarget, reason = box.querySelector(".cl-reason").value.trim(), files = [...box.querySelector(".cl-photos").files];
    if (reason.length < 10) return toast("Cuéntanos qué pasó en al menos 10 letras.", { type: "error" });
    if (files.length > 4) return toast("Puedes subir hasta 4 fotos.", { type: "error" });
    btn.disabled = true; btn.textContent = "Enviando…";
    const paths = [];
    try {
      for (const [i, f] of files.entries()) {
        const img = await compressImage(f), ext = { "image/png": "png", "image/webp": "webp" }[img.type] ?? "jpg";
        const path = `${uid}/${li.dataset.order}/${Date.now()}-${i}.${ext}`;
        const up = await sb.storage.from("claim-photos").upload(path, img, { contentType: img.type || "image/jpeg", upsert: false });
        if (up.error) throw up.error;
        paths.push(path);
      }
      const { error } = await sb.rpc("buyer_open_claim", { p_order: li.dataset.order, p_reason: reason, p_photos: paths });
      if (error) throw error;
      toast("Recibimos tu reclamo. Lo revisamos y te escribimos.");
      done();
    } catch (err) {
      console.error(err);
      if (paths.length) sb.storage.from("claim-photos").remove(paths);
      btn.disabled = false; btn.textContent = "Enviar reclamo";
      toast(err?.statusCode === "413" || /size/i.test(err?.message ?? "") ? "Una foto es muy pesada (máximo 5 MB)." : orderError(err), { type: "error" });
    }
  });
}

// ============================================================= checkout (#/pagar/<listing id>)
// Pays a Compra Protegida with the Botón de Pago Yappy. The order and its amounts come from the
// database (start_checkout: listing price or the buyer's accepted offer, plus the fee); the
// yappy-pago Edge Function talks to Yappy, and Yappy's payment notice marks the order paid.
let yappyScript = null;
function loadYappy() {
  yappyScript ??= new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.type = "module"; s.src = CONFIG.YAPPY.CDN;
    s.onload = () => customElements.whenDefined("btn-yappy").then(resolve);
    s.onerror = () => { s.remove(); yappyScript = null; reject(new Error("yappy cdn")); };
    document.head.append(s);
  });
  return withTimeout(yappyScript, 15000);
}
const checkoutError = (e) => /on hold/.test(e?.message ?? "") ? "Otra persona está pagando esta carta en este momento. Intenta de nuevo en unos minutos."
  : /own listing/.test(e?.message ?? "") ? "Esta carta es tuya."
  : /not available/.test(e?.message ?? "") ? "Esta carta ya no está disponible."
  : /too many/.test(e?.message ?? "") ? "Hiciste demasiados intentos hoy. Escríbenos si necesitas ayuda."
  : "No pudimos preparar tu compra. Revisa tu conexión e intenta de nuevo.";

async function viewCheckout(app, listingId) {
  setTitle("Pagar");
  const back = `<a class="btn outline" href="#/carta/${encodeURIComponent(listingId)}">Volver a la carta</a>`;
  if (!CONFIG.YAPPY.ENABLED || !sb || !isUuid(listingId)) {
    app.innerHTML = `<div class="checkout"><p class="notice soft">El pago en línea se activa pronto. Por ahora, toca “Comprar protegido” en la carta y te atendemos por WhatsApp.</p>${back}</div>`;
    return;
  }
  app.innerHTML = `<p class="loading"><span class="spinner"></span>Preparando tu compra…</p>`;
  const holder = app.firstElementChild;
  const [{ data: order, error }, { data: l }] = await Promise.all([
    sb.rpc("start_checkout", { p_listing: listingId }),
    sb.from("listings").select("title").eq("id", listingId).maybeSingle(),
  ]);
  if (!holder.isConnected) return;
  if (error || !order) {
    console.error(error);
    app.innerHTML = `<div class="checkout"><p class="notice bad">${esc(checkoutError(error))}</p>${back}</div>`;
    return;
  }
  const total = orderAmounts(order).buyer;
  const feeRows = orderAmounts(order).buyerFee ? `<div><dt>Protección</dt><dd>${formatUsd(order.fee_cents)}</dd></div><div><dt>ITBMS (7% sobre la protección)</dt><dd>${formatUsd(order.itbms_cents)}</dd></div>`
    : `<div><dt>Protección</dt><dd>$0.00</dd></div>`;
  app.innerHTML = `<div class="checkout col" style="gap:16px"><h1 class="display" style="font-size:30px">Pagar con Compra Protegida</h1>
    <section class="panel"><p style="margin:0;font-weight:600">${esc(l?.title ?? "Carta")}</p>
      <dl class="rows" style="margin-top:12px"><div><dt>Carta</dt><dd>${formatUsd(order.price_cents)}</dd></div>${feeRows}
      <div class="total"><dt>Total</dt><dd>${formatUsd(total)}</dd></div></dl>
      <p class="xs muted" style="margin:12px 0 0">Te guardamos la carta 15 minutos mientras pagas. ${esc(CONFIG.APP_NAME)} guarda tu dinero: el vendedor cobra cuando confirmas que recibiste la carta bien, o 3 días después de la entrega si no reportas nada.</p></section>
    <section class="panel center" id="payBox"><p class="loading"><span class="spinner"></span>Cargando Yappy…</p></section>
    <p class="xs muted" style="margin:0">Al pagar aceptas los <a class="link" href="#/terminos">Términos</a> de Compra Protegida.</p>
    <div>${back}</div></div>`;
  const box = $("#payBox");
  try { await loadYappy(); } catch { if (box.isConnected) box.innerHTML = `<p class="notice bad" style="margin:0">No pudimos cargar Yappy. Revisa tu conexión y recarga la página.</p>`; return; }
  if (!box.isConnected) return;
  box.innerHTML = `<btn-yappy theme="blue" rounded="true"></btn-yappy><div id="payMsg" style="margin-top:12px"></div>`;
  const btn = box.querySelector("btn-yappy"), msg = $("#payMsg");
  const say = (cls, html) => (msg.innerHTML = `<p class="notice ${cls}" style="margin:0">${html}</p>`);
  btn.addEventListener("eventClick", async () => {
    msg.innerHTML = "";
    btn.isButtonLoading = true;
    try {
      const s = (await sb.auth.getSession()).data.session;
      if (!s) return say("bad", "Tu sesión se cerró. Entra de nuevo para pagar.");
      // Renew the hold right before paying; if the order or its total changed, show the new one.
      const again = await sb.rpc("start_checkout", { p_listing: listingId });
      if (again.error) return say("bad", esc(checkoutError(again.error)));
      const t2 = orderAmounts(again.data).buyer;
      if (again.data.id !== order.id || t2 !== total) { toast("El total de tu compra cambió. Revísalo antes de pagar."); return viewCheckout(app, listingId); }
      const res = await withTimeout(fetch(`${CONFIG.SUPABASE_URL}/functions/v1/${CONFIG.YAPPY.FUNCTION}`, {
        method: "POST", headers: { "Content-Type": "application/json", apikey: CONFIG.SUPABASE_KEY, Authorization: `Bearer ${s.access_token}` },
        body: JSON.stringify({ order_id: order.id }),
      }), 30000);
      const out = await res.json().catch(() => ({}));
      if (!res.ok || !out.transactionId) return say("bad", esc(out.error ?? "No pudimos iniciar el pago con Yappy. Intenta de nuevo."));
      btn.eventPayment({ transactionId: out.transactionId, documentName: out.documentName, token: out.token });
    } catch (e) {
      console.error(e);
      say("bad", "No pudimos conectar con Yappy. Intenta de nuevo.");
    } finally { btn.isButtonLoading = false; }
  });
  btn.addEventListener("eventError", (e) => {
    console.warn("yappy", e.detail);
    say("bad", "El pago no se completó. Puedes intentarlo de nuevo. Si Yappy te descontó el dinero, no pagues otra vez: escríbenos.");
  });
  btn.addEventListener("eventSuccess", async () => {
    say("good", `<span class="spinner"></span> ¡Pago hecho! Estamos confirmándolo con Yappy…`);
    // The order turns "paid" when Yappy's notice reaches the Edge Function (usually seconds).
    for (let i = 0; i < 40 && box.isConnected; i++) {
      await new Promise((r) => setTimeout(r, 3000));
      const { data } = await sb.rpc("my_orders");
      const o = (data ?? []).find((x) => x.id === order.id);
      if (o && o.stage !== "awaiting_payment") { toast("¡Pago confirmado! Sigue tu compra en Mi cuenta."); return go("/cuenta"); }
    }
    if (box.isConnected) say("good", `Tu pago está en proceso. Lo verás confirmado en <a class="link" href="#/cuenta">Mi cuenta</a> en unos minutos.`);
  });
}
