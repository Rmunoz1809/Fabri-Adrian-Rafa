// ------------------------------------------------------------- authenticity check at a partner shop
// The seller pays by Yappy and takes the card to the shop; Holo never holds it. Staff records the
// result in #/admin?tab=revisiones and a passed check shows "Revisada por <tienda>".
const CHECK_STATUS = {
  requested: "Esperando pago", paid: "Pagada: lleva la carta a la tienda", authentic: "Revisada ✓",
  not_authentic: "No pasó la revisión", inconclusive: "Sin resultado claro", cancelled: "Cancelada",
};
async function renderAuthCheck(l, box) {
  const price = formatUsd(toCents(CONFIG.AUTH_CHECK_USD));
  const { data, error } = await sb.from("authenticity_checks").select("id, status, created_at").eq("listing_id", l.id).order("created_at", { ascending: false }).limit(1);
  if (!box.isConnected) return;
  if (error) { box.innerHTML = `<p class="xs muted" style="margin:0">Muy pronto podrás pedir que una tienda aliada revise tu carta.</p>`; return; }
  const last = data?.[0];
  if (last && ["requested", "paid"].includes(last.status)) {
    const pay = last.status === "requested" ? waLink(`Quiero pagar la revisión en tienda de "${l.title}" (ref ${l.id.slice(0, 8)}). Total ${price}.`) : null;
    box.innerHTML = `<p class="sub"><b>${CHECK_STATUS[last.status]}.</b> ${last.status === "requested" ? `Te escribimos por WhatsApp para el pago (${price} por Yappy) y la cita en la tienda.` : "Te escribimos por WhatsApp con la tienda y la hora."}</p>

  box.innerHTML = `${prev ? `<p class="notice warn" style="margin:0 0 12px">${prev}</p>` : ""}
    <p class="sub">Llevas la carta a una tienda aliada, la revisan en persona y tu anuncio muestra “Revisada por” con el nombre de la tienda. Los compradores confían más. Cuesta ${price}.</p>
    <label class="f" style="margin-top:12px">Tu WhatsApp para coordinar la cita<input class="input" id="authContact" maxlength="120" inputmode="tel" autocomplete="tel" placeholder="6XXX-XXXX"></label>
    <p class="xs muted" style="margin:6px 0 0">Solo lo usamos para coordinar la revisión. <a class="link" href="#/privacidad">Privacidad</a></p>
    <button type="button" class="btn primary block" style="margin-top:12px" id="authReq">Pedir revisión (${price})</button>

    const btn = e.currentTarget, contact = $("#authContact").value.trim();

    btn.disabled = true;

    if (!box.isConnected) return;
    if (error && error.code !== "23505") { btn.disabled = false; console.error(error); return toast("No pudimos enviar la solicitud. Intenta de nuevo.", { type: "error" }); }
    toast("Solicitud enviada", { description: "Te escribimos por WhatsApp para el pago y la cita." });
    renderAuthCheck(l, box);
  });
}

// ------------------------------------------------------------- share
// Sellers spread listings in WhatsApp/Facebook/Instagram groups. Hash links get no
// preview there, so "Compartir" builds a 1080×1350 image (the Instagram portrait size).
const listingUrl = (l) => `${location.origin}${location.pathname}#/carta/${encodeURIComponent(l.id)}`;
function loadImg(src) {
  return new Promise((res) => {
    if (!src) return res(null);
    const im = new Image(); im.crossOrigin = "anonymous";
    im.onload = () => res(im); im.onerror = () => res(null);
    // The page already loaded this image without CORS; a distinct URL avoids reusing
    // that cached copy, which would taint the canvas.
    im.src = src + (src.includes("?") ? "&" : "?") + "canvas=1";
  });
}
async function shareImage(l) {
  // Same look as the site: flat navy, white as the second color, no gradients.
  const W = 1080, H = 1350, c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d"), FG = "#f4f6fb", FG2 = "#a4aec4", pad = 80;
  await document.fonts?.ready;
  x.fillStyle = "#0b1222"; x.fillRect(0, 0, W, H);
  /** Cuts text with "…" so it fits in the given width at the current font. */
  const fit = (t, max = W - pad * 2) => { let s = t; while (x.measureText(s).width > max && s.length > 4) s = s.slice(0, -2); return s === t ? t : `${s.trimEnd()}…`; };
  // card
  const img = await loadImg(l.photos[0]);
  const boxW = 560, boxH = 782, bx = (W - boxW) / 2, by = 70;
  if (img) {
    const r = Math.min(boxW / img.width, boxH / img.height), w = img.width * r, h = img.height * r;

async function compressImage(file) {
  if (!file.type.startsWith("image/")) return file;
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); } catch { return file; }
  const s = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height); bmp.close?.();
  const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85));
  if (!blob) return file;
  if (["image/jpeg", "image/png", "image/webp"].includes(file.type) && blob.size >= file.size) return file;
  return new File([blob], "foto.jpg", { type: "image/jpeg" });
}
async function catalogSearch(name, number) {
  const clean = (s) => s.replace(/["\\]/g, "").trim();
  const n = number?.split("/")[0].replace(/^#/, "").trim();
  const queries = n ? [`name:"${clean(name)}" number:"${clean(n)}"`, `name:"${clean(name)}"`] : [`name:"${clean(name)}"`];
  for (const q of queries) {
    for (let attempt = 0; attempt < 3; attempt++) {
      if (attempt) await new Promise((r) => setTimeout(r, 600 * 2 ** (attempt - 1)));
      try {
        const res = await fetch(`${CONFIG.CATALOG_API}/cards?q=${encodeURIComponent(q)}&pageSize=9&orderBy=-set.releaseDate&select=id,name,number,rarity,set,images,tcgplayer`);
        if (res.ok) { const d = (await res.json()).data; if (d.length) return d; break; }
        if (res.status < 500) break;
      } catch { /* network hiccup, retry */ }
    }
  }
  // pokemontcg.io fails often (and sunsets 2027-03-01): fall back to the TCGdex catalog.
  const [found, sets] = await Promise.all([dexCandidates({ name, number: number?.split("/")[0], total: number?.split("/")[1] }), dexSets()]);
  return found.slice(0, 9).map((c) => catalogFromDexBrief(c, sets.get(setOfDexId(c.id))));
}

// ============================================================= card identification
// A photo is enough: the page works out which card (and which printing) it is, fills the
// form, writes a description, and shows today's price with its history.
//   1. AI (Supabase Edge Function "identificar-carta", Claude vision). Works for Pokémon, NBA and NFL.
//   2. Fallback without any key: OCR in the browser (Tesseract.js) reads the name and the
//      collector number (199/165).
// For Pokémon both paths end in the TCGdex catalog. The candidates are ranked by number, set
// size and name, and ties are broken by comparing the photo with each catalog image.
const TESSERACT_URL = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
// TCG Pocket is a digital game: its "cards" share names and numbers with physical ones.
const isPocketSet = (setId) => /^(A\d|B\d|P-A)/.test(setId);
const setOfDexId = (id) => id.slice(0, id.lastIndexOf("-"));
const sameNumber = (a, b) => (/^\d+$/.test(a) && /^\d+$/.test(b) ? Number(a) === Number(b) : String(a).toUpperCase() === String(b).toUpperCase());
const tokens = (s) => normalize(s).replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter((w) => w.length > 1);

let dexSetsPromise = null;
const dexSets = () => (dexSetsPromise ??= dexGet("/sets").then((list) => {
  if (!list) { dexSetsPromise = null; return new Map(); }
  return new Map(list.map((s) => [s.id, s]));
}));

/** Physical cards in TCGdex that match a name and/or collector number (number/total). */
async function dexCandidates({ name, number, total }) {
  const num = number?.replace(/^#/, "").trim(), tot = total?.replace(/\D/g, "");
  const q = new URLSearchParams();
  if (num) q.set("localId", /^\d+$/.test(num) ? String(Number(num)) : num); // TCGdex matches "contains": exact check below
  if (name) q.set("name", name);
  if (![...q.keys()].length) return [];
  let list = (await dexGet(`/cards?${q}`)) ?? [];
  if (!list.length && num && name) list = (await dexGet(`/cards?localId=${encodeURIComponent(q.get("localId"))}`)) ?? [];
  list = list.filter((c) => !isPocketSet(setOfDexId(c.id)) && (!num || sameNumber(c.localId, num)));
  if (tot && list.length > 1) {
    const sets = await dexSets();
    const bySize = list.filter((c) => String(sets.get(setOfDexId(c.id))?.cardCount?.official) === String(Number(tot)));
    if (bySize.length) list = bySize;
  }
  return list;
}

/** Minimal catalog object (same shape as pokemontcg.io) from a TCGdex search row. */
function catalogFromDexBrief(c, set) {
  return { id: ptcgId(c.id), dexId: c.id, name: c.name, number: c.localId, rarity: "", set: { name: set?.name ?? setOfDexId(c.id), printedTotal: set?.cardCount?.official ?? "" }, images: { small: c.image ? `${c.image}/low.webp` : "" }, brief: true };
}

/** Full catalog object from TCGdex: set, rarity, artist, prices. Shape compatible with pokemontcg.io. */
async function catalogFromDex(dexId) {
  const d = await dexGet(`/cards/${encodeURIComponent(dexId)}`);
  if (!d) return null;
  const set = await dexGet(`/sets/${encodeURIComponent(d.set.id)}`);
  const tp = d.pricing?.tcgplayer ?? {}, prices = {};
  for (const [k, v] of Object.entries(tp)) {
    if (v && typeof v === "object") prices[k.replace(/-(\w)/g, (_, ch) => ch.toUpperCase())] = { market: v.marketPrice ?? null, mid: v.midPrice ?? null, low: v.lowPrice ?? null, productId: v.productId ?? null };
  }
  return {
    id: ptcgId(d.id), dexId: d.id, name: d.name, number: d.localId, rarity: d.rarity ?? "",
    set: { id: d.set.id, name: d.set.name, printedTotal: d.set.cardCount?.official ?? set?.cardCount?.official ?? "", releaseDate: set?.releaseDate ?? "", serie: set?.serie?.name ?? "" },
    images: { small: d.image ? `${d.image}/low.webp` : "", large: d.image ? `${d.image}/high.webp` : "" },
    tcgplayer: Object.keys(prices).length ? { prices, updatedAt: tp.updated ?? new Date().toISOString() } : null,
    cardmarket: d.pricing?.cardmarket ?? null,
    illustrator: d.illustrator ?? "", hp: d.hp ?? null, types: d.types ?? [], stage: d.stage ?? "", kind: d.category ?? "",
  };
}

const loadImage = (src, cors) => new Promise((resolve, reject) => {
  const im = new Image();
  if (cors) im.crossOrigin = "anonymous";
  im.onload = () => resolve(im); im.onerror = reject; im.src = src;
});
/** The card's area in a photo: a centered card-shaped (63×88 mm) box. Scans fill the frame. */
function cardRect(w, h, fill) {
  const ratio = 63 / 88;
  let ch = Math.min(h, w / ratio) * fill, cw = ch * ratio;
  return { x: (w - cw) / 2, y: (h - ch) / 2, w: cw, h: ch };
}
/**
 * Where the card is in a photo: the bounding box of what differs from the background
 * (the color along the photo's edges). Falls back to a centered card-shaped box.
 */
function findCard(im) {
  const W = im.naturalWidth || im.width, H = im.naturalHeight || im.height, k = 200 / Math.max(W, H);
  const w = Math.max(8, Math.round(W * k)), h = Math.max(8, Math.round(H * k));
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d", { willReadFrequently: true }); g.drawImage(im, 0, 0, w, h);
  const px = g.getImageData(0, 0, w, h).data, at = (x, y) => (y * w + x) * 4;
  const edge = [];
  for (let x = 0; x < w; x++) edge.push(at(x, 0), at(x, 1), at(x, h - 1), at(x, h - 2));
  for (let y = 0; y < h; y++) edge.push(at(0, y), at(1, y), at(w - 1, y), at(w - 2, y));
  const bg = [0, 1, 2].map((ch) => median(edge.map((i) => px[i + ch])));
  const rows = new Array(h).fill(0), cols = new Array(w).fill(0);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = at(x, y);
    if (Math.hypot(px[i] - bg[0], px[i + 1] - bg[1], px[i + 2] - bg[2]) > 48) { rows[y]++; cols[x]++; }
  }
  const span = (arr, min) => { const a = arr.findIndex((v) => v >= min), b = arr.findLastIndex((v) => v >= min); return a < 0 ? null : [a, b + 1]; };
  const ys = span(rows, w * 0.25), xs = span(cols, h * 0.25);
  if (ys && xs) {
    const bw = (xs[1] - xs[0]) / k, bh = (ys[1] - ys[0]) / k, ratio = bw / bh;
    // Accept only card-like boxes (63×88 mm ≈ 0.72, some room for tilt) that are not the whole photo.
    if (ratio > 0.55 && ratio < 0.9 && bw * bh > W * H * 0.2 && bw * bh < W * H * 0.97) return { x: xs[0] / k, y: ys[0] / k, w: bw, h: bh };
  }
  return cardRect(W, H, 0.94);
}
/** Visual fingerprint: 64-bit gradient hash (shape) + 4×4 color grid (palette). */
function signature(im, fill) {
  const r = fill ? cardRect(im.naturalWidth || im.width, im.naturalHeight || im.height, fill) : findCard(im);
  const c = document.createElement("canvas"), g = c.getContext("2d", { willReadFrequently: true });
  c.width = 9; c.height = 8; g.drawImage(im, r.x, r.y, r.w, r.h, 0, 0, 9, 8);
  const px = g.getImageData(0, 0, 9, 8).data, lum = (i) => px[i] * 0.299 + px[i + 1] * 0.587 + px[i + 2] * 0.114;
  const bits = [];
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) bits.push(lum((y * 9 + x) * 4) > lum((y * 9 + x + 1) * 4) ? 1 : 0);
  c.width = 4; c.height = 4; g.drawImage(im, r.x, r.y, r.w, r.h, 0, 0, 4, 4);
  return { bits, color: [...g.getImageData(0, 0, 4, 4).data].filter((_, i) => i % 4 !== 3) };
}
/** 0 = identical, 1 = unrelated. */
function visualDistance(a, b) {
  let ham = 0, col = 0;
  a.bits.forEach((v, i) => { if (v !== b.bits[i]) ham++; });
  for (let i = 0; i < a.color.length; i += 3) col += Math.hypot(a.color[i] - b.color[i], a.color[i + 1] - b.color[i + 1], a.color[i + 2] - b.color[i + 2]);
  return 0.5 * (ham / 64) + 0.5 * (col / (a.color.length / 3) / 441.7);
}

/** Score candidates by what was read (number, set size, name) and by how much the photo looks like each one. */
async function rankCandidates(hints, photo) {
  let list = [];
  if (hints.number) list = await dexCandidates({ name: hints.name, number: hints.number, total: hints.total });
  if (!list.length && hints.number && hints.name) list = await dexCandidates({ number: hints.number, total: hints.total });
  if (!list.length && hints.name) list = await dexCandidates({ name: hints.name });
  if (!list.length) return [];
  const sets = await dexSets();
  const read = new Set(tokens(`${hints.name ?? ""} ${hints.text ?? ""}`));
  const setWords = new Set(tokens(hints.setName ?? ""));
  const scored = list.map((c) => {
    const nameTok = tokens(c.name), set = sets.get(setOfDexId(c.id));
    let text = nameTok.length ? (2 * nameTok.filter((w) => read.has(w)).length) / nameTok.length : 0;
    if (hints.number && sameNumber(c.localId, hints.number)) text += 2;
    if (hints.total && String(set?.cardCount?.official) === String(Number(hints.total.replace(/\D/g, "")))) text += 2;
    if (setWords.size && set) { const st = tokens(set.name); text += st.length ? st.filter((w) => setWords.has(w)).length / st.length : 0; }
    return { ...c, text, setName: set?.name ?? "", dist: null };
  }).sort((a, b) => b.text - a.text).slice(0, 16);
  return visualRank(scored, photo);
}
/** Visual tie-breaker among the best text matches: compare the photo with each catalog image. */
async function visualRank(scored, photo) {
  if (photo && scored.length > 1) {
    try {
      const url = URL.createObjectURL(photo), mine = signature(await loadImage(url));
      URL.revokeObjectURL(url);
      await Promise.all(scored.filter((c) => c.image).map(async (c) => {
        try { c.dist = visualDistance(mine, signature(await withTimeout(loadImage(`${c.image}/low.webp`, true), 8000), 1)); } catch { /* image missing */ }
      }));
    } catch (e) { console.warn("visual match skipped", e); }
  }
  const score = (c) => c.text - 10 * (c.dist ?? 0.45);
  return scored.sort((a, b) => score(b) - score(a)).map((c) => ({ ...c, score: score(c) }));
}

let ocrWorker = null;
async function ocr(canvas) {
  if (!window.Tesseract) {
    await new Promise((resolve, reject) => { const s = document.createElement("script"); s.src = TESSERACT_URL; s.onload = resolve; s.onerror = reject; document.head.appendChild(s); });
  }
  ocrWorker ??= window.Tesseract.createWorker("eng").catch((e) => { ocrWorker = null; throw e; });
  const { data } = await (await ocrWorker).recognize(canvas);
  return data.text ?? "";
}
/** Draw part of the card (fractions of the card box) upscaled and in grayscale, for OCR. */
function cropForOcr(im, [fx, fy, fw, fh], width, r = findCard(im)) {
  const sx = r.x + r.w * fx, sy = r.y + r.h * fy, sw = r.w * fw, sh = r.h * fh;
  const c = document.createElement("canvas"); c.width = width; c.height = Math.round((width * sh) / sw);
  const g = c.getContext("2d"); g.filter = "grayscale(1) contrast(1.4)"; g.drawImage(im, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}
// OCR mixes up I/l/1 and O/0: compare names in a folded alphabet.
const fold = (s) => normalize(s).replace(/[^a-z0-9]/g, "").replace(/[l1|]/g, "i").replace(/0/g, "o").replace(/5/g, "s");
const trigrams = (s) => { const out = new Set(); for (let i = 0; i + 3 <= s.length; i++) out.add(s.slice(i, i + 3)); return out; };
let allCardsPromise = null;
/** Every physical card in TCGdex (~2.4 MB, loaded once and only for the OCR fallback). */
const allDexCards = () => (allCardsPromise ??= dexGet("/cards").then((list) => {
  if (!list) { allCardsPromise = null; return []; }
  return list.filter((c) => !isPocketSet(setOfDexId(c.id)));
}));

/** Collector numbers read from the text: "199/165", and repairs like "21157203" → 215/203. */
function numberCandidates(text, sets) {
  const totals = new Set([...sets.values()].map((s) => s.cardCount?.official).filter((n) => n > 0));
  const pairs = new Map(), singles = new Set();
  const add = (a, b, weight) => {
    const na = Number(a), nb = Number(b);
    if (!(na >= 1 && totals.has(nb) && na <= nb * 1.6 + 30)) return;
    const k = `${na}/${nb}`; pairs.set(k, Math.max(pairs.get(k) ?? 0, weight));
  };
  // The rarity symbol after the number is often read as one more digit ("238/1918"): try both lengths.
  for (const m of text.matchAll(/(\d{1,3})\s?[/|\\]\s?(\d{2,4})/g)) { add(m[1], m[2].slice(0, 3), 3); add(m[1], m[2].slice(0, 2), 2.5); }
  for (const [run] of text.matchAll(/\d{4,9}/g)) {
    for (let i = 1; i <= 3; i++) {
      const a = run.slice(0, i);
      for (const skip of run[i] === "1" || run[i] === "7" ? [1, 0] : [0]) { // "/" read as 1 or 7, or dropped
        const rest = run.slice(i + skip);
        for (const n of [3, 2]) if (rest.length >= n) add(a, rest.slice(0, n), (skip ? 2 : 1.5) - (rest.length > n ? 0.5 : 0));
      }
    }
  }
  for (const [n] of text.matchAll(/(?<![\d©])\d{1,3}(?!\d)/g)) singles.add(String(Number(n)));
  return { pairs: [...pairs].map(([k, w]) => { const [num, total] = k.split("/"); return { num, total, w }; }), singles };
}

/** Candidates for an OCR reading: names that appear in the top text × numbers from the bottom. */
async function ocrCandidates(o) {
  const [cards, sets] = await Promise.all([allDexCards(), dexSets()]);
  if (!cards.length) return [];
  // Card-frame words ("Trainer", "Supporter"…) would match names like "Gym Trainer" on every card.
  const topText = o.top.replace(/\bev[oe]l[vy]es from\s+\S+/gi, " ") // the previous stage's name, not this card's
    .replace(/\b(trainer|supporter|item|stadium|pok[eé]mon|tool|basic|stage ?\d?|energy|ability|tera)\b/gi, " ");
  const topGrams = new Set(topText.split("\n").flatMap((line) => line.split(/\s{2,}|[^\p{L}\s'’.-]+/u).flatMap((part) => [...trigrams(fold(part))])));
  const nameScore = new Map();
  for (const name of new Set(cards.map((c) => c.name))) {
    const g = trigrams(fold(name));
    if (!g.size) continue;
    let hit = 0; for (const t of g) if (topGrams.has(t)) hit++;
    const cover = hit / g.size;
    // Partial reads ("UmbreonViay" for "Umbreon VMAX") still count almost fully: the picture breaks ties.
    if (cover >= 0.6) nameScore.set(name, (0.5 + 0.5 * cover) * Math.min(1, (g.size + 2) / 6)); // short names count less
  }
  const { pairs, singles } = numberCandidates(`${o.bottom}\n${o.top}`, sets);
  const scored = [];
  for (const c of cards) {
    const nm = nameScore.get(c.name) ?? 0, total = sets.get(setOfDexId(c.id))?.cardCount?.official;
    const pair = pairs.find((p) => sameNumber(c.localId, p.num) && Number(p.total) === total);
    const single = /^\d+$/.test(c.localId) && singles.has(String(Number(c.localId)));
    if (!nm && !pair) continue;
    const text = 3 * nm + (pair ? 2 + pair.w : single ? 0.5 : 0); // lone numbers are weak: HP, damage, prizes…
    scored.push({ ...c, text, setName: sets.get(setOfDexId(c.id))?.name ?? "", dist: null });
  }
  // Keep every close text match (e.g. all 36 printings of "Charizard"): the picture decides between them.
  scored.sort((a, b) => b.text - a.text);
  return scored.filter((c) => c.text >= scored[0].text - 2).slice(0, 150);
}

/** Read the card's name (top) and collector number (bottom) from the photo. */
async function ocrRead(photo, status) {
  const url = URL.createObjectURL(photo);
  allDexCards(); // start the catalog download while OCR runs
  try {
    const im = await loadImage(url);
    status("Leyendo el nombre de la carta…");
    const top = await ocr(cropForOcr(im, [0, 0, 1, 0.3], 1400));
    status("Leyendo el número de la carta…");
    const bottom = `${await ocr(cropForOcr(im, [0, 0.8, 1, 0.2], 1800))}\n${await ocr(cropForOcr(im, [0, 0.84, 0.5, 0.16], 1600))}`;
    return { top, bottom };
  } finally { URL.revokeObjectURL(url); }
}

const toBase64 = (file) => new Promise((resolve, reject) => {
  const fr = new FileReader(); fr.onload = () => resolve(String(fr.result).split(",")[1]); fr.onerror = reject; fr.readAsDataURL(file);
});
/** Claude vision via the Edge Function. Returns null when the function is not available. */
async function identifyWithAI(files) {
  if (!CONFIG.IDENTIFY_FUNCTION || !sb) return null;
  const s = (await sb.auth.getSession()).data.session;
  if (!s) return null;
  const images = await Promise.all(files.slice(0, 2).map(async (f) => ({ data: await toBase64(f), media_type: f.type || "image/jpeg" })));
  const res = await withTimeout(fetch(`${CONFIG.SUPABASE_URL}/functions/v1/${CONFIG.IDENTIFY_FUNCTION}`, {
    method: "POST", headers: { "Content-Type": "application/json", apikey: CONFIG.SUPABASE_KEY, Authorization: `Bearer ${s.access_token}` },
    body: JSON.stringify({ images }),
  }), 60000);
  if (!res.ok) { console.warn("identificar-carta", res.status, await res.text().catch(() => "")); return null; }
  return (await res.json()).card ?? null;
}

/** Photo(s) → { kind, card?, alternatives, ai?, source, confidence } or null. */
async function identifyCard(files, status) {
  status("Analizando la foto…");
  const ai = await identifyWithAI(files).catch((e) => { console.warn("AI identification unavailable", e); return null; });
  if (ai && !ai.is_trading_card) return { kind: "not-card", ai };
  if (ai && ai.category !== "pokemon") return { kind: "other", ai, source: "ia", confidence: ai.confidence };
  let hints = null, ranked;
  if (ai) {
    const [number, total] = (ai.card_number ?? "").replace(/^#/, "").split("/");
    hints = { name: ai.subject, number: number?.trim() || null, total: total?.trim() || null, setName: ai.set_name, text: `${ai.subject} ${ai.variant ?? ""}` };
    status("Buscando tu carta en el catálogo…");
    ranked = await rankCandidates(hints, files[0]);
  } else {
    const read = await ocrRead(files[0], status);
    status("Buscando tu carta en el catálogo…");
    ranked = await visualRank(await ocrCandidates(read), files[0]);
  }
  if (!ranked.length) return ai ? { kind: "other", ai, source: "ia", confidence: "baja" } : null;
  const card = await catalogFromDex(ranked[0].id);
  if (!card) return null;
  const [best, next] = ranked;
  const exact = hints ? hints.number && sameNumber(best.localId, hints.number) && best.text >= 4 : best.text >= 6;
  const clear = !next || best.score - next.score > 0.6;
  const confidence = ai ? (ai.confidence === "alta" && exact ? "alta" : "media") : exact && clear ? "alta" : exact || clear ? "media" : "baja";
  return { kind: "pokemon", card, alternatives: ranked.slice(1, 7), ai, source: ai ? "ia" : "ocr", confidence };
}

/** Free identification (no AI cost): OCR in the browser + the Pokémon catalog. Same scoring as identifyCard. */
async function identifyFree(files, status) {
  const read = await ocrRead(files[0], status);
  status("Buscando tu carta en el catálogo…");
  const ranked = await visualRank(await ocrCandidates(read), files[0]);
  if (!ranked.length) return null;
  const card = await catalogFromDex(ranked[0].id);
  if (!card) return null;
  const [best, next] = ranked;
  const exact = best.text >= 6, clear = !next || best.score - next.score > 0.6;
  return { kind: "pokemon", card, alternatives: ranked.slice(1, 7), source: "ocr", confidence: exact && clear ? "alta" : exact || clear ? "media" : "baja" };
}

/** Short listing description written from the identified card (never invents condition). */
function describeCard(c, ai) {
  const parts = [];
  if (c) {
    const year = c.set.releaseDate?.slice(0, 4);
    parts.push(`${c.name} · ${c.number}${c.set.printedTotal ? `/${c.set.printedTotal}` : ""} del set ${c.set.name}${c.set.serie ? ` (${c.set.serie}${year ? `, ${year}` : ""})` : year ? ` (${year})` : ""}.`);
    const facts = [c.rarity && `Rareza: ${c.rarity}`, c.types?.length && `Tipo: ${c.types.join("/")}`, c.hp && `${c.hp} HP`, c.illustrator && `Ilustración de ${c.illustrator}`].filter(Boolean);
    if (facts.length) parts.push(`${facts.join(" · ")}.`);
  } else if (ai) {
    parts.push(`${ai.subject} · ${[ai.set_name, ai.year, ai.card_number, ai.variant].filter(Boolean).join(" · ")}.`);
  }
  if (ai?.is_graded && ai.grading_company && ai.grade) parts.push(`Graduada ${ai.grading_company} ${ai.grade}${ai.cert_number ? `, certificado ${ai.cert_number}` : ""}.`);
  if (ai?.condition_notes?.length) parts.push(`Revisión visual preliminar: ${ai.condition_notes.join("; ")}.`);
  return parts.join("\n");
}

    $("#sellGate").hidden = false;
    $("#sellGate").scrollIntoView({ behavior: "smooth", block: "start" });
  });
  const form = $("#sellForm");
  const val = (n) => form.elements[n]?.value?.trim() ?? "";
  // Setting .value skips maxlength, so text filled in by the AI or the catalog is clipped to each field's limit.
  const set = (n, v) => { const el = form.elements[n]; if (el) el.value = String(v ?? "").slice(0, el.maxLength > 0 ? el.maxLength : undefined); };

  function renderGrade() {
    // The grade comes only from the slab label in the photo (read by the AI); sellers cannot type or change it.
    // The database enforces the same rule (migration 0009), so it cannot be faked through the API either.
    st.graded = !!st.grading;
    const g = st.grading;
    $("#gradeBox").innerHTML = g
      ? `<div class="panel accent small"><p class="ptitle" style="font-size:15px">${ic("shield")}Graduada ${esc(g.company)} ${esc(g.grade)}${g.cert ? ` · Certificado ${esc(g.cert)}` : ""}</p><p class="xs muted" style="margin-top:6px">Lo leímos de la etiqueta del slab en tu foto y no se puede cambiar a mano. Si está mal, sube una foto más clara de la etiqueta.</p></div>`
      : `${st.slabUnread ? `<p class="notice warn small" style="margin:0 0 10px">Vimos un slab pero no pudimos leer la empresa o la nota. Sube una foto de frente donde se lea la etiqueta.</p>` : `<p class="xs muted" style="margin:0 0 10px">${st.files.length ? "Sin graduar." : "Se detecta sola con la foto."} Si tu carta está en un slab (PSA, BGS, CGC, SGC, TAG), sube una foto donde se lea la etiqueta: la empresa y la nota salen de ahí.</p>`}<label class="f">Condición<select class="select" name="condition">${CONDITIONS.map((c) => `<option value="${c.code}">${c.label} (${c.code}): ${c.hint}</option>`).join("")}</select></label>`;
    form.elements.condition?.addEventListener("change", () => { renderEstimate(); loadSellChart(); });
    renderEstimate();
  }
  function currentEstimate() {
    const fromCatalog = st.picked && val("category") === "pokemon"
      ? estimatePrice({ reference: st.graded ? null : pickReferencePrice(st.picked, val("variant")), condition: st.graded ? null : val("condition") || "NM", grading: st.graded ? { company: st.grading.company, grade: st.grading.grade } : null })
      : null;
    return fromCatalog ?? estimateFromQuote(st.hist?.quote); // graded, NBA/NFL: price researched on the web
  }
  function renderEstimate() {
    if (!form.isConnected) return; // late callbacks (timers, identification) after leaving the page
    const est = currentEstimate();
    $("#estBox").innerHTML = est
      ? `<div class="panel accent small"><p class="ptitle" style="font-size:15px">${ic("tag")}Precio estimado: ${fmtEstimate(est.low)} – ${fmtEstimate(est.high)}</p><p class="xs muted" style="margin-top:6px">${est.basis.map(esc).join(" · ")}. Es una referencia, no una garantía.</p></div>`
      : "";
    const p = Number(val("price")), v = p > 0 ? priceVerdict(p, est) : null;
    $("#verdict").innerHTML = v === "alto" ? `<span style="color:var(--warn)">Tu precio está por encima del rango estimado. Puede tardar más en venderse.</span>` : v === "buen-precio" ? `<span style="color:var(--up)">Tu precio está por debajo del rango. Se va a vender rápido.</span>` : "";
  }

  $("#verifIn").addEventListener("change", async (e) => {
    const f = e.target.files[0]; if (!f) return;
    st.verif = await compressImage(f);
    const pv = $("#verifPrev"); pv.src = URL.createObjectURL(st.verif); pv.hidden = false;
    $("#verifLbl").textContent = "Cambiar foto de verificación";
  });
  $("#photos").addEventListener("change", async (e) => {
    const picked = [...e.target.files].slice(0, 4);
    if (!picked.length) return;
    $("#thumbs").innerHTML = `<span class="xs muted" style="display:inline-flex;align-items:center;gap:8px"><span class="spinner"></span>Preparando fotos…</span>`;
    st.files = await Promise.all(picked.map(compressImage));
    st.previews.forEach((u) => URL.revokeObjectURL(u));
    st.previews = st.files.map((f) => URL.createObjectURL(f));
    const drop = $("#drop");
    drop.querySelector("img")?.remove();
    const im = document.createElement("img"); im.src = st.previews[0]; im.alt = "Vista previa"; drop.appendChild(im);
    $("#thumbs").innerHTML = st.previews.length > 1 ? st.previews.map((u, i) => `<img src="${u}" alt="Foto ${i + 1}">`).join("") : "";
    if (picked.length < e.target.files.length) toast("Solo se usan las primeras 4 fotos.", { type: "info" });
    identify();
  });
  $("#category").addEventListener("change", () => {
    const pk = val("category") === "pokemon";
    $("#catalogBox").style.display = pk ? "" : "none";
    $("#subjectLbl").textContent = pk ? "Pokémon" : "Jugador";
    form.elements.setName.placeholder = pk ? "151" : "Panini Prizm";
    if (!pk) st.picked = null;
    renderEstimate();
    loadSellChart();
  });
  form.elements.variant.addEventListener("input", renderEstimate);
  // Cards typed by hand (NBA/NFL, or a Pokémon not picked from the catalog): price them once the details settle.
  let detailsTimer = null;
  form.addEventListener("change", (e) => {
    if (st.picked || !["subject", "setName", "year", "number", "variant"].includes(e.target.name)) return;
    clearTimeout(detailsTimer); detailsTimer = setTimeout(loadSellChart, 1500);
  });
  form.elements.price.addEventListener("input", () => { renderEstimate(); drawSellChart(); });

  // ----- identification from the photo
  async function identify() {
    if (!st.files.length) return;
    const run = ++st.idRun, box = $("#idBox");
    const status = (t) => { if (run === st.idRun) box.innerHTML = `<div class="panel accent small" style="display:flex;align-items:center;gap:10px"><span class="spinner"></span>${esc(t)}</div>`; };
    let res = null;
    // A script or image that fails to load rejects with an Event: log what failed, not "[object Event]".
    try { res = await identifyCard(st.files, status); } catch (e) { console.warn("identification failed", e instanceof Event ? `${e.type} ${e.target?.src ?? ""}` : e); }
    if (run !== st.idRun || !form.isConnected) return;
    st.ident = res;
    const ai = res?.ai;
    const grading = ai?.is_graded && GRADERS.includes(ai.grading_company) && ai.grade >= 1 && ai.grade <= 10
      ? { company: ai.grading_company, grade: Math.round(ai.grade * 2) / 2, cert: ai.cert_number ?? null } : null;
    st.grading = grading; st.slabUnread = !!ai?.is_graded && !grading;
    renderGrade();
    if (!res) {
      box.innerHTML = `<p class="notice soft" style="margin:0">No pudimos reconocer la carta en la foto. Prueba con una foto de frente, con buena luz y sin reflejos, o búscala en el catálogo más abajo.</p>`;
      return;
    }
    if (res.kind === "not-card") {
      box.innerHTML = `<p class="notice warn" style="margin:0">La foto no parece una carta coleccionable. Sube una foto del frente de tu carta.</p>`;
      return;
    }
    if (res.kind === "pokemon") {
      setCategory("pokemon");
      await pickCard(res.card, { fromIdent: true });
    } else {
      setCategory(ai.category === "otra" ? val("category") : ai.category);
      set("subject", ai.subject); set("setName", ai.set_name); set("year", ai.year ?? ""); set("number", ai.card_number ?? ""); set("variant", ai.variant ?? "");
      if (!val("title")) set("title", ai.title_es.slice(0, 80));
      fillDescription(describeCard(null, ai));
      renderEstimate();
    }
    if (res.kind !== "pokemon") loadSellChart(); // pickCard already loaded it
    box.innerHTML = ""; // the filled-in form is the result
  }
  function setCategory(cat) {
    if (!CATEGORIES.some((c) => c.slug === cat) || val("category") === cat) return;
    set("category", cat); $("#category").dispatchEvent(new Event("change"));
  }
  function fillDescription(text) {
    // Only replace text we wrote ourselves; never overwrite what the seller typed.
    // Setting .value skips the textarea's maxlength, so clip to the database limit (1000) here.
    text = text.slice(0, 1000);
    if (!val("description") || val("description") === st.autoDesc) { set("description", text); st.autoDesc = text; }
  }
  /** Approximate market value of the selected card, shown inside the price field. */
  function renderPriceHint() {
    if (!form.isConnected) return;
    const h = st.hist, cur = h ? h.market.at(-1) ?? h.cardmarket.at(-1) : null, est = currentEstimate();
    const v = cur?.v ?? est?.mid;
    form.elements.price.placeholder = v > 0 ? `Aprox. ${fmtEstimate(v)}` : "";
  }

  /** Select a catalog card: fill the form, the estimate and the price chart. */
  async function pickCard(c, { fromIdent = false, replace = false } = {}) {
    const run = ++st.pickRun;
    if (c.brief || (!c.set?.releaseDate && c.dexId)) c = (await catalogFromDex(c.dexId)) ?? c;
    if (run !== st.pickRun || !form.isConnected) return;
    st.picked = c;
    set("subject", c.name); set("setName", c.set.name); set("year", c.set.releaseDate?.slice(0, 4)); set("number", c.set.printedTotal ? `${c.number}/${c.set.printedTotal}` : c.number); set("variant", c.rarity ?? "");
    const autoTitle = `${c.name} ${c.number}${c.set.printedTotal ? `/${c.set.printedTotal}` : ""} · ${c.set.name}`.slice(0, 80);
    if (!val("title") || (replace && val("title") === st.autoTitle)) { set("title", autoTitle); st.autoTitle = autoTitle; }
    fillDescription(describeCard(c, fromIdent ? st.ident?.ai : null));
    renderEstimate();
    loadSellChart();
  }

  // ----- market value chart for the selected card
  const sellListing = () => {
    const c = val("category") === "pokemon" ? st.picked : null, price = Number(val("price"));
    return {
      card: c
        ? { category: "pokemon", subject: c.name, setName: c.set.name, year: c.set.releaseDate?.slice(0, 4), number: val("number"), variant: val("variant"), catalogId: c.id, dexId: c.dexId }
        : { category: val("category"), subject: val("subject"), setName: val("setName"), year: val("year"), number: val("number"), variant: val("variant"), catalogId: null },
      condition: st.graded ? null : val("condition") || "NM",
      grading: st.graded ? { company: st.grading.company, grade: st.grading.grade } : null,
      priceUsd: price > 0 ? price : null, priceLabel: "Tu precio", isDemo: false,
    };
  };
  let chartRo = null;
  async function loadSellChart() {
    const box = $("#sellChart");
    if (!box || !form.isConnected) return;
    const picked = st.picked && val("category") === "pokemon";
    if (!picked && !(val("subject").length >= 2 && val("setName"))) { box.hidden = true; st.hist = null; renderEstimate(); renderPriceHint(); return; }
    const run = ++st.chartRun, c = st.picked;
    box.hidden = false;
    box.innerHTML = `<h2 class="ptitle">${ic("trend")}Valor en el mercado</h2><p class="loading" style="padding:20px 0"><span class="spinner"></span>Buscando el precio de hoy y su historial…</p>`;
    const h = await fetchPriceHistory(sellListing()).catch((e) => { console.error(e); return { market: [], cardmarket: [], sales: [], web: [], factor: 1 }; });
    if (run !== st.chartRun || st.picked !== c || !box.isConnected) return;
    h.retry = loadSellChart;
    st.hist = h; st.range = h.weekly ? 365 : h.web?.length ? Infinity : 90;
    drawSellChart(true);
    renderEstimate();
    renderPriceHint();
    if (!chartRo) {
      let width = box.clientWidth;
      chartRo = new ResizeObserver(() => { if (!box.isConnected) return chartRo.disconnect(); if (box.clientWidth !== width) { width = box.clientWidth; drawSellChart(); } });
      chartRo.observe(box);
    }
  }
  function drawSellChart(animate = false) {
    const box = $("#sellChart");
    if (!box || !st.hist || box.hidden) return;
    renderPriceChart(box, sellListing(), st.hist, st.range, (r) => { st.range = r; drawSellChart(true); }, animate);
  }

  async function doCatalogSearch() {
    const name = $("#catName").value.trim();
    if (name.length < 2) { $("#catResults").innerHTML = `<p class="xs muted" style="margin-top:10px">Escribe el nombre de la carta.</p>`; return; }
    const btn = $("#catBtn");
    btn.disabled = true;
    $("#catResults").innerHTML = `<p class="xs muted" style="margin-top:10px;display:flex;align-items:center;gap:8px"><span class="spinner"></span>Buscando…</p>`;
    st.catalog = await catalogSearch(name, $("#catNum").value);
    if (!btn.isConnected) return;
    btn.disabled = false;
    $("#catResults").innerHTML = st.catalog.length
      ? `<p class="xs muted" style="margin-top:12px">Toca tu carta:</p><div class="results">${st.catalog.map((c, i) => `<button type="button" data-i="${i}" aria-pressed="false"><img src="${esc(c.images.small)}" alt="${esc(c.name)}" loading="lazy"><span>${esc(c.set.name)} · ${esc(c.number)}</span></button>`).join("")}</div>`
      : `<p class="xs muted" style="margin-top:10px">No la encontramos (el catálogo a veces falla; intenta de nuevo) o llena los datos a mano.</p>`;
    $("#catResults").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
      $("#catResults").querySelectorAll("button").forEach((x) => { x.classList.toggle("on", x === b); x.setAttribute("aria-pressed", String(x === b)); });
      pickCard(st.catalog[Number(b.dataset.i)], { replace: true });
    }));
  }
  $("#catBtn").addEventListener("click", doCatalogSearch);
  [$("#catName"), $("#catNum")].forEach((i) => i.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); doCatalogSearch(); } }));
  renderGrade();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("#sellMsg"), btn = $("#publishBtn");
    const fail = (t) => { msg.innerHTML = `<p class="notice bad">${esc(t)}</p>`; btn.disabled = false; btn.textContent = "Publicar gratis"; };
    const price = Number(val("price")), year = val("year") ? Number(val("year")) : null, grade = st.graded ? st.grading.grade : null;
    if (!st.files.length) return fail("Agrega al menos una foto real de la carta.");
    if (val("subject").length < 2) return fail("Falta el nombre del Pokémon o jugador.");
    if (!val("setName")) return fail("Falta el set o producto.");
    // Sports cards go back to the 1880s (the demo listings include 1948 Bowman); Pokémon starts in 1996.
    if (year != null && !(Number.isInteger(year) && year >= 1880 && year <= new Date().getFullYear() + 1)) return fail("Año no válido.");
    if (st.slabUnread) return fail("Vimos un slab pero no pudimos leer la nota. Sube una foto donde se lea la etiqueta.");
    if (!(price >= 1 && price <= 100000)) return fail("Escribe un precio entre $1 y $100,000.");
    if (val("title").length < 5) return fail("El título es muy corto.");
    for (const f of st.files) if (f.size > 3 * 1024 * 1024) return fail("Una de las fotos es muy pesada (máx. 3 MB).");
    const loc = FLAT_LOCATIONS[Number(val("location"))];
    if (!loc) return fail("Elige tu barrio o zona.");

    btn.disabled = true; btn.innerHTML = `<span class="spinner" style="border-color:currentColor"></span>Publicando…`; msg.innerHTML = "";
    // Sesión fresca: getSession renueva el token si expiró mientras llenaban el formulario.
    const fresh = (await sb.auth.getSession()).data.session;
    if (!fresh) return fail("Tu sesión expiró. Vuelve a entrar para publicar.");
    const uid = fresh.user.id, id = crypto.randomUUID();
    const catalogId = val("category") === "pokemon" && st.picked ? st.picked.id : null;
    const gradingKey = st.graded ? `${st.grading.company}${grade}` : "raw";
    let comps = [];
    if (catalogId) {
      const { data } = await sb.from("sales").select("price_cents, sold_at").eq("catalog_id", catalogId).eq("grading_key", gradingKey).order("sold_at", { ascending: false }).limit(50);
      comps = (data ?? []).map((s) => ({ priceUsd: s.price_cents / 100, soldAt: s.sold_at }));
    }
    const estimate = (catalogId ? estimatePrice({ reference: st.graded ? null : pickReferencePrice(st.picked, val("variant")), localComps: comps, condition: st.graded ? null : val("condition"), grading: st.graded ? { company: st.grading.company, grade } : null }) : null)
      ?? estimateFromQuote(st.hist?.quote); // graded, NBA/NFL: the price researched on the web

    // El anuncio nace como borrador (invisible al público) y sólo pasa a "active" cuando
    // las fotos ya están en Storage y registradas. Así nunca se publica un anuncio a medias.
    const paths = [];
    const step = (t) => { btn.innerHTML = `<span class="spinner" style="border-color:currentColor"></span>${esc(t)}`; };
    const abort = async (err, t) => {
      console.error(err);
      if (paths.length) { const rm = await sb.storage.from("listing-photos").remove(paths); if (rm.error) console.error(rm.error); }
      await sb.from("listings").delete().eq("id", id); // borra en cascada listing_photos
      return fail(t);
    };
    const dbMessage = (err, t) =>
      err?.code === "42501" ? "Tu sesión no tiene permiso para publicar. Sal y vuelve a entrar." :
      err?.code === "23503" ? "Tu cuenta no tiene perfil de vendedor. Sal y vuelve a entrar, o escríbenos." :
      /grading_from_photo/.test(err?.message ?? "") ? "La graduación tiene que verse en la foto del slab. Sube una foto donde se lea la etiqueta y vuelve a intentar." :
      err?.code === "23514" ? "Algún dato no es válido (revisa precio, título, nota o condición)." : t;
    const dup = (e) => /exists|duplicate/i.test(e?.message ?? "");

    step("Guardando datos…");
    const ins = await sb.from("listings").insert({
      id, seller_id: uid, status: "draft", category: val("category"), title: val("title"), description: val("description") || null,
      subject: val("subject"), set_name: val("setName"), year, number: val("number") || null, variant: val("variant") || null,
      condition: st.graded ? null : val("condition"), grading_company: st.graded ? st.grading.company : null, grade,
      cert_number: st.graded ? st.grading.cert : null,
      price_cents: Math.round(price * 100), province: loc.province, district: loc.district, neighborhood: loc.neighborhood,
      catalog_id: catalogId, estimate,
    });
    if (ins.error) { console.error(ins.error); return fail(dbMessage(ins.error, "No pudimos guardar el anuncio. Intenta de nuevo.")); }

    for (const [i, f] of st.files.entries()) {
      step(`Subiendo foto ${i + 1} de ${st.files.length}…`);
      const ext = { "image/png": "png", "image/webp": "webp" }[f.type] ?? "jpg";
      const path = `${uid}/${id}/${i}.${ext}`;
      let up;
      for (let attempt = 0; attempt < 3; attempt++) { // la red del teléfono a veces corta; reintenta
        if (attempt) await new Promise((r) => setTimeout(r, 800 * attempt));
        up = await sb.storage.from("listing-photos").upload(path, f, { contentType: f.type || "image/jpeg", cacheControl: "31536000", upsert: false });
        if (!up.error || dup(up.error)) break; // "ya existe" = el intento anterior sí llegó
      }
      if (up.error && !dup(up.error)) return abort(up.error, "No pudimos subir las fotos. Revisa tu conexión e intenta de nuevo.");
      paths.push(path);
    }

    step("Publicando…");
    const pr = await sb.from("listing_photos").insert(paths.map((storage_path, position) => ({ listing_id: id, storage_path, position })));
    if (pr.error) return abort(pr.error, dbMessage(pr.error, "No pudimos guardar las fotos del anuncio. Intenta de nuevo."));
    if (st.verif && st.verif.size <= 3 * 1024 * 1024) {
      // Optional: if it fails (e.g. migration 0006 not applied yet) the listing still publishes.
      step("Subiendo foto de verificación…");
      const vpath = `${uid}/${id}/verificacion.${{ "image/png": "png", "image/webp": "webp" }[st.verif.type] ?? "jpg"}`;
      const vu = await sb.storage.from("listing-photos").upload(vpath, st.verif, { contentType: st.verif.type || "image/jpeg", cacheControl: "31536000", upsert: false });
      if (vu.error && !dup(vu.error)) console.error("verification upload failed", vu.error);
      else {
        const vr = await sb.from("listing_photos").insert({ listing_id: id, storage_path: vpath, position: 99, kind: "verification" });
        if (vr.error) { console.error("verification row failed", vr.error); sb.storage.from("listing-photos").remove([vpath]); }
      }
    }
    const act = await sb.from("listings").update({ status: "active" }).eq("id", id).select("id");
    if (act.error || !act.data?.length) return abort(act.error ?? "activate: 0 rows", dbMessage(act.error, "No pudimos publicar el anuncio. Intenta de nuevo."));
    track("publicar", id);
    toast("Anuncio publicado", { description: "Ya está visible para los compradores." });
    go(`/carta/${id}`);
  });
  // Coming from "Véndela en Holo" in the scanner: start with that photo.
  if (pendingSellFiles?.length) {
    const dt = new DataTransfer();
    pendingSellFiles.forEach((f) => dt.items.add(f));
    pendingSellFiles = null;
    $("#photos").files = dt.files;
    $("#photos").dispatchEvent(new Event("change"));
  }
}

// ============================================================= scanner (#/escanear)
// "¿Cuánto vale tu carta?": photo → card → market value. Loose Pokémon cards are read for free in the
// browser first (OCR + catalog); the paid AI only runs for slabs, sports cards and unclear photos.
// The daily quota lives in the database (scan_quota, migration 0012).
let pendingSellFiles = null;
const quotaText = (q) => q.plan_until
  ? `Plan Coleccionista activo hasta el ${new Date(q.plan_until).toLocaleDateString("es-PA", { day: "numeric", month: "long" })}: escaneos sin límite.`
  : `Te ${q.limit - q.used === 1 ? "queda" : "quedan"} ${Math.max(0, q.limit - q.used)} de ${q.limit} escaneos gratis hoy.`;
function planOffer(q) {
  const pay = waLink(`Quiero el Plan Coleccionista (${formatUsd(toCents(CONFIG.PLAN_USD))} al mes).`);
  return `<section class="panel accent" style="margin-top:16px"><h2 class="ptitle">${ic("trend")}Usaste tus ${q.limit} escaneos gratis de hoy</h2>
    <p class="sub">Mañana tienes ${q.limit} más. Con el <b>Plan Coleccionista</b> escaneas sin límite por ${formatUsd(toCents(CONFIG.PLAN_USD))} al mes.</p>
    ${pay ? `<a class="btn primary" style="margin-top:12px" href="${esc(pay)}" target="_blank" rel="noopener">Quiero el plan</a>` : `<p class="notice soft" style="margin:12px 0 0">Muy pronto podrás activarlo aquí mismo.</p>`}</section>`;
}
function viewScan(app) {
  setTitle("¿Cuánto vale tu carta?");
  const head = `<p class="eyebrow"><span class="dot"></span>Gratis · 3 escaneos al día</p><h1>¿Cuánto vale tu carta?</h1>
    <p class="lead">Tómale una foto y te decimos qué carta es y cuánto vale hoy en el mercado. Pokémon, NBA y NFL, sueltas o graduadas.</p>`;
  if (!sb) { app.innerHTML = `<div class="wrap page">${head}<p class="notice bad">No hay conexión con el servidor. Revisa tu internet y recarga.</p></div>`; return; }
  if (!session) {
    app.innerHTML = `<div class="wrap page"><div style="max-width:760px">${head}</div>
      <div class="panel" style="max-width:440px;margin-top:24px;padding:24px"><p style="font-weight:600">Entra o crea tu cuenta para escanear.</p><p class="small muted" style="margin:4px 0 16px">Es gratis y toma menos de un minuto.</p>
      <a class="btn primary block" href="#/entrar?next=${encodeURIComponent("/escanear")}">Entrar o crear cuenta</a></div></div>`;
    return;
  }
  app.innerHTML = `<div class="wrap page"><div style="max-width:760px">${head}</div>
    <div class="scan">
      <div class="seg" role="radiogroup" aria-label="Tipo de carta" style="margin-top:8px">
        <label class="on"><input type="radio" name="scanKind" value="raw" checked>Carta suelta</label>
        <label><input type="radio" name="scanKind" value="graded">Graduada (en slab)</label>
      </div>
      <label class="drop card-ratio" id="scanDrop" style="margin-top:16px"><span class="ico">${ic("camera")}</span><span style="font-weight:600">Toma o sube una foto</span><span class="xs muted" style="padding:0 24px">De frente, con buena luz y sin reflejos.</span>
        <input type="file" id="scanIn" accept="image/jpeg,image/png,image/webp" class="sr-only"></label>
      <p class="xs muted" id="scanQuota" style="margin-top:10px;text-align:center"></p>
    </div>
    <div id="scanResult" aria-live="polite"></div></div>`;
  const quotaEl = $("#scanQuota"), out = $("#scanResult");
  app.querySelectorAll("input[name=scanKind]").forEach((r) => r.addEventListener("change", () =>
    app.querySelectorAll(".scan .seg label").forEach((lb) => lb.classList.toggle("on", lb.querySelector("input").checked))));
  sb.rpc("scan_quota", { p_use: false }).then(({ data, error }) => { if (!error && data && quotaEl.isConnected) quotaEl.textContent = quotaText(data); });
  let run = 0;
  $("#scanIn").addEventListener("change", async (e) => {
    const raw = e.target.files?.[0];
    e.target.value = "";
    if (!raw) return;
    const me = ++run, graded = app.querySelector("input[name=scanKind]:checked")?.value === "graded";
    const status = (t) => { if (me === run) out.innerHTML = `<div class="panel accent small" style="display:flex;align-items:center;gap:10px;margin-top:16px"><span class="spinner"></span>${esc(t)}</div>`; };
    status("Revisando tus escaneos de hoy…");
    const { data: q, error: qe } = await sb.rpc("scan_quota", { p_use: true });
    if (me !== run || !out.isConnected) return;
    if (qe && qe.code !== "PGRST202") { console.error(qe); out.innerHTML = `<p class="notice bad" style="margin-top:16px">No pudimos iniciar el escaneo. Intenta de nuevo.</p>`; return; }
    if (q) quotaEl.textContent = quotaText(q);
    if (q && !q.allowed) { out.innerHTML = planOffer(q); return; }
    track("escanear");
    const file = await compressImage(raw);
    // Free read first; a likely match is shown with "¿No es tu carta?", and only then the paid AI runs.
    const withAI = async () => {
      const mine = ++run;
      let r = null;
      try { r = await identifyCard([file], status); } catch (err) { console.warn("scan failed", err instanceof Event ? `${err.type} ${err.target?.src ?? ""}` : err); }
      if (mine === run && out.isConnected) renderScanResult(out, r, file, graded);
    };
    const free = graded ? null : await identifyFree([file], status).catch((err) => { console.warn("free scan", err); return null; });
    if (me !== run || !out.isConnected) return;
    if (free && free.confidence !== "baja") return renderScanResult(out, free, file, graded, free.confidence === "alta" ? null : withAI);
    withAI();
  });
}

  const img = c?.images?.large || c?.images?.small || URL.createObjectURL(file);

  out.innerHTML = `<div class="scan-result">
    <div class="panel scan-card"><img src="${esc(img)}" alt="${esc(card.subject)}" class="card"></div>

        ${ai?.is_graded && !grading ? `<p class="notice warn small" style="margin:10px 0 0">Vimos un slab pero no pudimos leer la nota. Mostramos el valor sin graduar.</p>` : ""}
        ${retryWithAI ? `<p class="small" style="margin:12px 0 0">¿No es tu carta? <button type="button" class="link" data-ai style="background:none;border:0;padding:0;cursor:pointer;font:inherit">Analizarla con IA</button> <span class="xs muted">(no gasta otro escaneo)</span></p>` : ""}</section>
      <section class="panel" id="priceChart"><h2 class="ptitle">${ic("trend")}Valor en el mercado</h2><p class="loading" style="padding:28px 0"><span class="spinner"></span>Buscando el precio de hoy…</p></section>

// Every step goes through staff_order_action() (migration 0014): the order, the listing and the
// sale record change together, and the database refuses a step out of order (e.g. paying the
// seller while a claim is open or before the 3-day window ends).
const STAFF_STAGE = {
  awaiting_payment: ["Esperando pago", "prot"], paid: ["Pagada · por entregar", "prot"], delivered: ["Entregada · 3 días para reclamar", "prot"],
  claim: ["Reclamo abierto", "warn"], ready: ["Lista para pagar al vendedor", "good"], released: ["Liberada ✓", "good"],
  refunded: ["Reembolsada", "warn"], cancelled: ["Cancelada", "neutral"],
};
const STAFF_ACTIONS = { // stage → [action, label, style]
  awaiting_payment: [["mark_paid", "Marcar pagada", "primary"], ["cancel", "Cancelar", "danger"]],
  paid: [["mark_delivered", "Entregada (empiezan los 3 días)", "primary"], ["buyer_confirmed", "El comprador confirmó que está bien", ""], ["refund", "Reembolsar", "danger"]],
  delivered: [["buyer_confirmed", "El comprador confirmó que está bien", ""], ["refund", "Reembolsar", "danger"]],
  claim: [["refund", "Reembolsar al comprador", "danger"], ["reject_claim", "Rechazar reclamo", ""]],
  ready: [["release", "Ya le pagué al vendedor", "primary"], ["refund", "Reembolsar", "danger"]],
};
async function adminOrders(body) {
  const { data: orders, error } = await sb.rpc("staff_orders");
  if (error) {
    if (["PGRST202", "42883"].includes(error.code)) { body.innerHTML = `<p class="notice bad">Falta aplicar la migración 0014 en Supabase.</p>`; return; }
    throw error;
  }
  const payNow = orders.filter((o) => o.stage === "ready");
  const claims = orders.filter((o) => o.stage === "claim");
  const open = orders.filter((o) => ["awaiting_payment", "paid", "delivered"].includes(o.stage));
  const closed = orders.filter((o) => ["released", "refunded", "cancelled"].includes(o.stage));

  const card = (o) => {
    const [label, cls] = STAFF_STAGE[o.stage] ?? [o.stage, "neutral"];
    const amt = orderAmounts(o), total = amt.buyer;
    const alert = /ATENCIÓN/.test(o.notes ?? "");
    return `<li class="panel order" data-id="${o.id}">

        <div><dt>Comprador</dt><dd>${esc(o.buyer_contact || (o.buyer_id ? `Cuenta ${o.buyer_id.slice(0, 8).toUpperCase()}` : "—"))}</dd></div>
        <div><dt>El comprador paga</dt><dd>${formatUsd(total)}</dd></div>
        <div><dt>Pagar al vendedor</dt><dd>${formatUsd(amt.payout)}</dd></div>
        <div><dt>Comisiones con ITBMS (comprador + vendedor)</dt><dd>${formatUsd(amt.buyerFee)} + ${formatUsd(amt.sellerFee)}</dd></div>
        ${o.payment_ref ? `<div><dt>Ref. de pago</dt><dd>${esc(o.payment_ref)}</dd></div>` : ""}
        ${o.delivered_at ? `<div><dt>Entregada</dt><dd>${fmtDate(o.delivered_at)}${o.buyer_confirmed_at ? " · el comprador confirmó" : ""}</dd></div>` : ""}
        ${o.stage === "delivered" ? `<div><dt>Se puede pagar al vendedor desde</dt><dd>${fmtDate(o.ready_at)}</dd></div>` : ""}
        ${o.payout_ref ? `<div><dt>Ref. del pago al vendedor</dt><dd>${esc(o.payout_ref)}</dd></div>` : ""}
        <div><dt>Creada / actualizada</dt><dd>${fmtDate(o.created_at)} · ${fmtDate(o.updated_at)}${o.source === "checkout" ? " · pagó en línea" : ""}</dd></div>
      </dl>
      <label class="f muted-label" style="margin-top:8px">Notas<textarea class="textarea order-notes" rows="2" maxlength="500">${esc(o.notes ?? "")}</textarea></label>
      <div class="order-actions">
        ${(STAFF_ACTIONS[o.stage] ?? []).map(([a, t, st]) => `<button class="btn ${st}" data-act="${a}">${t}</button>`).join("")}
        <button class="btn" data-act="notes">Guardar notas</button>
      </div><div class="order-msg"></div></li>`;
  };
  const list = (xs, empty) => xs.length ? `<ul class="admin-list">${xs.map(card).join("")}</ul>` : `<p class="muted small">${empty}</p>`;

  body.innerHTML = `
    <section class="panel col"><h2>Nueva orden protegida</h2>
      <p class="small muted" style="margin:0">Cuando un comprador te escribe para comprar protegido, búscale el anuncio y crea la orden. El comprador paga el precio + ${feePct()} + ITBMS; al vendedor le descontamos ${feePct()} + ITBMS al pagarle.</p>
      <div class="row-input"><input class="input" id="noSearch" placeholder="Busca el anuncio (título, jugador, set…)"><button class="btn" id="noFind" style="border-radius:12px">Buscar</button></div>
      <div id="noResults"></div>
    </section>
    <h2 class="display admin-h">Pagar hoy (${payNow.length})</h2>
    <p class="small muted" style="margin:0">El comprador confirmó o pasaron los 3 días sin reclamo. Envíale al vendedor el monto por Yappy y marca “Ya le pagué”.</p>
    ${list(payNow, "Nada por pagar.")}
    ${claims.length ? `<h2 class="display admin-h">Reclamos (${claims.length})</h2>${list(claims, "")}` : ""}
    <h2 class="display admin-h">En curso (${open.length})</h2>
    ${list(open, "No hay órdenes en curso.")}
    <details class="admin-closed"><summary>Cerradas (${closed.length})</summary>${list(closed, "Ninguna todavía.")}</details>`;

  // claim photos (private bucket: short-lived links for staff)
  body.querySelectorAll(".claim-photos").forEach(async (el) => {
    const paths = JSON.parse(el.dataset.photos || "[]");
    if (!paths.length) { el.innerHTML = `<span class="xs muted">Sin fotos.</span>`; return; }
    const { data } = await sb.storage.from("claim-photos").createSignedUrls(paths, 3600);
    el.innerHTML = (data ?? []).filter((x) => x.signedUrl).map((x) => `<a href="${esc(x.signedUrl)}" target="_blank" rel="noopener"><img src="${esc(x.signedUrl)}" alt="Foto del reclamo"></a>`).join("");
  });

  // new order
  const find = async () => {
    const q = $("#noSearch").value.trim(), out = $("#noResults");
    if (q.length < 2) { out.innerHTML = `<p class="xs muted">Escribe al menos 2 letras.</p>`; return; }
    out.innerHTML = `<p class="xs muted"><span class="spinner"></span> Buscando…</p>`;
    let query = sb.from("listings").select("id, title, price_cents, seller_id, status").eq("status", "active").limit(8);
    for (const t of searchTokens(q)) query = query.or(searchFilter(t, ["title", "subject", "set_name"]));
    const { data, error } = await query;
    if (error) return adminFail(error, out, "No se pudo buscar.");
    if (!data.length) { out.innerHTML = `<p class="xs muted">No hay anuncios activos con ese texto.</p>`; return; }
    const sellersFound = await profilesById(data.map((l) => l.seller_id));
    out.innerHTML = `<ul class="admin-list">${data.map((l) => {
      const q2 = quoteProtected(l.price_cents);
      return `<li class="panel" data-lid="${l.id}"><div class="phead"><span style="font-weight:600">${esc(l.title)}</span><span class="small muted">${esc(sellersFound.get(l.seller_id)?.display_name ?? "")}</span></div>
        <p class="small" style="margin:6px 0">El comprador paga <b>${formatUsd(q2.buyerTotalCents)}</b> (carta ${formatUsd(q2.priceCents)} + ${formatUsd(q2.feeCents)} + ITBMS ${formatUsd(q2.itbmsCents)}) · al vendedor le pagamos <b>${formatUsd(q2.sellerPayoutCents)}</b></p>
        <div class="row-input"><input class="input no-buyer" maxlength="120" placeholder="Comprador: nombre y WhatsApp"></div>
        <div class="row-input" style="margin-top:8px"><input class="input no-code" maxlength="8" placeholder="Código Holo del comprador (opcional)" autocapitalize="characters"><button class="btn primary no-create" style="border-radius:12px">Crear orden</button></div><div class="no-msg"></div></li>`;
    }).join("")}</ul>`;
    out.querySelectorAll("[data-lid]").forEach((li) => li.querySelector(".no-create").addEventListener("click", async (e) => {
      const l = data.find((x) => x.id === li.dataset.lid), msg = li.querySelector(".no-msg");
      e.target.disabled = true;
      // The buyer's code (in their message and in Mi cuenta) links the order to their account, so they
      // can review the seller afterwards, and applies the price of an offer the seller accepted.
      const code = li.querySelector(".no-code").value.trim().toLowerCase();
      let buyerId = null, price = l.price_cents;
      if (code) {
        const buyer = /^[0-9a-f]{8}$/.test(code) ? await findByCode(code) : null;
        if (!buyer) { e.target.disabled = false; msg.innerHTML = `<p class="notice bad" style="margin:0">No encontramos ese código. Está en el mensaje del comprador y en su Mi cuenta.</p>`; return; }
        buyerId = buyer.id;
        const { data: off } = await sb.from("offers").select("amount_cents").eq("listing_id", l.id).eq("buyer_id", buyerId).eq("status", "accepted").order("updated_at", { ascending: false }).limit(1);
        if (off?.[0]) price = off[0].amount_cents;
      }
      const q2 = quoteProtected(price);
      const row = {
        listing_id: l.id, seller_id: l.seller_id, buyer_id: buyerId, buyer_contact: li.querySelector(".no-buyer").value.trim() || null,
        price_cents: q2.priceCents, fee_cents: q2.feeCents, itbms_cents: q2.itbmsCents, status: "awaiting_payment",
        seller_fee_cents: q2.sellerFeeCents, seller_itbms_cents: q2.sellerItbmsCents,
      };
      let { error } = await sb.from("protected_orders").insert(row);
      // Before migration 0016 the seller commission columns don't exist yet.
      if (error && (error.code === "PGRST204" || error.code === "42703")) {
        delete row.seller_fee_cents; delete row.seller_itbms_cents;
        ({ error } = await sb.from("protected_orders").insert(row));
      }
      if (error) { e.target.disabled = false; return adminFail(error, msg, "No se pudo crear la orden."); }
      await sb.from("listings").update({ protected_eligible: true }).eq("id", l.id);
      if (price !== l.price_cents) toast(`Orden creada con la oferta aceptada: ${formatUsd(price)}.`);
      route();
    }));
  };
  $("#noFind").addEventListener("click", find);
  $("#noSearch").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); find(); } });

  // order actions
  const ASK = {
    mark_paid: ["Referencia del pago (Yappy o transferencia):", "payment_ref"],
    release: ["Referencia del Yappy que le enviaste al vendedor:", "payout_ref"],
    refund: ["Referencia del reembolso (opcional):", null],
    reject_claim: ["¿Por qué se rechaza el reclamo? (queda en las notas)", null],
  };
  const CONFIRM = {
    cancel: "¿Cancelar esta orden? No hubo pago.",
    refund: "¿Marcar como reembolsada? Confirma que ya le devolviste el dinero al comprador. La carta vuelve a estar a la venta.",
    buyer_confirmed: "¿El comprador te confirmó que recibió la carta bien? Queda lista para pagarle al vendedor.",
    mark_delivered: "¿El comprador ya tiene la carta? Empiezan sus 3 días para reclamar.",
  };
  body.querySelectorAll("li.order").forEach((li) => {
    const o = orders.find((x) => x.id === li.dataset.id), msg = li.querySelector(".order-msg");
    li.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", async () => {
      const act = b.dataset.act;
      if (act === "notes") {
        const { error } = await sb.from("protected_orders").update({ notes: li.querySelector(".order-notes").value.trim() || null }).eq("id", o.id);
        return error ? adminFail(error, msg) : (msg.innerHTML = `<p class="notice good" style="margin:0">Notas guardadas.</p>`);
      }
      let ref = null;
      if (ASK[act]) {
        const [q, field] = ASK[act];
        ref = prompt(act === "release" ? `Pagar ${formatUsd(orderAmounts(o).payout)} a ${o.seller_name ?? "el vendedor"}${o.payout_phone ? ` (Yappy ${o.payout_phone})` : ""}.\n${q}` : q, (field && o[field]) || "");
        if (ref === null) return;
      }
      if (CONFIRM[act] && !confirm(CONFIRM[act])) return;
      li.querySelectorAll("button").forEach((x) => (x.disabled = true));
      const { error } = await sb.rpc("staff_order_action", { p_order: o.id, p_action: act, p_ref: ref?.trim() || null });
      if (error) {
        li.querySelectorAll("button").forEach((x) => (x.disabled = false));
        return adminFail(error, msg, /not allowed/.test(error.message ?? "") ? "La orden cambió de estado. Recarga el panel." : "No se pudo guardar. Intenta de nuevo.");
      }
      route();
    }));
  });
}

async function adminListings(body, q) {
  let query = sb.from("listings").select("id, title, price_cents, status, protected_eligible, seller_id, created_at").order("created_at", { ascending: false }).limit(50);
  for (const t of searchTokens(q)) query = query.or(searchFilter(t, ["title", "subject", "set_name"]));
  const { data, error } = await query;
  if (error) throw error;
  const sellers = await profilesById(data.map((l) => l.seller_id));
  body.innerHTML = `
    <form id="alSearch" class="row-input" style="margin-bottom:12px"><input class="input" name="q" value="${esc(q)}" placeholder="Buscar anuncio"><button class="btn" style="border-radius:12px">Buscar</button></form>
    ${data.length ? `<ul class="admin-list">${data.map((l) => `<li class="panel" data-id="${l.id}">
      <div class="phead"><a href="#/carta/${encodeURIComponent(l.id)}" style="font-weight:600">${esc(l.title)}</a><span class="small">${formatUsd(l.price_cents)}</span></div>
      <p class="xs muted" style="margin:4px 0 8px">${esc(sellers.get(l.seller_id)?.display_name ?? "—")} · ${LISTING_STATUS[l.status] ?? l.status} · ${fmtDate(l.created_at)}</p>
      <div class="order-actions">
        <label class="toggle"><input type="checkbox" class="al-prot" ${l.protected_eligible ? "checked" : ""}> Compra Protegida</label>
        ${l.status === "removed" ? `<button class="btn" data-status="active">Reactivar</button>` : `<button class="btn danger" data-status="removed">Quitar anuncio</button>`}
      </div><div class="order-msg"></div></li>`).join("")}</ul>` : `<p class="muted small">No hay anuncios${q ? " con ese texto" : ""}.</p>`}`;
  $("#alSearch").addEventListener("submit", (e) => { e.preventDefault(); go(`/admin?tab=anuncios&q=${encodeURIComponent(e.target.q.value.trim())}`); });
  body.querySelectorAll("li[data-id]").forEach((li) => {
    const msg = li.querySelector(".order-msg");
    li.querySelector(".al-prot").addEventListener("change", async (e) => {
      const { error } = await sb.from("listings").update({ protected_eligible: e.target.checked }).eq("id", li.dataset.id);
      if (error) { e.target.checked = !e.target.checked; adminFail(error, msg); }
    });
    li.querySelector("[data-status]").addEventListener("click", async (e) => {
      const status = e.target.dataset.status;
      if (status === "removed" && !confirm("¿Quitar este anuncio? Deja de verse en la página (se puede reactivar).")) return;
      const { error } = await sb.from("listings").update({ status }).eq("id", li.dataset.id);
      if (error) return adminFail(error, msg);
      route();
    });
  });
}

async function adminShops(body) {

      <dl class="rows"><div><dt>Cuenta</dt><dd>${esc(names.get(r.user_id)?.display_name ?? "—")}</dd></div>
        <div><dt>Contacto</dt><dd>${esc(r.contact || "—")}</dd></div><div><dt>Ubicación</dt><dd>${esc(r.location || "—")}</dd></div></dl>
      <p class="xs muted" style="margin:8px 0">Antes de aprobar: revisa su Instagram, que el local exista y que venda cartas originales.</p>
      <div class="order-actions"><button class="btn primary" data-act="approve">Aprobar y verificar</button><button class="btn danger" data-act="reject">Rechazar</button></div>
      <div class="order-msg"></div></li>`).join("")}</ul>` : `<p class="muted small">No hay solicitudes pendientes.</p>`}
    <h2 class="display admin-h">Tiendas (${shops?.length ?? 0})</h2>
    ${shops?.length ? `<ul class="admin-list">${shops.map((s) => `<li class="panel" data-user="${s.id}"><div class="phead"><span style="font-weight:600">${esc(s.display_name)}</span>${s.verified ? shopBadge() : `<span class="b neutral">Sin verificar</span>`}</div>
      <div class="order-actions" style="margin-top:8px">${s.verified ? `<button class="btn danger" data-act="unverify">Quitar verificación</button>` : `<button class="btn primary" data-act="verify">Verificar</button>`}</div><div class="order-msg"></div></li>`).join("")}</ul>` : `<p class="muted small">Todavía no hay tiendas.</p>`}`;

  body.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", async () => {
    const li = b.closest("li"), msg = li.querySelector(".order-msg"), act = b.dataset.act, user = li.dataset.user;
    li.querySelectorAll("button").forEach((x) => (x.disabled = true));
    const fail = (e) => { li.querySelectorAll("button").forEach((x) => (x.disabled = false)); adminFail(e, msg); };
    if (act === "approve" || act === "verify" || act === "unverify") {
      const { error } = await sb.from("profiles").update(act === "unverify" ? { verified: false } : { is_shop: true, verified: true }).eq("id", user);
      if (error) return fail(error);
    }
    if (act === "approve" || act === "reject") {
      const { error } = await sb.from("shop_requests").update({ status: act === "approve" ? "approved" : "rejected", reviewed_at: new Date().toISOString() }).eq("id", li.dataset.id);
      if (error) return fail(error);
    }
    route();
  }));
}

// ------------------------------------------------------------- analytics
// [event, label, step it is compared against]. WhatsApp and "Comprar protegido" are
// parallel choices after opening a card, so both compare against ver_carta.
const FUNNEL = [
  ["visita", "Visitaron Holo", null], ["registro", "Crearon cuenta", "visita"], ["ver_carta", "Abrieron una carta", "registro"], ["escanear", "Escanearon una carta", "registro"],
  ["click_whatsapp", "Tocaron WhatsApp", "ver_carta"], ["click_protegida", "Tocaron “Comprar protegido”", "ver_carta"],
];
async function adminAnalytics(body, days) {
  days = [7, 30, 90].includes(days) ? days : 7;
  const { data, error } = await sb.rpc("analytics_summary", { p_days: days });
  if (error) {
    if (error.code === "PGRST202") { body.innerHTML = `<p class="notice warn">Falta aplicar la migración 0007 en Supabase para ver la analítica.</p>`; return; }
    throw error;
  }
  const f = data.funnel ?? {}, top = f.visita?.visitors || 0;
  const pct = (n, of) => (of ? `${Math.round((n / of) * 100)}%` : "—");
  const maxDay = Math.max(1, ...(data.daily ?? []).map((d) => d.visitors));
  body.innerHTML = `
    <div class="row-input" style="justify-content:flex-start">${[7, 30, 90].map((d) => `<a class="btn ${d === days ? "primary" : "outline"}" href="#/admin?tab=analitica&dias=${d}">${d} días</a>`).join("")}</div>
    <section class="panel col"><h2>Embudo · últimos ${days} días</h2>
      <p class="xs muted" style="margin:0">Personas distintas (visitantes anónimos). No incluye al staff.</p>
      <div class="funnel">${FUNNEL.map(([k, label, from]) => {
        const v = f[k]?.visitors ?? 0, prev = from ? f[from]?.visitors ?? 0 : 0;
        const fromLabel = { visita: "de las visitas", registro: "de quienes crearon cuenta", ver_carta: "de quienes abrieron una carta" }[from];
        return `<div class="frow"><div class="flabel"><span>${label}</span><b>${v}</b></div>
          <div class="fbar"><div style="width:${top ? Math.max(2, (v / top) * 100) : 0}%"></div></div>
          <p class="xs muted" style="margin:2px 0 0">${from && from !== "visita" ? `${pct(v, prev)} ${fromLabel} · ` : ""}${pct(v, top)} de las visitas</p></div>`;
      }).join("")}</div></section>
    <div class="stats">
      <div class="panel stat"><p class="display" style="font-size:28px;font-weight:700;margin:0">${f.publicar?.events ?? 0}</p><p class="xs muted" style="margin:2px 0 0">cartas publicadas</p></div>
      <div class="panel stat"><p class="display" style="font-size:28px;font-weight:700;margin:0">${f.compartir?.events ?? 0}</p><p class="xs muted" style="margin:2px 0 0">veces compartidas</p></div>
      <div class="panel stat"><p class="display" style="font-size:28px;font-weight:700;margin:0">${f.ver_carta?.events ?? 0}</p><p class="xs muted" style="margin:2px 0 0">cartas vistas (total)</p></div>
      <div class="panel stat"><p class="display" style="font-size:28px;font-weight:700;margin:0">${(f.click_whatsapp?.events ?? 0) + (f.click_protegida?.events ?? 0)}</p><p class="xs muted" style="margin:2px 0 0">contactos (WhatsApp + protegida)</p></div>
    </div>
    <section class="panel col"><h2>Visitantes por día</h2>
      ${(data.daily ?? []).length ? `<div class="daily">${data.daily.map((d) => `<div title="${esc(d.day)}: ${d.visitors}"><span style="height:${(d.visitors / maxDay) * 100}%"></span><em>${esc(String(d.day).slice(8, 10))}</em></div>`).join("")}</div>` : `<p class="muted small" style="margin:0">Todavía no hay visitas registradas.</p>`}</section>
    <section class="panel col"><h2>Cartas más vistas</h2>
      ${(data.top_listings ?? []).length ? `<table class="fees"><thead><tr><th>Carta</th><th>Vistas</th><th>Personas</th><th>Contactos</th></tr></thead><tbody>${data.top_listings.map((t) => {
        const title = t.title ?? DEMO.find((d) => d.id === t.ref)?.title ?? "Anuncio eliminado";
        return `<tr><td><a href="#/carta/${encodeURIComponent(t.ref)}">${esc(title)}</a></td><td>${t.views}</td><td>${t.visitors}</td><td>${t.clicks}</td></tr>`;
      }).join("")}</tbody></table>` : `<p class="muted small" style="margin:0">Todavía nadie ha abierto una carta.</p>`}</section>`;
}

        <dl class="rows"><div><dt>Vendedor</dt><dd>${esc(people.get(l?.seller_id)?.display_name ?? "—")}</dd></div>

        ${r.details ? `<p class="small" style="margin:8px 0 0;white-space:pre-line">“${esc(r.details)}”</p>` : ""}

        <div class="order-msg"></div></li>`;
    }).join("")}</ul>` : `<p class="muted small">No hay reportes pendientes. 🎉</p>`;
  body.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", async () => {

    const fail = (e) => { li.querySelectorAll("button").forEach((x) => (x.disabled = false)); adminFail(e, msg); };
    if (b.dataset.act === "remove") {

      const { error: e2 } = await sb.from("reports").update({ resolved: true }).eq("listing_id", li.dataset.listing).eq("resolved", false);
