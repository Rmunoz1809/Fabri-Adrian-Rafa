      ${sales.map((p) => dot(p, CHART_COLORS.sales, 4.5)).join("")}
      ${web.length > 1 ? `<path d="${webLine}" fill="none" stroke="${CHART_COLORS.web}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>` : ""}
      ${web.map((p) => (p.today ? `<circle class="ping" cx="${X(p.t)}" cy="${Y(p.v)}" r="4.5" fill="${CHART_COLORS.web}" opacity=".75"/>${dot(p, CHART_COLORS.web, 4.5)}` : dot(p, CHART_COLORS.web, 3))).join("")}
      ${last ? `<circle class="ping" cx="${X(last.t)}" cy="${Y(last.v)}" r="4.5" fill="${CHART_COLORS.market}" opacity=".75"/>${dot(last, CHART_COLORS.market, 4.5)}` : ""}
    </g>
    <g class="cross" style="display:none"><line y1="${m.t}" y2="${base}" stroke="var(--fg-3)" stroke-width="1"/><circle r="5.5" fill="var(--card)" stroke="var(--fg)" stroke-width="2"/></g>
  </svg><div class="ptip" role="status"></div>`;
  if (animate) revealChart(wrap.querySelector("#pcClip rect"), W);

  // Hover / keyboard layer: snap to the nearest date that has data.
  const byDay = new Map();
  const blank = (t) => ({ t, market: null, cm: null, sales: [], web: [] });
  for (const p of market) byDay.set(isoDay(new Date(p.t)), { ...blank(p.t), market: p.v, marketCarried: p.carried });
  for (const p of cmk) { const k = isoDay(new Date(p.t)); const s = byDay.get(k) ?? blank(p.t); s.cm = p; byDay.set(k, s); }
  for (const p of sales) { const k = isoDay(new Date(p.t)); const s = byDay.get(k) ?? blank(p.t); s.sales.push(p.v); byDay.set(k, s); }
  for (const p of web) { const k = isoDay(new Date(p.t)); const s = byDay.get(k) ?? blank(p.t); s.web.push(p); byDay.set(k, s); }
  const stops = [...byDay.values()].sort((a, b) => a.t - b.t);
  const svg = wrap.querySelector("svg"), tip = wrap.querySelector(".ptip"), cross = svg.querySelector(".cross");
  let idx = stops.length - 1;
  const row = (color, value, label, round) => {
    const r = document.createElement("div"); r.className = "r";
    const k = document.createElement("i"); k.className = "k"; k.style.background = color; if (round) Object.assign(k.style, { width: "8px", height: "8px", borderRadius: "50%" });
    const b = document.createElement("b"); b.textContent = value;
    r.append(k, b, document.createTextNode(label)); return r;
  };
  const show = (i) => {
    idx = Math.max(0, Math.min(stops.length - 1, i));
    const s = stops[idx], x = X(s.t), y = Y(s.market ?? s.cm?.v ?? s.sales[0] ?? s.web[0].v);
    cross.style.display = "";
    cross.querySelector("line").setAttribute("x1", x); cross.querySelector("line").setAttribute("x2", x);
    cross.querySelector("circle").setAttribute("cx", x); cross.querySelector("circle").setAttribute("cy", y);
    const d = document.createElement("div"); d.className = "d"; d.textContent = fmtDay(s.t, true);
    tip.replaceChildren(d);
    const again = " (sin dato nuevo, se repite)";
    if (s.market != null) tip.append(row(CHART_COLORS.market, formatUsd(toCents(s.market)), `TCGplayer${s.marketCarried ? again : ""}`));
    if (s.cm) tip.append(row(CHART_COLORS.cardmarket, formatUsd(toCents(s.cm.v)), `Cardmarket · ${s.cm.k}${s.cm.carried ? again : ""}`));
    for (const v of s.sales) tip.append(row(CHART_COLORS.sales, formatUsd(toCents(v)), "venta en Panamá", true));
    for (const p of s.web) tip.append(row(CHART_COLORS.web, formatUsd(toCents(p.v)), p.today ? "valor aproximado hoy" : p.k ?? `venta · ${p.src}`, true));
    const ref = s.market ?? s.cm?.v ?? s.sales[0] ?? s.web[0]?.v, diff = Math.round(((price - ref) / ref) * 100);
    if (price != null) tip.append(row("var(--fg)", formatUsd(toCents(price)), `${(l.priceLabel ?? "Este anuncio").toLowerCase()} (${diff > 0 ? "+" : ""}${diff}%)`));
    const first = tip.style.display !== "block";
    tip.style.display = "block";
    const tw = tip.offsetWidth, left = x > W / 2 ? Math.max(0, x - tw - 12) : Math.min(W - tw, x + 12);
    tip.classList.toggle("moving", !first); // Recharts slides the tooltip (400 ms ease) once it is visible
    tip.style.transform = `translate(${Math.round(left)}px, 0)`;
  };
  const hide = () => { cross.style.display = "none"; tip.style.display = "none"; tip.classList.remove("moving"); };
  svg.addEventListener("pointermove", (e) => {
    const r = svg.getBoundingClientRect(), px = ((e.clientX - r.left) / r.width) * W;
    let best = 0;
    stops.forEach((s, i) => { if (Math.abs(X(s.t) - px) < Math.abs(X(stops[best].t) - px)) best = i; });
    if (best !== idx || tip.style.display !== "block") show(best);
  });
  svg.addEventListener("pointerleave", () => { if (document.activeElement !== svg) hide(); });
  svg.addEventListener("focus", () => show(idx));
  svg.addEventListener("blur", hide);
  svg.addEventListener("keydown", (e) => {
    const step = { ArrowLeft: -1, ArrowRight: 1 }[e.key];
    if (step) { e.preventDefault(); show(idx + step); }
    else if (e.key === "Home" || e.key === "End") { e.preventDefault(); show(e.key === "Home" ? 0 : stops.length - 1); }
  });
}

async function loadPriceChart(l, onHistory = null) {
  const box = $("#priceChart");
  if (!box) return;
  const h = await fetchPriceHistory(l).catch((e) => { console.error(e); return { market: [], cardmarket: [], sales: [], web: [], factor: 1 }; });
  if (!box.isConnected) return;
  onHistory?.(h);
  h.retry = () => { box.innerHTML = `<h2 class="ptitle">${ic("trend")}Valor en el mercado</h2><p class="loading" style="padding:20px 0"><span class="spinner"></span>Buscando el precio en ventas recientes…</p>`; loadPriceChart(l, onHistory); };
  // Con historial semanal largo se abre en "1 año"; si no, en 90 días (o todo, si son ventas encontradas en internet).
  let range = h.weekly ? 365 : h.web?.length ? Infinity : 90, width = box.clientWidth;
  const draw = (animate) => renderPriceChart(box, l, h, range, (r) => { range = r; draw(true); }, animate);
  draw(true);
  const ro = new ResizeObserver(() => {
    if (!box.isConnected) return ro.disconnect();
    if (box.clientWidth !== width) { width = box.clientWidth; draw(false); }
  });
  ro.observe(box);
  return h;
}

// Mi cuenta: the seller's dashboard. Their cards and, per card and in total,
// how many people saw them. Only counts from our own events (migrations 0007 and 0018): no AI, and no
// visitor ids leave the database. The seller's own visits and the staff's are not counted.
let listingStatsOn = true;
async function loadListingStats(uid, ids) {
  if (!ids.length) return { totals: {}, byId: new Map() };
  if (listingStatsOn) {
    const { data, error } = await sb.rpc("my_listing_stats");
    if (!error && data) return { totals: data.totals ?? {}, byId: new Map((data.listings ?? []).map((r) => [r.id, r])) };
    if (!["PGRST202", "42883"].includes(error?.code)) { console.error(error); return null; }
    listingStatsOn = false; // migration 0018 not applied yet
  }
  // Until 0018 runs, staff can read the raw events (0007 policy) and count them the same way here.
  if (!isStaff) return null;
  const [ev, own, team] = await Promise.all([
    sb.from("events").select("name, visitor_id, user_id, listing_ref, created_at").in("listing_ref", ids)
      .in("name", ["ver_carta", "click_whatsapp", "click_protegida", "compartir"]).limit(20000),
    sb.from("events").select("visitor_id").eq("user_id", uid).limit(5000),
    sb.from("profiles").select("id").eq("is_staff", true),
  ]);
  if (ev.error) { console.error(ev.error); return null; }
  const ownBrowsers = new Set((own.data ?? []).map((r) => r.visitor_id));
  const skipUsers = new Set([uid, ...(team.data ?? []).map((r) => r.id)]);
  const rows = ev.data.filter((e) => !ownBrowsers.has(e.visitor_id) && !skipUsers.has(e.user_id));
  const week = Date.now() - 7 * 864e5;
  const people = (list) => new Set(list.map((e) => e.visitor_id)).size;
  const count = (list) => {
    const views = list.filter((e) => e.name === "ver_carta"), recent = views.filter((e) => Date.parse(e.created_at) >= week);
    return {
      views: views.length, visitors: people(views), views_7d: recent.length, visitors_7d: people(recent),
      interested: people(list.filter((e) => e.name === "click_whatsapp" || e.name === "click_protegida")),
      shares: list.filter((e) => e.name === "compartir").length,
      last_view: views.reduce((m, e) => (!m || e.created_at > m ? e.created_at : m), null),
    };
  };
  const by = new Map();
  for (const e of rows) { if (!by.has(e.listing_ref)) by.set(e.listing_ref, []); by.get(e.listing_ref).push(e); }
  return { totals: count(rows), byId: new Map([...by].map(([id, list]) => [id, count(list)])) };
}

const listingUrl = (l) => `${location.origin}${location.pathname}#/carta/${encodeURIComponent(l.id)}`;
function loadImg(src) {
  return new Promise((res) => {
    if (!src) return res(null);
    const im = new Image(); im.crossOrigin = "anonymous";
    im.onload = () => res(im); im.onerror = () => res(null);
    // The page already loaded this image without CORS; a distinct URL avoids reusing
    // that cached copy, which would taint the canvas.
    im.src = src + (src.includes("?") ? "&" : "?") + "canvas=1";
  });
}
/** The logo mark on a canvas: white rounded square, its light band, the navy Z and its dot. */

  x.save(); x.translate(left, top); x.scale(size / 64, size / 64);
  x.beginPath(); x.roundRect(0, 0, 64, 64, 20); x.fillStyle = "#f4f6fb"; x.fill(); x.clip();
  x.beginPath(); x.moveTo(-8, 64); x.lineTo(22, -4); x.lineTo(34, -4); x.lineTo(4, 64); x.closePath(); x.fillStyle = "#e3e8f2"; x.fill();
  x.beginPath(); x.moveTo(18, 20); x.lineTo(46, 20); x.lineTo(18, 44); x.lineTo(46, 44);
  x.strokeStyle = "#0b1222"; x.lineWidth = 6.5; x.lineCap = "round"; x.lineJoin = "round"; x.stroke();
  x.beginPath(); x.arc(46, 20, 4.2, 0, Math.PI * 2); x.fillStyle = "#0b1222"; x.fill();
  x.restore();
}
// story = true: 1080×1920 for Instagram/WhatsApp stories (the card larger, the text lower).
async function shareImage(l, story = false) {
  // Same look as the site: navy, white and the logo's gray.
  const W = 1080, H = story ? 1920 : 1350, c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d"), FG = "#f4f6fb", FG2 = "#a4aec4", pad = 80;
  await document.fonts?.ready;
  x.fillStyle = "#0b1222"; x.fillRect(0, 0, W, H);
  /** Cuts text with "…" so it fits in the given width at the current font. */
  const fit = (t, max = W - pad * 2) => { let s = t; while (x.measureText(s).width > max && s.length > 4) s = s.slice(0, -2); return s === t ? t : `${s.trimEnd()}…`; };
  // card
  const img = await loadImg(l.photos[0]);
  const boxW = story ? 720 : 560, boxH = story ? 1005 : 782, bx = (W - boxW) / 2, by = story ? 170 : 70;
  if (img) {
    const r = Math.min(boxW / img.width, boxH / img.height), w = img.width * r, h = img.height * r;
    x.save(); x.shadowColor = "rgba(0,0,0,.6)"; x.shadowBlur = 50; x.shadowOffsetY = 20;
    x.drawImage(img, (W - w) / 2, by + (boxH - h) / 2, w, h); x.restore();
  } else {
    x.fillStyle = "#1b2640"; x.beginPath(); x.roundRect(bx, by, boxW, boxH, 36); x.fill();
    x.fillStyle = FG; x.font = "800 56px Inter, sans-serif"; x.textAlign = "center";
    x.fillText(fit(l.card.subject, boxW - 60), W / 2, by + boxH / 2);
  }
  // text
  x.textAlign = "left"; x.fillStyle = FG;
  let y = story ? 1330 : 930;
  x.font = "600 44px Inter, sans-serif";
  x.fillText(fit(l.title), pad, y); y += 110;
  x.font = "800 104px Inter, sans-serif"; x.fillText(formatUsd(toCents(l.priceUsd)), pad, y);
  y += 64; x.font = "500 36px Inter, sans-serif"; x.fillStyle = FG2;
  const bits = [];
  if (l.estimate) bits.push(`Precio estimado ${fmtEstimate(l.estimate.low)} – ${fmtEstimate(l.estimate.high)}`);
  bits.push(`${l.location.neighborhood}, ${l.location.district}`);
  x.fillText(fit(bits.join("  ·  ")), pad, y);
  // pills
  const pills = [];
  if (isVerifiedShop(l.seller)) pills.push("🏪 Tienda verificada");
  if (l.verificationPhoto) pills.push("📸 Foto de verificación");
  let px = pad; y += 70; x.font = "600 30px Inter, sans-serif";
  for (const t of pills) {
    const w = x.measureText(t).width + 44;
    if (px + w > W - pad) break;
    x.fillStyle = "rgba(255,255,255,.1)"; x.beginPath(); x.roundRect(px, y - 38, w, 56, 28); x.fill();
    x.fillStyle = FG; x.fillText(t, px + 22, y); px += w + 14;
  }
  // footer: the logo, as in the logo files (the mark, then "MarketZ" in white and "lab" in gray)
  drawMark(x, pad, H - 112, 48);
  const name = CONFIG.APP_NAME.replace(/lab$/, ""), lab = CONFIG.APP_NAME.slice(name.length);
  x.font = "800 40px Inter, sans-serif"; x.letterSpacing = "-1.4px";
  x.fillStyle = FG; x.fillText(name, pad + 64, H - 74);
  x.fillStyle = FG2; x.fillText(lab, pad + 64 + x.measureText(name).width, H - 74);
  x.letterSpacing = "0px";
  x.fillStyle = FG2; x.font = "500 30px Inter, sans-serif"; x.textAlign = "right";
  x.fillText("Cartas coleccionables en Panamá", W - pad, H - 76);
  return new Promise((res) => c.toBlob(res, "image/jpeg", 0.9));
}

function gateBackground() {
  if ($("#gateBg")) return;
  const pokemon = (id) => `<div class="gc"><img src="https://assets.tcgdex.net/en/me/${id}/low.webp" alt="" loading="eager" decoding="async"></div>`;
  const sports = (name) => `<div class="gc"><img src="${CARD_SCANS}${name}.jpg" alt="" loading="eager" decoding="async"></div>`;
  const cols = [];
  for (let c = 0; c < 9; c++) {
    const cards = [];
    for (let r = 0; r < 6; r++) {
      const i = c * 6 + r;
      cards.push(i % 3 === 1 ? sports(GATE_SPORTS[(c * 2 + r) % GATE_SPORTS.length]) : pokemon(GATE_POKEMON[(c * 5 + r) % GATE_POKEMON.length]));
    }
    const run = cards.join("");
    cols.push(`<div class="gate-col">${run}${run}</div>`); // doubled for a seamless loop
  }
  document.body.insertAdjacentHTML("afterbegin", `<div class="gate-bg" id="gateBg" aria-hidden="true"><div class="gate-cols">${cols.join("")}</div></div>`);
}

// ------------------------------------------------------------- seller accounts (migration 0031)
// Accounts are buyer accounts (buy and consult) or seller accounts. To sell, an account gives a phone
// and the exact residence address where the MarketZlab team picks up the cards it sells: people sign
// up as sellers, or turn a buyer account into a seller account from "Vender" or Mi cuenta. The data
// lives in public.seller_accounts (only the person and staff read it). The account metadata carries
// account_type, which the menus read from the session, and a copy of the phone and address: until
// 0031 runs that copy is all there is, and 0031 moves it into the table.
const isSeller = (s = session) => s?.user?.user_metadata?.account_type === "seller";
/** "+507…" for a Panamanian mobile (8 digits, starts with 6) or landline (7 digits); null otherwise. Same rule as pa_phone() in 0031. */
function paPhone(raw) {
  const d = String(raw ?? "").replace(/\D/g, "").replace(/^(00)?507(?=\d{7,8}$)/, "");
  return /^(6\d{7}|[2-57-9]\d{6})$/.test(d) ? `+507${d}` : null;
}
const fmtPhone = (p) => { const d = String(p ?? "").replace(/^\+507/, ""); return d.length === 8 ? `${d.slice(0, 4)}-${d.slice(4)}` : d.length === 7 ? `${d.slice(0, 3)}-${d.slice(3)}` : d; };
const cleanAddress = (s) => String(s ?? "").trim().replace(/\s+/g, " ");
const SELLER_MSG = {
  phone: "Escribe un teléfono de Panamá: celular de 8 dígitos (6XXX-XXXX) o fijo de 7.",
  address: "Escribe la dirección completa: barrio, calle, casa o edificio y apartamento.",
  save: "No pudimos guardar tus datos. Revisa tu conexión e intenta de nuevo.",
};
// The pickup address is asked in parts, like a delivery form, and saved as one line (seller_accounts.pickup_address,
// 10 to 240 characters). The parts also go in the account metadata (pickup_parts) so editing fills the same boxes.
const PA_PROVINCES = ["Panamá", "Panamá Oeste", "Colón", "Chiriquí", "Coclé", "Herrera", "Los Santos", "Veraguas", "Bocas del Toro", "Darién",
  "Comarca Guna Yala", "Comarca Emberá-Wounaan", "Comarca Ngäbe-Buglé", "Comarca Naso Tjër Di"];
const ADDR_FIELDS = { province: "addrProvince", district: "addrDistrict", area: "addrArea", street: "addrStreet", house: "addrHouse", unit: "addrUnit", ref: "addrRef" };
/** The address parts typed in a form made with sellerFields(). */
const addressParts = (form) => Object.fromEntries(Object.entries(ADDR_FIELDS).map(([k, name]) => [k, cleanAddress(form.elements[name]?.value)]));
/** "Calle 74, PH Las Palmas, apto 3B, San Francisco, Panamá, Panamá. Referencia: frente al parque" */
const composeAddress = (a) => cleanAddress([a.street, a.house, a.unit, a.area, a.district, a.province].filter(Boolean).join(", ") + (a.ref ? `. Referencia: ${a.ref}` : ""));
const addressProblem = (a) => !a.province ? "Elige la provincia de tu dirección." : !a.district ? "Escribe el distrito."
  : !a.area ? "Escribe el corregimiento o barrio." : !a.street ? "Escribe la calle o avenida."
  : !a.house ? "Escribe el número de casa, el edificio o el PH." : composeAddress(a).length > 240 ? "La dirección es muy larga: máximo 240 caracteres en total." : null;
const sellerProblem = (phone, parts) => !phone ? SELLER_MSG.phone : addressProblem(parts);
// Until 0031 runs, the table and its functions are missing: the page falls back to the account metadata.
const sellerTableMissing = (e) => ["PGRST205", "PGRST202", "42P01", "42883"].includes(e?.code);
/** Phone and pickup address inputs (sign-up, "Vender" and Mi cuenta). With `email`, the account's e-mail too, read-only. */
function sellerFields({ phone = "", address = "", parts = null, email = null, disabled = false } = {}) {
  const off = disabled ? " disabled" : "";
  const v = (k) => esc(parts?.[k] ?? "");
  const opts = (list) => [...new Set(list)].map((x) => `<option value="${esc(x)}">`).join("");
  const input = (k, label, ph, extra = "") => `<label class="f"><span>${label}</span><input class="input" name="${ADDR_FIELDS[k]}" maxlength="${k === "unit" ? 20 : k === "ref" ? 80 : 60}" placeholder="${ph}" value="${v(k)}"${extra}${off}></label>`;
  return `${email != null ? `<label class="f">Correo<input class="input" type="email" value="${esc(email)}" readonly aria-readonly="true"><span class="hint xs">El de tu cuenta: no tienes que escribirlo otra vez.</span></label>` : ""}
    <label class="f">Teléfono (WhatsApp)<input class="input" name="sellerPhone" type="tel" required inputmode="tel" autocomplete="tel-national" maxlength="20" placeholder="6123-4567" value="${esc(phone ? fmtPhone(phone) : "")}"${off}><span class="hint xs">Por aquí coordinamos contigo cada venta.</span></label>
    <fieldset class="addr"><legend>Dirección exacta de residencia</legend>
      ${address && !parts ? `<p class="xs muted" style="margin:0">Dirección guardada: ${esc(address)}. Escríbela por partes para actualizarla.</p>` : ""}
      <div class="grid2"><label class="f">Provincia<select class="select" name="addrProvince" autocomplete="address-level1"${off}><option value="">Elige</option>${PA_PROVINCES.map((x) => `<option${parts?.province === x ? " selected" : ""}>${esc(x)}</option>`).join("")}</select></label>
        ${input("district", "Distrito", "Ej.: Panamá", ` list="addrDistricts" autocomplete="address-level2"`)}</div>
      ${input("area", "Corregimiento o barrio", "Ej.: San Francisco", ` list="addrAreas" autocomplete="address-level3"`)}
      ${input("street", "Calle o avenida", "Ej.: Calle 74", ` autocomplete="address-line1"`)}
      <div class="grid2">${input("house", "Casa, edificio o PH", "Ej.: PH Las Palmas")}
        ${input("unit", `Apartamento o piso <span class="muted">(opcional)</span>`, "Ej.: Apto 3B", ` autocomplete="address-line2"`)}</div>
      ${input("ref", `Punto de referencia <span class="muted">(opcional)</span>`, "Ej.: Frente al parque")}
      <datalist id="addrDistricts">${opts(LOCATIONS.map((l) => l.district))}</datalist><datalist id="addrAreas">${opts(LOCATIONS.flatMap((l) => l.neighborhoods))}</datalist>
    </fieldset>
    <p class="notice soft pickup-note">${ic("pin")}<span><b>Aquí retiramos tus cartas.</b> Cuando vendas una, el equipo de ${esc(CONFIG.APP_NAME)} pasa a buscarla a esta dirección. Solo la ve nuestro equipo: nunca sale en tus anuncios.</span></p>`;
}
/** Marks the account as a seller in its metadata (with a copy of the data). Resolves to an error, or null. */
function rememberSeller(acc) {
  return sb.auth.updateUser({ data: { account_type: "seller", seller_phone: acc.phone, pickup_address: acc.address, ...(acc.parts ? { pickup_parts: acc.parts } : {}) } }).then(({ data, error }) => {
    if (error) { console.warn("seller metadata", error); return error; }
    if (data?.user && session) session.user = data.user;
    renderNav();
    return null;
  }, (err) => { console.warn("seller metadata", err); return err; });
}
/** The signed-in person's seller data { phone, address }, or null for a buyer account. */
async function loadSellerAccount() {
  const meta = session.user.user_metadata ?? {};
  const fromMeta = isSeller() && paPhone(meta.seller_phone) ? { phone: paPhone(meta.seller_phone), address: cleanAddress(meta.pickup_address), parts: meta.pickup_parts ?? null } : null;
  const { data, error } = await sb.from("seller_accounts").select("phone, pickup_address").eq("user_id", session.user.id).maybeSingle();
  if (error) { if (!sellerTableMissing(error)) console.warn("seller account", error); return fromMeta; }
  if (data) {
    // The boxes are filled again only when the saved parts still make up the saved address.
    const parts = meta.pickup_parts && composeAddress(meta.pickup_parts) === data.pickup_address ? meta.pickup_parts : null;
    const acc = { phone: data.phone, address: data.pickup_address, parts };
    if (!isSeller()) rememberSeller(acc); // saved in the database but the session doesn't know yet
    return acc;
  }
  // A seller whose data is only in the metadata (e.g. signed up before 0031 and missed by its backfill).
  if (fromMeta) sb.rpc("save_seller_account", { p_phone: fromMeta.phone, p_pickup_address: fromMeta.address }).then(({ error: e }) => e && console.warn("seller account sync", e));
  return fromMeta;
}
/** Whether the signed-in account can sell: the session says so for sellers; the database is asked only otherwise. */
const sellerReady = async () => isSeller() || !!(await loadSellerAccount());
/** Saves the seller data (becoming a seller, or a new phone or address). Returns an error message, or null. */
async function saveSellerAccount(acc) {
  const r = await sb.rpc("save_seller_account", { p_phone: acc.phone, p_pickup_address: acc.address }).then((x) => x, () => ({ error: { code: "network" } }));
  if (r.error && !sellerTableMissing(r.error)) {
    console.error(r.error);
    const m = r.error.message ?? "";
    return /phone/.test(m) ? SELLER_MSG.phone : /address/.test(m) ? SELLER_MSG.address : SELLER_MSG.save;
  }
  const metaError = await rememberSeller(acc);
  // After 0031 the database already has it, so the account sells even if the metadata lags behind
  // (loadSellerAccount() fixes the metadata later). Before 0031 the metadata is the only copy.
  return metaError && r.error ? SELLER_MSG.save : null;
}
/** Wires a form made with sellerFields(): validates, saves and calls done(acc). */
function bindSellerForm(form, done) {
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = form.querySelector(".seller-save"), msg = form.querySelector(".seller-msg");
    if (btn.disabled) return;
    const parts = addressParts(form);
    const acc = { phone: paPhone(form.sellerPhone.value), address: composeAddress(parts), parts };
    const bad = sellerProblem(acc.phone, parts);
    if (bad) { msg.innerHTML = `<p class="notice bad" style="margin:0">${esc(bad)}</p>`; (acc.phone ? form.querySelector(".addr select, .addr input") : form.sellerPhone).focus(); return; }
    const text = btn.innerHTML;
    btn.disabled = true; btn.innerHTML = `<span class="spinner" style="border-color:currentColor"></span>Guardando…`; msg.innerHTML = "";
    const err = await saveSellerAccount(acc);
    if (!form.isConnected) return;
    btn.disabled = false; btn.innerHTML = text;
    if (err) { msg.innerHTML = `<p class="notice bad" style="margin:0">${esc(err)}</p>`; return; }
    done(acc);
  });
}
// "Vender" with a buyer account: it becomes a seller account first (same data as a seller sign-up).
function viewBecomeSeller(app) {

async function compressImage(file) {
  if (!file.type.startsWith("image/")) return file;
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); } catch { return file; }
  const s = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height); bmp.close?.();
  const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85));
  if (!blob) return file;
  if (["image/jpeg", "image/png", "image/webp"].includes(file.type) && blob.size >= file.size) return file;
  return new File([blob], "foto.jpg", { type: "image/jpeg" });
}
async function catalogSearch(name, number) {
  const clean = (s) => s.replace(/["\\]/g, "").trim();
  const n = number?.split("/")[0].replace(/^#/, "").trim();
  const queries = n ? [`name:"${clean(name)}" number:"${clean(n)}"`, `name:"${clean(name)}"`] : [`name:"${clean(name)}"`];
  for (const q of queries) {
    for (let attempt = 0; attempt < 3; attempt++) {
      if (attempt) await new Promise((r) => setTimeout(r, 600 * 2 ** (attempt - 1)));
      try {
        const res = await fetch(`${CONFIG.CATALOG_API}/cards?q=${encodeURIComponent(q)}&pageSize=9&orderBy=-set.releaseDate&select=id,name,number,rarity,set,images,tcgplayer`);
        if (res.ok) { const d = (await res.json()).data; if (d.length) return d; break; }
        if (res.status < 500) break;
      } catch { /* network hiccup, retry */ }
    }
  }
  // pokemontcg.io fails often (and sunsets 2027-03-01): fall back to the TCGdex catalog.
  const [found, sets] = await Promise.all([dexCandidates({ name, number: number?.split("/")[0], total: number?.split("/")[1] }), dexSets()]);
  return found.slice(0, 9).map((c) => catalogFromDexBrief(c, sets.get(setOfDexId(c.id))));
}

// ============================================================= card identification
// A photo is enough: the page works out which card (and which printing) it is, fills the
// form, writes a description, and shows today's price with its history.
//   1. AI (Supabase Edge Function "identificar-carta", Claude vision). Works for Pokémon, NBA and NFL.
//   2. Fallback without any key: OCR in the browser (Tesseract.js) reads the name and the
//      collector number (199/165).
// For Pokémon both paths end in the TCGdex catalog. The candidates are ranked by number, set
// size and name, and ties are broken by comparing the photo with each catalog image.
const TESSERACT_URL = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
// TCG Pocket is a digital game: its "cards" share names and numbers with physical ones.
const isPocketSet = (setId) => /^(A\d|B\d|P-A)/.test(setId);
const setOfDexId = (id) => id.slice(0, id.lastIndexOf("-"));
const sameNumber = (a, b) => (/^\d+$/.test(a) && /^\d+$/.test(b) ? Number(a) === Number(b) : String(a).toUpperCase() === String(b).toUpperCase());
const tokens = (s) => normalize(s).replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter((w) => w.length > 1);

let dexSetsPromise = null;
const dexSets = () => (dexSetsPromise ??= dexGet("/sets").then((list) => {
  if (!list) { dexSetsPromise = null; return new Map(); }
  return new Map(list.map((s) => [s.id, s]));
}));

/** Physical cards in TCGdex that match a name and/or collector number (number/total). */
async function dexCandidates({ name, number, total }) {
  const num = number?.replace(/^#/, "").trim(), tot = total?.replace(/\D/g, "");
  const q = new URLSearchParams();
  if (num) q.set("localId", /^\d+$/.test(num) ? String(Number(num)) : num); // TCGdex matches "contains": exact check below
  if (name) q.set("name", name);
  if (![...q.keys()].length) return [];
  let list = (await dexGet(`/cards?${q}`)) ?? [];
  if (!list.length && num && name) list = (await dexGet(`/cards?localId=${encodeURIComponent(q.get("localId"))}`)) ?? [];
  list = list.filter((c) => !isPocketSet(setOfDexId(c.id)) && (!num || sameNumber(c.localId, num)));
  if (tot && list.length > 1) {
    const sets = await dexSets();
    const bySize = list.filter((c) => String(sets.get(setOfDexId(c.id))?.cardCount?.official) === String(Number(tot)));
    if (bySize.length) list = bySize;
  }
  return list;
}

/** Minimal catalog object (same shape as pokemontcg.io) from a TCGdex search row. */
function catalogFromDexBrief(c, set) {
  return { id: ptcgId(c.id), dexId: c.id, name: c.name, number: c.localId, rarity: "", set: { name: set?.name ?? setOfDexId(c.id), printedTotal: set?.cardCount?.official ?? "" }, images: { small: c.image ? `${c.image}/low.webp` : "" }, brief: true };
}

/** Full catalog object from TCGdex: set, rarity, artist, prices. Shape compatible with pokemontcg.io. */
async function catalogFromDex(dexId) {
  const d = await dexGet(`/cards/${encodeURIComponent(dexId)}`);
  if (!d) return null;
  const set = await dexGet(`/sets/${encodeURIComponent(d.set.id)}`);
  const tp = d.pricing?.tcgplayer ?? {}, prices = {};
  for (const [k, v] of Object.entries(tp)) {
    if (v && typeof v === "object") prices[k.replace(/-(\w)/g, (_, ch) => ch.toUpperCase())] = { market: v.marketPrice ?? null, mid: v.midPrice ?? null, low: v.lowPrice ?? null, productId: v.productId ?? null };
  }
  return {
    id: ptcgId(d.id), dexId: d.id, name: d.name, number: d.localId, rarity: d.rarity ?? "",
    set: { id: d.set.id, name: d.set.name, printedTotal: d.set.cardCount?.official ?? set?.cardCount?.official ?? "", releaseDate: set?.releaseDate ?? "", serie: set?.serie?.name ?? "" },
    images: { small: d.image ? `${d.image}/low.webp` : "", large: d.image ? `${d.image}/high.webp` : "" },
    tcgplayer: Object.keys(prices).length ? { prices, updatedAt: tp.updated ?? new Date().toISOString() } : null,
    cardmarket: d.pricing?.cardmarket ?? null,
    illustrator: d.illustrator ?? "", hp: d.hp ?? null, types: d.types ?? [], stage: d.stage ?? "", kind: d.category ?? "",
  };
}

const loadImage = (src, cors) => new Promise((resolve, reject) => {
  const im = new Image();
  if (cors) im.crossOrigin = "anonymous";
  im.onload = () => resolve(im); im.onerror = reject; im.src = src;
});
/** The card's area in a photo: a centered card-shaped (63×88 mm) box. Scans fill the frame. */
function cardRect(w, h, fill) {
  const ratio = 63 / 88;
  let ch = Math.min(h, w / ratio) * fill, cw = ch * ratio;
  return { x: (w - cw) / 2, y: (h - ch) / 2, w: cw, h: ch };
}
/**
 * Where the card is in a photo: the bounding box of what differs from the background
 * (the color along the photo's edges). Falls back to a centered card-shaped box.
 */
function findCard(im) {
  const W = im.naturalWidth || im.width, H = im.naturalHeight || im.height, k = 200 / Math.max(W, H);
  const w = Math.max(8, Math.round(W * k)), h = Math.max(8, Math.round(H * k));
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d", { willReadFrequently: true }); g.drawImage(im, 0, 0, w, h);
  const px = g.getImageData(0, 0, w, h).data, at = (x, y) => (y * w + x) * 4;
  const edge = [];
  for (let x = 0; x < w; x++) edge.push(at(x, 0), at(x, 1), at(x, h - 1), at(x, h - 2));
  for (let y = 0; y < h; y++) edge.push(at(0, y), at(1, y), at(w - 1, y), at(w - 2, y));
  const bg = [0, 1, 2].map((ch) => median(edge.map((i) => px[i + ch])));
  const rows = new Array(h).fill(0), cols = new Array(w).fill(0);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = at(x, y);
    if (Math.hypot(px[i] - bg[0], px[i + 1] - bg[1], px[i + 2] - bg[2]) > 48) { rows[y]++; cols[x]++; }
  }
  const span = (arr, min) => { const a = arr.findIndex((v) => v >= min), b = arr.findLastIndex((v) => v >= min); return a < 0 ? null : [a, b + 1]; };
  const ys = span(rows, w * 0.25), xs = span(cols, h * 0.25);
  if (ys && xs) {
    const bw = (xs[1] - xs[0]) / k, bh = (ys[1] - ys[0]) / k, ratio = bw / bh;
    // Accept only card-like boxes (63×88 mm ≈ 0.72, some room for tilt) that are not the whole photo.
    if (ratio > 0.55 && ratio < 0.9 && bw * bh > W * H * 0.2 && bw * bh < W * H * 0.97) return { x: xs[0] / k, y: ys[0] / k, w: bw, h: bh };
  }
  return cardRect(W, H, 0.94);
}
/** Visual fingerprint: 64-bit gradient hash (shape) + 4×4 color grid (palette). */
function signature(im, fill) {
  const r = fill ? cardRect(im.naturalWidth || im.width, im.naturalHeight || im.height, fill) : findCard(im);
  const c = document.createElement("canvas"), g = c.getContext("2d", { willReadFrequently: true });
  c.width = 9; c.height = 8; g.drawImage(im, r.x, r.y, r.w, r.h, 0, 0, 9, 8);
  const px = g.getImageData(0, 0, 9, 8).data, lum = (i) => px[i] * 0.299 + px[i + 1] * 0.587 + px[i + 2] * 0.114;
  const bits = [];
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) bits.push(lum((y * 9 + x) * 4) > lum((y * 9 + x + 1) * 4) ? 1 : 0);
  c.width = 4; c.height = 4; g.drawImage(im, r.x, r.y, r.w, r.h, 0, 0, 4, 4);
  return { bits, color: [...g.getImageData(0, 0, 4, 4).data].filter((_, i) => i % 4 !== 3) };
}
/** 0 = identical, 1 = unrelated. */
function visualDistance(a, b) {
  let ham = 0, col = 0;
  a.bits.forEach((v, i) => { if (v !== b.bits[i]) ham++; });
  for (let i = 0; i < a.color.length; i += 3) col += Math.hypot(a.color[i] - b.color[i], a.color[i + 1] - b.color[i + 1], a.color[i + 2] - b.color[i + 2]);
  return 0.5 * (ham / 64) + 0.5 * (col / (a.color.length / 3) / 441.7);
}

/** Score candidates by what was read (number, set size, name) and by how much the photo looks like each one. */
async function rankCandidates(hints, photo) {
  let list = [];
  if (hints.number) list = await dexCandidates({ name: hints.name, number: hints.number, total: hints.total });
  if (!list.length && hints.number && hints.name) list = await dexCandidates({ number: hints.number, total: hints.total });
  if (!list.length && hints.name) list = await dexCandidates({ name: hints.name });
  if (!list.length) return [];
  const sets = await dexSets();
  const read = new Set(tokens(`${hints.name ?? ""} ${hints.text ?? ""}`));
  const setWords = new Set(tokens(hints.setName ?? ""));
  const scored = list.map((c) => {
    const nameTok = tokens(c.name), set = sets.get(setOfDexId(c.id));
    let text = nameTok.length ? (2 * nameTok.filter((w) => read.has(w)).length) / nameTok.length : 0;
    if (hints.number && sameNumber(c.localId, hints.number)) text += 2;
    if (hints.total && String(set?.cardCount?.official) === String(Number(hints.total.replace(/\D/g, "")))) text += 2;
    if (setWords.size && set) { const st = tokens(set.name); text += st.length ? st.filter((w) => setWords.has(w)).length / st.length : 0; }
    return { ...c, text, setName: set?.name ?? "", dist: null };
  }).sort((a, b) => b.text - a.text).slice(0, 16);
  return visualRank(scored, photo);
}
/** Visual tie-breaker among the best text matches: compare the photo with each catalog image. */
async function visualRank(scored, photo) {
  if (photo && scored.length > 1) {
    try {
      const url = URL.createObjectURL(photo), mine = signature(await loadImage(url));
      URL.revokeObjectURL(url);
      await Promise.all(scored.filter((c) => c.image).map(async (c) => {
        try { c.dist = visualDistance(mine, signature(await withTimeout(loadImage(`${c.image}/low.webp`, true), 8000), 1)); } catch { /* image missing */ }
      }));
    } catch (e) { console.warn("visual match skipped", e); }
  }
  const score = (c) => c.text - 10 * (c.dist ?? 0.45);
  return scored.sort((a, b) => score(b) - score(a)).map((c) => ({ ...c, score: score(c) }));
}

let ocrWorker = null;
async function ocr(canvas) {
  if (!window.Tesseract) {
    await new Promise((resolve, reject) => { const s = document.createElement("script"); s.src = TESSERACT_URL; s.onload = resolve; s.onerror = reject; document.head.appendChild(s); });
  }
  ocrWorker ??= window.Tesseract.createWorker("eng").catch((e) => { ocrWorker = null; throw e; });
  const { data } = await (await ocrWorker).recognize(canvas);
  return data.text ?? "";
}
/** Draw part of the card (fractions of the card box) upscaled and in grayscale, for OCR. */
function cropForOcr(im, [fx, fy, fw, fh], width, r = findCard(im)) {
  const sx = r.x + r.w * fx, sy = r.y + r.h * fy, sw = r.w * fw, sh = r.h * fh;
  const c = document.createElement("canvas"); c.width = width; c.height = Math.round((width * sh) / sw);
  const g = c.getContext("2d"); g.filter = "grayscale(1) contrast(1.4)"; g.drawImage(im, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}
// OCR mixes up I/l/1 and O/0: compare names in a folded alphabet.
const fold = (s) => normalize(s).replace(/[^a-z0-9]/g, "").replace(/[l1|]/g, "i").replace(/0/g, "o").replace(/5/g, "s");
const trigrams = (s) => { const out = new Set(); for (let i = 0; i + 3 <= s.length; i++) out.add(s.slice(i, i + 3)); return out; };
let allCardsPromise = null;
/** Every physical card in TCGdex (~2.4 MB, loaded once and only for the OCR fallback). */
const allDexCards = () => (allCardsPromise ??= dexGet("/cards").then((list) => {
  if (!list) { allCardsPromise = null; return []; }
  return list.filter((c) => !isPocketSet(setOfDexId(c.id)));
}));

/** Collector numbers read from the text: "199/165", and repairs like "21157203" → 215/203. */
function numberCandidates(text, sets) {
  const totals = new Set([...sets.values()].map((s) => s.cardCount?.official).filter((n) => n > 0));
  const pairs = new Map(), singles = new Set();
  const add = (a, b, weight) => {
    const na = Number(a), nb = Number(b);
    if (!(na >= 1 && totals.has(nb) && na <= nb * 1.6 + 30)) return;
    const k = `${na}/${nb}`; pairs.set(k, Math.max(pairs.get(k) ?? 0, weight));
  };
  // The rarity symbol after the number is often read as one more digit ("238/1918"): try both lengths.
  for (const m of text.matchAll(/(\d{1,3})\s?[/|\\]\s?(\d{2,4})/g)) { add(m[1], m[2].slice(0, 3), 3); add(m[1], m[2].slice(0, 2), 2.5); }
  for (const [run] of text.matchAll(/\d{4,9}/g)) {
    for (let i = 1; i <= 3; i++) {
      const a = run.slice(0, i);
      for (const skip of run[i] === "1" || run[i] === "7" ? [1, 0] : [0]) { // "/" read as 1 or 7, or dropped
        const rest = run.slice(i + skip);
        for (const n of [3, 2]) if (rest.length >= n) add(a, rest.slice(0, n), (skip ? 2 : 1.5) - (rest.length > n ? 0.5 : 0));
      }
    }
  }
  for (const [n] of text.matchAll(/(?<![\d©])\d{1,3}(?!\d)/g)) singles.add(String(Number(n)));
  return { pairs: [...pairs].map(([k, w]) => { const [num, total] = k.split("/"); return { num, total, w }; }), singles };
}

/** Candidates for an OCR reading: names that appear in the top text × numbers from the bottom. */
async function ocrCandidates(o) {
  const [cards, sets] = await Promise.all([allDexCards(), dexSets()]);
  if (!cards.length) return [];
  // Card-frame words ("Trainer", "Supporter"…) would match names like "Gym Trainer" on every card.
  const topText = o.top.replace(/\bev[oe]l[vy]es from\s+\S+/gi, " ") // the previous stage's name, not this card's
    .replace(/\b(trainer|supporter|item|stadium|pok[eé]mon|tool|basic|stage ?\d?|energy|ability|tera)\b/gi, " ");
  const topGrams = new Set(topText.split("\n").flatMap((line) => line.split(/\s{2,}|[^\p{L}\s'’.-]+/u).flatMap((part) => [...trigrams(fold(part))])));
  const nameScore = new Map();
  for (const name of new Set(cards.map((c) => c.name))) {
    const g = trigrams(fold(name));
    if (!g.size) continue;
    let hit = 0; for (const t of g) if (topGrams.has(t)) hit++;
    const cover = hit / g.size;
    // Partial reads ("UmbreonViay" for "Umbreon VMAX") still count almost fully: the picture breaks ties.
    if (cover >= 0.6) nameScore.set(name, (0.5 + 0.5 * cover) * Math.min(1, (g.size + 2) / 6)); // short names count less
  }
  const { pairs, singles } = numberCandidates(`${o.bottom}\n${o.top}`, sets);
  const scored = [];
  for (const c of cards) {
    const nm = nameScore.get(c.name) ?? 0, total = sets.get(setOfDexId(c.id))?.cardCount?.official;
    const pair = pairs.find((p) => sameNumber(c.localId, p.num) && Number(p.total) === total);
    const single = /^\d+$/.test(c.localId) && singles.has(String(Number(c.localId)));
    if (!nm && !pair) continue;
    const text = 3 * nm + (pair ? 2 + pair.w : single ? 0.5 : 0); // lone numbers are weak: HP, damage, prizes…
    scored.push({ ...c, text, setName: sets.get(setOfDexId(c.id))?.name ?? "", dist: null });
  }
  // Keep every close text match (e.g. all 36 printings of "Charizard"): the picture decides between them.
  scored.sort((a, b) => b.text - a.text);
  return scored.filter((c) => c.text >= scored[0].text - 2).slice(0, 150);
}

/** Read the card's name (top) and collector number (bottom) from the photo. */
async function ocrRead(photo, status) {
  const url = URL.createObjectURL(photo);
  allDexCards(); // start the catalog download while OCR runs
  try {
    const im = await loadImage(url);
    status("Leyendo el nombre de la carta…");
    const top = await ocr(cropForOcr(im, [0, 0, 1, 0.3], 1400));
    status("Leyendo el número de la carta…");
    const bottom = `${await ocr(cropForOcr(im, [0, 0.8, 1, 0.2], 1800))}\n${await ocr(cropForOcr(im, [0, 0.84, 0.5, 0.16], 1600))}`;
    return { top, bottom };
  } finally { URL.revokeObjectURL(url); }
}

const toBase64 = (file) => new Promise((resolve, reject) => {
  const fr = new FileReader(); fr.onload = () => resolve(String(fr.result).split(",")[1]); fr.onerror = reject; fr.readAsDataURL(file);
});
/** Claude vision via the Edge Function. Returns null when the function is not available. */
async function identifyWithAI(files) {
  if (!CONFIG.IDENTIFY_FUNCTION || !sb) return null;
  const s = (await sb.auth.getSession()).data.session;
  if (!s) return null;
  const images = await Promise.all(files.slice(0, 2).map(async (f) => ({ data: await toBase64(f), media_type: f.type || "image/jpeg" })));
  const res = await withTimeout(fetch(`${CONFIG.SUPABASE_URL}/functions/v1/${CONFIG.IDENTIFY_FUNCTION}`, {
    method: "POST", headers: { "Content-Type": "application/json", apikey: CONFIG.SUPABASE_KEY, Authorization: `Bearer ${s.access_token}` },
    body: JSON.stringify({ images }),
  }), 60000);
  if (!res.ok) { console.warn("identificar-carta", res.status, await res.text().catch(() => "")); return null; }
  return (await res.json()).card ?? null;
}

/** Photo(s) → { kind, card?, alternatives, ai?, source, confidence } or null. */
async function identifyCard(files, status) {
  status("Analizando la foto…");
  const ai = await identifyWithAI(files).catch((e) => { console.warn("AI identification unavailable", e); return null; });
  if (ai && !ai.is_trading_card) return { kind: "not-card", ai };
  if (ai && ai.category !== "pokemon") return { kind: "other", ai, source: "ia", confidence: ai.confidence };
  let hints = null, ranked;
  if (ai) {
    const [number, total] = (ai.card_number ?? "").replace(/^#/, "").split("/");
    hints = { name: ai.subject, number: number?.trim() || null, total: total?.trim() || null, setName: ai.set_name, text: `${ai.subject} ${ai.variant ?? ""}` };
    status("Buscando tu carta en el catálogo…");
    ranked = await rankCandidates(hints, files[0]);
  } else {
    const read = await ocrRead(files[0], status);
    status("Buscando tu carta en el catálogo…");
    ranked = await visualRank(await ocrCandidates(read), files[0]);
  }
  if (!ranked.length) return ai ? { kind: "other", ai, source: "ia", confidence: "baja" } : null;
  const card = await catalogFromDex(ranked[0].id);
  if (!card) return null;
  const [best, next] = ranked;
  const exact = hints ? hints.number && sameNumber(best.localId, hints.number) && best.text >= 4 : best.text >= 6;
  const clear = !next || best.score - next.score > 0.6;
  const confidence = ai ? (ai.confidence === "alta" && exact ? "alta" : "media") : exact && clear ? "alta" : exact || clear ? "media" : "baja";
  return { kind: "pokemon", card, alternatives: ranked.slice(1, 7), ai, source: ai ? "ia" : "ocr", confidence };
}

/** Free identification (no AI cost): OCR in the browser + the Pokémon catalog. Same scoring as identifyCard. */
async function identifyFree(files, status) {
  const read = await ocrRead(files[0], status);
  status("Buscando tu carta en el catálogo…");
  const ranked = await visualRank(await ocrCandidates(read), files[0]);
  if (!ranked.length) return null;
  const card = await catalogFromDex(ranked[0].id);
  if (!card) return null;
  const [best, next] = ranked;
  const exact = best.text >= 6, clear = !next || best.score - next.score > 0.6;
  return { kind: "pokemon", card, alternatives: ranked.slice(1, 7), source: "ocr", confidence: exact && clear ? "alta" : exact || clear ? "media" : "baja" };
}

/** Short listing description written from the identified card (never invents condition). */
function describeCard(c, ai) {
  const parts = [];
  if (c) {

}

      : `<p class="xs muted" style="margin-top:10px">No la encontramos (el catálogo a veces falla; intenta de nuevo) o llena los datos a mano.</p>`;
    $("#catResults").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
      $("#catResults").querySelectorAll("button").forEach((x) => { x.classList.toggle("on", x === b); x.setAttribute("aria-pressed", String(x === b)); });
      pickCard(st.catalog[Number(b.dataset.i)], { replace: true });
    }));
  }
  $("#catBtn").addEventListener("click", doCatalogSearch);
  [$("#catName"), $("#catNum")].forEach((i) => i.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); doCatalogSearch(); } }));
  renderGrade();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("#sellMsg"), btn = $("#publishBtn");
    const fail = (t) => { msg.innerHTML = `<p class="notice bad">${esc(t)}</p>`; btn.disabled = false; btn.textContent = "Publicar gratis"; };
    const price = Number(val("price")), year = val("year") ? Number(val("year")) : null, grade = st.graded ? st.grading.grade : null;
    if (!st.files.length) return fail("Agrega al menos una foto real de la carta.");
    if (val("subject").length < 2) return fail("Falta el nombre del Pokémon o jugador.");
    if (!val("setName")) return fail("Falta el set o producto.");
    // Sports cards go back to the 1880s (the demo listings include 1948 Bowman); Pokémon starts in 1996.
    if (year != null && !(Number.isInteger(year) && year >= 1880 && year <= new Date().getFullYear() + 1)) return fail("Año no válido.");
    if (st.slabUnread) return fail("Vimos un slab pero no pudimos leer la nota. Sube una foto donde se lea la etiqueta.");
    if (!(price >= 1 && price <= 100000)) return fail("Escribe un precio entre $1 y $100,000.");
    if (val("title").length < 5) return fail("El título es muy corto.");
    for (const f of st.files) if (f.size > 3 * 1024 * 1024) return fail("Una de las fotos es muy pesada (máx. 3 MB).");
    const loc = FLAT_LOCATIONS[Number(val("location"))];
    if (!loc) return fail("Elige tu barrio o zona.");

    btn.disabled = true; btn.innerHTML = `<span class="spinner" style="border-color:currentColor"></span>Publicando…`; msg.innerHTML = "";
    // Sesión fresca: getSession renueva el token si expiró mientras llenaban el formulario.
    const fresh = (await sb.auth.getSession()).data.session;
    if (!fresh) return fail("Tu sesión expiró. Vuelve a entrar para publicar.");
    const uid = fresh.user.id, id = crypto.randomUUID();
    const catalogId = val("category") === "pokemon" && st.picked ? st.picked.id : null;
    const gradingKey = st.graded ? `${st.grading.company}${grade}` : "raw";
    let comps = [];
    if (catalogId) {
      const { data } = await sb.from("sales").select("price_cents, sold_at").eq("catalog_id", catalogId).eq("grading_key", gradingKey).order("sold_at", { ascending: false }).limit(50);
      comps = (data ?? []).map((s) => ({ priceUsd: s.price_cents / 100, soldAt: s.sold_at }));
    }
    const estimate = (catalogId ? estimatePrice({ reference: st.graded ? null : pickReferencePrice(st.picked, val("variant")), localComps: comps, condition: st.graded ? null : val("condition"), grading: st.graded ? { company: st.grading.company, grade } : null }) : null)
      ?? estimateFromQuote(st.hist?.quote); // graded, NBA/NFL: the price researched on the web

    // El anuncio nace como borrador (invisible al público) y sólo pasa a "active" cuando
    // las fotos ya están en Storage y registradas. Así nunca se publica un anuncio a medias.
    const paths = [];
    const step = (t) => { btn.innerHTML = `<span class="spinner" style="border-color:currentColor"></span>${esc(t)}`; };
    const abort = async (err, t) => {
      console.error(err);
      if (paths.length) { const rm = await sb.storage.from("listing-photos").remove(paths); if (rm.error) console.error(rm.error); }
      await sb.from("listings").delete().eq("id", id); // borra en cascada listing_photos
      return fail(t);
    };
    const dbMessage = (err, t) =>
      /seller_account_required/.test(err?.message ?? "") ? "Para publicar necesitas una cuenta de vendedor: completa tu teléfono y dirección en Mi cuenta ▸ Cuenta de vendedor." :
      err?.code === "42501" ? "Tu sesión no tiene permiso para publicar. Sal y vuelve a entrar." :
      err?.code === "23503" ? "Tu cuenta no tiene perfil de vendedor. Sal y vuelve a entrar, o escríbenos." :
      /grading_from_photo/.test(err?.message ?? "") ? "La graduación tiene que verse en la foto del slab. Sube una foto donde se lea la etiqueta y vuelve a intentar." :
      err?.code === "23514" ? "Algún dato no es válido (revisa precio, título, nota o condición)." : t;
    const dup = (e) => /exists|duplicate/i.test(e?.message ?? "");

    step("Guardando datos…");
    const ins = await sb.from("listings").insert({
      id, seller_id: uid, status: "draft", category: val("category"), title: val("title"), description: val("description") || null,
      subject: val("subject"), set_name: val("setName"), year, number: val("number") || null, variant: val("variant") || null,
      condition: st.graded ? null : val("condition"), grading_company: st.graded ? st.grading.company : null, grade,
      cert_number: st.graded ? st.grading.cert : null,
      price_cents: Math.round(price * 100), province: loc.province, district: loc.district, neighborhood: loc.neighborhood,
      catalog_id: catalogId, estimate,
    });
    if (ins.error) { console.error(ins.error); return fail(dbMessage(ins.error, "No pudimos guardar el anuncio. Intenta de nuevo.")); }

    for (const [i, f] of st.files.entries()) {
      step(`Subiendo foto ${i + 1} de ${st.files.length}…`);
      const ext = { "image/png": "png", "image/webp": "webp" }[f.type] ?? "jpg";
      const path = `${uid}/${id}/${i}.${ext}`;
      let up;
      for (let attempt = 0; attempt < 3; attempt++) { // la red del teléfono a veces corta; reintenta
        if (attempt) await new Promise((r) => setTimeout(r, 800 * attempt));
        up = await sb.storage.from("listing-photos").upload(path, f, { contentType: f.type || "image/jpeg", cacheControl: "31536000", upsert: false });
        if (!up.error || dup(up.error)) break; // "ya existe" = el intento anterior sí llegó
      }
      if (up.error && !dup(up.error)) return abort(up.error, "No pudimos subir las fotos. Revisa tu conexión e intenta de nuevo.");
      paths.push(path);
    }

    step("Publicando…");
    const pr = await sb.from("listing_photos").insert(paths.map((storage_path, position) => ({ listing_id: id, storage_path, position })));
    if (pr.error) return abort(pr.error, dbMessage(pr.error, "No pudimos guardar las fotos del anuncio. Intenta de nuevo."));
    if (st.verif && st.verif.size <= 3 * 1024 * 1024) {
      // Optional: if it fails (e.g. migration 0006 not applied yet) the listing still publishes.
      step("Subiendo foto de verificación…");
      const vpath = `${uid}/${id}/verificacion.${{ "image/png": "png", "image/webp": "webp" }[st.verif.type] ?? "jpg"}`;
      const vu = await sb.storage.from("listing-photos").upload(vpath, st.verif, { contentType: st.verif.type || "image/jpeg", cacheControl: "31536000", upsert: false });
      if (vu.error && !dup(vu.error)) console.error("verification upload failed", vu.error);
      else {
        const vr = await sb.from("listing_photos").insert({ listing_id: id, storage_path: vpath, position: 99, kind: "verification" });
        if (vr.error) { console.error("verification row failed", vr.error); sb.storage.from("listing-photos").remove([vpath]); }
      }
    }
    const act = await sb.from("listings").update({ status: "active" }).eq("id", id).select("id");
    if (act.error || !act.data?.length) return abort(act.error ?? "activate: 0 rows", dbMessage(act.error, "No pudimos publicar el anuncio. Intenta de nuevo."));
    track("publicar", id);
    toast("Anuncio publicado", { description: "Ya está visible para los compradores." });
    go(`/carta/${id}`);
  });
  // Coming from "Véndela en MarketZlab" in the scanner: start with that photo.
  if (pendingSellFiles?.length) {
    const dt = new DataTransfer();
    pendingSellFiles.forEach((f) => dt.items.add(f));
    pendingSellFiles = null;
    $("#photos").files = dt.files;
    $("#photos").dispatchEvent(new Event("change"));
  }
}

// ============================================================= bulk graded upload (#/vender/graduadas)
// For shops: one photo per slab, up to BULK_MAX at a time. The AI reads each label (company, grade,
// certificate) like in the single form, which also lets the database accept the grade (migration 0009);
// the seller only checks the title and sets each price, then everything is published together.
// Only graded cards: their label says exactly what they are, so the AI can do the work reliably.
const BULK_MAX = 20; // the identification function allows 30 per hour per account
function viewSellGraded(app) {
  setTitle("Subir cartas graduadas");
  if (!sb) { app.innerHTML = `<div class="wrap"><p class="notice bad" style="margin-top:24px">No hay conexión con el servidor. Revisa tu internet y recarga.</p></div>`; return; }
  if (!session) return go("/entrar?next=/vender/graduadas");
  const accepted = sellTermsAccepted(session);
  const locOptions = FLAT_LOCATIONS.map((l, i) => `<option value="${i}">${esc(l.neighborhood)}, ${esc(l.district)}</option>`).join("");
  app.innerHTML = `<div class="wrap page"><h1>Subir cartas graduadas</h1>
    <p class="lead">Sube una foto de cada slab y publicamos todas juntas. Leemos la empresa, la nota y el certificado de cada etiqueta; tú solo pones el precio.</p>
    <p class="small muted" style="margin:-8px 0 16px">¿Es una sola carta o no está graduada? <a class="link" href="#/vender">Usa el formulario normal</a>.</p>
    ${sellIntro(accepted ? "done" : "ask")}
    <div id="sellGate"${accepted ? "" : " hidden"}>
      <section class="panel col bulk-pick">
        <h2 class="step" style="margin:0"><span class="num-badge">1</span>Fotos de los slabs</h2>
        <p class="xs muted" style="margin:0">Una foto por carta, de frente, con la etiqueta bien legible y sin reflejos. Hasta ${BULK_MAX} por vez.</p>
        <label class="btn outline block">${ic("camera")}Elegir fotos<input type="file" id="bulkIn" accept="image/jpeg,image/png,image/webp" multiple class="sr-only"></label>
      </section>
      <div id="bulkList" class="col" style="gap:12px;margin-top:16px"></div>
      <section class="panel col" id="bulkFoot" hidden style="margin-top:16px">
        <h2 class="step" style="margin:0"><span class="num-badge">2</span>Ubicación y publicar</h2>
        <label class="f">Barrio / zona (para todas)<select class="select" id="bulkLoc">${locOptions}</select></label>
        <p class="xs muted" style="margin:0">Solo mostramos el barrio, nunca tu dirección.</p>
        <div id="bulkMsg" aria-live="polite"></div>
        <button type="button" class="btn primary block" id="bulkPublish">Publicar</button>
      </section>
    </div></div>`;
  $("#sellAcceptBtn")?.addEventListener("click", () => {
    acceptSellTerms(session);
    $("#sellAccept").innerHTML = sellAcceptedNote();
    $("#sellGate").hidden = false;
    $("#sellGate").scrollIntoView({ behavior: "smooth", block: "start" });
  });

  let rows = [], busy = false;
  const list = $("#bulkList");
  const ready = () => rows.filter((r) => r.state === "ok");
  const rowHtml = (r, i) => {
    const g = r.grading;
    const body = r.state === "reading" ? `<p class="small muted" style="margin:0"><span class="spinner"></span> Leyendo la etiqueta…</p>`
      : r.state === "waiting" ? `<p class="small muted" style="margin:0">En cola…</p>`
      : r.state === "error" ? `<p class="notice warn small" style="margin:0">${esc(r.error)}</p>`
      : r.state === "done" ? `<p class="notice good small" style="margin:0">Publicada. <a class="link" href="#/carta/${encodeURIComponent(r.id)}">Ver anuncio</a></p>`
      : `<p class="small" style="margin:0;font-weight:600">${esc(g.company)} ${esc(g.grade)}${g.cert ? ` · Cert. ${esc(g.cert)}` : ""} · ${esc(categoryName(r.ai.category))}</p>
        <label class="f">Título<input class="input b-title" maxlength="80" value="${esc(r.title)}"></label>
        <div class="row-input"><input class="input b-price" type="number" min="1" step="0.01" inputmode="decimal" placeholder="Precio (USD)" aria-label="Precio en dólares" value="${r.price ?? ""}">
          <button type="button" class="btn sm b-est" style="border-radius:12px">${r.estimating ? `<span class="spinner"></span>` : "Precio sugerido"}</button></div>
        ${r.estimate ? `<p class="xs muted" style="margin:0">Mercado: ${fmtEstimate(r.estimate.low)} – ${fmtEstimate(r.estimate.high)}. Es una referencia, no una garantía.</p>` : r.estimateFailed ? `<p class="xs muted" style="margin:0">No encontramos un precio de referencia para esta carta.</p>` : ""}`;
    return `<article class="panel bulk-row" data-i="${i}"><img src="${r.preview}" alt="Foto ${i + 1}"><div class="col" style="gap:8px;min-width:0;flex:1">${body}</div>
      ${["done", "publishing"].includes(r.state) || busy ? "" : `<button type="button" class="icon-btn b-del" aria-label="Quitar esta carta">${ic("x")}</button>`}</article>`;
  };
  // What the seller types goes straight into its row, so redrawing never loses it.
  list.addEventListener("input", (e) => {
    const r = rows[Number(e.target.closest(".bulk-row")?.dataset.i)];
    if (!r) return;
    if (e.target.classList.contains("b-title")) r.title = e.target.value;
    if (e.target.classList.contains("b-price")) r.price = e.target.value;
  });
  const render = () => {
    if (!list.isConnected) return;
    list.innerHTML = rows.map(rowHtml).join("");
    $("#bulkFoot").hidden = !rows.length;
    const n = ready().length;
    $("#bulkPublish").textContent = n ? `Publicar ${n} ${n === 1 ? "carta" : "cartas"}` : "Publicar";
    $("#bulkPublish").disabled = busy || !n;
    list.querySelectorAll(".b-del").forEach((b) => b.addEventListener("click", () => {
      const i = Number(b.closest(".bulk-row").dataset.i);
      URL.revokeObjectURL(rows[i].preview); rows.splice(i, 1); render();
    }));
    list.querySelectorAll(".b-est").forEach((b) => b.addEventListener("click", () => estimateRow(rows[Number(b.closest(".bulk-row").dataset.i)])));
  };
  const asListing = (r) => ({
    card: { category: r.ai.category, subject: r.ai.subject, setName: r.ai.set_name, year: r.ai.year, number: r.ai.card_number, variant: r.ai.variant, catalogId: null },
    condition: null, grading: { company: r.grading.company, grade: r.grading.grade },
  });
  async function estimateRow(r) {
    if (r.estimating) return;
    r.estimating = true; render();
    const q = await fetchMarketQuote(asListing(r)).catch((e) => { console.warn("bulk price", e); return null; });
    r.estimating = false; r.estimate = estimateFromQuote(q); r.estimateFailed = !r.estimate;
    if (r.estimate && !Number(r.price)) r.price = String(Math.round(r.estimate.mid));
    render();
  }
  async function read(r) {
    r.state = "reading"; render();
    const ai = await identifyWithAI([r.file]).catch((e) => { console.warn("bulk identify", e); return null; });
    const grading = ai?.is_graded && GRADERS.includes(ai.grading_company) && ai.grade >= 1 && ai.grade <= 10
      ? { company: ai.grading_company, grade: Math.round(ai.grade * 2) / 2, cert: ai.cert_number ?? null } : null;
    if (!ai) Object.assign(r, { state: "error", error: "No pudimos leer esta foto. Revisa tu conexión o súbela de nuevo." });
    else if (!ai.is_trading_card) Object.assign(r, { state: "error", error: "La foto no parece una carta." });
    else if (!ai.is_graded) Object.assign(r, { state: "error", error: "Esta carta no está graduada. Súbela con el formulario normal." });
    else if (!grading) Object.assign(r, { state: "error", error: "Vimos el slab pero no se lee la etiqueta. Toma otra foto de frente, sin reflejos." });
    else if (!CATEGORIES.some((c) => c.slug === ai.category)) Object.assign(r, { state: "error", error: "Por ahora solo publicamos Pokémon, NBA y NFL." });
    else if (!ai.subject || !ai.set_name) Object.assign(r, { state: "error", error: "No pudimos leer qué carta es. Súbela con el formulario normal." });
    else Object.assign(r, { state: "ok", ai, grading, title: `${ai.title_es} ${grading.company} ${grading.grade}`.replace(/\s+/g, " ").trim().slice(0, 80) });
    render();
  }
  $("#bulkIn").addEventListener("change", async (e) => {
    const room = BULK_MAX - rows.filter((r) => r.state !== "done").length;
    const picked = [...e.target.files].slice(0, Math.max(0, room));
    e.target.value = "";
    if (e.target.files.length > picked.length || room <= 0) toast(`Puedes subir hasta ${BULK_MAX} cartas por vez.`, { type: "info" });
    const fresh = [];
    for (const f of picked) {
      const file = await compressImage(f);
      const r = { file, preview: URL.createObjectURL(file), state: "waiting" };
      rows.push(r); fresh.push(r);
    }
    render();
    for (const r of fresh) { if (!list.isConnected) return; await read(r); } // one at a time: gentle on the hourly limit
  });

  $("#bulkPublish").addEventListener("click", async () => {
    const msg = $("#bulkMsg"), todo = ready();
    const loc = FLAT_LOCATIONS[Number($("#bulkLoc").value)];
    for (const r of todo) {
      const price = Number(r.price);
      if (!(price >= 1 && price <= 100000)) { msg.innerHTML = `<p class="notice bad">Pon un precio entre $1 y $100,000 en cada carta.</p>`; return; }
      if ((r.title ?? "").trim().length < 5) { msg.innerHTML = `<p class="notice bad">Hay un título muy corto. Revísalo.</p>`; return; }
      if (r.file.size > 3 * 1024 * 1024) { msg.innerHTML = `<p class="notice bad">Una de las fotos es muy pesada (máx. 3 MB). Quítala y súbela de nuevo.</p>`; return; }
    }
    if (!loc) { msg.innerHTML = `<p class="notice bad">Elige tu barrio o zona.</p>`; return; }
    const s = (await sb.auth.getSession()).data.session;
    if (!s) { msg.innerHTML = `<p class="notice bad">Tu sesión expiró. Vuelve a entrar para publicar.</p>`; return; }
    busy = true; msg.innerHTML = "";
    let ok = 0;
    for (const [k, r] of todo.entries()) {
      $("#bulkPublish").innerHTML = `<span class="spinner" style="border-color:currentColor"></span>Publicando ${k + 1} de ${todo.length}…`;
      r.state = "publishing";
      const res = await publishGraded(s.user.id, r, loc);
      if (res.id) { r.state = "done"; r.id = res.id; ok++; track("publicar", res.id); }
      else { r.state = "error"; r.error = res.error; }
      busy = k < todo.length - 1; render();
      if (busy) $("#bulkPublish").disabled = true;
    }
    busy = false; render();
    const failed = todo.length - ok;
    msg.innerHTML = ok ? `<p class="notice good">Publicamos ${ok} ${ok === 1 ? "carta" : "cartas"}.${failed ? ` ${failed} no se pudieron publicar: revisa el aviso en cada una.` : ""} <a class="link" href="#/cuenta">Ver mis cartas</a></p>`
      : `<p class="notice bad">No se pudo publicar ninguna. Revisa el aviso en cada carta.</p>`;
  });
}

// One graded listing: draft → photo → active, like the single form (nothing half-published).
async function publishGraded(uid, r, loc) {
  const id = crypto.randomUUID(), ai = r.ai, g = r.grading;
  const ins = await sb.from("listings").insert({
    id, seller_id: uid, status: "draft", category: ai.category, title: r.title.trim(), description: describeCard(null, ai).slice(0, 1000) || null,
    subject: ai.subject.slice(0, 80), set_name: ai.set_name.slice(0, 80), year: Number.isInteger(ai.year) && ai.year >= 1880 && ai.year <= new Date().getFullYear() + 1 ? ai.year : null,
    number: ai.card_number?.slice(0, 20) || null, variant: ai.variant?.slice(0, 60) || null,
    condition: null, grading_company: g.company, grade: g.grade, cert_number: g.cert?.slice(0, 30) || null,
    price_cents: Math.round(Number(r.price) * 100), province: loc.province, district: loc.district, neighborhood: loc.neighborhood,
    catalog_id: null, estimate: r.estimate ?? null,
  });
  if (ins.error) {
    console.error(ins.error);
    return { error: /grading_from_photo/.test(ins.error.message ?? "") ? "La nota no coincide con la etiqueta leída. Vuelve a subir la foto." : "No pudimos guardar esta carta. Intenta de nuevo." };
  }
  const ext = { "image/png": "png", "image/webp": "webp" }[r.file.type] ?? "jpg", path = `${uid}/${id}/0.${ext}`;
  const undo = async () => { await sb.storage.from("listing-photos").remove([path]); await sb.from("listings").delete().eq("id", id); };
  let up;
  for (let attempt = 0; attempt < 3; attempt++) {
    if (attempt) await new Promise((res) => setTimeout(res, 800 * attempt));
    up = await sb.storage.from("listing-photos").upload(path, r.file, { contentType: r.file.type || "image/jpeg", cacheControl: "31536000", upsert: false });
    if (!up.error || /exists|duplicate/i.test(up.error.message ?? "")) break;
  }
  if (up.error && !/exists|duplicate/i.test(up.error.message ?? "")) { console.error(up.error); await undo(); return { error: "No pudimos subir la foto. Revisa tu conexión e intenta de nuevo." }; }
  const pr = await sb.from("listing_photos").insert({ listing_id: id, storage_path: path, position: 0 });
  if (pr.error) { console.error(pr.error); await undo(); return { error: "No pudimos guardar la foto. Intenta de nuevo." }; }
  const act = await sb.from("listings").update({ status: "active" }).eq("id", id).select("id");
  if (act.error || !act.data?.length) { console.error(act.error); await undo(); return { error: "No pudimos publicar esta carta. Intenta de nuevo." }; }
  return { id };
}

// Publishes a listing built by the simpler forms (sealed product, lots): draft → photos → active, and
// undoes everything if a step fails, like the card form (nothing half-published).
async function publishListing(uid, row, files) {
  const id = crypto.randomUUID(), paths = [];
  const undo = async () => { if (paths.length) await sb.storage.from("listing-photos").remove(paths); await sb.from("listings").delete().eq("id", id); };
  const ins = await sb.from("listings").insert({ id, seller_id: uid, status: "draft", ...row });
  if (ins.error) {
    console.error(ins.error);
    if (ins.error.code === "42703" || ins.error.code === "PGRST204" || /check constraint/.test(ins.error.message ?? "") && /product_type/.test(ins.error.message ?? "")) return { missingColumn: true };
    return { error: "No pudimos guardar el anuncio. Intenta de nuevo." };
  }
  for (const [i, f] of files.entries()) {
    const ext = { "image/png": "png", "image/webp": "webp" }[f.type] ?? "jpg", path = `${uid}/${id}/${i}.${ext}`;
    let up;
    for (let attempt = 0; attempt < 3; attempt++) {
      if (attempt) await new Promise((r) => setTimeout(r, 800 * attempt));
      up = await sb.storage.from("listing-photos").upload(path, f, { contentType: f.type || "image/jpeg", cacheControl: "31536000", upsert: false });
      if (!up.error || /exists|duplicate/i.test(up.error.message ?? "")) break;
    }
    if (up.error && !/exists|duplicate/i.test(up.error.message ?? "")) { console.error(up.error); await undo(); return { error: "No pudimos subir las fotos. Revisa tu conexión e intenta de nuevo." }; }
    paths.push(path);
  }
  const pr = await sb.from("listing_photos").insert(paths.map((storage_path, position) => ({ listing_id: id, storage_path, position })));
  if (pr.error) { console.error(pr.error); await undo(); return { error: "No pudimos guardar las fotos. Intenta de nuevo." }; }
  const act = await sb.from("listings").update({ status: "active" }).eq("id", id).select("id");
  if (act.error || !act.data?.length) { console.error(act.error); await undo(); return { error: "No pudimos publicar el anuncio. Intenta de nuevo." }; }
  return { id };
}

// ============================================================= identity check (migration 0025)
// Individuals send their full name, a photo of their cédula and a selfie holding it; staff approve
// and the photos are deleted right after the decision. Shops use the shop verification instead.
async function renderIdentity(uid, prof, box) {
  if (!sb || prof.is_shop) return;
  if (prof.verified) {
    box.innerHTML = `<section class="panel col"><h2>Identidad verificada</h2><p class="notice good" style="margin:0">${ic("check")} Tu identidad está verificada: tus anuncios llevan el sello.</p></section>`;
    return;
  }
  const { data, error } = await sb.from("identity_checks").select("status, note, submitted_at").eq("user_id", uid).maybeSingle();
  if (!box.isConnected) return;
  if (error) { if (!["42P01", "PGRST205"].includes(error.code)) console.error(error); return; } // migration 0025 not applied yet
  if (data?.status === "pending") {
    box.innerHTML = `<section class="panel col"><h2>Identidad verificada</h2><p class="notice soft" style="margin:0">Recibimos tus fotos el ${new Date(data.submitted_at).toLocaleDateString("es-PA", { day: "numeric", month: "long" })}. Las revisamos y te avisamos en la campanita.</p></section>`;
    return;
  }
  box.innerHTML = `<section class="panel col"><h2>Verifica tu identidad</h2>
    <p class="small muted" style="margin:0">Los compradores confían más en vendedores con el sello <b>Identidad verificada</b>. Es gratis.</p>
    ${data?.status === "rejected" ? `<p class="notice warn" style="margin:0">No pudimos verificarte la vez anterior${data.note ? `: ${esc(data.note)}` : "."} Puedes enviarlas de nuevo.</p>` : ""}
    <label class="f">Nombre completo, como aparece en tu cédula<input class="input" id="idName" maxlength="80" autocomplete="name"></label>
    <label class="f">Foto del frente de tu cédula<input type="file" id="idDoc" accept="image/jpeg,image/png,image/webp"></label>
    <label class="f">Selfie sosteniendo tu cédula junto a tu cara<input type="file" id="idSelfie" accept="image/jpeg,image/png,image/webp"></label>
    <p class="xs muted" style="margin:0">Solo las ve el equipo de ${esc(CONFIG.APP_NAME)} para comparar tu cara y tu nombre, y <b>las borramos apenas terminamos la revisión</b>. No guardamos tu número de cédula.</p>
    <button type="button" class="btn primary" id="idSend">Enviar para verificar</button></section>`;
  $("#idSend").addEventListener("click", async (e) => {
    const btn = e.currentTarget, name = $("#idName").value.trim().replace(/\s+/g, " ");
    const doc = $("#idDoc").files[0], selfie = $("#idSelfie").files[0];
    if (name.length < 4) return toast("Escribe tu nombre completo.", { type: "error" });
    if (!doc || !selfie) return toast("Sube las dos fotos: la cédula y la selfie con la cédula.", { type: "error" });
    btn.disabled = true; btn.textContent = "Enviando…";
    const paths = [];
    try {
      for (const [k, f] of [["cedula", doc], ["selfie", selfie]]) {
        const img = await compressImage(f), ext = { "image/png": "png", "image/webp": "webp" }[img.type] ?? "jpg";
        const path = `${uid}/${Date.now()}-${k}.${ext}`;
        const up = await sb.storage.from("identity-docs").upload(path, img, { contentType: img.type || "image/jpeg", upsert: false });
        if (up.error) throw up.error;
        paths.push(path);
      }
      const { error: err } = await sb.rpc("submit_identity", { p_full_name: name, p_doc_path: paths[0], p_selfie_path: paths[1] });
      if (err) throw err;
      toast("Recibimos tus fotos. Te avisamos cuando revisemos.");
      renderIdentity(uid, prof, box);
    } catch (err) {
      console.error(err);
      if (paths.length) sb.storage.from("identity-docs").remove(paths);
      btn.disabled = false; btn.textContent = "Enviar para verificar";
      toast(/already pending/.test(err?.message ?? "") ? "Ya tienes una verificación en revisión." : err?.statusCode === "413" || /size/i.test(err?.message ?? "") ? "Una foto es muy pesada (máximo 5 MB)." : "No pudimos enviar tus fotos. Intenta de nuevo.", { type: "error" });
    }
  });
}

// Staff: pending identity checks. Approving or rejecting deletes the photos right away.
async function adminIdentity(body) {
  const { data, error } = await sb.from("identity_checks").select("user_id, full_name, doc_path, selfie_path, status, submitted_at").eq("status", "pending").order("submitted_at", { ascending: true });
  if (error) {
    if (["42P01", "PGRST205"].includes(error.code)) { body.innerHTML = `<p class="notice bad">Falta aplicar la migración 0025 en Supabase.</p>`; return; }
    throw error;
  }
  const people = await profilesById(data.map((c) => c.user_id));
  body.innerHTML = `<p class="small muted" style="margin:0 0 12px">Compara la cara de la selfie con la de la cédula y el nombre con el que escribió. Al decidir, las fotos se borran.</p>
    ${data.length ? `<ul class="admin-list">${data.map((c) => `<li class="panel" data-u="${c.user_id}">
      <div class="phead"><span style="font-weight:600">${esc(c.full_name)}</span><a class="small link" href="#/vendedor/${encodeURIComponent(c.user_id)}">${esc(people.get(c.user_id)?.display_name ?? "perfil")}</a></div>
      <p class="xs muted" style="margin:4px 0 8px">Enviada ${fmtDate(c.submitted_at)}</p>
      <div class="claim-photos" data-photos="${esc(JSON.stringify([c.doc_path, c.selfie_path].filter(Boolean)))}"></div>
      <input class="input id-note" maxlength="300" placeholder="Motivo si la rechazas (lo verá la persona)" style="margin-top:10px">
      <div class="order-actions"><button class="btn primary" data-id="ok">Aprobar</button><button class="btn danger" data-id="no">Rechazar</button></div><div class="order-msg"></div></li>`).join("")}</ul>`
      : `<p class="muted small">No hay verificaciones pendientes.</p>`}`;
  body.querySelectorAll(".claim-photos").forEach(async (el) => {
    const paths = JSON.parse(el.dataset.photos || "[]");
    if (!paths.length) return;
    const { data: urls } = await sb.storage.from("identity-docs").createSignedUrls(paths, 600);
    el.innerHTML = (urls ?? []).filter((x) => x.signedUrl).map((x) => `<a href="${esc(x.signedUrl)}" target="_blank" rel="noopener"><img src="${esc(x.signedUrl)}" alt="Foto de verificación" style="width:140px;height:140px"></a>`).join("");
  });
  body.querySelectorAll("[data-id]").forEach((b) => b.addEventListener("click", async () => {
    const li = b.closest("li"), approve = b.dataset.id === "ok", note = li.querySelector(".id-note").value.trim();
    if (!approve && !note && !confirm("¿Rechazar sin explicar el motivo?")) return;
    li.querySelectorAll("button").forEach((x) => (x.disabled = true));
    const { data: paths, error: err } = await sb.rpc("review_identity", { p_user: li.dataset.u, p_approve: approve, p_note: note || null });
    if (err) { li.querySelectorAll("button").forEach((x) => (x.disabled = false)); return adminFail(err, li.querySelector(".order-msg")); }
    if (paths?.length) { const rm = await sb.storage.from("identity-docs").remove(paths); if (rm.error) console.error("identity photos not deleted", rm.error); }
    route();
  }));
}

const timeAgo = (iso) => {
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  if (s < 60) return "ahora";
  if (s < 3600) return `hace ${Math.floor(s / 60)} min`;
  if (s < 86400) return `hace ${Math.floor(s / 3600)} h`;
  if (s < 7 * 86400) { const d = Math.floor(s / 86400); return `hace ${d} ${d === 1 ? "día" : "días"}`; }
  return new Date(iso).toLocaleDateString("es-PA", { day: "numeric", month: "short" });
};

/** Runs fn over the list, at most n at a time. */
async function eachLimit(list, n, fn) {
  let i = 0;

function readWatchLocal() {

function writeWatchLocal(items) {
