/** The current person's watchlist, newest first (cached per session). Signed in, it moves to the account what was saved in this browser. */
function loadWatchlist() {
  const uid = session?.user.id ?? null;
  if (watchState?.uid === uid) return Promise.resolve(watchState.items);
  if (watchLoad?.uid === uid) return watchLoad.p;
  const p = (async () => {
    let items = readWatchLocal(), remote = false;
    if (sb && uid && watchDbOn) {
      const { data, error } = await sb.from("watchlist").select(WATCH_COLS).order("created_at", { ascending: false }).limit(WATCH_LIMIT);
      if (error) { if (watchMissing(error)) watchDbOn = false; else console.error(error); }
      else {
        remote = true;
        const mine = data.map(rowToWatch), have = new Set(mine.map(watchKey)), left = [];
        for (const w of items.reverse()) { // oldest first, so the newest ends on top
          if (have.has(watchKey(w))) continue;
          if (mine.length >= WATCH_LIMIT) { left.unshift(w); continue; }
          const { data: row, error: e } = await sb.from("watchlist").insert(watchToRow(watchPick(w))).select(WATCH_COLS).single();
          if (row) { mine.unshift(rowToWatch(row)); have.add(watchKey(w)); }
          else if (e?.code !== "23505") { left.unshift(w); console.warn("watchlist upload", e?.code); }
        }
        items = [...mine, ...left];
        writeWatchLocal(left);
      }
    }
    watchState = { uid, items, remote };
    return items;
  })();
  watchLoad = { uid, p };
  p.finally(() => { if (watchLoad?.p === p) watchLoad = null; });
  return p;
}
function watchChanged() { watchGen++; watchBadge.uid = undefined; }
const fullMsg = `Tu watchlist ya tiene ${WATCH_LIMIT} cartas. Quita alguna para agregar otra.`;
async function addToWatchlist(cand) {
  const w = watchPick(cand);
  if (w.name.length < 2) return { ok: false, msg: "Escribe el nombre de la carta." };
  const items = await loadWatchlist();
  if (items.some((x) => watchKey(x) === watchKey(w))) return { ok: true };
  if (items.length >= WATCH_LIMIT) return { ok: false, msg: fullMsg };
  if (watchState.remote) {
    const { data, error } = await sb.from("watchlist").insert(watchToRow(w)).select(WATCH_COLS).single();
    if (data) { items.unshift({ ...rowToWatch(data), dexId: w.dexId }); watchChanged(); return { ok: true }; }
    if (error?.code === "23505") { watchState = null; watchChanged(); return { ok: true }; } // added from another tab
    if (/limit/.test(error?.message ?? "")) return { ok: false, msg: fullMsg };
    if (!watchMissing(error)) { console.error(error); return { ok: false, msg: "No pudimos guardarla. Revisa tu conexión e intenta de nuevo." }; }
    watchDbOn = false; watchState.remote = false;
  }
  items.unshift({ ...w, id: `local-${crypto.randomUUID()}`, createdAt: new Date().toISOString() });
  writeWatchLocal(items);
  watchChanged();
  return { ok: true };
}
async function removeFromWatchlist(cand) {
  const items = await loadWatchlist();
  const it = items.find((x) => (cand.id && x.id === cand.id) || watchKey(x) === watchKey(cand));
  if (!it) return { ok: true };
  if (!isLocalWatch(it)) {
    const { error } = await sb.from("watchlist").delete().eq("id", it.id);
    if (error) { console.error(error); return { ok: false, msg: "No pudimos quitarla. Revisa tu conexión e intenta de nuevo." }; }
  }
  const i = items.indexOf(it);

}

async function dexRefCents(card) {
  const d = await fetchDexCard(card);
  const tp = d?.pricing?.tcgplayer, keys = tp ? Object.keys(tp).filter((k) => tp[k] && typeof tp[k] === "object") : [];
  if (keys.length) { const p = tp[pickVariantKey(keys, card.variant)], v = p?.marketPrice ?? p?.midPrice; if (v > 0) return { cents: toCents(v), d }; }
  const cm = d?.pricing?.cardmarket, eur = cm?.avg7 > 0 ? cm.avg7 : cm?.trend > 0 ? cm.trend : null;
  const fx = eur ? await eurUsd() : null;
  return { cents: fx?.rate ? toCents(eur * fx.rate) : null, d };
}
/** The reference price at hand: the one saved today, else this file's weekly TCGplayer price (raw Pokémon), else the last one saved. */
function watchQuickRef(w) {
  if (w.refCents > 0 && w.refAt && Date.now() - Date.parse(w.refAt) < DAY_MS) return w.refCents;
  if (!w.graded && w.catalogId) {
    const series = storedPrices().cartas[w.catalogId]?.series?.tcgplayer ?? {}, keys = Object.keys(series);
    const last = keys.length ? (series[pickVariantKey(keys, w.variant)] ?? []).filter((p) => p.market > 0).at(-1) : null;
    if (last) return toCents(last.market);
  }
  return w.refCents > 0 ? w.refCents : null;
}
const histRef = (h) => {
  const p = h?.market?.at(-1) ?? h?.cardmarket?.at(-1) ?? h?.web?.at(-1);
  return p?.v > 0 ? toCents(p.v) : h?.quote?.market_price > 0 ? toCents(h.quote.market_price) : null;
};
/** Researches the reference now: TCGdex for raw Pokémon cards, else the price history's sources (PriceCharting / SportsCardsPro, then the web quote). */
async function watchLiveRef(w) {
  if (w.category === "pokemon" && w.catalogId && !w.graded) { const r = await dexRefCents(w).catch(() => null); if (r?.cents) return r.cents; }
  return histRef(await fetchPriceHistory(watchListing(w)).catch(() => null));
}

// ----- is it on MarketZlab?
function watchMatches(w, l) {
  if ((l.status && l.status !== "active") || isSealed(l) || isLot(l) || !!w.graded !== !!l.grading) return false;
  if (w.catalogId && l.card.catalogId) return String(w.catalogId).toLowerCase() === String(l.card.catalogId).toLowerCase();
  if (w.category && l.card.category && w.category !== l.card.category) return false;
  const hay = normalize([l.title, l.card.subject, l.card.setName, l.card.number, l.card.variant, l.card.year].join(" "));
  return searchTokens(w.name).every((t) => hay.includes(t)) && (!w.number || watchNum(w.number) === watchNum(l.card.number));
}
/** Active listings that may match the list: the same catalog ids, or the main word of each name (for listings typed by hand). */
async function fetchWatchListings(items) {
  if (!sb || !items.length) return [];
  const ids = [...new Set(items.map((w) => w.catalogId).filter(Boolean))].slice(0, 100);
  const words = [...new Set(items.map((w) => searchTokens(w.name).sort((a, b) => b.length - a.length)[0]).filter(Boolean))].slice(0, 40);
  const run = async (filter) => {
    for (let tries = 0; tries < 5; tries++) {
      const { data, error } = await filter(sb.from("listings").select(listingCols()).eq("status", "active")).limit(200);
      if (missingCol(error)) continue;
      if (error) { console.error(error); return []; }
      return data ?? [];
    }
    return [];
  };
  const [byId, byName] = await Promise.all([
    ids.length ? run((q) => q.in("catalog_id", ids)) : [],
    words.length ? run((q) => q.or(words.map((t) => searchFilter(t, ["subject", "title"])).join(","))) : [],
  ]);
  const listings = await withProfiles([...new Map([...byId, ...byName].map((r) => [r.id, r])).values()]);
  rememberListings(listings);
  return listings;
}
/** watchKey → the active listings (demo ones too) for that card, cheapest first. */
async function watchAvailability(items) {
  const pool = new Map();
  const fresh = await fetchWatchListings(items).catch((e) => { console.warn("watchlist listings", e); return []; });
  for (const l of [...(CONFIG.SHOW_DEMO_LISTINGS ? DEMO : []), ...listingCache.values(), ...fresh]) pool.set(l.id, l);
  const all = [...pool.values()];
  return new Map(items.map((w) => [watchKey(w), all.filter((l) => watchMatches(w, l)).sort((a, b) => a.priceUsd - b.priceUsd)]));
}

// ----- catalog search
/**
 * Every printing of a card in the catalog (TCGdex, Pokémon): "Charizard" brings all its sets, numbers,
 * rarities and promos; "pikachu 151" or "Umbreon VMAX 215/203" narrow it down. Names with the search as
 * whole words come first, then the newest sets. null when the catalog does not answer.
 */
async function watchCatalogSearch(text) {
  const numM = text.match(/#?\s*([a-z]{0,5}\d+[a-z]?)\s*\/\s*([a-z]{0,5}\d+)\b/i) ?? text.match(/#\s*([a-z]{0,5}\d+[a-z]?)\b/i);
  const words = (numM ? text.replace(numM[0], " ") : text).replace(/[^\p{L}\p{N}'’.&-]+/gu, " ").trim().split(/\s+/).filter(Boolean).slice(0, 6);
  const sets = await dexSets();
  let list = null, used = 0;
  for (let k = words.length; k >= 1; k--) {
    const name = words.slice(0, k).join(" ");
    if (name.length < 3) break;
    const found = await dexGet(`/cards?name=${encodeURIComponent(name)}`);
    if (!found) return null;
    if (found.length) { list = found; used = k; break; }
  }
  if (!list && numM) list = await dexCandidates({ number: numM[1], total: numM[2] });
  list = (list ?? []).filter((c) => !isPocketSet(setOfDexId(c.id)));
  const setOf = (c) => sets.get(setOfDexId(c.id));
  if (numM && used) {
    const byNum = list.filter((c) => sameNumber(c.localId, numM[1]));
    const byTotal = numM[2] ? byNum.filter((c) => String(setOf(c)?.cardCount?.official ?? "") === String(Number(numM[2]))) : byNum;
    list = byTotal.length ? byTotal : byNum;
  }
  // Words that are not part of the name ("151", "evolving skies") pick the set or the number.
  const extra = words.slice(used).map(normalize);
  let note = "";
  if (extra.length && list.length) {
    const narrowed = list.filter((c) => {
      const setName = normalize(setOf(c)?.name ?? ""), setWords = setName.split(/[^\p{L}\p{N}]+/u);
      return extra.every((t) => (/^\d+$/.test(t) ? sameNumber(c.localId, t) || setWords.includes(t) : setName.includes(t) || setOfDexId(c.id).toLowerCase() === t));
    });
    if (narrowed.length) list = narrowed;
    else note = `Ninguna versión de «${words.slice(0, used).join(" ")}» coincide con «${words.slice(used).join(" ")}»: te mostramos todas.`;
  }
  const order = new Map([...sets.keys()].map((id, i) => [id, i]));
  const plain = (s) => ` ${normalize(s).replace(/[^\p{L}\p{N}]+/gu, " ").trim()} `;
  const q = plain(words.slice(0, used).join(" "));
  const whole = (c) => (used && plain(c.name).includes(q) ? 1 : 0);
  list.sort((a, b) => whole(b) - whole(a) || !!b.image - !!a.image
    || (order.get(setOfDexId(b.id)) ?? -1) - (order.get(setOfDexId(a.id)) ?? -1) || (parseInt(a.localId, 10) || 0) - (parseInt(b.localId, 10) || 0));
  return {
    note,
    cards: list.slice(0, 500).map((c) => {
      const set = setOf(c), total = set?.cardCount?.official;
      return {
        category: "pokemon", dexId: c.id, catalogId: ptcgId(c.id), name: c.name, setName: set?.name ?? setOfDexId(c.id), number: total ? `${c.localId}/${total}` : c.localId,
        variant: "", image: c.image ? `${c.image}/high.webp` : "", thumb: c.image ? `${c.image}/low.webp` : "",
      };
    }),
  };
}

  };
  const paintMine = async () => {
    const run = ++st.mineRun, items = await loadWatchlist();
    if (run !== st.mineRun || !mineBox.isConnected) return;
    if (!items.length) {
      setWatchBadge(0);
      mineBox.innerHTML = `<section class="wl-sec"><div class="rhead"><h2 class="wl-h">${ic("bookmark")}Tus cartas</h2></div>
        <div class="empty-state"><span class="ico">${ic("bookmark")}</span><p style="font-weight:600">Tu watchlist está vacía.</p><p class="small muted" style="margin-top:4px">Busca una carta arriba y toca «Agregar a mi watchlist».</p></div></section>`;
      return;
    }
    if (!st.painted) mineBox.innerHTML = `<p class="wl-status"><span class="spinner"></span>Revisando si tus cartas ya están en ${APP}…</p>`;
    const avail = await watchAvailability(items).catch((e) => { console.error(e); return new Map(); });
    if (run !== st.mineRun || !mineBox.isConnected) return;
    const yes = items.filter((w) => avail.get(watchKey(w))?.length), no = items.filter((w) => !avail.get(watchKey(w))?.length);
    setWatchBadge(yes.length);
    const live = st.painted ? "" : " live";
    st.painted = true;
    mineBox.innerHTML = `
      <section class="wl-sec" aria-labelledby="wlYes"><div class="rhead"><h2 class="wl-h" id="wlYes">${ic("checkCircle")}Disponibles en ${APP}<span class="wl-count">${yes.length}</span></h2></div>
        ${yes.length ? `<ul class="grid${live}">${yes.map((w, i) => availTile(w, avail.get(watchKey(w)), i)).join("")}</ul>` : `<p class="wl-none">Ninguna de tus cartas está a la venta todavía. Cuando alguien publique una, aparece aquí.</p>`}</section>
      <section class="wl-sec" aria-labelledby="wlNo"><div class="rhead"><h2 class="wl-h" id="wlNo">${ic("clock")}Todavía no están en la web<span class="wl-count">${no.length}</span></h2></div>
        ${no.length ? `<ul class="grid${live}">${no.map(missingTile).join("")}</ul>` : `<p class="wl-none">Todas tus cartas están a la venta en ${APP}.</p>`}</section>`;
    // Reference prices: researched again at most once a day per card (and once per visit).
    const stale = no.filter((w) => !watchRefTried.has(watchKey(w)) && !(w.refCents > 0 && w.refAt && Date.now() - Date.parse(w.refAt) < DAY_MS));
    eachLimit(stale, 2, async (w) => {
      watchRefTried.add(watchKey(w));
      const cents = await watchLiveRef(w).catch(() => null);
      if (!cents) return;
      saveWatchRef(w, cents);
      const li = mineBox.querySelector(`li[data-wid="${CSS.escape(w.id)}"]`);
      if (!li) return;
      li.querySelector("[data-price]").textContent = fmtRef(cents);
      li.querySelector("[data-flag]").textContent = missingText(cents);
    });
  };

  // --- events
  input.addEventListener("input", () => { clearTimeout(st.timer); $("#wlClear").hidden = !input.value; st.timer = setTimeout(search, 350); });
  $("#wlForm").addEventListener("submit", (e) => { e.preventDefault(); input.blur(); search(); });
  $("#wlClear").addEventListener("click", () => { input.value = ""; search(); input.focus(); });
  app.querySelectorAll("input[name=wlKind]").forEach((r) => r.addEventListener("change", () => {
    st.graded = app.querySelector("input[name=wlKind]:checked")?.value === "graded";
    app.querySelectorAll(".wl-opts .seg label").forEach((lb) => lb.classList.toggle("on", lb.querySelector("input").checked));
    $("#wlGrade").hidden = !st.graded;
    resBox.querySelectorAll("[data-ref]").forEach((el) => { const c = st.reg.get(el.dataset.ref); if (c) el.innerHTML = priceBlock(c); });
    syncButtons();
  }));
  $("#wlCo").addEventListener("change", (e) => { st.company = e.target.value; });
  $("#wlGr").addEventListener("change", (e) => { st.grade = Number(e.target.value); });
  resBox.addEventListener("click", async (e) => {
    const chip = e.target.closest("[data-try]");
    if (chip) { input.value = chip.dataset.try; return search(); }
    if (e.target.closest("#wlMore")) {
      const cards = visible(), from = st.shown;
      st.shown += WATCH_PAGE;
      $("#wlGrid").insertAdjacentHTML("beforeend", cards.slice(from, st.shown).map((c, i) => cardTile(c, i)).join(""));
      $("#wlMore").closest(".wl-more").outerHTML = moreBtn(cards.length - st.shown);
      loadPrices(cards.slice(from, st.shown));
      return syncButtons();
    }
    const b = e.target.closest("button[data-w]"), c = b && st.reg.get(b.dataset.w);
    if (c && await toggleWatch(b, withKind(c))) paintMine();
  });
  resBox.addEventListener("change", (e) => { if (e.target.id === "wlSet") { st.set = e.target.value; st.shown = WATCH_PAGE; paintCatalog(); } });
  mineBox.addEventListener("click", async (e) => {
    const b = e.target.closest(".wl-del, .wl-ask");
    if (!b) return;
    const w = (await loadWatchlist()).find((x) => x.id === b.dataset.id);
    if (!w) return;
    if (b.classList.contains("wl-ask")) return askAboutWatch(w);
    b.disabled = true;
    const r = await removeFromWatchlist(w);
    if (!r.ok) { b.disabled = false; return toast(r.msg, { type: "error" }); }
    toast("La quitamos de tu watchlist");
    paintMine();
    syncButtons();
  });

  if (q0) search(); else paintIdle();
  if (!q0 && matchMedia("(hover: hover) and (pointer: fine)").matches) input.focus({ preventScroll: true });
  await paintMine();
}

// ============================================================= scanner (#/escanear)
// "¿Cuánto vale tu carta?": photo → card → market value. Loose Pokémon cards are read for free in the
// browser first (OCR + catalog); the paid AI only runs for slabs, sports cards and unclear photos.
// The daily quota lives in the database (scan_quota, migration 0012).
let pendingSellFiles = null;
const quotaText = (q) => `Te ${q.limit - q.used === 1 ? "queda" : "quedan"} ${Math.max(0, q.limit - q.used)} de ${q.limit} escaneos gratis hoy.`;
// ============================================================= shop events (#/eventos, migration 0028)
// Verified shops publish tournaments, leagues and launches. "Me interesa" gets a reminder the day before
// (remind_events in the database) and a notice if the shop cancels.
let eventsOn = true;
const EVENT_GAMES = [["pokemon", "Pokémon"], ["one_piece", "One Piece"], ["magic", "Magic"], ["yugioh", "Yu-Gi-Oh!"], ["lorcana", "Lorcana"], ["deportivas", "Cartas deportivas"], ["otro", "Otro juego"]];
const EVENT_KINDS = [["torneo", "Torneo"], ["liga", "Liga"], ["prerelease", "Prerelease"], ["lanzamiento", "Lanzamiento"], ["intercambio", "Intercambio"], ["otro", "Evento"]];
const optName = (list, v) => list.find(([k]) => k === v)?.[1] ?? v;
const PA_TZ = "America/Panama";
const paDate = (ts) => new Intl.DateTimeFormat("en-CA", { timeZone: PA_TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date(ts));
const paTime = (ts) => new Intl.DateTimeFormat("en-GB", { timeZone: PA_TZ, hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date(ts));
const fmtEventTime = (ts) => new Date(ts).toLocaleTimeString("es-PA", { hour: "numeric", minute: "2-digit", timeZone: PA_TZ });
async function fetchEvents(shop = null) {
  if (!eventsOn || !sb) return [];
  const { data, error } = await sb.rpc("upcoming_events", shop ? { p_shop: shop } : {});
  if (error) { if (["PGRST202", "42883"].includes(error.code)) eventsOn = false; else console.error(error); return []; }
  return data ?? [];
}
function eventCard(e, { showShop = true, manage = false, compact = false } = {}) {
  const d = new Date(e.starts_at);
  const day = d.toLocaleDateString("es-PA", { day: "numeric", timeZone: PA_TZ });
  const month = d.toLocaleDateString("es-PA", { month: "short", timeZone: PA_TZ }).replace(".", "");
  const when = `${d.toLocaleDateString("es-PA", { weekday: "long", day: "numeric", month: "long", timeZone: PA_TZ })}, ${fmtEventTime(e.starts_at)}${e.ends_at ? ` a ${fmtEventTime(e.ends_at)}` : ""}`;
  const facts = [when, e.fee_cents ? `Inscripción ${formatUsd(e.fee_cents)}` : "Gratis", e.capacity ? `Cupo para ${e.capacity}` : ""].filter(Boolean);
  const people = e.interested ? `${e.interested} ${e.interested === 1 ? "persona interesada" : "personas interesadas"}` : "";
  const action = manage ? (e.cancelled ? "" : `<button type="button" class="btn outline sm" data-ev="edit">Editar</button><button type="button" class="btn ghost sm" data-ev="cancel">Cancelar evento</button>`)
    : e.cancelled ? "" : `<button type="button" class="btn ${e.mine ? "primary" : "outline"} sm" data-ev="interest" aria-pressed="${e.mine}">${ic(e.mine ? "check" : "bell")}${e.mine ? "Te interesa" : "Me interesa"}</button>`;
  return `<li class="event${e.cancelled ? " off" : ""}" data-event="${esc(e.id)}">
    <div class="ev-date" aria-hidden="true"><span>${esc(month)}</span><b>${esc(day)}</b></div>
    <div class="ev-body"><p class="ev-kind">${esc(optName(EVENT_KINDS, e.kind))} · ${esc(optName(EVENT_GAMES, e.game))}${e.cancelled ? `<span class="b warn">Cancelado</span>` : ""}</p>
      <h3>${esc(e.title)}</h3>
      <p class="xs muted">${facts.map(esc).join(" · ")}</p>
      ${showShop ? `<p class="small"><a class="link" href="#/vendedor/${encodeURIComponent(e.shop_id)}">${esc(e.shop_name)}</a>${e.shop_address ? ` · ${esc(e.shop_address)}` : e.shop_province ? ` · ${esc(e.shop_province)}` : ""}</p>` : ""}
      ${e.description && !compact ? `<p class="small ev-desc">${esc(e.description)}</p>` : ""}
      ${action || people ? `<div class="ev-actions">${action}${people ? `<span class="xs muted">${people}</span>` : ""}</div>` : ""}</div></li>`;
}
// "Me interesa" on any list of event cards; redraw() re-renders that list.
function bindInterest(listEl, events, redraw) {
  listEl.addEventListener("click", async (ev) => {
    const b = ev.target.closest('[data-ev="interest"]');
    if (!b) return;
    if (!session) return go(`/entrar?next=${encodeURIComponent(location.hash.replace(/^#/, "") || "/eventos")}`);
    const e = events.find((x) => x.id === b.closest("[data-event]").dataset.event);
    if (!e) return;
    b.disabled = true;
    const { error } = e.mine
      ? await sb.from("event_interest").delete().eq("event_id", e.id).eq("user_id", session.user.id)
      : await sb.from("event_interest").insert({ event_id: e.id, user_id: session.user.id });
    if (error && error.code !== "23505") { b.disabled = false; console.error(error); return toast("No pudimos guardarlo. Intenta de nuevo.", { type: "error" }); }
    if (!error) e.interested += e.mine ? -1 : 1;
    e.mine = !e.mine;
    if (e.mine) toast("Listo. Te recordamos un día antes.");
    redraw();
  });
}

// ============================================================= Mi portafolio (#/portafolio, migration 0033)
// The cards a person owns, saved from "¿Cuánto vale tu carta?" without publishing them. Each one shows
// what it is worth today (the listing page's price sources), what it sells for on MarketZlab and in
// Panamá, and keeps the scanned photo: "Vender esta carta" opens #/vender with it (a sale draft).
// Private to its owner. Until 0033 runs, the list lives in this browser (without photos) and moves to
// the account the first time the table is there.
let portfolioOn = true;
// Entry value and daily value log (migration 0035) and "show on my profile" (0036). Until they run,
// the cards load without those columns.
let pfPerfCols = true, pfPublicCol = true;
const PF_LOCAL = "holo.portfolio.v1";

const PF_PERF = ["added_value_cents", "value_log"];
const PF_FRESH_MS = 12 * 3600000;
const pfMissing = (e) => ["42P01", "PGRST205", "PGRST204", "42703"].includes(e?.code);
const pfRow = (o) => Object.fromEntries(PF_FIELDS.filter((k) => o[k] !== undefined).map((k) => [k, o[k]]));

async function pfQuery(run) {
  for (;;) {

    const m = pfMissing(res.error) ? res.error.message ?? "" : "";
    if (pfPerfCols && /added_value_cents|value_log/.test(m)) pfPerfCols = false;

  write(list) { try { localStorage.setItem(PF_LOCAL, JSON.stringify(list.slice(0, 500))); return true; } catch { return false; } },
};

function marketValueOf(h) {

async function loadPortfolio() {
  if (sb && session && portfolioOn) {
    const { data, error } = await pfQuery(() => sb.from("portfolio_items").select(pfCols()).order("created_at", { ascending: false }).limit(500));
    if (!error) {
      const local = pfLocal.read();
      if (local.length) {
        const ins = await pfQuery(() => sb.from("portfolio_items").insert(local.map((it) => ({ ...pfDb(pfRow(it)), user_id: session.user.id }))).select(pfCols()));
        if (!ins.error) { pfLocal.write([]); data.unshift(...ins.data); } else console.warn("portfolio: local cards not moved", ins.error);
      }

    }
    if (pfMissing(error)) portfolioOn = false; else throw error;
  }

    if (!error) {

      pfItems.set(data.id, data);

      if (file) {
        const ext = { "image/png": "png", "image/webp": "webp" }[file.type] ?? "jpg";
        const path = `${session.user.id}/${data.id}.${ext}`;
        const up = await sb.storage.from("portfolio-photos").upload(path, file, { contentType: file.type || "image/jpeg", upsert: true });
        if (up.error) console.warn("portfolio photo", up.error);
        else {
          const { error: e2 } = await sb.from("portfolio_items").update({ photo_path: path }).eq("id", data.id);
          if (e2) { console.warn("portfolio photo path", e2); sb.storage.from("portfolio-photos").remove([path]); } else data.photo_path = path;
        }

      return { item: data, local: false };

    if (!pfMissing(error)) throw error;

}

async function pfMarket(items) {

  if (!sb || !items.length) return out;
  const ids = [...new Set(items.map((it) => it.catalog_id).filter(Boolean))].slice(0, 200);
  const since = new Date(Date.now() - 366 * DAY_MS).toISOString();
  const [ls, sl] = await Promise.all([
    ids.length ? sb.from("listings").select("id, catalog_id, title, price_cents, grading_company, grade").eq("status", "active").in("catalog_id", ids).limit(1000) : { data: [] },
    ids.length ? sb.from("sales").select("catalog_id, grading_key, price_cents, sold_at").in("catalog_id", ids).gte("sold_at", since).order("sold_at", { ascending: false }).limit(1000) : { data: [] },
  ]);
  const sameGrade = (it, company, grade) => (it.grading_company ?? null) === (company ?? null) && (!company || Number(it.grade) === Number(grade));
  for (const it of items) {
    const o = out.get(it.id);
    if (it.catalog_id) {
      o.listings = (ls.data ?? []).filter((r) => r.catalog_id === it.catalog_id && sameGrade(it, r.grading_company, r.grade));
      o.sales = (sl.data ?? []).filter((r) => r.catalog_id === it.catalog_id && r.grading_key === pfGradingKey(it));

async function pfPublicPanel(app, items, ints) {

    for (const it of items) {

    }
  };
  paintPublic();
  app.querySelectorAll("[data-pub]").forEach((b) => b.addEventListener("click", async () => {
    const on = b.dataset.pub === "1", change = items.filter((it) => (example || !it.local) && !!it.is_public !== on);
    if (!change.length) return toast(on ? "Ya se ven todas en tu perfil." : "Ninguna se ve en tu perfil.");
    b.disabled = true;
    const { error } = example ? {} : await sb.from("portfolio_items").update({ is_public: on }).in("id", change.map((it) => it.id));
    b.disabled = false;
    if (error) { console.error(error); return toast("No pudimos cambiarlo. Intenta de nuevo.", { type: "error" }); }
    change.forEach((it) => { it.is_public = on; });
    paintPublic();
    toast(on ? "Tus cartas ya se ven en tu perfil" : "Ocultaste tus cartas de tu perfil", on ? { description: "Comparte el enlace para que la gente marque las que le interesan." } : {});
  }));
  $("#pfShare")?.addEventListener("click", async () => {
    const text = `Mira mi colección de cartas en ${CONFIG.APP_NAME}`;
    if (navigator.share) { try { await navigator.share({ text, url: link }); return; } catch (err) { if (err?.name === "AbortError") return; } }
    try { await navigator.clipboard.writeText(link); toast("Copiamos el enlace a tu perfil"); } catch { window.open(`https://wa.me/?text=${encodeURIComponent(`${text}: ${link}`)}`, "_blank", "noopener"); }
  });
  // Per card, most wanted first. Cards on sale need their title from listings.
  const box = $("#pfInt");
  if (!ints.cards.length) {
    box.innerHTML = `<div class="int-big"><p class="v">0</p><p class="s">Todavía nadie marcó “Me interesa” en tus cartas. Muéstralas en tu perfil y comparte el enlace.</p></div>`;
    return;
  }
  const lids = ints.cards.filter((c) => c.key.startsWith("l:")).map((c) => c.key.slice(2));
  const ls = lids.length ? (await sb.from("listings").select("id, title, status").in("id", lids)).data ?? [] : [];
  if (!box.isConnected) return;
  const byListing = new Map(ls.map((l) => [l.id, l])), byItem = new Map(items.map((it) => [it.id, it]));
  const rows = ints.cards.map((c) => {

    if (c.key.startsWith("p:")) {

      return it && { ...c, href: `#/portafolio/${encodeURIComponent(id)}`, name: `${it.subject}${it.grading_company ? ` · ${pfLabel(it)}` : ""}`, img: it.image_url, tag: it.is_public ? "En tu colección" : "En tu colección · ya no se ve en tu perfil" };
    }
    const l = byListing.get(id);
    return l && { ...c, href: `#/carta/${encodeURIComponent(id)}`, name: l.title, img: null, tag: { active: "En venta", reserved: "Reservada", sold: "Vendida" }[l.status] ?? "Retirada" };

/** "N personas interesadas en M de tus cartas" and the cards, most wanted first (5, then "Ver las otras").

      <span class="n">${ic("heart")}${peopleN(r.people)}</span></a></li>`;
  return `<div class="int-big"><p class="v">${fmtN(people)}</p><p class="s">${people === 1 ? "persona interesada" : "personas interesadas"} en <b>${fmtN(rows.length)} de tus cartas</b>. No te mostramos quiénes: solo cuántas quieren cada una.</p></div>
    <ol class="int-list">${rows.slice(0, 5).map(row).join("")}</ol>

}

        <div class="share-row"><a class="btn outline sm" href="${pfProfileHref(example)}">${ic("eye")}Ver mi perfil</a><button type="button" class="btn outline sm" id="pfShare">${ic("share")}Compartir</button></div></div>

    ${local && items.length ? `<p class="notice soft" style="margin:0">Por ahora tu portafolio se guarda en este navegador. Pronto se guardará en tu cuenta y lo verás en todos tus dispositivos.</p>` : ""}
    ${items.length ? "" : pubPanel}
    ${items.length ? `<section class="dash-tiles" aria-label="Resumen de tu portafolio">

      ${tile("trend", "Valor estimado", `<span class="spinner"></span>`, "calculando…", "pfTotal")}

      ${paidItems.length ? tile("tag", "Pagaste", formatUsd(paidItems.reduce((n, it) => n + it.paid_cents * (it.quantity ?? 1), 0)), `en ${fmtN(paidItems.length)} ${paidItems.length === 1 ? "carta" : "cartas"}`, "pfPaid") : ""}
      ${tile("store", `En venta en ${esc(CONFIG.APP_NAME)}`, `<span class="spinner"></span>`, "de tus cartas", "pfOnSale")}
    </section>
    ${pubPanel}
    <ul class="grid live" id="pfGrid">${items.map((it, i) => `<li style="--i:${Math.min(i, 16)}"><a class="pcard pf-card" href="#/portafolio/${encodeURIComponent(it.id)}" data-pf="${esc(it.id)}">
      <div class="media card-ratio"><div class="inner">${pfArt(it, photos)}</div>
        <div class="corner-l" data-pubchip><span class="cond">${esc(pfLabel(it))}</span>${pubChip(it)}</div>${(it.quantity ?? 1) > 1 ? `<div class="corner-r"><span class="pf-qty">×${it.quantity}</span></div>` : ""}</div>
      <p class="title">${esc(it.subject)}</p>

      <div class="pf-rows"><p class="pf-val"><span class="k">Valor hoy</span><b data-val>${it.value_cents != null ? formatUsd(it.value_cents) : `<span class="spinner"></span>`}</b></p>

      <a class="btn primary" href="#/escanear">${ic("camera")}Escanear una carta</a></div>`}
  </div>`;

  if (!items.length) return;
  const cardOf = (it) => app.querySelector(`[data-pf="${CSS.escape(it.id)}"]`);
  // Where they sell, all at once.
  pfMarket(items).then((m) => {
    if (!app.isConnected) return;
    let onSale = 0;
    for (const it of items) {
      const x = m.get(it.id), el = cardOf(it)?.querySelector("[data-sale]");
      if (x.listings.length) onSale++;
      if (el) el.innerHTML = pfSaleLine(x);
    }
    const n = $("#pfOnSale"); if (n) { n.textContent = fmtN(onSale); $("#pfOnSaleS").textContent = `de tus ${fmtN(items.length)} cartas`; }
  }).catch((e) => console.warn("portfolio market", e));
  // Values, three at a time (the price sources rate-limit).
  let total = 0, missing = 0, next = 0;
  const work = async () => {
    while (next < items.length) {
      const it = items[next++];
      const usd = await pfValue(it);
      if (!app.isConnected) return;
      const el = cardOf(it)?.querySelector("[data-val]"), chg = cardOf(it)?.querySelector("[data-chg]");
      if (usd) { total += usd * (it.quantity ?? 1); if (el) el.textContent = fmtEstimate(usd); } else { missing++; if (el) el.textContent = "—"; }
      if (chg) chg.innerHTML = pfChgLine(it);
    }
  };
  await Promise.all([work(), work(), work()]);
  if (!app.isConnected) return;
  const t = $("#pfTotal");
  if (t) { t.textContent = formatUsd(Math.round(total * 100)); $("#pfTotalS").textContent = missing ? `sin contar ${fmtN(missing)} ${missing === 1 ? "carta" : "cartas"} sin precio` : "a precio de mercado de hoy"; }
  // The whole portfolio as a stock: today's value against the entry value of each card.
  const moved = items.map((it) => [pfChange(it), it.quantity ?? 1]).filter(([c]) => c);
  const mv = $("#pfMoved");
  if (mv) {
    const entry = moved.reduce((n, [c, q]) => n + c.entry * q, 0), diff = moved.reduce((n, [c, q]) => n + (c.now - c.entry) * q, 0);
    if (!moved.length || !entry) { mv.textContent = "—"; $("#pfMovedS").textContent = "todavía sin precio de entrada"; }
    else {
      mv.innerHTML = `<span class="pf-move ${Math.abs(diff / entry) < 0.0005 ? "flat" : diff > 0 ? "up" : "down"}">${pfSigned(diff)}</span>`;
      $("#pfMovedS").innerHTML = `${pfMove(diff / entry)} ${moved.length < items.length ? `en ${fmtN(moved.length)} de ${fmtN(items.length)} cartas` : "como una acción"}`;
    }
  }
  const paid = $("#pfPaid");
  if (paid && !missing) {
    const cost = paidItems.reduce((n, it) => n + it.paid_cents * (it.quantity ?? 1), 0) / 100;
    const worth = paidItems.reduce((n, it) => n + ((it.value_cents ?? 0) / 100) * (it.quantity ?? 1), 0);
    const d = worth - cost;
    $("#pfPaidS").innerHTML = `${d >= 0 ? "ganancia" : "pérdida"} de <b>${formatUsd(Math.round(Math.abs(d) * 100))}</b> hoy`;
  }
}

/** A box to sign with a finger or the mouse. The PNG is always 900×300 on white, whatever the screen. */
function signaturePad(canvas) {
  const W = 900, H = 300, ctx = canvas.getContext("2d");
  canvas.width = W; canvas.height = H;
  let last = null, ink = 0;
  const at = (e) => { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; };
  const clear = () => { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H); ink = 0; canvas.classList.remove("signed"); };
  canvas.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    last = at(e);
    ctx.fillStyle = "#0b1222"; ctx.beginPath(); ctx.arc(last[0], last[1], 2.4, 0, Math.PI * 2); ctx.fill();
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!last) return;
    const p = at(e);
    ctx.strokeStyle = "#0b1222"; ctx.lineWidth = 4.5; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke();
    ink += Math.hypot(p[0] - last[0], p[1] - last[1]);
    last = p;
    canvas.classList.add("signed");
  });
  const end = () => { last = null; };
  canvas.addEventListener("pointerup", end);
  canvas.addEventListener("pointercancel", end);
  clear();
  return { clear, empty: () => ink < 80, png: () => canvas.toDataURL("image/png") };
}

  const up = await sb.storage.from("shop-agreements").upload(path, f, { contentType: f.type || "application/octet-stream", upsert: false });
  if (up.error) throw up.error;
  const { error } = await sb.rpc("submit_shop_document", { p_shop_name: shopName, p_document_path: path });
  if (error) throw error;
}
// Signing up before confirming the e-mail gives no session to upload with: the file waits in this browser
// (IndexedDB keeps the File) and goes out on the first sign-in. On another device, Mi cuenta asks for it again.
function pendingStore(mode, op) {
  return new Promise((resolve, reject) => {
    const open = indexedDB.open("marketzlab", 1);
    open.onupgradeneeded = () => open.result.createObjectStore("pending");
    open.onerror = () => reject(open.error);
    open.onsuccess = () => {
      const db = open.result, tx = db.transaction("pending", mode), req = op(tx.objectStore("pending"));
      tx.oncomplete = () => { db.close(); resolve(req.result); };
      tx.onerror = tx.onabort = () => { db.close(); reject(tx.error); };
    };
  });
}
const stashShopDoc = (email, shopName, file) =>
  pendingStore("readwrite", (st) => st.put({ email, shopName, file }, "shopDoc")).catch((e) => console.warn("shop agreement not kept", e));
let shopDocBusy = false;
async function finishPendingShopDoc() {
  if (!sb || !session || shopDocBusy || typeof indexedDB === "undefined") return;
  let p = null;
  try { p = await pendingStore("readonly", (st) => st.get("shopDoc")); } catch { return; }
  if (!p?.file || p.email !== (session.user.email ?? "").toLowerCase()) return;
  shopDocBusy = true;
  const drop = () => pendingStore("readwrite", (st) => st.delete("shopDoc")).catch(() => undefined);
  try {
    await sendShopDocument(session.user.id, p.shopName, p.file);
    await drop();
    toast("Recibimos el acuerdo de tu tienda", { description: "Tu tienda está en revisión. Te avisamos cuando la aprobemos." });
    if (parseHash().path === "/cuenta") route();
  } catch (e) {
    if (/already pending/.test(e?.message ?? "")) await drop(); else console.warn("pending shop agreement", e);
  } finally { shopDocBusy = false; }
}

const PROFILE_COLS = "display_name, is_shop, verified, avatar_path, shop_description, shop_photo_path";
async function viewAccount(app) {
  setTitle("Mi cuenta");
  if (!sb || !session) return go("/entrar?next=/cuenta");

  if (error || !prof) {
    console.error(error);
    app.innerHTML = `<p class="notice bad" style="margin-top:24px">No pudimos cargar tu perfil. ${error?.code === "42703" ? "Falta aplicar la migración 0004 en Supabase." : "Recarga la página."}</p>`;
    return;
  }
  const st = { avatar: null, shopPhoto: null };
  const pic = (url, cls, empty) => url ? `<img src="${esc(url)}" alt="" class="${cls}">` : `<span class="${cls} empty">${empty}</span>`;
  app.innerHTML = `<div class="account dash">
    <div class="dash-head"><div class="dash-me">${sellerAvatar(profileToSeller(uid, prof), 56)}<div style="min-width:0"><p class="kicker">Mi cuenta · <span id="accKind"${prof.is_shop || isShopSignup() ? " data-fixed" : ""}>${prof.is_shop ? (prof.verified ? "Tienda" : "Tienda en revisión") : isShopSignup() ? "Tienda en revisión" : isSeller() ? "Vendedor" : "Comprador"}</span></p><h1 class="dash-name">${esc(prof.display_name)}</h1>${session.user.email ? `<p class="xs muted" style="margin-top:2px">${esc(session.user.email)}</p>` : ""}</div></div>
      <div class="dash-actions"><a class="btn outline sm" href="#/vendedor/${encodeURIComponent(uid)}">Ver mi perfil público</a><a class="btn primary sm" href="#/vender">${ic("plus")}Publicar carta</a></div></div>
    <div id="dash" class="dash-body"><p class="loading"><span class="spinner"></span>Cargando tus cartas…</p></div>
    <div id="accSeller" class="col" style="margin-top:24px"></div>
    <div id="accInquiries" class="col" style="margin-top:16px"></div>
    <div id="accIdentity" class="col" style="margin-top:16px"></div>
    <div id="accShop" class="col" style="margin-top:16px"></div>
    <div id="accEvents" class="col" style="margin-top:16px"></div>
    <form id="accForm" class="col acc-form" style="margin-top:24px" novalidate>
      <section class="panel col">
        <h2>Perfil</h2>
        <p class="xs muted" style="margin:0">Así te ven los compradores en tus anuncios.</p>
        <div class="acc-avatar"><label class="acc-pick" title="Cambiar foto de perfil">${pic(profilePhotoUrl(prof.avatar_path), "av", esc(prof.display_name.slice(0, 1).toUpperCase()))}
          <input type="file" id="avatarIn" accept="image/jpeg,image/png,image/webp" class="sr-only"></label>
          <div><p style="margin:0;font-weight:600">Foto de perfil</p><p class="xs muted" style="margin:2px 0 0">Tu cara o el logo de tu tienda. Toca la foto para cambiarla.</p></div></div>
        <label class="f">Nombre para mostrar<input class="input" name="displayName" required minlength="2" maxlength="40" value="${esc(prof.display_name)}"></label>
      </section>
      ${prof.is_shop ? `<section class="panel col">
        <div class="phead"><h2>Tu tienda</h2>${sellerBadge({ isShop: true, verified: prof.verified })}</div>
        <label class="f">Describe tu tienda<textarea class="textarea" name="shopDescription" rows="4" maxlength="280" placeholder="Qué vendes, dónde queda el local, horario…">${esc(prof.shop_description ?? "")}</textarea><span class="xs muted" id="descCount"></span></label>
        <div class="f" style="font-size:14px;font-weight:500">Foto del local
          <label class="acc-shop" title="Cambiar foto del local">${pic(profilePhotoUrl(prof.shop_photo_path), "shp", "Sube una foto de la fachada o del mostrador")}
            <input type="file" id="shopIn" accept="image/jpeg,image/png,image/webp" class="sr-only"></label>
          <span class="xs muted" style="font-weight:400">Una foto real del local da confianza: la gente ve que existes.</span></div>
        ${shopCols ? `<label class="f">Dirección del local<input class="input" name="shopAddress" maxlength="160" placeholder="Ej.: Multiplaza, segundo piso, local 210" value="${esc(prof.shop_address ?? "")}"><span class="xs muted" style="font-weight:400">Sale en tu página con un enlace a Google Maps.</span></label>
        <div class="grid2"><label class="f">Provincia<select class="select" name="shopProvince"><option value="">Elige</option>${PROVINCES.map((v) => `<option ${prof.shop_province === v ? "selected" : ""}>${esc(v)}</option>`).join("")}</select></label>
          <label class="f">Horario<input class="input" name="shopHours" maxlength="200" placeholder="Lun a sáb, 10 a. m. a 8 p. m." value="${esc(prof.shop_hours ?? "")}"></label></div>
        <label class="check"><input type="checkbox" name="shopPickup"${prof.shop_pickup ? " checked" : ""}><span><b>Retiro en tienda:</b> quien te compra puede pasar a buscar su compra al local. Le damos tu dirección y un código que te muestra al retirarla.${prof.verified ? "" : " Se activa cuando tu tienda esté verificada."}</span></label>` : ""}
        ${prof.verified ? `<p class="notice good" style="margin:0">✓ Tu tienda está verificada.</p>`
          : `<p class="notice soft" style="margin:0"><b style="color:var(--ink)">Tu tienda está en revisión.</b> Sube la foto del local: nos ayuda a verificar que existe. Te avisamos cuando tengas el sello.</p>`}
      </section>` : ""}
      <div id="accMsg"></div>
      <button class="btn primary block" id="accBtn">Guardar cambios</button>
    </form></div>`;

  renderSellerSection($("#accSeller"), parseHash().params.get("vendedor") === "1");
  renderMyInquiries($("#accInquiries"));
  renderIdentity(uid, prof, $("#accIdentity"));
  if (prof.is_shop && prof.verified) renderShopEvents(uid, $("#accEvents"));
  renderDashboard(uid, prof, $("#dash"));
  const form = $("#accForm"), desc = form.shopDescription;
  const count = () => ($("#descCount").textContent = `${desc.value.length}/280`);
  if (desc) { desc.addEventListener("input", count); count(); }
  const preview = (input, key, cls) => input.addEventListener("change", () => {
    const f = input.files[0]; if (!f) return;
    st[key] = f;
    const holder = input.parentElement.querySelector(`.${cls}`);
    const img = document.createElement("img"); img.className = cls; img.alt = ""; img.src = URL.createObjectURL(f);
    holder.replaceWith(img);
  });
  renderShopRequest(uid, prof, $("#accShop"), parseHash().params.get("tienda") === "1");
  preview($("#avatarIn"), "avatar", "av");
  if (prof.is_shop) preview($("#shopIn"), "shopPhoto", "shp");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("#accBtn"), msg = $("#accMsg");
    const say = (cls, t) => (msg.innerHTML = `<p class="notice ${cls}" style="margin:0">${esc(t)}</p>`);
    const displayName = form.displayName.value.trim();
    if (displayName.length < 2) return say("bad", "El nombre debe tener al menos 2 caracteres.");
    btn.disabled = true; btn.textContent = "Guardando…"; msg.innerHTML = "";
    const uploaded = [];
    const upload = async (file, kind) => {
      const f = await compressImage(file);
      const ext = { "image/png": "png", "image/webp": "webp" }[f.type] ?? "jpg";
      const path = `${uid}/${kind}-${Date.now()}.${ext}`;
      const up = await sb.storage.from("profile-photos").upload(path, f, { contentType: f.type || "image/jpeg", cacheControl: "31536000", upsert: false });
      if (up.error) throw up.error;
      uploaded.push(path);
      return path;
    };
    try {
      const patch = { display_name: displayName };
      if (prof.is_shop) patch.shop_description = desc.value.trim() || null;
      if (prof.is_shop && form.shopAddress) {
        const address = form.shopAddress.value.trim().replace(/\s+/g, " ");
        if (address && address.length < 5) throw Object.assign(new Error("address"), { userMsg: "Escribe la dirección completa del local." });
        if (form.shopPickup.checked && !address) throw Object.assign(new Error("address"), { userMsg: "Para ofrecer retiro en tienda, escribe la dirección del local." });
        Object.assign(patch, { shop_address: address || null, shop_province: form.shopProvince.value || null, shop_hours: form.shopHours.value.trim() || null, shop_pickup: form.shopPickup.checked });
      }
      if (st.avatar) patch.avatar_path = await upload(st.avatar, "avatar");
      if (st.shopPhoto) patch.shop_photo_path = await upload(st.shopPhoto, "local");
      const res = await sb.from("profiles").update(patch).eq("id", uid).select(profileCols(PROFILE_COLS)).single();
      if (res.error) throw res.error;
      // Replaced photos are no longer referenced anywhere: remove them.
      const old = [st.avatar && prof.avatar_path, st.shopPhoto && prof.shop_photo_path].filter(Boolean);
      if (old.length) sb.storage.from("profile-photos").remove(old);
      Object.assign(prof, res.data); st.avatar = st.shopPhoto = null;
      profileName = prof.display_name; renderNav(); $(".dash-name")?.replaceChildren(prof.display_name);
      say("good", "Listo, tu perfil quedó guardado.");
    } catch (err) {
      console.error(err);
      if (uploaded.length) sb.storage.from("profile-photos").remove(uploaded);
      say("bad", err?.userMsg ?? (err?.statusCode === "413" || /size/i.test(err?.message ?? "") ? "La foto es muy pesada (máximo 5 MB)." : "No pudimos guardar los cambios. Revisa tu conexión e intenta de nuevo."));
    } finally { btn.disabled = false; btn.textContent = "Guardar cambios"; }
  });
}

function adminFail(err, el, fallback = "No se pudo guardar. Intenta de nuevo.") {

async function profilesById(ids) {
  const uniq = [...new Set(ids.filter(Boolean))];
  if (!uniq.length) return new Map();
  const { data } = await sb.from("public_profiles").select("id, display_name, is_shop, verified").in("id", uniq);
  return new Map((data ?? []).map((p) => [p.id, p]));
}
const fmtDate = (s) => s ? new Date(s).toLocaleDateString("es-PA", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";

// ------------------------------------------------------------- consultas (migration 0030)
async function adminInquiries(body, filter) {
  let query = sb.from("inquiries").select("id, code, user_id, source, listing_id, subject, price_cents, catalog_ref, message, contact_phone, status, staff_note, created_at, updated_at").order("created_at", { ascending: false }).limit(200);
  query = filter === "abiertas" ? query.neq("status", "cerrada") : filter === "todas" ? query : query.eq("status", filter);
  const { data, error } = await query;
  if (error) {
    if (inquiryMissing(error)) { body.innerHTML = `<p class="notice bad">Falta aplicar la migración 0030 en Supabase para ver las consultas.</p>`; return; }
    throw error;
  }
  const [people, pickups] = await Promise.all([profilesById(data.map((q) => q.user_id)), pickupsFor(data.map((q) => q.listing_id))]);
  const filters = [["abiertas", "Abiertas"], ["nueva", "Recibidas"], ["en_curso", "En curso"], ["cerrada", "Cerradas"], ["todas", "Todas"]];
  body.innerHTML = `<p class="small muted">Lo que la gente pregunta desde “Consultar por WhatsApp”. El código va en su mensaje de WhatsApp${CONFIG.WHATSAPP ? "" : " (el número de WhatsApp de la página todavía no está configurado: respóndeles al WhatsApp que dejaron)"}.</p>
    <div class="row-input" style="justify-content:flex-start;flex-wrap:wrap">${filters.map(([k, t]) => `<a class="btn sm ${k === filter ? "primary" : "outline"}" href="#/admin?tab=consultas&estado=${k}">${t}</a>`).join("")}</div>
    ${data.length ? `<ul class="admin-list">${data.map((q) => `<li class="panel" data-id="${q.id}">
      <div class="phead"><span><span class="inq-code">${esc(q.code)}</span> · ${q.listing_id ? `<a href="#/carta/${encodeURIComponent(q.listing_id)}" style="font-weight:600">${esc(q.subject)}</a>` : `<b>${esc(q.subject)}</b>`}</span><span class="b ${INQUIRY_STATUS[q.status]?.[1] ?? "neutral"}">${INQUIRY_STATUS[q.status]?.[0] ?? esc(q.status)}</span></div>
      <p class="xs muted" style="margin:4px 0 0">${esc(people.get(q.user_id)?.display_name ?? "—")} · ${esc(INQUIRY_SOURCE[q.source] ?? q.source)}${q.price_cents ? ` · ${formatUsd(q.price_cents)}` : ""}${q.catalog_ref ? ` · ${esc(q.catalog_ref)}` : ""} · ${fmtDate(q.created_at)}</p>
      ${q.message ? `<p class="small" style="margin:6px 0 0">“${esc(q.message)}”</p>` : ""}
      ${pickupLine(pickups.get(q.listing_id))}
      ${q.contact_phone ? `<p class="small" style="margin:6px 0 0">WhatsApp: <a class="link" target="_blank" rel="noopener" href="https://wa.me/${esc(waNumber(q.contact_phone))}?text=${encodeURIComponent(`Hola, te escribimos de ${CONFIG.APP_NAME} por tu consulta ${q.code}: “${q.subject}”.`)}">${esc(q.contact_phone)}</a></p>` : ""}
      <div class="order-actions" style="margin-top:8px"><select class="select iq-status" aria-label="Estado">${Object.entries(INQUIRY_STATUS).map(([k, [t]]) => `<option value="${k}"${k === q.status ? " selected" : ""}>${t}</option>`).join("")}</select>
        <input class="input iq-note" maxlength="1000" placeholder="Nota interna (opcional)" value="${esc(q.staff_note ?? "")}" aria-label="Nota interna"><button class="btn" data-save>Guardar</button></div><div class="order-msg"></div></li>`).join("")}</ul>`
      : `<p class="muted small">No hay consultas ${filter === "todas" ? "todavía" : "en este estado"}.</p>`}`;
  body.querySelectorAll("[data-save]").forEach((b) => b.addEventListener("click", async () => {
    const li = b.closest("li"), msg = li.querySelector(".order-msg");
    b.disabled = true;
    const { error: e } = await sb.rpc("staff_update_inquiry", { p_id: li.dataset.id, p_status: li.querySelector(".iq-status").value, p_note: li.querySelector(".iq-note").value.trim() || null });
    b.disabled = false;
    if (e) return adminFail(e, msg);
    msg.innerHTML = `<p class="notice good" style="margin:0">Guardado.</p>`;
  }));
}

// ------------------------------------------------------------- sellers (migration 0031)
/** Who sells each listing and where we pick the card up. Before 0031 only the seller's name is known. */
async function pickupsFor(listingIds) {
  const ids = [...new Set(listingIds.filter(Boolean))];
  if (!ids.length) return new Map();
  const { data: ls } = await sb.from("listings").select("id, seller_id").in("id", ids);
  const sellerIds = [...new Set((ls ?? []).map((l) => l.seller_id))];
  if (!sellerIds.length) return new Map();
  const [names, accs] = await Promise.all([profilesById(sellerIds), sb.from("seller_accounts").select("user_id, phone, pickup_address").in("user_id", sellerIds)]);
  const byUser = new Map((accs.data ?? []).map((a) => [a.user_id, a]));
  return new Map(ls.map((l) => [l.id, { name: names.get(l.seller_id)?.display_name ?? "—", known: !accs.error, ...byUser.get(l.seller_id) }]));
}
const pickupLine = (p) => !p ? "" : `<p class="small ic-line" style="margin:6px 0 0">${ic("pin")}Retiro: <a class="link" href="#/admin?tab=vendedores&amp;q=${encodeURIComponent(p.name)}">${esc(p.name)}</a>${p.phone
  ? ` · <a class="link" target="_blank" rel="noopener" href="https://wa.me/${esc(waNumber(p.phone))}">${esc(fmtPhone(p.phone))}</a> · ${esc(p.pickup_address)}`
  : p.known ? ` · <span class="muted">no nos ha dado teléfono ni dirección de retiro</span>` : ""}</p>`;

async function adminListings(body, q) {
  let query = sb.from("listings").select("id, title, price_cents, status, seller_id, created_at").order("created_at", { ascending: false }).limit(50);
  for (const t of searchTokens(q)) query = query.or(searchFilter(t, ["title", "subject", "set_name"]));
  const { data, error } = await query;
  if (error) throw error;
  const sellers = await profilesById(data.map((l) => l.seller_id));
  body.innerHTML = `
    <form id="alSearch" class="row-input" style="margin-bottom:12px"><input class="input" name="q" value="${esc(q)}" placeholder="Buscar anuncio"><button class="btn" style="border-radius:12px">Buscar</button></form>
    ${data.length ? `<ul class="admin-list">${data.map((l) => `<li class="panel" data-id="${l.id}">
      <div class="phead"><a href="#/carta/${encodeURIComponent(l.id)}" style="font-weight:600">${esc(l.title)}</a><span class="small">${formatUsd(l.price_cents)}</span></div>
      <p class="xs muted" style="margin:4px 0 8px">${esc(sellers.get(l.seller_id)?.display_name ?? "—")} · ${LISTING_STATUS[l.status] ?? l.status} · ${fmtDate(l.created_at)}</p>
      <div class="order-actions">
        ${l.status === "removed" ? `<button class="btn" data-status="active">Reactivar</button>` : `<button class="btn danger" data-status="removed">Quitar anuncio</button>`}
      </div><div class="order-msg"></div></li>`).join("")}</ul>` : `<p class="muted small">No hay anuncios${q ? " con ese texto" : ""}.</p>`}`;
  $("#alSearch").addEventListener("submit", (e) => { e.preventDefault(); go(`/admin?tab=anuncios&q=${encodeURIComponent(e.target.q.value.trim())}`); });
  body.querySelectorAll("li[data-id]").forEach((li) => {
    const msg = li.querySelector(".order-msg");
    li.querySelector("[data-status]").addEventListener("click", async (e) => {
      const status = e.target.dataset.status;
      if (status === "removed" && !confirm("¿Quitar este anuncio? Deja de verse en la página (se puede reactivar).")) return;
      const { error } = await sb.from("listings").update({ status }).eq("id", li.dataset.id);
      if (error) return adminFail(error, msg);
      route();
    });
  });
}

// ------------------------------------------------------------- shops
// Pending sign-ups with all their data and the signature (0037). Approving is MarketZlab's signature:
// review_shop_request() verifies the shop, fills its store page and gives it a seller account in one go.
async function adminShops(body) {
  const [{ data: reqs, error }, { data: shops }, { data: signed }] = await Promise.all([
    sb.from("shop_requests").select("*").eq("status", "pending").order("created_at"),
    sb.from("public_profiles").select("id, display_name, verified").eq("is_shop", true).order("display_name"),
    sb.from("shop_requests").select("id, user_id, signed_at, document_path, reviewed_at").eq("status", "approved").or("signed_at.not.is.null,document_path.not.is.null").order("reviewed_at", { ascending: false }),
  ]);
  if (error) throw error;
  const names = await profilesById(reqs.map((r) => r.user_id));
  const agreement = new Map();
  (signed ?? []).forEach((s) => { if (!agreement.has(s.user_id)) agreement.set(s.user_id, s); });
  const row = (k, v) => v ? `<div><dt>${k}</dt><dd>${v}</dd></div>` : "";
  const ext = (href, text) => `<a class="link" target="_blank" rel="noopener" href="${esc(href)}">${text}</a>`;
  body.innerHTML = `
    <h2 class="display admin-h" style="margin-top:0">Solicitudes pendientes (${reqs.length})</h2>
    ${reqs.length ? `<ul class="admin-list">${reqs.map((r) => {
      const where = [r.address, r.province].filter(Boolean).join(", ");
      return `<li class="panel" data-id="${r.id}" data-user="${r.user_id}">
      <div class="phead"><span style="font-weight:600">${esc(r.shop_name)}</span><span class="xs muted">${fmtDate(r.created_at)}</span></div>
      <dl class="rows">
        ${row("Cuenta", `<a class="link" href="#/vendedor/${encodeURIComponent(r.user_id)}">${esc(names.get(r.user_id)?.display_name ?? "perfil")}</a>`)}
        ${row("Responsable", r.owner_name ? `${esc(r.owner_name)} · cédula ${esc(r.owner_id_doc)}` : "")}
        ${row("Dirección", where ? ext(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${where}, Panamá`)}`, esc(where)) : esc(r.location ?? ""))}
        ${row("WhatsApp", r.phone ? ext(`https://wa.me/${waNumber(r.phone)}`, esc(fmtPhone(r.phone))) : "")}
        ${row("Instagram", r.instagram ? ext(`https://www.instagram.com/${encodeURIComponent(r.instagram)}/`, "@" + esc(r.instagram)) : esc(r.contact ?? ""))}
        ${row("Yappy", r.yappy_phone ? esc(fmtPhone(r.yappy_phone)) : "")}
        ${row("Horario", esc(r.pickup_hours ?? ""))}
        ${row("Acuerdo", r.signed_at ? `Firmado en la página ${fmtDate(r.signed_at)} · <a class="link" href="#/acuerdo-tienda/${r.id}">Ver acuerdo</a>`
          : r.document_path ? `<a class="link" data-doc="${esc(r.document_path)}" target="_blank" rel="noopener" href="#/admin?tab=tiendas">Abrir el acuerdo subido</a>` : `<span class="muted">Sin acuerdo (solicitud anterior)</span>`)}
      </dl>
      ${r.signature_png ? `<img class="sig-thumb" src="${esc(r.signature_png)}" alt="Firma de ${esc(r.owner_name)}">` : ""}
      <p class="xs muted" style="margin:8px 0">Antes de aprobar: abre el acuerdo y revisa que esté completo y firmado, busca el local en Google Maps (o visítalo), revisa su Instagram y que venda cartas originales.</p>
      <input class="input shop-note" maxlength="300" placeholder="Nota (si la rechazas, la verá la tienda)">
      <div class="order-actions"><button class="btn primary" data-act="approve">Aprobar y firmar</button><button class="btn danger" data-act="reject">Rechazar</button></div>
      <div class="order-msg"></div></li>`;
    }).join("")}</ul>` : `<p class="muted small">No hay solicitudes pendientes.</p>`}
    <h2 class="display admin-h">Tiendas (${shops?.length ?? 0})</h2>
    ${shops?.length ? `<ul class="admin-list">${shops.map((s) => {
      const a = agreement.get(s.id);
      return `<li class="panel" data-user="${s.id}"><div class="phead"><span style="font-weight:600">${esc(s.display_name)}</span>${s.verified ? shopBadge() : `<span class="b neutral">Sin verificar</span>`}</div>
      <p class="xs muted" style="margin:6px 0 0">${!a ? "Sin acuerdo firmado" : a.signed_at ? `<a class="link" href="#/acuerdo-tienda/${a.id}">Acuerdo firmado el ${longDate(a.signed_at)}</a>`
        : `<a class="link" data-doc="${esc(a.document_path)}" target="_blank" rel="noopener" href="#/admin?tab=tiendas">Acuerdo subido (aprobado el ${longDate(a.reviewed_at)})</a>`}</p>
      <div class="order-actions" style="margin-top:8px">${s.verified ? `<button class="btn danger" data-act="unverify">Quitar verificación</button>` : `<button class="btn primary" data-act="verify">Verificar</button>`}</div><div class="order-msg"></div></li>`;
    }).join("")}</ul>` : `<p class="muted small">Todavía no hay tiendas.</p>`}`;

  // Uploaded agreements (0038) live in a private bucket: each link gets a 10-minute signed URL.
  const docs = [...body.querySelectorAll("a[data-doc]")];
  if (docs.length) sb.storage.from("shop-agreements").createSignedUrls(docs.map((a) => a.dataset.doc), 600).then(({ data }) => {
    (data ?? []).forEach((u, i) => { if (u.signedUrl) docs[i].href = u.signedUrl; });
  });
  body.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", async () => {
    const li = b.closest("li"), msg = li.querySelector(".order-msg"), act = b.dataset.act, user = li.dataset.user;
    const note = li.querySelector(".shop-note")?.value.trim() ?? "";
    if (act === "reject" && !note && !(await confirmDialog({ title: "¿Rechazar sin explicar el motivo?", body: "La tienda verá un mensaje general para que revise sus datos.", confirm: "Rechazar", danger: true }))) return;
    li.querySelectorAll("button").forEach((x) => (x.disabled = true));
    const fail = (e) => { li.querySelectorAll("button").forEach((x) => (x.disabled = false)); adminFail(e, msg); };
    if (act === "approve" || act === "reject") {
      const { error } = await sb.rpc("review_shop_request", { p_id: li.dataset.id, p_approve: act === "approve", p_note: note || null });
      if (!error) { toast(act === "approve" ? "Tienda aprobada y acuerdo firmado" : "Solicitud rechazada"); return route(); }
      if (!shopReqMissing(error)) return fail(error);
      // Before 0037: verify the profile and close the request with two writes, as in 0005.
    }
    if (act !== "reject") {
      const { error } = await sb.from("profiles").update(act === "unverify" ? { verified: false } : { is_shop: true, verified: true }).eq("id", user);
      if (error) return fail(error);
    }
    if (act === "approve" || act === "reject") {
      const { error } = await sb.from("shop_requests").update({ status: act === "approve" ? "approved" : "rejected", reviewed_at: new Date().toISOString() }).eq("id", li.dataset.id);
      if (error) return fail(error);
    }
    route();
  }));
}

// ------------------------------------------------------------- analytics
// [event, label, step it is compared against]. "Consultar por WhatsApp" is logged as click_whatsapp;
// click_protegida only counts the days before Compra Protegida left the page (2026-10-16).
const FUNNEL = [
  ["visita", "Visitaron MarketZlab", null], ["registro", "Crearon cuenta", "visita"], ["ver_carta", "Abrieron una carta", "registro"], ["escanear", "Escanearon una carta", "registro"],
  ["click_whatsapp", "Consultaron por una carta", "ver_carta"],
];
async function adminAnalytics(body, days) {
  days = [7, 30, 90].includes(days) ? days : 7;
  const { data, error } = await sb.rpc("analytics_summary", { p_days: days });
  if (error) {
    if (error.code === "PGRST202") { body.innerHTML = `<p class="notice warn">Falta aplicar la migración 0007 en Supabase para ver la analítica.</p>`; return; }
    throw error;
  }
  const f = data.funnel ?? {}, top = f.visita?.visitors || 0;
  const pct = (n, of) => (of ? `${Math.round((n / of) * 100)}%` : "—");
  const maxDay = Math.max(1, ...(data.daily ?? []).map((d) => d.visitors));
  body.innerHTML = `
    <div class="row-input" style="justify-content:flex-start">${[7, 30, 90].map((d) => `<a class="btn ${d === days ? "primary" : "outline"}" href="#/admin?tab=analitica&dias=${d}">${d} días</a>`).join("")}</div>
    <section class="panel col"><h2>Embudo · últimos ${days} días</h2>
      <p class="xs muted" style="margin:0">Personas distintas (visitantes anónimos). No incluye al staff.</p>
      <div class="funnel">${FUNNEL.map(([k, label, from]) => {
        const v = f[k]?.visitors ?? 0, prev = from ? f[from]?.visitors ?? 0 : 0;
        const fromLabel = { visita: "de las visitas", registro: "de quienes crearon cuenta", ver_carta: "de quienes abrieron una carta" }[from];
        return `<div class="frow"><div class="flabel"><span>${label}</span><b>${v}</b></div>
          <div class="fbar"><div style="width:${top ? Math.max(2, (v / top) * 100) : 0}%"></div></div>
          <p class="xs muted" style="margin:2px 0 0">${from && from !== "visita" ? `${pct(v, prev)} ${fromLabel} · ` : ""}${pct(v, top)} de las visitas</p></div>`;
      }).join("")}</div></section>
    <div class="stats">
      <div class="panel stat"><p class="display" style="font-size:28px;font-weight:700;margin:0">${f.publicar?.events ?? 0}</p><p class="xs muted" style="margin:2px 0 0">cartas publicadas</p></div>
      <div class="panel stat"><p class="display" style="font-size:28px;font-weight:700;margin:0">${f.compartir?.events ?? 0}</p><p class="xs muted" style="margin:2px 0 0">veces compartidas</p></div>
      <div class="panel stat"><p class="display" style="font-size:28px;font-weight:700;margin:0">${f.ver_carta?.events ?? 0}</p><p class="xs muted" style="margin:2px 0 0">cartas vistas (total)</p></div>
      <div class="panel stat"><p class="display" style="font-size:28px;font-weight:700;margin:0">${(f.click_whatsapp?.events ?? 0) + (f.click_protegida?.events ?? 0)}</p><p class="xs muted" style="margin:2px 0 0">consultas y contactos</p></div>
    </div>
    <section class="panel col"><h2>Visitantes por día</h2>
      ${(data.daily ?? []).length ? `<div class="daily">${data.daily.map((d) => `<div title="${esc(d.day)}: ${d.visitors}"><span style="height:${(d.visitors / maxDay) * 100}%"></span><em>${esc(String(d.day).slice(8, 10))}</em></div>`).join("")}</div>` : `<p class="muted small" style="margin:0">Todavía no hay visitas registradas.</p>`}</section>
    <section class="panel col"><h2>Cartas más vistas</h2>
      ${(data.top_listings ?? []).length ? `<table class="fees"><thead><tr><th>Carta</th><th>Vistas</th><th>Personas</th><th>Contactos</th></tr></thead><tbody>${data.top_listings.map((t) => {
        const title = t.title ?? DEMO.find((d) => d.id === t.ref)?.title ?? "Anuncio eliminado";
        return `<tr><td><a href="#/carta/${encodeURIComponent(t.ref)}">${esc(title)}</a></td><td>${t.views}</td><td>${t.visitors}</td><td>${t.clicks}</td></tr>`;
      }).join("")}</tbody></table>` : `<p class="muted small" style="margin:0">Todavía nadie ha abierto una carta.</p>`}</section>
    <section class="panel col" id="wantedTop"><h2>Lo más buscado</h2><p class="muted small" style="margin:0"><span class="spinner"></span></p></section>`;
  // What people want and nobody sells yet: what to ask the shops to bring. From the watchlists
  // (watchlist_summary, migration 0034); until it runs, the old "Busco…" searches (0022).
  const box = $("#wantedTop");
  const { data: wl, error: wlErr } = await sb.rpc("watchlist_summary", { p_limit: 30 });
  if (!box?.isConnected) return;
  if (!wlErr) {
    const link = (w) => (w.catalog_id ? `#/watchlist/carta/${encodeURIComponent(w.catalog_id)}` : hrefWith({ sort: "recientes" }, { q: w.name }));
    box.innerHTML = `<h2>Lo más buscado (watchlists)</h2>${wl.length ? `<table class="fees"><thead><tr><th>Carta</th><th>Personas</th><th>Precio de referencia</th><th>En venta</th></tr></thead><tbody>${wl.map((w) =>
      `<tr><td><a href="${esc(link(w))}">${esc(w.name)}</a>${[w.set_name, w.number].filter(Boolean).length ? `<span class="xs muted"> · ${esc([w.set_name, w.number].filter(Boolean).join(" · "))}</span>` : ""}${w.graded ? ` <span class="b prot">Graduada</span>` : ""}</td><td>${w.people}</td><td>${w.ref_price_cents ? formatUsd(w.ref_price_cents) : "—"}</td><td>${Number(w.on_sale) ? w.on_sale : `<b>Nadie la vende</b>`}</td></tr>`).join("")}</tbody></table>
      <p class="xs muted" style="margin:0">“Nadie la vende”: cartas que la gente quiere y no están en la web. Pídeselas a las tiendas.</p>` : `<p class="muted small" style="margin:0">Nadie ha agregado cartas a su watchlist todavía.</p>`}`;
    return;
  }
  if (!["PGRST202", "42883"].includes(wlErr.code)) console.error(wlErr);
  const { data: wanted, error: wErr } = await sb.rpc("wanted_summary");
  if (!box.isConnected) return;
  if (wErr) { box.remove(); if (wErr.code !== "PGRST202") console.error(wErr); return; }
  box.innerHTML = `<h2>Lo más buscado (“Busco…”, antes de la watchlist)</h2>${wanted.length ? `<table class="fees"><thead><tr><th>Búsqueda</th><th>Personas</th><th>Avisos enviados</th></tr></thead><tbody>${wanted.map((w) =>
    `<tr><td><a href="${esc(hrefWith({ sort: "recientes" }, { q: w.query }))}">${esc(w.query)}</a></td><td>${w.people}</td><td>${w.hits}</td></tr>`).join("")}</tbody></table>
    <p class="xs muted" style="margin:0">Las búsquedas con 0 avisos son cartas que nadie ha publicado todavía: pídeselas a las tiendas.</p>` : `<p class="muted small" style="margin:0">Nadie ha guardado una búsqueda todavía.</p>`}`;
}

// ------------------------------------------------------------- reports
const REPORT_REASON = { replica: "Réplica o falsificación", estafa: "Posible estafa", precio: "Precio o datos engañosos", contenido: "Contenido inapropiado", otro: "Otro" };
async function adminReports(body) {
  const { data: reps, error } = await sb.from("reports").select("id, listing_id, reporter_id, reason, details, created_at").eq("resolved", false).order("created_at", { ascending: false }).limit(100);
  if (error) throw error;
  const ids = [...new Set(reps.map((r) => r.listing_id).filter(Boolean))];
  const { data: listings } = ids.length ? await sb.from("listings").select("id, title, status, seller_id").in("id", ids) : { data: [] };
  const byId = new Map((listings ?? []).map((l) => [l.id, l]));
  const people = await profilesById([...reps.map((r) => r.reporter_id), ...(listings ?? []).map((l) => l.seller_id)]);
  const perListing = reps.reduce((m, r) => m.set(r.listing_id, (m.get(r.listing_id) ?? 0) + 1), new Map());
  body.innerHTML = reps.length ? `<p class="small muted" style="margin:0">Revisa el anuncio antes de decidir. “Quitar anuncio” lo oculta de la página (se puede reactivar en Anuncios).</p>
    <ul class="admin-list">${reps.map((r) => {
      const l = byId.get(r.listing_id);
      return `<li class="panel" data-id="${r.id}" data-listing="${r.listing_id ?? ""}">
        <div class="phead"><a href="#/carta/${encodeURIComponent(r.listing_id ?? "")}" style="font-weight:600">${esc(l?.title ?? "Anuncio eliminado")}</a><span class="b warn">${esc(REPORT_REASON[r.reason] ?? r.reason)}</span></div>
        <dl class="rows"><div><dt>Vendedor</dt><dd>${esc(people.get(l?.seller_id)?.display_name ?? "—")}</dd></div>
          <div><dt>Reportado por</dt><dd>${esc(people.get(r.reporter_id)?.display_name ?? "—")}</dd></div>
          <div><dt>Reportes abiertos de este anuncio</dt><dd>${perListing.get(r.listing_id)}</dd></div>
          <div><dt>Estado del anuncio</dt><dd>${LISTING_STATUS[l?.status] ?? "—"}</dd></div><div><dt>Fecha</dt><dd>${fmtDate(r.created_at)}</dd></div></dl>
        ${r.details ? `<p class="small" style="margin:8px 0 0;white-space:pre-line">“${esc(r.details)}”</p>` : ""}
        <div class="order-actions">${l && l.status !== "removed" ? `<button class="btn danger" data-act="remove">Quitar anuncio</button>` : ""}<button class="btn" data-act="dismiss">Descartar reporte</button></div>
        <div class="order-msg"></div></li>`;
    }).join("")}</ul>` : `<p class="muted small">No hay reportes pendientes. 🎉</p>`;
  body.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", async () => {
    const li = b.closest("li"), msg = li.querySelector(".order-msg");
    if (b.dataset.act === "remove" && !confirm("¿Quitar este anuncio? Se marcan como resueltos todos sus reportes.")) return;
    li.querySelectorAll("button").forEach((x) => (x.disabled = true));
    const fail = (e) => { li.querySelectorAll("button").forEach((x) => (x.disabled = false)); adminFail(e, msg); };
    if (b.dataset.act === "remove") {
      const { error } = await sb.from("listings").update({ status: "removed" }).eq("id", li.dataset.listing);
      if (error) return fail(error);
      const { error: e2 } = await sb.from("reports").update({ resolved: true }).eq("listing_id", li.dataset.listing).eq("resolved", false);
      if (e2) return fail(e2);
    } else {
      const { error } = await sb.from("reports").update({ resolved: true }).eq("id", li.dataset.id);
      if (error) return fail(error);
    }
    route();
  }));
  await adminFlaggedReviews(body);
}
async function adminFlaggedReviews(body) {

        <button class="btn" data-act="notes">Guardar notas</button>
      </div><div class="order-msg"></div></li>`;
  body.innerHTML = `<p class="small muted" style="margin:0">El vendedor paga ${price} por Yappy y lleva la carta a la tienda. ${esc(CONFIG.APP_NAME)} nunca recibe la carta. “Auténtica” muestra “Revisada por &lt;tienda&gt;” en el anuncio. ${shops?.length ? "" : "<b>Todavía no hay tiendas verificadas</b>: verifica una en la pestaña Tiendas."}</p>
    <h2 class="h2" style="margin-top:20px">Pendientes (${open.length})</h2>
    ${open.length ? `<ul class="admin-list">${open.map(card).join("")}</ul>` : `<p class="muted small">No hay revisiones pendientes.</p>`}
    ${closed.length ? `<details style="margin-top:20px"><summary class="small">Cerradas (${closed.length})</summary><ul class="admin-list">${closed.map(card).join("")}</ul></details>` : ""}`;
  body.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", async () => {
    const li = b.closest("li"), msg = li.querySelector(".order-msg"), act = b.dataset.act;
    const patch = { notes: li.querySelector(".order-notes").value.trim() || null };
    if (act !== "notes") patch.status = act;
    if (["authentic", "not_authentic", "inconclusive"].includes(act)) {
      patch.shop_id = li.querySelector(".chk-shop")?.value || null;
      if (!patch.shop_id) { msg.innerHTML = `<p class="notice bad" style="margin:0">Elige la tienda que la revisó.</p>`; return; }
      patch.checked_at = new Date().toISOString();
    }
    if (act === "cancelled" && !confirm("¿Cancelar esta revisión? Si ya pagó, devuélvele el dinero por Yappy.")) return;
    const removeListing = act === "not_authentic" && li.dataset.listing && confirm("¿Quitar también el anuncio de la página? (Recomendado si la carta es réplica.)");
    li.querySelectorAll("button").forEach((x) => (x.disabled = true));
    const { error } = await sb.from("authenticity_checks").update(patch).eq("id", li.dataset.id);
    if (!error && removeListing) {
      const { error: e2 } = await sb.from("listings").update({ status: "removed" }).eq("id", li.dataset.listing);
      if (e2) { li.querySelectorAll("button").forEach((x) => (x.disabled = false)); return adminFail(e2, msg, "La revisión quedó guardada, pero no se pudo quitar el anuncio. Hazlo en Anuncios."); }
      listingCache.delete(li.dataset.listing);
    }
    if (error) { li.querySelectorAll("button").forEach((x) => (x.disabled = false)); return adminFail(error, msg); }
    if (act === "notes") { li.querySelectorAll("button").forEach((x) => (x.disabled = false)); msg.innerHTML = `<p class="notice good" style="margin:0">Notas guardadas.</p>`; return; }
    if (li.dataset.listing) listingCache.delete(li.dataset.listing);
    route();
  }));
}

// ------------------------------------------------------------- summary
async function adminSummary(body) {
  const [inq, { count: activeCount }, { count: soldCount }, { count: shopCount }, { count: pendingShops }, { count: openReports }] = await Promise.all([
    inquiriesOn ? sb.from("inquiries").select("status, source, created_at").limit(10000) : { data: null },
    sb.from("listings").select("id", { count: "exact", head: true }).eq("status", "active"),
    sb.from("listings").select("id", { count: "exact", head: true }).eq("status", "sold"),
    sb.from("public_profiles").select("id", { count: "exact", head: true }).eq("is_shop", true).eq("verified", true),
    sb.from("shop_requests").select("id", { count: "exact", head: true }).eq("status", "pending"),
    sb.from("reports").select("id", { count: "exact", head: true }).eq("resolved", false),
  ]);
  const q = inq.error || !inq.data ? null : inq.data, week = Date.now() - 7 * 864e5;
  const stat = (n, t) => `<div class="panel stat"><p class="display" style="font-size:28px;font-weight:700;margin:0">${n}</p><p class="xs muted" style="margin:2px 0 0">${t}</p></div>`;
  body.innerHTML = `
    <div class="stats">
      ${q ? stat(q.filter((x) => x.status === "nueva").length, "consultas sin atender") : ""}
      ${q ? stat(q.filter((x) => Date.parse(x.created_at) >= week).length, "consultas en los últimos 7 días") : ""}
      ${q ? stat(q.filter((x) => x.source === "watchlist").length, "consultas por cartas que no están en la web") : ""}
      ${stat(activeCount ?? 0, "anuncios activos")}
      ${stat(soldCount ?? 0, "cartas vendidas")}
      ${stat(shopCount ?? 0, "tiendas verificadas")}
      ${stat(pendingShops ?? 0, "solicitudes de tienda")}
      ${stat(openReports ?? 0, "reportes por revisar")}
    </div>
    ${q ? "" : `<p class="notice soft">Falta aplicar la migración 0030 en Supabase para ver las consultas.</p>`}`;
}

// ------------------------------------------------------------- captcha (Cloudflare Turnstile)
// Off until CONFIG.TURNSTILE_SITE_KEY is set. Supabase Auth verifies the token server-side once
// "Captcha protection" is enabled in the dashboard with the matching secret key.
let turnstileLoad = null;
function loadTurnstile() {
  turnstileLoad ??= new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
    s.async = true; s.onload = () => resolve(window.turnstile); s.onerror = () => { turnstileLoad = null; reject(new Error("turnstile load failed")); };
    document.head.appendChild(s);
  });
  return turnstileLoad;
}
async function mountCaptcha(box) {
  if (!CONFIG.TURNSTILE_SITE_KEY || !box) return null;
  try {
    const ts = await loadTurnstile();
    if (!box.isConnected) return null;
    // The normal widget is at least 300 px wide; on narrow phones use the compact one so the form doesn't overflow.
    const size = box.clientWidth < 300 ? "compact" : "flexible";
    const id = ts.render(box, { sitekey: CONFIG.TURNSTILE_SITE_KEY, language: "es", theme: "auto", appearance: "interaction-only", size });
    // The widget solves itself in the background; a fast submit (or a password manager) can beat it,
    // so wait a few seconds for the token instead of failing right away.
    const token = async (ms = 8000) => {
      for (const until = Date.now() + ms; ; await new Promise((r) => setTimeout(r, 150))) {
        const t = ts.getResponse(id);
        if (t || Date.now() > until || !box.isConnected) return t || "";
      }
    };
    const remove = () => { clearInterval(watch); try { ts.remove(id); } catch { /* already gone */ } };
    // Leaving the sign-in page drops the form without telling us: clean up the widget so it stops running.
    const watch = setInterval(() => { if (!box.isConnected) remove(); }, 1000);
    return { token, reset: () => ts.reset(id), remove };
  } catch (e) {
    console.error(e);
    box.innerHTML = `<p class="notice bad">No se pudo cargar la verificación. Recarga la página.</p>`;
    return null;
  }
}

matchMedia("(min-width: 1024px)").addEventListener("change", () => $("#fpanel")?._close?.(true));
// Card images fade in once loaded; broken ones leave a neutral box instead of a broken-image icon.
document.addEventListener("load", (e) => { if (e.target instanceof HTMLImageElement) e.target.classList.remove("loading-img"); }, true);
document.addEventListener("error", (e) => { if (e.target instanceof HTMLImageElement && e.target.classList.contains("card")) e.target.classList.replace("loading-img", "broken") || e.target.classList.add("broken"); }, true);
// New version: GitHub Pages lets browsers keep holo.html for 10 minutes and a tab can stay open for days,
// so after a push people kept seeing the old page. When the published file is newer than the one running,
// the page reloads: right away if it was just opened (it came from the cache), else on the next change of
// page (so nothing on screen is lost). Checked on load and when the tab comes back, at most every 5 minutes.
const pageModified = Date.parse(document.lastModified) || Date.now(); // without the header it's "now": never reloads
let newVersion = false, versionCheckedAt = 0;
async function checkVersion() {
  if (newVersion || !/^https?:$/.test(location.protocol) || Date.now() - versionCheckedAt < 5 * 60000) return newVersion;
  versionCheckedAt = Date.now();
  try {
    const r = await fetch(location.pathname, { method: "HEAD", cache: "no-store" });
    newVersion = Date.parse(r.headers.get("last-modified") ?? "") > pageModified + 60000;
  } catch { /* offline: try again later */ }
  return newVersion;
}
function reloadForNewVersion() {
  try { if (sessionStorage.getItem("holo.reloadedFor") === String(pageModified)) return false; sessionStorage.setItem("holo.reloadedFor", String(pageModified)); } catch { return false; }
  location.reload();
  return true;
}
checkVersion().then((v) => { if (v) reloadForNewVersion(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkVersion(); });
window.addEventListener("hashchange", () => { if (!(newVersion && reloadForNewVersion())) route(); });
// The seller row sits inside the card's link: clicking it opens the seller page instead of the card.
document.addEventListener("click", (e) => {
  const row = e.target.closest?.(".tseller[data-seller]");
  if (!row?.dataset.seller || !row.closest("a")) return;
  e.preventDefault();
  go(`/vendedor/${encodeURIComponent(row.dataset.seller)}`);
});
async function loadProfileName() {
  profileName = null; isStaff = false;
  if (!session) return;
  const { data } = await sb.from("profiles").select("display_name, is_staff").eq("id", session.user.id).maybeSingle();
  profileName = data?.display_name ?? null;
  isStaff = Boolean(data?.is_staff);
  renderNav();
  finishPendingShopDoc();
  if (isStaff && parseHash().path === "/admin") route(); // staff flag arrived after the first render
}
(async () => {
  if (sb) {
    session = (await sb.auth.getSession()).data.session;
    sb.auth.onAuthStateChange((_evt, s) => {
      const changed = (s?.user.id ?? null) !== (session?.user.id ?? null);
      session = s;
      // supabase-js runs this callback while holding its auth lock: calling it again from inside
      // can deadlock, so the follow-up queries run on the next tick.
      if (changed) setTimeout(() => { loadProfileName(); route(); }, 0);
    });
    loadProfileName();
  }
  trackVisitOncePerSession();
  route();
})();
</script>
